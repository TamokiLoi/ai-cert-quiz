<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CertLab · Ôn tập câu hỏi</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1b2931; background: #f5f6f3; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .wrap { width: min(100% - 36px, 980px); margin-inline: auto; }
    .hero { color: #f7faf4; background: #183a34; padding: 54px 0 42px; }
    .eyebrow { margin: 0 0 12px; color: #b7d6c3; font-size: .76rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.25rem); letter-spacing: -.045em; line-height: 1.15; }
    .intro { margin: 14px 0 22px; max-width: 650px; color: #d6e5da; }
    .set-nav { display: flex; flex-wrap: wrap; gap: 10px; }
    .set-nav a { padding: 7px 13px; border: 1px solid #688b7d; border-radius: 999px; color: #f7faf4; text-decoration: none; font-size: .9rem; }
    .set-nav a:hover, .set-nav a:focus-visible { background: #315b4d; }
    .toolbar { position: sticky; z-index: 5; top: 0; border-bottom: 1px solid #d9e0d9; background: rgba(250, 251, 248, .97); backdrop-filter: blur(10px); }
    .toolbar-inner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 12px; }
    .search { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border: 1px solid #bdccc2; border-radius: 8px; outline-color: #277658; background: white; color: #1b2931; }
    .toolbar-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .progress { font-size: .9rem; font-weight: 700; white-space: nowrap; }
    .quiet-button { border: 1px solid #bdccc2; border-radius: 8px; background: white; color: #254b3c; padding: 8px 12px; font-size: .86rem; font-weight: 650; }
    .quiet-button:hover, .quiet-button:focus-visible { background: #e7f2e9; }
    main { padding: 22px 0 80px; }
    .result-count { margin: 0 0 20px; font-size: .86rem; color: #587068; }
    .question-set { margin: 38px 0 64px; scroll-margin-top: 110px; }
    .set-heading { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid #244d3e; }
    .set-heading h2 { margin: 0; font-size: 1.5rem; letter-spacing: -.03em; }
    .set-heading span { color: #586a63; font-size: .9rem; }
    .question-card { margin: 0 0 16px; padding: 25px 28px 23px; border: 1px solid #dce3dc; border-radius: 12px; background: #fff; box-shadow: 0 3px 14px rgba(27, 53, 43, .035); scroll-margin-top: 112px; }
    .question-meta { margin: 0 0 13px; color: #2a7151; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .question-text { margin: 0 0 22px; font-size: 1.06rem; font-weight: 650; line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; }
    .choices { display: grid; gap: 9px; }
    .choice { width: 100%; display: flex; align-items: flex-start; gap: 13px; padding: 12px 14px; border: 1px solid #d6dfd8; border-radius: 9px; background: #fbfcfa; color: #26342c; text-align: left; line-height: 1.5; transition: background .15s, border-color .15s; }
    .choice:hover, .choice:focus-visible { border-color: #40816a; background: #f0f7f0; }
    .choice-label { flex: 0 0 28px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: #e7eee9; color: #315547; font-weight: 800; }
    .choice-text { padding-top: 2px; white-space: pre-line; overflow-wrap: anywhere; }
    .choice.is-correct { border-color: #238652; background: #eaf7ed; }
    .choice.is-correct .choice-label { background: #248052; color: white; }
    .choice.is-wrong { border-color: #c65e54; background: #fff0ed; }
    .choice.is-wrong .choice-label { background: #bb524c; color: white; }
    .choice.is-picked { outline: 2px solid currentColor; outline-offset: -3px; }
    .feedback { min-height: 1.5em; margin: 14px 0 0; font-weight: 750; }
    .feedback.correct { color: #146c42; }
    .feedback.wrong { color: #ab463d; }
    .explanation { margin-top: 16px; padding: 14px 16px; border-left: 3px solid #94b9a2; border-radius: 0 8px 8px 0; background: #f3f8f4; }
    .explanation summary { color: #24533e; font-weight: 800; cursor: pointer; }
    .explanation p { margin: 12px 0 0; white-space: pre-line; overflow-wrap: anywhere; font-size: .94rem; }
    .empty { padding: 24px; text-align: center; color: #586a63; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { .wrap { width: min(100% - 24px, 980px); } .hero { padding-block: 35px; } .question-card { padding: 19px 16px; } .toolbar-actions { width: 100%; justify-content: space-between; } .set-heading { gap: 4px 12px; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">CertLab · Sổ tay ôn tập</p>
      <h1>Học từng câu, hiểu từng đáp án.</h1>
      <p class="intro">Toàn bộ câu hỏi trên một trang. Chọn đáp án để xem đúng/sai ngay lập tức; mở phần giải thích dưới mỗi câu khi cần.</p>
      <nav class="set-nav" id="set-nav" aria-label="Chuyển đến bộ câu hỏi"></nav>
    </div>
  </header>
  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <input class="search" id="search" type="search" placeholder="Tìm câu hỏi hoặc đáp án…" aria-label="Tìm câu hỏi hoặc đáp án">
      <div class="toolbar-actions">
        <span class="progress" id="progress" aria-live="polite"></span>
        <button class="quiet-button" id="shuffle-questions" type="button" aria-pressed="false">Đảo thứ tự câu</button>
        <button class="quiet-button" id="toggle-explanations" type="button">Mở tất cả giải thích</button>
      </div>
    </div>
  </div>
  <main class="wrap">
    <p class="result-count" id="result-count"></p>
    <div id="questions"></div>
    <p class="empty" id="empty" hidden>Không tìm thấy câu hỏi phù hợp.</p>
  </main>
  <script type="application/json" id="study-data">[{"file":"certlab-questions-with-explanations.json","title":"Bộ câu hỏi 1","questions":[{"index":1,"text":"Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues:\n\n(1) compound phrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split;\n\n(2) implied but unstated skills occasionally appear in extractions;\n\n(3) similar documents produce wildly different array lengths (5-10 vs 40+ entries).\n\nYour prompt currently says \"Extract all skills mentioned.\"\n\nWhat's the most effective improvement?","choices":[{"id":"71716","label":"A","text":"A\nEnrich the schema to {skill: string, confidence: float, source_quote: string[]} to capture extraction metadata."},{"id":"71717","label":"B","text":"B\nAdd constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\""},{"id":"71718","label":"C","text":"C\nAdd few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity."},{"id":"71719","label":"D","text":"D\nAdd post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}],"correctAnswerIds":["71718"],"explanation":"Đây là vấn đề kinh điển về sự không nhất quán trong việc diễn giải (interpretation) các yêu cầu mở (vague instructions) của LLM.\n\nTại sao chọn C: Few-shot prompting là cách hiệu quả nhất để giải quyết cả ba vấn đề bạn đang gặp phải:\n\nCompound phrases: Bằng cách cung cấp ví dụ mẫu về cách tách hoặc giữ các cụm kỹ năng, bạn thiết lập một tiêu chuẩn về \"tính hạt\" (granularity).\n\nImplied skills: Ví dụ mẫu sẽ làm rõ rằng mô hình chỉ được phép trích xuất những gì có trong văn bản, giúp loại bỏ các kỹ năng \"được suy diễn\".\n\nArray lengths: Bằng cách hiển thị các ví dụ về tài liệu có độ dài khác nhau nhưng cách trích xuất nhất quán, bạn hướng dẫn mô hình hiểu được phạm vi (scope) mong muốn, từ đó ổn định số lượng đầu ra.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Làm giàu schema giúp ích cho việc theo dõi (monitoring) và kiểm soát sau này, nhưng nó không trực tiếp dạy mô hình làm thế nào để trích xuất đúng ngay từ đầu.\n\nB: Việc thêm các ràng buộc cứng (hard constraints) như \"10-20 skills\" là cách làm nguy hiểm. Nếu tài liệu thật sự có ít kỹ năng hơn, mô hình có thể bị \"ảo giác\" để lấp đầy số lượng; nếu tài liệu có nhiều kỹ năng hơn, mô hình sẽ bị cắt bỏ thông tin quan trọng.\n\nD: Việc chuẩn hóa sau khi trích xuất (post-extraction normalization) là bước xử lý hậu kỳ. Mặc dù cần thiết, nhưng nó không giải quyết được vấn đề mô hình trích xuất sai hoặc không nhất quán ngay từ đầu. Bạn nên ưu tiên cải thiện chất lượng trích xuất tại gốc (tại thời điểm model suy luận) bằng few-shot trước khi dựa vào các quy trình hậu kỳ phức tạp.\n\nBạn đã làm rất tốt các câu trước đó, đây là một câu hỏi quan trọng về kỹ thuật Prompt Engineering trong trích xuất dữ liệu. Bạn có muốn đi tiếp các câu tiếp theo không?"},{"index":2,"text":"Users report that responses feel repetitive across turns—each message begins with phrases like \"Certainly!\" or \"I'd be happy to help!\" even deep into conversations. You want responses to feel more natural, without these repetitive openers.\n\nWhat's the most effective approach?","choices":[{"id":"71928","label":"A","text":"A\nLower the temperature parameter to make response openings more deterministic and less variable"},{"id":"71929","label":"B","text":"B\nAdd system prompt instructions specifying phrases to avoid, such as \"Never begin responses with 'Certainly' or similar affirmations\""},{"id":"71930","label":"C","text":"C\nImplement post-processing to detect and strip common greeting phrases from response beginnings"},{"id":"71931","label":"D","text":"D\nAppend a partial assistant message with a direct response opening that the model will continue from"}],"correctAnswerIds":["71931"],"explanation":"Tại sao D đúng? Trong kỹ thuật prompt (đặc biệt là với các mô hình của Anthropic như Claude), việc sử dụng tính năng Prefill Assistant Response (tiền điền phản hồi của trợ lý) bằng cách bắt đầu sẵn nội dung câu trả lời (hoặc bỏ trống các từ đệm như \"Certainly!\") ép mô hình phải tiếp tục sinh văn bản từ điểm đó, giúp kiểm soát hoàn toàn câu mở đầu một cách ổn định nhất.\n\nTại sao các đáp án khác chưa tối ưu?\n\nA (Temperature): Giảm temperature chỉ làm giảm tính ngẫu nhiên chứ không ngăn được thói quen tạo lời mở đầu rập khuôn của mô hình.\n\nB (System Prompt): Các mô hình ngôn ngữ lớn đôi khi vẫn bỏ qua các điều kiện phủ định dạng \"Không được bắt đầu bằng...\" trong system prompt.\n\nC (Post-processing): Xử lý hậu kỳ làm phức tạp hệ thống, có thể cắt nhầm nội dung và không giải quyết được gốc rễ vấn đề ở khâu sinh văn bản."},{"index":3,"text":"Production logs reveal inconsistent error responses when lookup_order fails. The agent sometimes retries (wasting 3-4 turns) before concluding on the error. Your MCP tool currently returns only a plain text error message to Claude.\n\nWhat's the most effective improvement?","choices":[{"id":"71812","label":"A","text":"A\nImplement retry logic with exponential backoff in your MCP server for all errors, returning only successful results to the agent."},{"id":"71813","label":"B","text":"B\nAdd few-shot examples to the system prompt showing how to distinguish retryable from non-retryable errors by parsing error message text."},{"id":"71814","label":"C","text":"C\nCreate an analyze_error MCP tool the agent calls to determine the error type before deciding how to handle it."},{"id":"71815","label":"D","text":"D\nReturn structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."}],"correctAnswerIds":["71815"],"explanation":"Đáp án đúng cho câu hỏi này là [D].\n\nGiải thích chi tiết:\n\nLý do chọn D: Vấn đề gốc rễ là công cụ MCP hiện chỉ trả về một thông báo lỗi dạng văn bản thuần túy (plain text error message), khiến mô hình LLM (như Claude) không thể phân biệt rõ ràng giữa lỗi nghiệp vụ (như không tìm thấy đơn hàng, retryable: false) và lỗi kỹ thuật tạm thời, dẫn đến việc agent cố thử lại một cách vô ích (wasting 3-4 turns). Giải pháp chuẩn và tối ưu nhất là trả về các phản hồi lỗi có cấu trúc (structured error responses) cung cấp rõ ràng các trường thông tin như retryable: false cùng với giải thích thân thiện để mô hình xử lý ngay lập tức trong một lượt duy nhất mà không cần đoán mò.\n\nCác đáp án khác không chính xác:\n\nA: Việc tự động ẩn lỗi và thực hiện retry ngầm trong MCP server cho mọi lỗi có thể làm treo hoặc kéo dài thời gian phản hồi mà không giải quyết được các lỗi logic nghiệp vụ cố định (business errors).\n\nB: Việc thêm few-shot examples vào system prompt để phân tích văn bản lỗi thủ công là cách làm kém bền vững, dễ bị trôi ngữ cảnh hoặc hiểu sai cú pháp văn bản lỗi.\n\nC: Việc tạo một công cụ chuyên biệt chỉ để phân tích lỗi (analyze_error MCP tool) làm tăng thêm số bước gọi tool không cần thiết (round-trips) và lãng phí tài nguyên của agent."},{"index":4,"text":"The coordinator agent has AgentFunctions configured for all four specialized subagents, each with appropriate descriptions and restrictions. During testing, you find the coordinator sometimes fails to delegate—it writes \"I'll ask the web search agent to find sources\" without actually invoking it.\n\nWhat is the most likely cause?","choices":[{"id":"71728","label":"A","text":"A\nThe AgentFunctions are configured correctly, but the coordinator's system prompt includes a statement that prevents it from knowing the available subagent types."},{"id":"71729","label":"B","text":"B\nSubagent context limit descriptions from the coordinator don't provide enough context; you need to configure explicit context content between coordinator and tool descriptions."},{"id":"71730","label":"C","text":"C\nThe coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent parameter can be specified."},{"id":"71731","label":"D","text":"D\nThe coordinator's allowed Tools configuration doesn't include \"Task\", so while it can describe delegation, it cannot actually invoke the tool required to spawn subagents."}],"correctAnswerIds":["71731"],"explanation":"Lý do chọn D: Khi một agent đóng vai trò điều phối (coordinator) nhận biết được sự cần thiết phải ủy quyền công việc cho các agent con (subagents) nhưng lại chỉ viết ra câu tường thuật (như \"I'll ask the web search agent...\") mà không thực hiện lệnh gọi công cụ (tool invocation), nguyên nhân phổ biến nhất là do quyền hạn (permissions) của coordinator chưa được cấu hình cho phép sử dụng công cụ \"Task\" (hoặc công cụ ủy quyền). Do thiếu quyền này, LLM hiểu được ý định và mô tả hành động bằng văn bản, nhưng hệ thống thực tế chặn hoặc không có công cụ để kích hoạt việc sinh ra subagent.\n\nCác đáp án khác không chính xác:\n\nA: Các AgentFunctions đã được cấu hình đúng mô tả và hạn chế, vấn đề nằm ở lớp thực thi công cụ chứ không phải system prompt xóa mất nhận thức về loại subagent.\n\nB: Vấn đề không nằm ở giới hạn ngữ cảnh của subagent hay việc thiếu cấu hình nội dung ngữ cảnh bổ sung.\n\nC: Việc gọi công cụ chưa bao giờ diễn ra chứ không phải bị cắt cụt (truncated) do max_tokens thấp."},{"index":5,"text":"After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats–inline citations vs. bibliographies, methodology sections vs. details embedded in introductions.\n\nWhat's the most effective way to address these failures?","choices":[{"id":"71692","label":"A","text":"A\nModify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation."},{"id":"71693","label":"B","text":"B\nBuild a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract."},{"id":"71694","label":"C","text":"C\nImplement retry logic that re-sends requests when validation detects empty required fields."},{"id":"71695","label":"D","text":"D\nAdd few-shot examples demonstrating extractions from documents with varied structures–showing how to identify citations in different formats and locate methodology details across section types."}],"correctAnswerIds":["71695"],"explanation":"Đây là bài toán điển hình về việc mô hình gặp khó khăn trong việc khái quát hóa (generalization) thông tin do sự đa dạng về định dạng dữ liệu trong tài liệu nguồn.\n\nTại sao chọn D:\n\nFew-shot prompting là kỹ thuật hiệu quả nhất để giải quyết sự không nhất quán trong cấu trúc tài liệu. Khi bạn cung cấp các ví dụ cụ thể (input-output pairs) cho thấy cách trích xuất cùng một loại thông tin (citations, methodology) từ nhiều cấu trúc khác nhau (inline, bibliography, intro, methodology section), bạn đang dạy mô hình cách nhận diện và chuẩn hóa thông tin đó.\n\nNó giúp mô hình hiểu rằng nhiệm vụ không chỉ là tìm các phần có tên gọi cụ thể (ví dụ: \"Methodology\"), mà là tìm nội dung tương ứng bất kể nó nằm ở đâu hay được trình bày ra sao.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Làm cho các trường thông tin trở nên tùy chọn (optional) sẽ làm giảm chất lượng dữ liệu đầu ra và không giải quyết được vấn đề thực chất là mô hình đang \"bỏ lỡ\" thông tin.\n\nB: Sử dụng regex là phương pháp cứng nhắc. Các văn bản pháp lý hoặc kỹ thuật phức tạp thường không tuân theo các pattern cố định. Việc duy trì các bộ lọc regex này sẽ rất khó khăn và dễ bị lỗi khi tài liệu thay đổi cấu trúc.\n\nC: Việc thử lại (retry) khi không có thay đổi trong prompt hoặc ngữ cảnh chỉ gây lãng phí tài nguyên (tokens/latency) mà không làm tăng khả năng thành công của mô hình, vì mô hình vẫn sẽ gặp cùng một khó khăn như lần thử đầu tiên."},{"index":6,"text":"After adding an MCP server with specialized code refactoring tools (extract_function, rename_variable, inline_function), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and working. Examining the configuration, you find each MCP tool has a minimal description like \"extract_function: extracts a function from code.\"\n\nWhat's the most effective way to improve adoption of the MCP refactoring tools?","choices":[{"id":"71632","label":"A","text":"A\nRemove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications."},{"id":"71633","label":"B","text":"B\nImplement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them."},{"id":"71634","label":"C","text":"C\nAccept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools."},{"id":"71635","label":"D","text":"D\nEnhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs."}],"correctAnswerIds":["71635"],"explanation":"Trong các hệ thống AI sử dụng Model Context Protocol (MCP), mô hình ngôn ngữ lớn (LLM) đưa ra quyết định chọn công cụ dựa trên mô tả (description) của công cụ đó.\n\nTại sao chọn D: Khi mô tả công cụ quá sơ sài (như \"extract_function: extracts a function from code\"), LLM không có đủ thông tin về ngữ cảnh hoặc độ tin cậy của công cụ so với các phương pháp cũ (như sed hay Write). Bằng cách cải thiện mô tả—bao gồm các điều kiện cụ thể khi nào nên ưu tiên dùng công cụ, định dạng đầu vào/đầu ra mong đợi—bạn đang cung cấp \"hướng dẫn sử dụng\" tốt hơn cho AI. Điều này giúp AI tự tin chọn công cụ chuyên dụng thay vì quay về các phương pháp thủ công.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc xóa bỏ hoàn toàn các công cụ cơ bản (Write) là quá cực đoan và có thể làm mất khả năng xử lý các tình huống mà công cụ chuyên dụng không bao phủ hết.\n\nB: Việc xây dựng một bộ phân loại (classifier) nằm ngoài luồng xử lý thông thường sẽ làm hệ thống trở nên phức tạp, khó bảo trì và không tận dụng được khả năng tự suy luận của LLM.\n\nC: Đây không phải là hành vi mong đợi. Việc có các công cụ chuyên dụng nhưng không sử dụng được là dấu hiệu của việc cấu hình hoặc cấu trúc thông tin (meta-data) của công cụ chưa đủ tốt."},{"index":7,"text":"In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications.\n\nWhat's the most effective approach to optimize for varying query complexity?","choices":[{"id":"71856","label":"A","text":"A\nCreate a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness."},{"id":"71857","label":"B","text":"B\nTrain a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve."},{"id":"71858","label":"C","text":"C\nHave the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements."},{"id":"71859","label":"D","text":"D\nImplement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination."}],"correctAnswerIds":["71858"],"explanation":"Tại sao đáp án C đúng: Đề bài nhấn mạnh rằng \"Your query distribution is diverse and evolving as users discover new applications\" (Phân phối câu hỏi rất đa dạng và liên tục tiến hóa khi người dùng khám phá ra các ứng dụng mới). Trong kiến trúc agent thông minh, việc để coordinator (agent điều phối trung tâm) tự phân tích từng truy vấn và đưa ra quyết định linh hoạt (dynamic routing) là phương pháp tối ưu nhất để xử lý các dạng câu hỏi biến đổi liên tục. Coordinator có thể điều phối gọi số lượng subagent vừa đủ (ví dụ: chỉ gọi 1 subagent cho câu hỏi đơn giản, hoặc gọi toàn bộ pipeline cho câu hỏi phức tạp) mà không cần cấu hình cứng.\n\nTại sao các đáp án khác sai:\n\nĐáp án A sai: Việc tạo một đường tắt (fast-path) hoàn toàn bỏ qua subagents cho câu hỏi đơn giản nhưng bắt buộc \"routing all other queries through the complete pipeline\" (đẩy tất cả các truy vấn khác qua toàn bộ pipeline cố định) không giải quyết được tính chất \"đa dạng và liên tục tiến hóa\" của các dạng câu hỏi phức tạp mới phát sinh.\n\nĐáp án B sai: Việc huấn luyện một mô hình phân loại (classifier) riêng biệt dựa trên dữ liệu lịch sử rồi phải \"retraining periodically as query patterns evolve\" tạo ra thêm chi phí vận hành (overhead) rất lớn, kém linh hoạt và chậm thích ứng hơn so với việc để coordinator tự xử lý bằng LLM sẵn có.\n\nĐáp án D sai: Việc phân loại dựa trên mẫu câu cố định (predefined subagent combination) sẽ quá cứng nhắc (hard-coded), không thể xử lý tốt các truy vấn mới, đa dạng và evolving mà người dùng liên tục tạo ra."},{"index":8,"text":"Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions\n\nBefore deploying, what validation step is most critical?","choices":[{"id":"71708","label":"A","text":"A\nAnalyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate."},{"id":"71709","label":"B","text":"B\nRun a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports."},{"id":"71710","label":"C","text":"C\nCompare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors."},{"id":"71711","label":"D","text":"D\nVerify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}],"correctAnswerIds":["71708"],"explanation":"Tại sao chọn A:\n\nNguyên tắc kiểm định dữ liệu quan trọng nhất trước khi tự động hóa (automation threshold) là tránh thiên vị gộp (Simpson's Paradox / Aggregate Bias).\n\nĐộ chính xác tổng thể 97% có thể làm giấu đi những phân đoạn rủi ro lớn. Ví dụ: hệ thống đạt 99% chính xác ở các trường thông tin đơn giản (tên, ngày tháng), nhưng chỉ đạt 60% ở các trường critical (số tiền, điều khoản hợp đồng) hoặc đối với các loại tài liệu phức tạp. Phân tích chi tiết theo từng loại tài liệu và trường dữ liệu (document type and field) giúp đảm bảo không có phân đoạn nào bị suy giảm chất lượng nghiêm trọng trước khi bỏ qua kiểm duyệt thủ công.\n\nTại sao các đáp án khác không phù hợp?\n\nB sai: So sánh ngưỡng tin cậy để tìm cutoff là bước tối ưu hóa sau khi đã xác nhận độ ổn định và an toàn của dữ liệu theo từng phân đoạn.\n\nC sai: Chạy thử nghiệm pilot 25% mà chưa kiểm tra độ chính xác theo phân đoạn có thể vô tình đẩy các dữ liệu trích xuất sai nghiêm trọng vào hệ thống downstream.\n\nD sai: Xác nhận yêu cầu của downstream systems là cần thiết nhưng không phải là bước kiểm định dữ liệu (validation step) đối với mô hình extraction."},{"index":9,"text":"Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies \"30-day payment terms\" while Amendment 1 changes this to \"45 days\"), the model inconsistently extracts one value or the other with no indication of which applies.\n\nWhat's the most effective approach to improve extraction accuracy for documents with amendments?","choices":[{"id":"71664","label":"A","text":"A\nRedesign the schema so amended fields capture multiple values, each with source location and effective date."},{"id":"71665","label":"B","text":"B\nImplement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review."},{"id":"71666","label":"C","text":"C\nPreprocess documents with a classifier that identifies and removes superseded sections before the main extraction step."},{"id":"71667","label":"D","text":"D\nAdd prompt instructions to always extract the most recent amendment value and ignore superseded original terms."}],"correctAnswerIds":["71664"],"explanation":"Trong các bài toán xử lý tài liệu pháp lý phức tạp như hợp đồng có nhiều phụ lục (amendments), việc chỉ cố gắng lấy ra một giá trị duy nhất (giá trị hiện tại) là rất rủi ro và dễ dẫn đến sai sót (model thường bị nhầm lẫn giữa điều khoản gốc và điều khoản sửa đổi).\n\nTại sao chọn A: Đây là phương pháp \"Structured Data Integrity\" (toàn vẹn dữ liệu cấu trúc). Bằng cách thiết kế lại schema để lưu trữ tất cả các phiên bản (kèm theo nguồn gốc và ngày hiệu lực), hệ thống của bạn sẽ đạt được hai lợi ích lớn:\n\nTính truy xuất nguồn gốc (Traceability): Bạn có thể kiểm chứng tại sao mô hình lại trích xuất giá trị đó, dựa trên đoạn văn bản nào.\n\nTính linh hoạt: Sau khi trích xuất được toàn bộ lịch sử thay đổi vào cấu trúc dữ liệu, lớp xử lý phía sau (downstream logic) mới là nơi quyết định đâu là giá trị \"cuối cùng\" có hiệu lực. Điều này tách biệt nhiệm vụ trích xuất (extraction) khỏi nhiệm vụ suy luận logic (reasoning), giúp mô hình hoạt động ổn định và chính xác hơn nhiều.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Việc dựa vào \"pattern matching\" hậu kiểm là giải pháp chắp vá. Các văn bản pháp lý rất đa dạng về ngôn ngữ, pattern matching sẽ không bao giờ bao phủ hết các trường hợp, và việc bắt con người \"review thủ công\" sẽ làm mất đi giá trị của việc tự động hóa.\n\nC: Việc xóa bỏ các phần \"superseded\" (bị thay thế) là cực kỳ nguy hiểm. Trong quản lý hợp đồng, việc biết được điều khoản cũ là gì đôi khi quan trọng không kém điều khoản mới (để giải quyết các tranh chấp về thời điểm phát sinh nghĩa vụ).\n\nD: Việc chỉ dựa vào \"prompt instructions\" là không đủ. Khi tài liệu có nhiều tầng lớp sửa đổi phức tạp, prompt không thể thay thế cho một kiến trúc dữ liệu vững chắc. Model vẫn sẽ bị \"ảo giác\" (hallucinate) hoặc bỏ sót thông tin nếu cấu trúc đầu ra không hỗ trợ việc phân biệt các lớp dữ liệu đó."},{"index":10,"text":"You're Implementing a feature where users refine their playlist preferences through multiple conversation turns. After deploying, you notice Claude's responses don't reflect what us earlier in the same conversation— for example, a user says they love jazz, but two messages later Claude asks what genres they enjoy.\n\nWhat is the most likely cause?","choices":[{"id":"71908","label":"A","text":"A\nThe model's context window has been exceeded by the conversation length"},{"id":"71909","label":"B","text":"B\nClaude requires a vector database connection to maintain conversation memory"},{"id":"71910","label":"C","text":"C\nYour application isn't including prior messages in the messages array"},{"id":"71911","label":"D","text":"D\nThe Claude API requires a session_id parameter that you haven't configured"}],"correctAnswerIds":["71910"],"explanation":"Bối cảnh bài toán:\n\nTrong một cuộc trò chuyện nhiều lượt (multi-turn conversation) nhằm tinh chỉnh sở thích nghe nhạc, Claude quên mất thông tin người dùng vừa cung cấp chỉ sau vài tin nhắn (ví dụ: vừa nói thích nhạc jazz nhưng ngay sau đó lại hỏi thích thể loại gì).\n\nMô hình ngôn ngữ lớn (LLM) vốn không có bộ nhớ trạng thái nội bộ (stateless) giữa các lần gọi API khác nhau.\n\nLý do lựa chọn phương án C:\n\nBản chất stateless của API: Claude API (và hầu hết các API của LLM) hoạt động theo cơ chế stateless. Mỗi lần gọi API, ứng dụng của bạn phải gửi toàn bộ lịch sử trò chuyện (bao gồm các tin nhắn trước đó của cả user và assistant) vào mảng messages trong payload gửi lên.\n\nNếu ứng dụng quên không đưa các tin nhắn trước vào mảng này mà chỉ gửi tin nhắn mới nhất, mô hình sẽ không có ngữ cảnh về những gì đã trao đổi trước đó, dẫn đến việc \"quên\" thông tin ngay trong cùng một phiên chat.\n\nLoại trừ các phương án khác:\n\nPhương án A sai vì chỉ mới qua vài tin nhắn thì không thể vượt quá giới hạn cửa sổ ngữ cảnh (context window) của mô hình.\n\nPhương án B sai vì Claude API không bắt buộc phải có cơ sở dữ liệu vector (vector database) chỉ để duy trì bộ nhớ trong một phiên chat ngắn hạn (multi-turn messages array là đủ).\n\nPhương án D sai vì Claude API không sử dụng tham số session_id để tự động quản lý lịch sử trò chuyện phía server theo cách đó."},{"index":11,"text":"The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals that 12% of high-confidence extractions (>85%) also contain errors—cases where the model finds plausible-but-incorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing different product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to catch these high-confidence errors and measure whether improvements reduce the error rate over time.\n\nWhat approach is most effective?","choices":[{"id":"71940","label":"A","text":"A\nImplement heuristic rules that flag documents containing comparison tables or appendices for review regardless of confidence score."},{"id":"71941","label":"B","text":"B\nImplement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly, enabling error rate measurement and novel pattern detection."},{"id":"71942","label":"C","text":"C\nAdd a verification pass that re-extracts from each high-confidence document, flagging cases where the two extraction attempts produce different results."},{"id":"71943","label":"D","text":"D\nLower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}],"correctAnswerIds":["71941"],"explanation":"Lý do chọn B: Trong các hệ thống AI/LLM production, khi mô hình tự tin cao (>85%) nhưng vẫn có tỷ lệ lỗi ẩn (như sai sót do bảng so sánh, phụ lục, hay ngôn từ mơ hồ mà model tự bịa ra giá trị hợp lý - plausible-but-incorrect), việc áp dụng stratified random sampling (lấy mẫu ngẫu nhiên phân tầng) là chiến lược bền vững nhất. Nó vừa giúp kiểm soát định kỳ, đo lường chính xác tỷ lệ lỗi (error rate) theo thời gian, vừa phát hiện được các mẫu lỗi mới (novel patterns) để cải thiện hệ thống.\n\nCác phương án khác chưa tối ưu:\n\nA: Dùng heuristic rules cứng nhắc có thể gây quá tải cho bộ phận review thủ công và bỏ sót các lỗi phát sinh từ ngữ cảnh khác ngoài bảng so sánh/phụ lục.\n\nC: Chạy lại xác thực (re-extraction) trên tất cả tài liệu độ tin cậy cao gây tốn kém chi phí tính toán và nếu model có xu hướng sai sót cố hữu (consistent hallucination), kết quả chạy lại vẫn có thể trùng khớp sai lầm.\n\nD: Hạ ngưỡng confidence xuống 70% làm tăng đáng kể khối lượng công việc kiểm duyệt thủ công mà không giải quyết tận gốc rễ nguyên nhân gây lỗi ở nhóm độ tin cậy cao."},{"index":12,"text":"When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely.\n\nWhat's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?","choices":[{"id":"71772","label":"A","text":"A\nImplement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents."},{"id":"71773","label":"B","text":"B\nCreate a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity."},{"id":"71774","label":"C","text":"C\nHave the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis."},{"id":"71775","label":"D","text":"D\nEnable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations."}],"correctAnswerIds":["71774"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C:\n\nĐể giảm thời gian xử lý (giảm latency) đối với một tài liệu lớn có chứa nhiều tiền lệ pháp lý (precedents), phương pháp tối ưu và phổ biến nhất trong kiến trúc đa agent là để coordinator chia nhỏ công việc và giao cho nhiều subagent chạy song song (parallel subagents), mỗi agent xử lý một tập con các precedents, sau đó gom kết quả lại.\n\nCách này vừa giúp xử lý song song giảm đáng kể thời gian chờ đợi, vừa đảm bảo coordinator vẫn giữ quyền kiểm soát trực tiếp toàn bộ các subagent con này để dễ dàng theo dõi (monitor) và gỡ lỗi (debug).\n\nCác đáp án khác không chính xác:\n\nA: Sử dụng hàng đợi thông điệp bất đồng bộ (message queue) và worker pool làm tăng độ phức tạp kiến trúc hạ tầng ngoài phạm vi thiết kế agent thông thường và làm giảm khả năng theo dõi trực tiếp của coordinator.\n\nB: Tạo phân cấp agent đệ quy quá sâu (multi-level recursive hierarchy) không cần thiết và làm phức tạp quá mức việc debug.\n\nD: Cho phép subagent tự động sinh ra các subagent con của riêng nó (nested spawning) làm mất đi khả năng kiểm soát tập trung trực tiếp của coordinator, gây khó khăn cho việc giám sát và debug hệ thống."},{"index":13,"text":"Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field–sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source.\n\nWhat's the most effective way to improve extraction consistency?","choices":[{"id":"71684","label":"A","text":"A\nSet temperature to 0 to eliminate randomness and ensure deterministic outputs"},{"id":"71685","label":"B","text":"B\nMake the \"materials\" field required instead of optional in the schema to force the model to always extract a value"},{"id":"71686","label":"C","text":"C\nSwitch to a more capable model tier since inconsistent extraction indicates insufficient model capability"},{"id":"71687","label":"D","text":"D\nAdd few-shot examples showing 2-3 complete input-output pairs with standardized material description formats"}],"correctAnswerIds":["71687"],"explanation":"Khi mô hình AI gặp vấn đề về tính nhất quán trong trích xuất dữ liệu (dù schema đã được định nghĩa rõ ràng), nguyên nhân cốt lõi thường là do mô hình không \"hiểu\" được kỳ vọng về định dạng đầu ra hoặc thiếu sự hướng dẫn cụ thể về cách chuẩn hóa các giá trị biến thiên (như \"cotton blend\" so với \"Cotton/Polyester mix\").\n\nTại sao chọn D:\n\nFew-shot prompting là kỹ thuật hiệu quả nhất để thiết lập \"tiêu chuẩn\". Bằng cách cung cấp 2-3 ví dụ cụ thể (input + output đúng), bạn đang hướng dẫn mô hình cách chuẩn hóa (normalize) các thuật ngữ về vật liệu và ép buộc mô hình phải trích xuất trường này một cách nhất quán theo định dạng bạn mong muốn.\n\nNó giúp mô hình nhận diện được rằng \"nếu có thông tin vật liệu, nó phải được trích xuất\" theo format đã chỉ định, từ đó khắc phục tình trạng mô hình thỉnh thoảng bỏ qua trường này.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Nhiệt độ bằng 0 (temperature = 0) giúp kết quả có tính xác định cao hơn (ít ngẫu nhiên hơn), nhưng nó không dạy mô hình cách chuẩn hóa dữ liệu. Nếu prompt gốc không đủ rõ ràng về định dạng, nó sẽ chỉ tạo ra một lỗi sai lặp đi lặp lại một cách \"xác định\".\n\nB: Việc bắt buộc trường dữ liệu (required) sẽ ép mô hình phải điền vào, nhưng nếu không có hướng dẫn về định dạng (few-shot), mô hình vẫn có thể điền vào theo các kiểu khác nhau (ví dụ: vẫn ghi \"cotton blend\" lúc thì \"Cotton/Polyester mix\"). Điều này không giải quyết được tính nhất quán về nội dung.\n\nC: Inconsistent extraction (trích xuất không nhất quán) thường là vấn đề về hướng dẫn (prompting) chứ không phải vấn đề về năng lực của mô hình. Các mô hình hiện đại đều đủ khả năng trích xuất vật liệu, vấn đề nằm ở cách chúng ta yêu cầu chúng làm việc đó."},{"index":14,"text":"An engineer asks the agent to investigate error handling in a legacy payment processing module spanning 15 files. After reading the first 8 files, the agent's responses are becoming noticeably less accurate—it's forgetting previously discovered code patterns and hasn't yet located all test files or traced the complete data flow.\n\nWhat's the most effective approach to complete this investigation?","choices":[{"id":"71636","label":"A","text":"A\n\nSpawn a subagent to explore the remaining files, providing a summary of discovered patterns as its initial context."},{"id":"71637","label":"B","text":"B\n\nDocument a summary of findings so far in a file, then start fresh with a new context using that summary as reference."},{"id":"71638","label":"C","text":"C\nClose the current context with /clear and start fresh, re-reading only the most critical files."},{"id":"71639","label":"D","text":"D\nUse Grep to search for specific function names across remaining files, reducing the content loaded into context."}],"correctAnswerIds":["71637"],"explanation":"Trong các tình huống làm việc với các codebase lớn (như module 15 file), khi AI bắt đầu mất dấu các thông tin đã tìm thấy trước đó (do giới hạn ngữ cảnh hoặc \"sự mệt mỏi\" của mô hình), việc quản lý ngữ cảnh chủ động là chìa khóa.\n\nTại sao chọn B: Đây là kỹ thuật \"Checkpointing\" hiệu quả. Bằng cách ghi lại những gì đã biết (các patterns, test files đã tìm thấy, luồng dữ liệu đã hiểu) vào một tài liệu (ví dụ: investigation_summary.md), bạn tạo ra một \"bộ nhớ ngoài\" (external memory). Khi bắt đầu một phiên làm việc mới (context mới), bạn nạp tệp này vào để AI ngay lập tức nắm bắt được toàn bộ lịch sử và kết quả công việc, giúp nó tiếp tục công việc mà không bị lặp lại hoặc quên mất các chi tiết quan trọng.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc sinh ra một \"subagent\" thường không giải quyết được vấn đề mất ngữ cảnh vì subagent cũng sẽ bị giới hạn bởi cùng một mô hình nền tảng và có thể gây phức tạp hóa việc quản lý luồng suy nghĩ.\n\nC: Sử dụng /clear là cần thiết để làm mới ngữ cảnh, nhưng chỉ re-reading \"các file quan trọng\" vẫn khiến AI thiếu đi bức tranh tổng thể và các kết luận đã được rút ra từ những file đã đọc trước đó. Phương án B vượt trội hơn nhờ việc bảo toàn các kết luận (findings).\n\nD: Grep chỉ giúp tìm kiếm từ khóa, nó không giúp AI \"hiểu\" hoặc \"xâu chuỗi\" được logic nghiệp vụ phức tạp của module thanh toán—điều mà một tệp tóm tắt (B) làm tốt hơn nhiều."},{"index":15,"text":"Your agent has analyzed a complex service module–reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs.\n\nHow should you manage the sessions?","choices":[{"id":"71644","label":"A","text":"A\nResume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."},{"id":"71645","label":"B","text":"B\nExport the analysis session's key findings to a file, then create two new sessions that reference this file."},{"id":"71646","label":"C","text":"C\nContinue in the original session, developing end-to-end tests first, then snapshot tests sequentially."},{"id":"71647","label":"D","text":"D\nStart two fresh sessions, having each re-read the relevant source files before beginning."}],"correctAnswerIds":["71644"],"explanation":"Trong các hệ thống AI làm việc với codebase phức tạp, việc duy trì ngữ cảnh là tối quan trọng, đặc biệt khi cần đánh giá các phương án thử nghiệm đối nghịch nhau mà không muốn làm nhiễu dữ liệu.\n\nTại sao chọn A: Tính năng fork_session được thiết kế chuyên biệt cho tình huống này. Nó cho phép:\n\nThừa hưởng toàn bộ ngữ cảnh: Cả hai nhánh đều giữ nguyên các thông tin, patterns và kiến trúc mà AI đã phân tích từ 23 source files trước đó, giúp bạn không mất thời gian nạp lại dữ liệu.\n\nTách biệt logic (Isolation): Việc phát triển \"end-to-end tests\" ở nhánh này và \"snapshot tests\" ở nhánh kia hoàn toàn độc lập. Các thay đổi hoặc giả định của phương án này sẽ không ảnh hưởng đến phương án kia, giúp so sánh kết quả chính xác hơn.\n\nHiệu quả: Đây là cách làm \"đúng quy trình\" nhất để quản lý các nhánh thử nghiệm trong một luồng công việc AI, thay vì phải xuất/nhập file (B) hoặc thực hiện tuần tự gây quá tải (C).\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Mất công sức và không hiệu quả. Việc xuất/nhập file thủ công thường dẫn đến mất mát các chi tiết ngữ cảnh tinh vi mà AI đã \"nhớ\" được trong quá trình phân tích.\n\nC: Phát triển tuần tự không giúp đánh giá song song (trade-off) tốt bằng việc tách nhánh, đồng thời các thay đổi code của phương án đầu có thể làm \"ô nhiễm\" hoặc làm sai lệch kết quả của phương án sau.\n\nD: Việc bắt đầu lại từ đầu là lãng phí tài nguyên và thời gian, đồng thời AI có thể bỏ sót các chi tiết nhỏ đã được xác định trước đó do không có sự tiếp nối ngữ cảnh (context continuity)."},{"index":16,"text":"The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source quality criteria (coverage breadth, source diversity), and content type classifications. The coordinator sometimes encounters challenges where instructions fail when the subagent encounters unexpected situations.\n\nWhat's the most effective way to improve subagent adaptability?","choices":[{"id":"71744","label":"A","text":"A\nRemove procedural detail entirely, delegating with simple goals like \"research it thoroughly\" and relying on the subagent's general capabilities."},{"id":"71745","label":"B","text":"B\nAdd explicit fallback directives to the detailed instructions: \"if specified searches fail, attempt alternative queries before reporting failure.\""},{"id":"71746","label":"C","text":"C\nImplement a task classification step where the coordinator categorizes requests as \"analytical\" vs \"exploratory\" and uses different instruction sets for each category."},{"id":"71747","label":"D","text":"D\nSpecify research goals and quality criteria (coverage breadth, source diversity, content type) rather than procedural instructions, letting the subagent determine execution."}],"correctAnswerIds":["71747"],"explanation":"Đáp án đúng cho câu hỏi này là [D].\n\nGiải thích chi tiết:\n\nLý do chọn D: Trong thiết kế hệ thống đa agent (multi-agent systems), việc cung cấp các hướng dẫn quá chi tiết về mặt thủ tục (procedural instructions như ép buộc truy vấn chính xác, bước đi cứng nhắc) dễ khiến subagent gặp bế tắc khi tình huống thực tế thay đổi hoặc phát sinh bất ngờ. Để cải thiện khả năng thích ứng (adaptability), kiến trúc tốt nhất là chuyển từ chỉ đạo thủ tục sang giao quyền dựa trên mục tiêu và tiêu chuẩn chất lượng (specify research goals and quality criteria), trao quyền tự chủ cho subagent linh hoạt tự quyết định cách thực thi tối ưu nhất.\n\nCác đáp án khác không chính xác:\n\nA: Loại bỏ hoàn toàn chi tiết và giao việc quá mơ hồ (\"research it thoroughly\") sẽ khiến subagent thiếu đi các tiêu chí kiểm soát chất lượng cần thiết, dễ dẫn đến kết quả lan man, thiếu chiều sâu.\n\nB: Việc thêm các lệnh fallback thủ công vào tập chỉ dẫn chi tiết vẫn giữ nguyên bản chất cứng nhắc của lập trình thủ tục, không giải quyết được gốc rễ vấn đề thích ứng linh hoạt.\n\nC: Việc phân loại tác vụ thành analytical hay exploratory không giải quyết trực tiếp bài toán xử lý các tình huống bất ngờ khi subagent đang thực thi các bước thủ tục cụ thể."},{"index":17,"text":"An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total).\n\nWhat's the most effective next step for building understanding while managing context constraints?","choices":[{"id":"71652","label":"A","text":"A\nAnalyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations."},{"id":"71653","label":"B","text":"B\nUse Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line ranges with minimal surrounding context."},{"id":"71654","label":"C","text":"C\nUse the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation."},{"id":"71655","label":"D","text":"D\nUse Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by reading them first, then check smaller files for gaps."}],"correctAnswerIds":["71652"],"explanation":"Khi đối mặt với một codebase lớn (15 file, ~8,000 dòng code), việc cố gắng đọc hết tất cả hoặc tìm kiếm theo từ khóa dàn trải sẽ làm lãng phí \"ngân sách\" ngữ cảnh (context budget) của AI, khiến nó không nắm bắt được bức tranh tổng thể về kiến trúc hệ thống.\n\nTại sao chọn A: Đây là phương pháp \"Top-down\" tối ưu:\n\nXác định tâm điểm (Base class/Interface): Bằng cách phân tích imports và cấu trúc lớp, AI tìm thấy \"bộ não\" của hệ thống caching. Hiểu được interface giúp AI biết cách hệ thống giao tiếp với các thành phần khác.\n\nTruy vết có mục tiêu (Trace specific implementations): Sau khi đã hiểu cơ chế cốt lõi, việc tìm kiếm các đoạn code liên quan đến \"invalidation\" sẽ trở nên cực kỳ chính xác và tiết kiệm ngữ cảnh. Bạn chỉ nạp vào bộ nhớ những phần thực sự cần thiết thay vì nạp toàn bộ các file không liên quan.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Việc chỉ tìm theo từ khóa (\"invalidate\"/\"expire\") rất dễ bỏ sót các logic phụ thuộc vào trạng thái hoặc các luồng gián tiếp, và nó không giúp AI hiểu được kiến trúc tổng thể.\n\nC: Đây là cách làm phản khoa học nhất. Việc đọc tuần tự 15 file sẽ gây \"context saturation\" (bão hòa ngữ cảnh), khiến AI mất đi các thông tin quan trọng ở phần đầu khi nó đọc đến phần sau.\n\nD: Việc ưu tiên đọc file dựa trên dung lượng (size) không phản ánh đúng vai trò của file đó trong kiến trúc hệ thống. Một file nhỏ (ví dụ: một Interface hoặc Decorator) thường quan trọng hơn nhiều so với một file lớn chứa nhiều dữ liệu tĩnh."},{"index":18,"text":"This currently requires manually copy-pasting content into conversations. The team wants the agent to access this standard Jira ticket data directly.\n\nWhat's the most effective approach?","choices":[{"id":"71868","label":"A","text":"A\nIntegrate an existing Jira MCP server that exposes tickets, comments, and metadata through discoverable tool interfaces."},{"id":"71869","label":"B","text":"B\nUse the Bash tool with curl to call Jira's REST API, including authentication headers and parsing JSON responses inline."},{"id":"71870","label":"C","text":"C\nBuild a custom MCP server wrapping Jira's API with tools designed specifically for this team's code review workflow."},{"id":"71871","label":"D","text":"D\nExport Jira tickets to markdown files in the repository that the agent accesses using the Read tool."}],"correctAnswerIds":["71868"],"explanation":"Tại sao đáp án A đúng:\n\nĐề bài nêu rõ yêu cầu truy cập dữ liệu standard Jira ticket data trực tiếp để thay thế việc copy-paste thủ công. Sử dụng Model Context Protocol (MCP) với một MCP server có sẵn cho Jira giúp cung cấp sẵn các giao diện công cụ chuẩn hóa, bảo mật và có thể khám phá được (discoverable tool interfaces) mà agent có thể sử dụng ngay lập tức mà không cần tốn công xây dựng lại từ đầu.\n\nTại sao các đáp án khác sai:\n\nĐáp án B sai: Việc sử dụng Bash tool với curl để gọi REST API thủ công kèm theo phân tích JSON inline vừa kém an toàn, dễ lỗi cú pháp dòng lệnh, vừa không tận dụng được cơ chế quản lý công cụ cấu trúc an toàn của agent.\n\nĐáp án C sai: Việc tự xây dựng một custom MCP server từ đầu là lãng phí thời gian và công sức khi đề bài nhắc đến việc truy cập dữ liệu Jira tiêu chuẩn (standard Jira ticket data) mà các MCP server có sẵn đã hỗ trợ hoàn toàn.\n\nĐáp án D sai: Việc export thủ công ra các file markdown trong repository gây ra độ trễ dữ liệu lớn, mất đi tính đồng bộ thời gian thực (real-time access) của ticket và biến thông tin động thành tài liệu tĩnh."},{"index":19,"text":"A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 responses. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers.\n\nWhat task decomposition approach would be most effective?","choices":[{"id":"71604","label":"A","text":"A\nHave the agent first create a comprehensive plan mapping all code paths through documented components before beginning any exploration or code reading."},{"id":"71605","label":"B","text":"B\nDefine a fixed sequence of investigation steps upfront—grep for error handlers, then examine middleware, then check database queries, then examine middleware-woven code."},{"id":"71606","label":"C","text":"C\nHave the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges."},{"id":"71607","label":"D","text":"D\nRun parallel worker agents on the file system of four layers, then combine their findings to reconstruct the complete error path."}],"correctAnswerIds":["71606"],"explanation":"Trong các bài toán xử lý sự cố (troubleshooting) với một hệ thống phức tạp hoặc cơ sở mã lớn (codebase 200+ file) mà không biết rõ các thành phần liên quan, phương pháp tiếp cận linh hoạt (dynamic/adaptive) luôn mang lại hiệu quả cao nhất:\n\nTại sao chọn C: Việc điều tra lỗi ngẫu nhiên (intermittent 500 errors) thường giống như một quá trình thám tử. Bạn không thể biết trước mọi bước cần thiết nếu chưa tìm ra manh mối đầu tiên. Phương pháp này cho phép agent thu thập thông tin, phân tích dữ liệu log hoặc dấu vết (trace) từ bước trước đó, rồi mới quyết định bước tiếp theo nên là gì (ví dụ: tập trung vào middleware hay database). Điều này giúp tối ưu hóa thời gian và tránh việc thực hiện các phân tích không cần thiết.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc lập bản đồ toàn bộ hệ thống trước khi bắt đầu là quá tốn kém và thiếu thực tế đối với một lỗi cụ thể. Nó làm lãng phí nguồn lực vào các khu vực không liên quan đến lỗi.\n\nB: Một quy trình cứng nhắc (fixed sequence) rất dễ thất bại vì mỗi lỗi có đặc thù riêng. Nếu lỗi nằm ở một logic kinh doanh (business logic) ẩn, việc đi theo tuần tự cố định từ middleware xuống database có thể khiến agent bỏ lỡ nguyên nhân gốc rễ.\n\nD: Việc chạy song song (parallel) khi chưa xác định được phạm vi hoặc không có sự phối hợp chặt chẽ dễ dẫn đến việc làm quá tải hệ thống, tạo ra nhiều \"nhiễu\" và khó khăn trong việc kết nối các mảnh ghép thông tin lại với nhau để tìm ra một lỗi có tính chất liên tục/ngẫu nhiên."},{"index":20,"text":"Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals.\n\nWhat's the most effective approach to improve extraction reliability?","choices":[{"id":"71844","label":"A","text":"A\nExtract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct."},{"id":"71845","label":"B","text":"B\nAdd few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions."},{"id":"71846","label":"C","text":"C\nAdd a \"calculated_total\" field where the model sums extracted line items alongside a \"stated_total\" field. Flag records for human review when values differ."},{"id":"71847","label":"D","text":"D\nImplement post-processing that automatically adjusts line item amounts proportionally when their sum doesn't match the stated total."}],"correctAnswerIds":["71846"],"explanation":"Đáp án đúng: [C] (Add a \"calculated_total\" field where the model sums extracted line items alongside a \"stated_total\" field. Flag records for human review when values differ.)\n\nGiải thích chi tiết:\n\nTại sao phương án [C] là tối ưu nhất?\n\nTrong các hệ thống xử lý tài chính/hóa đơn tự động, việc tự ý chỉnh sửa dữ liệu (như tự ý phân bổ lại tiền ở phương án D) hoặc để mô hình tự suy luận mà không có cơ chế kiểm soát có thể dẫn đến sai lệch dữ liệu tài chính nghiêm trọng, ảnh hưởng đến tính pháp lý và sổ sách kế toán.\n\nViệc tách biệt rõ ràng giữa calculated_total (tổng do mô hình tự tính từ các dòng line items) và stated_total (tổng thực tế ghi trên hóa đơn) cho phép hệ thống phát hiện chính xác lỗi (do lỗi OCR hoặc lỗi mô hình).\n\nĐánh dấu (flag) các bản ghi không khớp để review thủ công (human review) là phương pháp chuẩn mực trong các kiến trúc AI tài chính đòi hỏi độ chính xác cao tuyệt đối, ngăn chặn việc dữ liệu sai bị đẩy thẳng vào hệ thống kế toán hạ nguồn (downstream accounting systems).\n\nTại sao các phương án khác chưa tối ưu:\n\n[A] Sử dụng thêm một model phụ riêng biệt vừa tốn kém chi phí, tăng độ trễ (latency) vừa không giải quyết được tận gốc vấn đề dữ liệu gốc bị lỗi OCR hoặc trích xuất nhầm từ đầu.\n\n[B] Few-shot examples có thể giúp giảm một phần lỗi của model, nhưng không thể khắc phục được tận gốc các trường hợp lỗi OCR từ văn bản gốc (nguồn tài liệu gốc đã bị sai số từ đầu).\n\n[D] Tự động điều chỉnh tỉ lệ (proportional adjustment) là hành vi tự ý \"bóp méo\" số liệu gốc của hóa đơn, cực kỳ rủi ro trong kế toán và kiểm toán vì làm sai lệch số tiền thực tế giao dịch."},{"index":21,"text":"During a conversation about order tracking, your external system receives a webhook indicating the user's package has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the assistant to naturally incorporate this status change in its next response.\n\nWhat's the most effective approach?","choices":[{"id":"71924","label":"A","text":"A\nAdd the current shipping status to the system prompt before the next API call."},{"id":"71925","label":"B","text":"B\nAppend the status update as a prefix to the next user message before calling the API."},{"id":"71926","label":"C","text":"C\nConfigure the assistant to call a get_order_status tool at the start of every response."},{"id":"71927","label":"D","text":"D\nImmediately send an API request with the update as a synthetic user message, generating an unsolicited assistant response."}],"correctAnswerIds":["71924"],"explanation":"A) Thêm trạng thái vận chuyển hiện tại vào system prompt trước lần gọi API tiếp theo.\n\nWebhook là một sự kiện từ bên ngoài (external event). Khi hệ thống của bạn biết được thông tin mới (ví dụ: đơn hàng đã được gửi), thì ở lần gọi API tiếp theo, bạn chỉ cần bổ sung thông tin này vào system prompt hoặc application context.\n\nƯu điểm:\n\nAI coi đây là thông tin đáng tin cậy do hệ thống cung cấp.\n\nKhông cần sửa nội dung người dùng.\n\nKhông cần gọi API ngay lập tức.\n\nAI sẽ tự nhiên nhắc đến việc đơn hàng đã được gửi khi trả lời.\n\nĐây là cách Anthropic khuyến nghị khi xử lý external state changes."},{"index":22,"text":"After deploying the automated review, you notice high precision but low recall — real bugs are slipping through undetected. Investigation reveals your review prompt instructs Claude to \"only report high- confidence issues you are certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race condition that caused a production outage was visible in a reviewed PR and went unreported. You need to substantially improve bug detection while keeping false positive rates manageable for your team.\n\nWhat is the most effective approach?","choices":[{"id":"71876","label":"A","text":"A\nSplit the review into a finding stage where Claude's goal is coverage — flagging every potential issue with confidence and severity metadata — and a separate stage that thresholds those findings."},{"id":"71877","label":"B","text":"B\nRemove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a programmatic filter to deduplicate and suppress categories that historically generate false positives."},{"id":"71878","label":"C","text":"C\nAdd detailed few-shot examples demonstrating bug categories Claude should flag — race conditions, null dereferences, error handling gaps — while keeping the high-confidence filtering instruction to maintain current precision levels."},{"id":"71879","label":"D","text":"D\nExpand the context window by including related test files, recent git history, and the module's dependency graph alongside the diff, giving Claude richer signals to assess issue severity."}],"correctAnswerIds":["71876"],"explanation":"Bối cảnh bài toán:\n\nHệ thống review code tự động hiện tại đang gặp vấn đề high precision but low recall (độ chính xác cao nhưng độ bao phủ thấp): các lỗi thực tế (như race condition gây sập production) bị bỏ sót vì prompt yêu cầu Claude quá khắt khe (\"only report high-confidence issues\", \"err on the side of not commenting\").\n\nMục tiêu là nâng cao khả năng phát hiện lỗi (recall) mà vẫn giữ tỷ lệ dương tính giả (false positive) ở mức quản lý được để không làm phiền developers.\n\nLý do lựa chọn phương án A:\n\nTách bạch 2 giai đoạn (Two-stage approach):\n\nGiai đoạn 1 (Finding Stage): Mục tiêu cốt lõi là đạt độ bao phủ cao (coverage), yêu cầu mô hình nêu ra mọi vấn đề tiềm ẩn kèm theo metadata về mức độ tự tin (confidence) và mức độ nghiêm trọng (severity). Bằng cách này, mô hình không bị kìm hãm bởi việc phải lọc từ đầu.\n\nG giai đoạn 2 (Thresholding Stage): Lọc lại hoặc xử lý các kết quả đó dựa trên các tiêu chí cụ thể thay vì bắt một mình prompt xử lý toàn bộ bài toán đánh đổi giữa precision và recall.\n\nCác phương án khác (như B, C, D) hoặc vẫn dựa vào việc ép một prompt duy nhất lọc trước (gây mất recall), hoặc phụ thuộc vào việc thêm ví dụ/context đơn thuần mà không giải quyết được bài toán phân tách luồng đánh giá coverage vs. filtering."},{"index":23,"text":"The document analysis agent has a single analyze_document tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions.\n\nWhat's the most effective way to improve reliability?","choices":[{"id":"71724","label":"A","text":"A\nKeep the single tool but add an analysis_type enum parameter requiring explicit selection between extraction, summarization, and verification modes."},{"id":"71725","label":"B","text":"B\nSplit the generic tool into purpose-specific tools– extract_data_points, summarize_content, verify_claim_against_source –each with defined input/output contracts."},{"id":"71726","label":"C","text":"C\nEnhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats."},{"id":"71727","label":"D","text":"D\nHave the coordinator pre-classify each analysis request before passing instructions to the document analysis agent."}],"correctAnswerIds":["71725"],"explanation":"Đây là bài toán về thiết kế hệ thống công cụ (Tool Design Pattern) trong kiến trúc AI Agent để đảm bảo tính dự đoán được (predictability) và độ tin cậy.\n\nTại sao chọn B:\n\nTách biệt trách nhiệm (Separation of Concerns): Khi bạn có một công cụ \"đa năng\" (generic tool) nhận tham số là văn bản tự do, mô hình rất dễ bị nhầm lẫn giữa các mục đích khác nhau (ví dụ: yêu cầu \"extract\" nhưng lại trả về \"summary\").\n\nĐịnh nghĩa hợp đồng rõ ràng (Input/Output Contracts): Bằng cách chia thành các công cụ chuyên biệt, mỗi công cụ sẽ có một Schema riêng biệt và cố định. Ví dụ, extract_data_points sẽ được cấu hình để luôn trả về dạng JSON có cấu trúc, trong khi summarize_content sẽ tập trung vào văn bản. Điều này loại bỏ hoàn toàn việc \"đoán\" mục đích của mô hình và đảm bảo rằng đầu ra luôn tuân thủ đúng định dạng cần thiết cho công việc tiếp theo của Synthesis Agent.\n\nGiảm thiểu lỗi logic: Khi mô hình chỉ có một lựa chọn duy nhất cho một mục đích cụ thể, tỉ lệ thành công sẽ tăng vọt vì bạn đã giới hạn không gian tìm kiếm giải pháp của nó.\n\nTại sao các phương án khác chưa tối ưu:\n\nA & C: Chỉ là những \"băng dán\" tạm thời (patch). Việc thêm tham số hoặc mô tả chi tiết vẫn không ngăn được mô hình \"nhầm lẫn\" giữa các định dạng đầu ra nếu nó vẫn sử dụng cùng một bộ logic thực thi cho nhiều mục đích khác nhau.\n\nD: Việc để coordinator phân loại là một bước trung gian tốn kém, làm tăng độ trễ (latency) và vẫn phụ thuộc vào việc mô hình phân loại có chính xác hay không, trong khi việc tách công cụ (B) giải quyết vấn đề ở tầng kiến trúc hệ thống, mang lại độ ổn định cao nhất."},{"index":24,"text":"In production, you're distributing complex queries to specialized subagents. The query distribution is uneven and evolving as users discover new applications.\n\nWhat's the most effective approach to optimize for query complexity?","choices":[{"id":"71776","label":"A","text":"A\nTrain a query complexity classifier based on labeled historical data to predict optimal subagent combination."},{"id":"71777","label":"B","text":"B\n\nHave the coordinator analyze each query dynamically and selectively route subagents based on the query's complexity and routing characteristics."},{"id":"71778","label":"C","text":"C\nImplement pattern-based routing that categorizes queries based on factual vs analytical patterns and maps each to a predefined subagent combination."},{"id":"71779","label":"D","text":"D\n\nCreate a fast-track path for factual questions that bypasses subagents entirely, routing only analytical queries through the complete pipeline."}],"correctAnswerIds":["71777"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Đề bài nhấn mạnh rằng phân phối truy vấn không đồng đều và đang liên tục tiến hóa (uneven and evolving as users discover new applications) khi người dùng khám phá các ứng dụng mới. Do đó, việc sử dụng các phương pháp tĩnh như huấn luyện mô hình phân loại dựa trên dữ liệu lịch sử cố định (Đáp án A), quy tắc mẫu cố định (Đáp án C), hay đường tắt cứng nhắc (Đáp án D) đều sẽ nhanh chóng trở nên lỗi thời hoặc thiếu linh hoạt. Phương án tối ưu và thích ứng tốt nhất là để coordinator tự phân tích từng truy vấn một cách động (dynamically) và định tuyến linh hoạt cho các subagent dựa trên chính đặc trưng phức tạp của truy vấn đó tại thời điểm thực thi.\n\nCác đáp án khác không chính xác:\n\nA: Huấn luyện bộ phân loại dựa trên dữ liệu lịch sử tĩnh (historical data) sẽ kém hiệu quả khi phân phối truy vấn liên tục thay đổi và phát triển theo các ứng dụng mới mà người dùng khám phá.\n\nC: Áp dụng định tuyến dựa trên mẫu cố định (pattern-based routing) bị cứng nhắc, không xử lý được các biến thể phức tạp mới phát sinh.\n\nD: Việc tạo fast-track bỏ qua hoàn toàn subagents cho các câu hỏi thông thường làm giảm tính đồng nhất và khả năng xử lý chuyên sâu của kiến trúc đa agent."},{"index":25,"text":"After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask \"What did we conclude about the theme of isolation?\", the assistant provides generic literary analysis rather than referencing the group's specific insights from earlier sessions. Discussions often build on previous meetings' conclusions, so maintaining narrative context is important.\n\nWhat's the most effective approach?","choices":[{"id":"71904","label":"A","text":"A\nImplement rolling window truncation to keep only the most recent 25,000 tokens."},{"id":"71905","label":"B","text":"B\nImplement progressive summarization where older conversation blocks are replaced with concise summaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim."},{"id":"71906","label":"C","text":"C\nAdd structured XML tags to mark significant discussion conclusions throughout the conversation history."},{"id":"71907","label":"D","text":"D\nUse semantic embedding to index the full conversation history and retrieve only relevant past exchanges for each user query, replacing the linear conversation format with retrieved segments."}],"correctAnswerIds":["71905"],"explanation":"Bối cảnh bài toán:\n\nLịch sử trò chuyện kéo dài qua nhiều tuần (đạt 85,000 tokens) và các cuộc thảo luận sau thường dựa trên kết luận hoặc quyết định của các buổi họp trước.\n\nKhi hỏi về chủ đề cụ thể, trợ lý đưa ra phân tích chung chung thay vì bám sát thông tin chi tiết từng trao đổi trước đó do ngữ cảnh quá dài hoặc bị cắt cụt.\n\nLý do lựa chọn phương án B:\n\nProgressive Summarization (Tóm tắt lũy tiến / phân tầng): Phương pháp này giúp giữ nguyên vẹn (verbatim) các trao đổi gần đây để duy trì nhịp đối thoại tự nhiên, đồng thời thay thế các khối nội dung cũ bằng các bản tóm tắt tinh gọn nhưng đặc tả rõ các kết luận cốt lõi, quyết định và chủ đề lặp lại. Điều này giúp giữ vững \"narrative context\" (ngữ cảnh xuyên suốt) mà không làm mất đi các insights quan trọng của nhóm.\n\nLoại trừ các phương án khác:\n\nPhương án A (Rolling window truncation): Cắt bỏ toàn bộ dữ liệu cũ ngoài 25,000 tokens gần nhất sẽ làm mất hoàn toàn lịch sử và các quyết định quan trọng từ các buổi họp trước.\n\nPhương án C (Thêm thẻ XML): Không giải quyết được bài toán quản lý kích thước ngữ cảnh khi lịch sử ngày càng phình to.\n\nPhương án D (Semantic embedding & RAG): Thay thế định dạng hội thoại tuyến tính bằng việc truy xuất các đoạn rời rạc làm đứt gãy luồng thảo luận mang tính liên tục và ngữ cảnh xuyên suốt của chuỗi các buổi họp nhóm định kỳ."},{"index":26,"text":"Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its old_string parameter cannot find unique text to match – the file has repetitive docstrings, variable names, and structural patterns.\n\nWhat's the most reliable way to complete this insertion?","choices":[{"id":"71608","label":"A","text":"A\nUse Read to load the file, add the function at the appropriate location, then Write the updated file"},{"id":"71609","label":"B","text":"B\nUse Bash to append the function definition to the end of the file using heredoc syntax"},{"id":"71610","label":"C","text":"C\nUse Edit's replace_all parameter to target a common pattern and embed the new function in the replacement text"},{"id":"71611","label":"D","text":"D\nUse Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}],"correctAnswerIds":["71608"],"explanation":"Khi công cụ Edit không thể xác định vị trí chính xác do nội dung file quá lặp lại (repetitive), việc cố gắng ép buộc bằng cách tăng độ dài old_string (phương án D) thường không hiệu quả và dễ gây ra lỗi sai lệch ngữ cảnh. Các lý do tại sao A là phương pháp đáng tin cậy nhất:\n\nĐộ chính xác tuyệt đối: Khi bạn sử dụng Read để tải toàn bộ nội dung file, bạn có cái nhìn đầy đủ về cấu trúc file đó. Sau đó, việc sử dụng Write (ghi đè toàn bộ file với nội dung đã được chỉnh sửa) giúp bạn kiểm soát chính xác vị trí chèn hàm mới mà không cần dựa vào khả năng khớp mẫu (pattern matching) bị hạn chế của công cụ Edit.\n\nTránh rủi ro:\n\nB (Bash/heredoc): Chỉ cho phép chèn vào cuối file (append), điều này có thể làm hỏng cấu trúc module nếu hàm mới cần nằm ở một vị trí cụ thể giữa các hàm khác.\n\nC (Replace all): Rất nguy hiểm trong một file có nội dung lặp lại, vì nó có thể vô tình thay thế nhầm nhiều vị trí khác không mong muốn.\n\nD (Long old_string): Tăng độ dài old_string lên 30+ dòng không đảm bảo tính duy nhất và làm tăng xác suất sai sót do các thay đổi nhỏ về định dạng hoặc khoảng trắng trong file gốc.\n\nVì vậy, trong các hệ thống AI agent, khi công cụ chỉnh sửa theo mẫu (Edit) gặp lỗi, \"Read toàn bộ - Chỉnh sửa - Write lại toàn bộ\" là quy trình tiêu chuẩn để đảm bảo tính toàn vẹn của mã nguồn."},{"index":27,"text":"Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts\n\nFor which failure pattern would additional retries be LEAST effective?","choices":[{"id":"71696","label":"A","text":"A\nThe model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the input"},{"id":"71697","label":"B","text":"B\nThe model extracts dates as ISO 8601 datetime strings (\"2023-03-15T00:00:00Z\") when the schema requires only the date portion (YYYY-MM-DD)"},{"id":"71698","label":"C","text":"C\nThe model extracts citation counts as locale-formatted strings (\"1,234\") when the schema requires integers"},{"id":"71699","label":"D","text":"D\nThe model extracts keywords as a nested object organized by category when the schema requires a flat array of strings"}],"correctAnswerIds":["71696"],"explanation":"Cơ chế \"retry-with-error-feedback\" (thử lại kèm phản hồi lỗi) dựa trên giả định rằng mô hình đã có đủ thông tin trong ngữ cảnh (context window) nhưng chỉ đơn giản là đang hiểu sai yêu cầu hoặc định dạng.\n\nTại sao chọn A: Đây là lỗi thuộc về thiếu dữ liệu (missing information). Nếu toàn bộ danh sách tác giả không tồn tại trong tài liệu đầu vào (input context), thì dù bạn có bắt mô hình thử lại bao nhiêu lần đi chăng nữa, nó cũng không thể \"phát minh\" ra thông tin không tồn tại đó. Việc phản hồi lỗi chỉ giúp mô hình biết là nó đang làm sai, nhưng nó không có nguồn dữ liệu để lấy thông tin đúng. Đây là giới hạn về dữ liệu nguồn, không phải lỗi kỹ năng trích xuất của AI.\n\nTại sao các phương án khác kém hiệu quả hơn (tức là retries sẽ HIỆU QUẢ với chúng):\n\nB, C, D: Đây là các lỗi về định dạng (formatting/schema mismatches). Mô hình đã có thông tin cần thiết trong văn bản, nó chỉ đang bị nhầm lẫn giữa định dạng yêu cầu (ISO 8601 vs Date, Integer vs Formatted String, Flat array vs Nested object). Trong các trường hợp này, việc phản hồi lỗi (\"Error: Output must be a flat array, not a nested object\") sẽ giúp mô hình điều chỉnh lại cách trình bày dữ liệu trong lần thử tiếp theo, vì vậy retries sẽ rất hiệu quả."},{"index":28,"text":"After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like \"30 minutes\" incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions.\n\nWhich approach most effectively allocates reviewer attention?","choices":[{"id":"71668","label":"A","text":"A\nPrioritize review of all extractions where required fields are empty or explicitly marked as not found."},{"id":"71669","label":"B","text":"B\nHave the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set."},{"id":"71670","label":"C","text":"C\nReview all extractions from documents with formatting anomalies such as unusual layouts or mixed content types."},{"id":"71671","label":"D","text":"D\nRandomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns."}],"correctAnswerIds":["71669"],"explanation":"Trong các hệ thống trích xuất dữ liệu (data extraction) bằng AI, vấn đề lớn nhất là các lỗi ngữ nghĩa (semantic errors) không vi phạm cấu trúc JSON (schema validation). Để tận dụng tối đa nguồn lực người kiểm duyệt (chỉ 20% công suất), bạn cần một phương pháp lọc thông minh thay vì chọn ngẫu nhiên.\n\nTại sao chọn B: Đây là phương pháp tối ưu nhất về mặt kỹ thuật:\n\nPhát hiện rủi ro chủ động: Bằng cách yêu cầu model xuất ra \"điểm tự tin\" (confidence score) cho từng trường dữ liệu, bạn có một thước đo định lượng cho độ tin cậy của mỗi output.\n\nHiệu quả cao: Khi kết hợp với tập dữ liệu kiểm chứng (labeled validation set), bạn có thể tìm ra \"ngưỡng\" (threshold) – ví dụ, tất cả các trường có điểm tự tin dưới 0.85 sẽ được tự động gửi cho người kiểm duyệt. Điều này giúp tập trung 20% công sức của con người vào đúng những trường dữ liệu có xác suất lỗi cao nhất, thay vì lãng phí thời gian xem lại những dữ liệu mà AI đã làm chính xác.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc ưu tiên các trường \"trống\" hoặc \"không tìm thấy\" không giải quyết được vấn đề lỗi ngữ nghĩa (như ví dụ \"30 minutes\" bị đặt nhầm chỗ), vì những lỗi này thường xảy ra ở các trường có chứa dữ liệu nhưng sai nội dung.\n\nC: Mặc dù định dạng bất thường có thể gây lỗi, nhưng đây không phải là nguyên nhân duy nhất. Rất nhiều lỗi ngữ nghĩa xảy ra trên các tài liệu chuẩn (standard layouts), nên việc chỉ tập trung vào tài liệu dị dạng sẽ bỏ sót phần lớn lỗi thực tế.\n\nD: Việc lấy mẫu ngẫu nhiên (random sampling) là chiến lược thụ động và kém hiệu quả. Nó chỉ cung cấp dữ liệu thống kê về độ chính xác chung chứ không giúp ngăn chặn hoặc sửa chữa lỗi một cách có hệ thống như phương pháp lọc theo ngưỡng tin cậy (B)."},{"index":29,"text":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you notice the agent continues to use Grep to inspect dependencies even when users explicitly ask about \"code dependencies\". Tool definitions reveal: analyze_dependencies returns a dependency graph by analyzing imports.\n\nWhat's the most effective approach to improve the agent's selection of MCP tools?","choices":[{"id":"71660","label":"A","text":"A\nExpand MCP tool descriptions and outputs–e.g., \"Builds dependency graph with list_imports, direct_circular_deps\"–to clearly distinguish dependencies and cycle analysis from Grep."},{"id":"71661","label":"B","text":"B\nSplit analyze_dependencies into granular tools: list_imports, detect_transitive_deps, identify_circular_deps to avoid overlap with Grep."},{"id":"71662","label":"C","text":"C\nAdd routing questions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."},{"id":"71663","label":"D","text":"D\nRemove Grep from the available tools to eliminate functional overlap."}],"correctAnswerIds":["71660"],"explanation":"Để cải thiện khả năng lựa chọn công cụ của AI trong hệ thống MCP, bạn cần tập trung vào việc làm cho \"danh tính\" và \"chức năng\" của công cụ trở nên rõ ràng và vượt trội hơn so với các phương pháp cũ (như Grep).\n\nTại sao chọn A: LLM lựa chọn công cụ dựa trên mô tả (meta-data). Hiện tại, AI chọn Grep vì nó \"biết\" Grep là gì và làm gì. Khi bạn cập nhật mô tả của analyze_dependencies để giải thích cụ thể rằng nó không chỉ liệt kê mà còn tạo ra dependency graph (đồ thị phụ thuộc) và phân tích sâu hơn (như cycle detection), bạn đang cung cấp cho AI một lý do logic mạnh mẽ hơn để ưu tiên sử dụng công cụ này thay vì Grep—vốn chỉ là tìm kiếm văn bản đơn thuần.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Việc chia nhỏ quá mức các công cụ có thể làm hệ thống trở nên cồng kềnh, khó quản lý và khiến AI khó khăn hơn trong việc quyết định nên dùng công
