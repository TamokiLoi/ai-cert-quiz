 cụ nào cho các yêu cầu rộng như \"code dependencies\".\n\nC: Việc dùng system prompt để hướng dẫn (hard-coding) là giải pháp tạm thời, không bền vững. Nếu bạn bổ sung thêm công cụ mới trong tương lai, bạn sẽ phải liên tục cập nhật prompt, điều này tạo ra gánh nặng bảo trì lớn.\n\nD: Việc xóa Grep là quá cực đoan. Grep vẫn có giá trị trong việc tìm kiếm nhanh các chuỗi văn bản không liên quan đến cấu trúc code, và việc ép buộc AI không có quyền truy cập vào các công cụ cơ bản có thể làm giảm hiệu suất của nó trong những tác vụ đơn giản."},{"index":30,"text":"A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains context: lookup_status_result messages containing \"Status: Pending Refund\" and significant tokens from prior lookup results. The agent needs to be prepared to answer the customer fully.\n\nWhat approach most reliably handles returning customers?","choices":[{"id":"71840","label":"A","text":"A\nResume with the full conversation and add a system prompt instruction that instructs the agent to prioritize resolving the pending refund."},{"id":"71841","label":"B","text":"B\nResume with state and configure the agent to automatically re-call all previous tool_results messages to ensure data freshness."},{"id":"71842","label":"C","text":"C\nStart a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."},{"id":"71843","label":"D","text":"D\nCreate a new session with a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed."}],"correctAnswerIds":["71842"],"explanation":"Đáp án đúng: [C] (hoặc [D], vì C và D giống hệt nhau về nội dung chữ: \"Start/Create a new session, inject a structured summary of the previous interaction (issue type, resolution steps, current status), then make fresh tool calls as needed.\")\n\nGiải thích chi tiết:\n\nTại sao nên bắt đầu phiên mới với bản tóm tắt có cấu trúc (Structured Summary)?\n\nSau 4 giờ gián đoạn, phiên chat cũ đã trở nên quá dài (32 lượt tương tác) kèm theo lượng lớn token từ các kết quả gọi công cụ cũ (tool_results). Tiếp tục giữ nguyên toàn bộ lịch sử trò chuyện cũ sẽ làm lãng phí context window, tăng chi phí và có nguy cơ khiến mô hình bị \"nhiễu\" bởi dữ liệu cũ không còn đảm bảo độ tươi mới (data freshness).\n\nViệc tạo một phiên làm việc mới (new session) kết hợp tiêm bản tóm tắt cấu trúc (bao gồm loại sự cố, các bước đã xử lý và trạng thái hiện tại) giúp agent nắm bắt toàn bộ ngữ cảnh quan trọng mà không bị quá tải bộ nhớ.\n\nSau đó, agent có thể thực hiện các lệnh gọi công cụ mới (fresh tool calls) khi cần thiết để lấy dữ liệu cập nhật mới nhất từ hệ thống (ví dụ: kiểm tra xem trạng thái \"Pending Refund\" đã được xử lý xong chưa).\n\nTại sao các đáp án khác không chính xác:\n\n[A] Giữ lại toàn bộ cuộc hội thoại dài và chỉ thêm system prompt sẽ vẫn gặp vấn đề quá tải token, rườm rà và dữ liệu cũ từ các tool calls trước đó có thể không còn chính xác sau 4 tiếng.\n\n[B] Tự động gọi lại tất cả các tool_results cũ vừa không cần thiết vừa tốn kém tài nguyên, lại không giải quyết được việc cô đọng ngữ cảnh hội thoại."},{"index":31,"text":"Your extraction pipeline processes invoices and extracts line items, tax amounts, and grand totals. You discover that 8% of documents have extracted line item amounts that don't sum to the extracted grand total—the downstream accounting system has been detecting mismatches.\n\nWhat's the most effective improvement?","choices":[{"id":"71672","label":"A","text":"A\nAdd a calculated_total field where the model extracts line items independently, then validate totals alongside a is_total_consistent boolean flag for human review when values differ."},{"id":"71673","label":"B","text":"B\nExtract line items and totals independently, then use a separate validation model to reconcile discrepancies."},{"id":"71674","label":"C","text":"C\nImplement post-processing that automatically adjusts line item amounts when the extracted total doesn't match the sum."},{"id":"71675","label":"D","text":"D\nAdd few-shot examples to the system prompt where extracted line items correctly sum to demonstrate the desired extraction behavior."}],"correctAnswerIds":["71672"],"explanation":"Đây là bài toán về kiểm soát chất lượng dữ liệu (Data Quality Control) trong quy trình trích xuất tự động.\n\nTại sao chọn A: Đây là phương pháp chủ động (proactive) và minh bạch nhất:\n\nTính toàn vẹn: Thay vì bắt AI cố gắng \"tự sửa\" (dễ dẫn đến ảo giác), bạn yêu cầu AI trích xuất thực tế những gì nó thấy. Sau đó, hệ thống sẽ thực hiện phép tính tổng (calculated_total) để đối chiếu với tổng cuối (grand total) đã được trích xuất.\n\nLuồng xử lý thông minh: Cờ is_total_consistent giúp lọc tự động. Nếu false, hệ thống ngay lập tức chuyển tài liệu đó vào hàng đợi cho con người kiểm duyệt (human-in-the-loop). Điều này đảm bảo dữ liệu đi vào hệ thống kế toán luôn chính xác, đồng thời tiết kiệm thời gian vì con người chỉ cần xem xét các trường hợp có sự sai lệch.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Việc dùng một \"validation model\" riêng biệt chỉ làm tăng chi phí vận hành (inference cost) và độ phức tạp cho hệ thống mà không chắc chắn giải quyết được tận gốc vấn đề (nếu model đầu tiên đã đọc sai dữ liệu từ hóa đơn, model thứ hai cũng sẽ gặp khó khăn tương tự).\n\nC: Đây là cách làm rất nguy hiểm. Việc tự động điều chỉnh số liệu (post-processing) mà không có sự kiểm chứng có thể làm sai lệch dữ liệu tài chính nghiêm trọng, dẫn đến việc hạch toán sai mà không ai hay biết.\n\nD: Few-shot prompting giúp cải thiện kết quả nhưng không thể đảm bảo độ chính xác tuyệt đối. Đối với các nghiệp vụ tài chính, bạn luôn cần một lớp kiểm tra logic (logic validation layer) như ở phương án A để bảo đảm tính đúng đắn trước khi dữ liệu được ghi nhận."},{"index":32,"text":"An engineer used Claude Code yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She's worked on three other codebases since then and knows the session was named \"auth-deep-dive\".\n\nHow should she resume?","choices":[{"id":"71612","label":"A","text":"A\nUse --continue to pick up where the most recent conversation left off"},{"id":"71613","label":"B","text":"B\nUse --resume auth-deep-dive to load that specific session by name"},{"id":"71614","label":"C","text":"C\nUse --session-id with the UUID from yesterday's session transcript file"},{"id":"71615","label":"D","text":"D\nStart fresh and re-read the same files"}],"correctAnswerIds":["71613"],"explanation":"Trong Claude Code, việc quản lý và tiếp tục các phiên làm việc (sessions) được thiết kế để hỗ trợ hiệu quả cho các luồng công việc dài hơi:\n\nTại sao chọn B: Claude Code cho phép người dùng đặt tên cho các phiên làm việc hoặc tự động lưu trữ chúng. Lệnh --resume đi kèm với tên phiên (session name) là cách trực tiếp và chuẩn xác nhất để khôi phục đúng ngữ cảnh, lịch sử trò chuyện và trạng thái mà kỹ sư đã xây dựng trước đó, ngay cả khi họ đã làm việc trên các codebase khác.\n\nTại sao các phương án khác không phù hợp:\n\nA (--continue): Lệnh này thường chỉ dùng để tiếp tục phiên làm việc gần nhất (most recent). Vì kỹ sư đã làm việc trên 3 codebase khác kể từ hôm qua, lệnh này có khả năng cao sẽ tải nhầm phiên làm việc cuối cùng thay vì phiên \"auth-deep-dive\" mong muốn.\n\nC (--session-id): Mặc dù về mặt kỹ thuật có thể truy xuất qua ID, nhưng cách dùng tên (name) thân thiện và dễ nhớ hơn nhiều so với việc phải lục tìm UUID từ file transcript.\n\nD (Start fresh): Đây là cách làm thiếu hiệu quả vì nó làm mất đi toàn bộ ngữ cảnh (context) đã dày công xây dựng trong 2 giờ làm việc trước đó."},{"index":33,"text":"Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of extractions fail semantic validation--for example, line Item amounts don't extracted total, or vendor IDs don't match valid formats. These failures currently route to manual review.\n\nWhat's the most effective approach to reduce manual review volume while maintaining accuracy?","choices":[{"id":"71884","label":"A","text":"A\nRetry the extraction up to 3 times when validation fallis, accepting the first result that passes validation."},{"id":"71885","label":"B","text":"B\nAdd stricter schema constraints with detailed field descriptions to prevent the model from generating invalid values initially."},{"id":"71886","label":"C","text":"C\nImplement post-processing logic that automatically corrects common amors, such as recalculating totais from line items when sums don't match."},{"id":"71887","label":"D","text":"D\nWhen validation falls, make a follow-up request with the document, extraction, and validation errors for model correction."}],"correctAnswerIds":["71887"],"explanation":"Bối cảnh bài toán:\n\nHệ thống trích xuất hóa đơn sử dụng JSON schema nghiêm ngặt nên không có lỗi cú pháp JSON. Tuy nhiên, có 12% lỗi validation ngữ nghĩa (ví dụ: tổng tiền line item không khớp với tổng hóa đơn, hoặc định dạng ID nhà cung cấp không hợp lệ).\n\nMục tiêu là giảm tỷ lệ phải review thủ công mà vẫn đảm bảo độ chính xác.\n\nLý do lựa chọn phương án D:\n\nTận dụng khả năng self-correction (tự sửa lỗi) của LLM: Khi trích xuất lần đầu gặp lỗi ngữ nghĩa, việc gửi lại chính tài liệu gốc kèm theo kết quả trích xuất bị lỗi và thông báo lỗi cụ thể (validation errors) vào một lượt request (turn) tiếp theo cho phép mô hình nhìn nhận rõ lỗi sai và tự điều chỉnh giá trị cho chính xác.\n\nĐây là một pattern thiết kế cực kỳ hiệu quả trong các ứng dụng AI production để xử lý các lỗi ngữ nghĩa phức tạp (như tính toán sai lệch hoặc định dạng sai) mà không cần ép mô hình phải hoàn hảo ngay ở lượt gọi đầu tiên.\n\nCác phương án khác (như A chỉ đơn thuần retry mù quáng mà không cung cấp thông tin lỗi; B dựa hoàn toàn vào schema trong khi lỗi ngữ nghĩa thường do độ phức tạp ngữ cảnh của văn bản; C tự động sửa logic post-processing có thể làm mất đi dữ liệu thực tế và tiềm ẩn rủi ro sai sót nghiệp vụ nghiêm trọng)."},{"index":34,"text":"After your daily batch of 10,000 documents completes, 300 documents (3%) failed with \"context_length_exceeded\" errors. The results file identifies each failure by custom_id.\n\nWhat's the most cost-effective approach to process these failures?","choices":[{"id":"71680","label":"A","text":"A\nResubmit the entire 10,000 document batch using a model tier with a larger context window"},{"id":"71681","label":"B","text":"B\nReprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with identical system prompts"},{"id":"71682","label":"C","text":"C\nIncrease the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"},{"id":"71683","label":"D","text":"D\nResubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial extractions"}],"correctAnswerIds":["71683"],"explanation":"Trong các bài toán xử lý hàng loạt (batch processing), lỗi context_length_exceeded có nghĩa là tài liệu đầu vào vượt quá giới hạn ngữ cảnh cho phép của model tại thời điểm đó.\n\nTại sao chọn D: Đây là giải pháp hiệu quả và tiết kiệm chi phí nhất:\n\nTối ưu hóa tài nguyên: Bạn chỉ cần xử lý lại đúng 300 tài liệu bị lỗi thay vì phải chạy lại toàn bộ 10.000 tài liệu (phương án A và B) – điều này giúp tiết kiệm đáng kể chi phí API.\n\nGiải quyết triệt để lỗi: Bằng cách chia nhỏ (chunking) tài liệu, bạn đưa nội dung về trong phạm vi giới hạn của ngữ cảnh (context window), sau đó kết hợp các phần trích xuất (combine extractions) để có được kết quả hoàn chỉnh. Điều này trực tiếp giải quyết nguyên nhân gốc rễ của lỗi context_length_exceeded.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc chạy lại cả 10.000 tài liệu là lãng phí tài nguyên và tiền bạc cực lớn chỉ để sửa 300 lỗi.\n\nB: Prompt caching giúp giảm chi phí cho phần prompt chung, nhưng việc xử lý lại 9.700 tài liệu đã thành công là không cần thiết.\n\nC: Việc tăng max_tokens (đầu ra) không giúp giải quyết lỗi context_length_exceeded (lỗi này liên quan đến kích thước đầu vào – input tokens), do đó phương án này hoàn toàn không khắc phục được vấn đề."},{"index":35,"text":"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes confidence calibrations are synthesized into standardized uncertainty expressions, while other times results produce vague estimates without clear methodology.\n\nWhich system-level improvement best addresses this inconsistency?","choices":[{"id":"71740","label":"A","text":"A\nAdd a verification subagent that cross-references findings across sources, only accepting synthesis corroborated by at least two independent sources."},{"id":"71741","label":"B","text":"B\nConfigure subagents to only report findings with sufficient coverage breadth, source diversity, and quality criteria before passing results to the synthesis agent."},{"id":"71742","label":"C","text":"C\n\nImplement a confidence calibration layer where synthesis agent normalizes uncertainty expressions into standardized probability representations (0.0-1.0), then weights their calibrated confidence."},{"id":"71743","label":"D","text":"D\n\nInstruct the synthesis agent to use explicit sections separating confirmed findings from contested analysis, preserving original source characterizations."}],"correctAnswerIds":["71742"],"explanation":"Đáp án C là cải tiến cấp hệ thống phù hợp nhất để giải quyết triệt để vấn đề này.\n\nGiải thích chi tiết:\n\nĐáp án C giải quyết trực tiếp nguyên nhân cốt lõi:\n\nVấn đề chính được nêu trong bài là sự thiếu nhất quán trong cách thể hiện độ không chắc chắn (uncertainty) — lúc thì có chuẩn hóa, lúc lại đưa ra ước tính mơ hồ. Bằng cách triển khai một lớp hiệu chỉnh độ tin cậy (confidence calibration layer) để quy đổi mọi biểu thức về dạng xác suất chuẩn (từ $0.0$ đến $1.0$), tác vụ tổng hợp (synthesis agent) sẽ bắt buộc mọi báo cáo đầu ra phải tuân theo một khuôn mẫu định lượng đồng nhất.\n\nTại sao các đáp án còn lại chưa tối ưu:\n\nA & B (Tập trung vào khâu lọc nguồn dữ liệu): Hai phương án này giúp cải thiện chất lượng dữ liệu đầu vào và độ tin cậy của nguồn tin (xác minh chéo, độ phủ thông tin). Tuy nhiên, chúng không giải quyết được việc chuẩn hóa cách trình bày độ không chắc chắn ở đầu ra.\n\nD (Phân chia cấu trúc bài viết): Phương án này chỉ giúp tách biệt thông tin đã xác thực và thông tin còn tranh cãi thành các mục riêng, nhưng vẫn để nguyên bản các mô tả mơ hồ ban đầu mà không qua xử lý hay chuẩn hóa dữ liệu."},{"index":36,"text":"Monitoring shows 12% of extractions fall Pydantic validation with specific errors like \"expected float for quantity, got '2 to 3\". Retrying these requests without modification produces failures.\n\nWhat's the most effective approach to recover from these validation failures?","choices":[{"id":"71900","label":"A","text":"A\nPre-process source documents to standardize problematic formats before sending them for extraction"},{"id":"71901","label":"B","text":"B\nSend a follow-up request including the validation error, asking the model to correct its output"},{"id":"71902","label":"C","text":"C\nImplement a secondary pipeline using a larger model tier to reprocess documents that fail validation"},{"id":"71903","label":"D","text":"D\nSet temperature to 0 to eliminate output variability and ensure consistent formatting"}],"correctAnswerIds":["71901"],"explanation":"Bối cảnh bài toán:\n\nHệ thống ghi nhận 12% trường hợp trích xuất dữ liệu thất bại do lỗi kiểm tra từ Pydantic (ví dụ: expected float for quantity, got '2 to 3').\n\nViệc thử lại yêu cầu mà không có sự thay đổi (retrying without modification) vẫn sẽ tiếp tục thất bại do mô hình lặp lại lỗi cũ.\n\nLý do lựa chọn phương án B:\n\nTận dụng thông tin phản hồi lỗi (Error Feedback Loop): Khi Pydantic báo lỗi cụ thể, việc gửi thông báo lỗi đó kèm theo yêu cầu chỉnh sửa trực tiếp lại cho mô hình (cho phép mô hình thấy được output trước đó sai ở đâu và cần sửa trường nào) là phương pháp trực tiếp, hiệu quả và tốn ít chi phí nhất để khắc phục định dạng dữ liệu sai lệch.\n\nCác phương án khác (như tiền xử lý toàn bộ tài liệu nguồn phức tạp, dùng mô hình lớn hơn đắt đỏ hơn, hay chỉ chỉnh temperature) không giải quyết trực tiếp và chính xác được vấn đề ngữ nghĩa/định dạng mà Pydantic đang bắt lỗi dựa trên kết quả trích xuất cụ thể của mô hình."},{"index":37,"text":"Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements.\n\nHow should you architect the processing pipeline?","choices":[{"id":"71720","label":"A","text":"A\nQueue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return."},{"id":"71721","label":"B","text":"B\nRoute standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the real-time Messages API."},{"id":"71722","label":"C","text":"C\nSubmit all documents to the real-time Messages API to ensure consistent processing latency across document types."},{"id":"71723","label":"D","text":"D\nSubmit all documents to the Batch API with custom_ids for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions."}],"correctAnswerIds":["71721"],"explanation":"Đây là bài toán cân bằng giữa chi phí (cost) và thời gian phản hồi (latency/SLA) trong kiến trúc hệ thống AI:\n\nTại sao chọn B:\n\nTối ưu chi phí: Các tài liệu \"standard monthly reports\" không yêu cầu xử lý ngay lập tức. Sử dụng Batch API cho loại tài liệu này giúp bạn tận dụng mức giảm giá 50% chi phí, đây là cách hiệu quả nhất để tối ưu ngân sách.\n\nĐáp ứng SLA nghiêm ngặt: Các tài liệu \"urgent exception reports\" có yêu cầu thời gian phản hồi cực nhanh (dưới 30 phút). Batch API (với thời gian xử lý có thể lên tới 24 giờ) không thể đáp ứng được yêu cầu này. Việc định tuyến (route) các tài liệu này qua Real-time Messages API đảm bảo chúng được xử lý gần như tức thì, giúp bạn kích hoạt các cảnh báo (alerts) đúng thời hạn.\n\nĐây là mô hình kiến trúc lai (hybrid approach) chuẩn mực trong doanh nghiệp: ưu tiên hiệu năng cho các luồng nghiệp vụ quan trọng và ưu tiên chi phí cho các luồng xử lý khối lượng lớn nhưng không khẩn cấp.\n\nTại sao các phương án khác chưa tối ưu:\n\nA & D: Việc đưa các tài liệu khẩn cấp vào batch queue sẽ khiến chúng phải chờ đợi quá lâu, chắc chắn vi phạm SLA 30 phút.\n\nC: Việc đưa tất cả vào Real-time Messages API sẽ gây lãng phí chi phí rất lớn, vì bạn phải trả mức giá đầy đủ cho cả những tài liệu không cần xử lý gấp."},{"index":38,"text":"Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a recurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical details from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current approach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to these precision-dependent questions are often hedged or inaccurate.\n\nWhat's the most effective architectural change?","choices":[{"id":"71944","label":"A","text":"A\nKeep source text from methodology and results sections in context permanently, while summarizing only the conversational discussion and interpretation portions."},{"id":"71945","label":"B","text":"B\nMaintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods) and retrieve relevant entries into context when precision-dependent questions are detected."},{"id":"71946","label":"C","text":"C\nImplement retrieval that re-injects relevant paper sections when the user's question suggests they need specific numerical details."},{"id":"71947","label":"D","text":"D\nUse a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all numerical details and statistical values."}],"correctAnswerIds":["71945"],"explanation":"Lý do chọn B: Trong các hệ thống RAG hoặc trợ lý nghiên cứu khoa học xử lý hội thoại dài (>60K tokens), việc tóm tắt thông tin văn bản thuần túy (như các phương án A, C, hoặc D) thường làm mất mát các chi tiết số liệu chính xác (exact numbers, p-values, sample sizes). Phương án tối ưu và chuyên nghiệp nhất là trích xuất và lưu trữ các dữ liệu định lượng cốt lõi vào một structured database (structured fact extraction), sau đó tra cứu và đưa chính xác các entry đó vào ngữ cảnh khi người dùng hỏi các câu hỏi đòi hỏi độ chính xác cao.\n\nCác phương án khác chưa tối ưu:\n\nA: Giữ nguyên văn phần methodology và results sẽ làm cạn kiệt nhanh chóng giới hạn context window khi số lượng bài báo tăng lên.\n\nC: Việc re-inject lại toàn bộ các phần paper section vẫn gặp hạn chế về việc LLM phải quét lại lượng text dài thườn thượt thay vì dùng cấu trúc dữ liệu tường minh.\n\nD: Tóm tắt độ trung thực cao hơn thông qua lệnh gọi riêng vẫn là tóm tắt dạng text, không giải quyết triệt để vấn đề mất mát thông tin số liệu chính xác qua nhiều vòng hội thoại."},{"index":39,"text":"Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling approximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98% accuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third consistently missed. The model's context window is 200K tokens.\n\nWhat is the most likely cause?","choices":[{"id":"71892","label":"A","text":"A\nThe model distributes attention proportionally across input length, causing fields mentioned only once near the document's end to receive insufficient processing focus."},{"id":"71893","label":"B","text":"B\nSchemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing extraction accuracy independent of document length."},{"id":"71894","label":"C","text":"C\nTool definitions consume input context tokens. Combined with system prompts and document content, the total approaches the context limit, degrading end-of-document processing."},{"id":"71895","label":"D","text":"D\nVery long documents exceed the model's effective attention span regardless of context limits, causing accuracy degradation for content farther from the prompt instructions."}],"correctAnswerIds":["71894"],"explanation":"Bối cảnh bài toán:\n\nHệ thống xử lý các tài liệu dài bằng cách sử dụng tool_use.\n\nKhi tài liệu đạt độ dài từ 175K - 190K tokens, hiệu suất giảm mạnh và thông tin ở phần 1/3 cuối tài liệu liên tục bị bỏ sót mặc dù giới hạn tối đa của mô hình là 200K tokens.\n\nLý do lựa chọn phương án C:\n\nTải trọng context thực tế (Effective Context Consumption): Mặc dù giới hạn danh nghĩa là 200K tokens, nhưng khi cộng dồn tài liệu (190K), các định nghĩa công cụ chi tiết (khoảng 2.5K tokens cho 12 fields cùng mô tả), và system prompts, tổng số lượng tokens thực tế tiêu thụ đã tiệm cận cực kỳ sát giới hạn 200K.\n\nKhi hệ thống chạm gần ngưỡng giới hạn của cửa sổ ngữ cảnh, khả năng xử lý, chú ý và duy trì độ chính xác của mô hình ở phần cuối văn bản (end-of-document processing) bị suy giảm đáng kể.\n\nLoại trừ các phương án khác:\n\nPhương án D (chọn nhầm trước đó): Dù hiện tượng \"Lost in the Middle\" có tồn tại ở văn bản dài, nhưng trong trường hợp cụ thể này, nguyên nhân cốt lõi dẫn đến sự suy giảm đột ngột nằm ở việc tổng lượng tokens tiêu thụ (tài liệu lớn + công cụ phức tạp) đã đẩy toàn bộ ngữ cảnh chạm sát giới hạn 200K tokens của mô hình."},{"index":40,"text":"An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module).\n\nWhat exploration strategy will most reliably identify all callers?","choices":[{"id":"71624","label":"A","text":"A\nSearch for the function name in project documentation to understand intended usage patterns and navigate to documented integration points."},{"id":"71625","label":"B","text":"B\nUse Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function."},{"id":"71626","label":"C","text":"C\nRead the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase."},{"id":"71627","label":"D","text":"D\nUse Grep to search for the function's original name across the codebase."}],"correctAnswerIds":["71626"],"explanation":"Trong các hệ thống phần mềm lớn, một hàm thường được bao bọc (wrap) hoặc đổi tên để phù hợp với ngữ cảnh của các module khác nhau (như ví dụ calculateTax thành computeOrderTax).\n\nTại sao chọn C: Đây là cách tiếp cận có hệ thống và toàn diện nhất. Việc đầu tiên cần làm là đọc code (Read) để nắm bắt được toàn bộ các \"bí danh\" (aliases) hoặc tên gọi khác nhau của hàm đó thông qua các wrapper. Sau khi đã có danh sách tất cả các tên gọi (từ core library và các wrapper), việc sử dụng Grep (hoặc các công cụ tìm kiếm mã nguồn tương tự) để quét toàn bộ codebase cho từng cái tên đó sẽ đảm bảo bạn không bỏ sót bất kỳ điểm gọi hàm (caller) nào, bất kể nó được gọi thông qua module gốc hay thông qua wrapper.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Tài liệu (documentation) thường lạc hậu hoặc không bao giờ liệt kê hết mọi trường hợp sử dụng trong code thực tế. Chỉ dựa vào tài liệu sẽ khiến bạn bỏ sót rất nhiều caller.\n\nB: Phương pháp này chỉ tìm theo tên module (file import), không tìm trực tiếp tên hàm. Điều này rất dễ bỏ sót các trường hợp hàm được gọi từ các module nội bộ hoặc khi tên hàm bị ẩn đi trong quá trình wrap.\n\nD: Chỉ tìm \"tên gốc\" sẽ hoàn toàn bỏ lỡ tất cả các caller đang gọi hàm thông qua các tên mới (đã được rename) trong các wrapper modules. Bạn sẽ gần như chắc chắn gây ra lỗi (break code) khi xóa hàm này."},{"index":41,"text":"An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth–having the agent propose specific code changes for each–before deciding which to implement.\n\nWhat's the most effective way to structure this exploration?","choices":[{"id":"71640","label":"A","text":"A\nStart two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context."},{"id":"71641","label":"B","text":"B\nResume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context."},{"id":"71642","label":"C","text":"C\nResume yesterday's session and explore both approaches sequentially within the same conversation thread."},{"id":"71643","label":"D","text":"D\nUse fork_session to create two branches from yesterday's analysis, exploring one approach in each fork."}],"correctAnswerIds":["71643"],"explanation":"Khi làm việc với các hệ thống AI hỗ trợ lập trình (như Claude hoặc các công cụ tương tự có tính năng quản lý phiên làm việc), việc duy trì ngữ cảnh là tối quan trọng, đặc biệt khi bạn cần thử nghiệm nhiều phương án khác nhau mà không muốn chúng làm \"nhiễu\" lẫn nhau.\n\nTại sao chọn D: Tính năng fork_session (tạo nhánh từ phiên làm việc) là công cụ mạnh mẽ nhất cho trường hợp này. Nó cho phép bạn:\n\nBảo toàn ngữ cảnh: Cả hai nhánh đều thừa hưởng toàn bộ lịch sử phân tích từ ngày hôm qua (các findings về module xác thực).\n\nTách biệt logic (Isolation): Bạn có thể phát triển phương án \"tách microservice\" ở nhánh này và \"refactor in-place\" ở nhánh kia mà không sợ các thay đổi code hoặc giả định của phương án này làm ảnh hưởng đến phương án kia.\n\nQuyết định dựa trên dữ liệu: Sau khi exploration kết thúc, bạn có thể so sánh kết quả cụ thể từ hai nhánh độc lập để đưa ra quyết định cuối cùng chính xác hơn.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc tạo \"fresh sessions\" (phiên làm việc mới) buộc bạn phải tốn công sức nạp lại dữ liệu (context loading), dễ dẫn đến thiếu sót thông tin và không tận dụng được trí nhớ của AI về các phân tích cũ.\n\nB: Việc tạo một phiên mới để khám phá phương án thứ hai sau khi đã xong phiên đầu tiên vừa mất thời gian, vừa dễ bị \"ô nhiễm\" ngữ cảnh nếu không cẩn thận.\n\nC: Việc exploration cả hai cách tiếp cận trong cùng một luồng (thread) là sai lầm vì các thay đổi code cho hai phương án đối nghịch nhau sẽ gây xung đột logic nghiêm trọng, làm AI bị \"loạn\" ngữ cảnh và giảm độ chính xác của các đề xuất code."},{"index":42,"text":"An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services.\n\nWhat exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?","choices":[{"id":"71656","label":"A","text":"A\nUse Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally."},{"id":"71657","label":"B","text":"B\nLaunch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview."},{"id":"71658","label":"C","text":"C\nRead any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system."},{"id":"71659","label":"D","text":"D\nRead all files containing \"auth\", \"login\", \"permission\", or \"token\" in their content or filename."}],"correctAnswerIds":["71656"],"explanation":"Đối với một codebase lớn (800+ file), việc hiểu kiến trúc đòi hỏi chiến lược \"điều hướng có mục đích\" (targeted navigation) để không làm quá tải ngữ cảnh của mô hình.\n\nTại sao chọn A: Đây là phương pháp \"Traceability\" (truy vết) hiệu quả nhất:\n\nBắt đầu từ entry points: Việc sử dụng Grep để tìm các điểm khởi đầu (như middleware xác thực, decorator, hoặc controller xử lý login) giúp bạn định vị đúng nơi logic bắt đầu.\n\nIncremental mapping: Sau đó, bằng cách đọc các file đó và lần theo imports hoặc function calls, AI sẽ xây dựng được một \"bản đồ kiến trúc\" logic từng bước một. Cách này giúp AI chỉ tập trung vào các file thực sự liên quan, tiết kiệm ngữ cảnh và tránh bị phân tán bởi hàng trăm file không cần thiết khác.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Việc dùng \"parallel subagents\" (nhiều agent song song) cho một nhiệm vụ phân tích kiến trúc ban đầu thường gây nhiễu, vì các agent này thiếu sự thống nhất trong cách hiểu luồng dữ liệu (data flow) và có thể gây xung đột trong kết luận.\n\nC: Mặc dù đọc tài liệu hướng dẫn (README, CLAUDE.md) là tốt, nhưng việc \"nhờ kỹ sư chỉ định 10-15 file\" là phụ thuộc quá mức vào con người. Vai trò của agent là tự suy luận (reasoning) và khám phá (exploration) dựa trên code. Nếu kỹ sư đã biết rõ 15 file đó thì họ đã không cần agent hỗ trợ phân tích kiến trúc từ đầu.\n\nD: Đây là chiến lược \"brute-force\" (thô bạo) nhất. Đọc tất cả các file có chứa từ khóa \"auth\" trong 800 file codebase sẽ làm đầy bộ nhớ ngữ cảnh (context window) ngay lập tức với hàng đống dữ liệu thừa, dẫn đến việc mô hình bị \"lú\" và mất đi khả năng tư duy logic sâu sắc."},{"index":43,"text":"A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear stack trace pointing to a specific area, but you haven't worked with this module before.\n\nWhat's the most effective approach?","choices":[{"id":"71872","label":"A","text":"A\nUse plan mode to analyze the error in context of the module's design, enumerate potential root causes, and prioritize fixes systematically."},{"id":"71873","label":"B","text":"B\n\nEnter plan mode to explore the module's architecture and dependencies before attempting any fix."},{"id":"71874","label":"C","text":"C\n\nUse direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause."},{"id":"71875","label":"D","text":"D\nStart with direct execution to gather initial information, then switch to plan mode to design a comprehensive solution before implementing."}],"correctAnswerIds":["71874"],"explanation":"Đáp án đúng là: C. Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you identify the root cause.\n\nGiải thích:\n\nBối cảnh tình huống: Đang xảy ra sự cố nghiêm trọng ảnh hưởng trực tiếp đến người dùng trên môi trường production (critical bug in production) và log đã ghi nhận được stack trace chỉ rõ khu vực bị lỗi.\n\nLý do chọn C:\n\nKhi có lỗi khẩn cấp xảy ra ở production và đã có stack trace cụ thể, ưu tiên hàng đầu là khắc phục nhanh chóng. Việc sử dụng Direct Execution giúp truy vết trực tiếp mã nguồn, nhanh chóng tìm ra nguyên nhân gốc rễ (root cause) và đưa ra bản sửa lỗi mà không tốn thời gian lập kế hoạch tổng thể không cần thiết.\n\nLý do loại các đáp án khác:\n\nA & B (Dùng Plan mode ngay từ đầu): Plan mode thích hợp hơn cho việc thiết kế tính năng mới, tái cấu trúc hệ thống (refactoring) hoặc phân tích kiến trúc diện rộng. Việc dùng Plan mode khi đã có vị trí lỗi cụ thể trong tình huống sản sống (production issue) sẽ gây lãng phí thời gian xử lý sự cố.\n\nD (Kết hợp cả hai): Khi vị trí lỗi đã được khuynh vùng rõ qua stack trace, việc chuyển đổi qua lại giữa direct execution và plan mode làm kéo dài thời gian khôi phục dịch vụ."},{"index":44,"text":"An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate — it's forgetting previously discussed code patterns and hasn't yet located all test files or traced critical payment flows.\n\nWhat's the most effective approach to complete this investigation?","choices":[{"id":"71848","label":"A","text":"A\nSpawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding."},{"id":"71849","label":"B","text":"B\nClear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets."},{"id":"71850","label":"C","text":"C\nDocument all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation."},{"id":"71851","label":"D","text":"D\nSwitch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration."}],"correctAnswerIds":["71848"],"explanation":"Đáp án đúng: [A] (Spawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding.)\n\nGiải thích chi tiết:\n\nTại sao phương án [A] là tối ưu nhất?\n\nTrong các tác vụ phân tích mã nguồn lớn (codebase exploration) phức tạp, việc phân chia nhiệm vụ cho các subagents (đại lý con) giúp phân tán tải trọng ngữ cảnh (context load). Main agent sẽ đóng vai trò điều phối, tổng hợp kết quả từ các subagent mà không bị quá tải bộ nhớ hay bị trôi mất các mẫu mã nguồn quan trọng đã thảo luận trước đó.\n\nPhương án này tận dụng tối đa kiến trúc đa tác nhân (multi-agent architecture) để xử lý song song các câu hỏi cụ thể (như tìm kiếm file test hoặc trace luồng thanh toán) thay vì bắt một agent đơn lẻ phải đọc và ghi nhớ tuần tự toàn bộ thư viện mã nguồn lớn.\n\nTại sao các phương án khác chưa tối ưu:\n\n[B] và [C] Đòi hỏi việc xóa hoàn toàn context (/clear) và ghi vào scratchpad thủ công, làm gián đoạn dòng suy luận (reasoning flow) và dễ bỏ sót ngữ cảnh tổng quan ban đầu.\n\n[D] Sử dụng thuần túy Grep chỉ tìm được từ khóa tĩnh mà không thể phân tích sâu được logic dòng điều khiển (control flow) hay các code path chưa được kiểm thử trong các luồng thanh toán phức tạp."},{"index":45,"text":"During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10- 15 turns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified, occasionally skipping required formatting, or providing information types the guidelines restrict. Conversation length is well within context limits (typically 30,000 tokens out of 200,000 available).\n\nWhat's the most effective approach to maintain consistent behavior throughout extended conversations?","choices":[{"id":"71920","label":"A","text":"A\nMove behavioral guidelines from the system prompt into the first user message."},{"id":"71921","label":"B","text":"B\nAutomatically start a new conversation after 20 turns, passing a summary of the prior context to maintain continuity."},{"id":"71922","label":"C","text":"C\nImplement post-response validation that regenerates each response until it conforms to the specified guidelines."},{"id":"71923","label":"D","text":"D\nInsert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially before complex requests."}],"correctAnswerIds":["71923"],"explanation":"Tại sao chọn D: Trong các cuộc trò chuyện dài với LLM, khi số lượng lượt trao đổi tăng lên, các phản hồi trước đó sẽ làm \"loãng\" sự chú ý của mô hình đối với system prompt ban đầu (như đã phân tích ở các câu trước). Việc chèn các tin nhắn nhắc nhở (reminders/re-prompts) dưới vai trò người dùng (user-role) tại các điểm ngắt tự nhiên hoặc trước các yêu cầu phức tạp là phương pháp thực tế và hiệu quả nhất để kéo sự chú ý của mô hình quay lại với các quy tắc cốt lõi mà không cần phải thiết lập lại toàn bộ phiên chat.\n\nTại sao loại các đáp án khác:\n\nA (Sai): System prompt là vị trí chuẩn và hiệu quả nhất để thiết lập hành vi toàn cục; chuyển hướng dẫn sang tin nhắn đầu tiên của người dùng không giải quyết được vấn đề trôi dạt ngữ cảnh (attention drift) ở các turn sau.\n\nB (Sai): Việc cắt ngang và bắt buộc khởi động lại hội thoại sau 20 turns làm gián đoạn trải nghiệm người dùng một cách không cần thiết, trong khi ngữ cảnh vẫn còn rất rộng (chỉ mới dùng 30,000 / 200,000 tokens).\n\nC (Sai): Việc kiểm tra và liên tục bắt mô hình tự sinh lại (regenerate) phản hồi cho đến khi đạt yêu cầu sẽ làm tăng độ trễ (latency) cực kỳ lớn, tốn kém chi phí token và không giải quyết được gốc rễ vấn đề suy giảm chú ý của prompt."},{"index":46,"text":"Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types –\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"–and new types continue appearing regularly.\n\nWhat's the most effective long-term solution?","choices":[{"id":"71704","label":"A","text":"A\nContinuously expand the enum to include newly observed property types and add monitoring for additional edge cases."},{"id":"71705","label":"B","text":"B\nChange property_type from an enum to a free-form string and implement a normalization step in post-processing."},{"id":"71706","label":"C","text":"C\nAdd an \"other\" value to your enum with a separate property_type_detail string field for specifics when \"other\" is selected."},{"id":"71707","label":"D","text":"D\nAdd few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value."}],"correctAnswerIds":["71706"],"explanation":"Đây là bài toán quản lý dữ liệu linh hoạt (flexible data modeling) khi đối mặt với một tập hợp giá trị không cố định và liên tục thay đổi (open-ended classification).\n\nTại sao chọn C: Đây là giải pháp bền vững và sạch sẽ nhất (best practice):\n\nBảo toàn cấu trúc (Schema Integrity): Bạn vẫn giữ được các giá trị chuẩn trong enum để phục vụ các phân tích thống kê cốt lõi.\n\nKhả năng mở rộng: Bằng cách thêm trường property_type_detail (một trường tự do), bạn không bao giờ phải lo lắng về việc schema bị lỗi khi xuất hiện các loại hình bất động sản mới. Mô hình có thể thoải mái ghi chú \"duplex\" hay \"tiny house\" mà không vi phạm validation rules.\n\nDữ liệu sạch: Sau này, bạn có thể dễ dàng lọc các mục \"other\" và dựa trên dữ liệu trong trường property_type_detail để quyết định xem có cần thêm các giá trị mới vào enum chính thức hay không.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Đây là cách làm \"chạy theo sự vụ\" (reactive). Bạn sẽ phải liên tục cập nhật enum và triển khai lại (re-deploy) code mỗi khi có loại bất động sản mới, điều này tạo ra gánh nặng bảo trì rất lớn.\n\nB: Việc đổi sang free-form string sẽ làm mất tính toàn vẹn của dữ liệu. Bạn sẽ sớm gặp phải cảnh dữ liệu bị phân mảnh: \"House\", \"house \", \"house.\", \"single-family house\"... khiến việc tổng hợp thống kê trở nên cực kỳ khó khăn.\n\nD: Việc ép buộc mô hình ánh xạ các kiểu lạ vào các kiểu hiện có (ví dụ: ép \"mobile home\" vào \"house\") là sai lệch thông tin nghiêm trọng, làm giảm chất lượng dữ liệu của bạn ngay từ nguồn."},{"index":47,"text":"An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration.\n\nWhat's the most effective approach?","choices":[{"id":"71616","label":"A","text":"A\nResume the subagent from its previous transcript without mentioning the changes–the architecture understanding remains valid."},{"id":"71617","label":"B","text":"B\nLaunch a fresh subagent and include the prior transcript in the initial prompt for context."},{"id":"71618","label":"C","text":"C\nLaunch a fresh subagent with a summary of prior findings."},{"id":"71619","label":"D","text":"D\nResume the subagent from its previous transcript and inform it about the renamed functions."}],"correctAnswerIds":["71619"],"explanation":"Trong môi trường làm việc với AI agent (như Claude Code), việc duy trì ngữ cảnh (context) là yếu tố quan trọng nhất để đạt hiệu suất cao.\n\nTại sao chọn D:\n\nTận dụng ngữ cảnh: Agent đã mất 30 phút để hiểu cấu trúc của 47 file. Việc resume cho phép agent giữ lại toàn bộ \"kiến thức\" (mental model) về luồng dữ liệu mà nó đã xây dựng.\n\nCập nhật thực tế: Khi mã nguồn đã thay đổi (2 hàm bị đổi tên), bạn cần chủ động thông báo cho agent biết. Đây là thao tác \"human-in-the-loop\" giúp agent điều chỉnh hiểu biết của mình mà không cần phải phân tích lại từ đầu.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Sai lầm vì không cập nhật thông tin về các hàm đã đổi tên. Khi agent cố gắng truy xuất hoặc sử dụng các hàm này trong tương lai, nó sẽ gặp lỗi \"symbol not found\", dẫn đến mất thời gian debug không cần thiết.\n\nB & C: Việc khởi động lại (fresh subagent) sẽ làm mất đi toàn bộ lợi thế của 30 phút phân tích trước đó. Dù có đưa lại transcript (B) hoặc tóm tắt (C), agent vẫn sẽ tốn thêm thời gian để \"đọc\" lại và xây dựng lại sơ đồ tư duy (mental map), kém hiệu quả hơn nhiều so với việc resume trực tiếp và cập nhật delta thay đổi."},{"index":48,"text":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. During testing, the agent sometimes fails to call extract_metadata because it wants to provide direct answers.\n\nWhat's the most reliable way to ensure metadata extraction always happens first?","choices":[{"id":"71676","label":"A","text":"A\nSet tool_choice to \"auto\" and reorder the tool definitions placing extract_metadata first since Claude prioritizes earlier-listed tools."},{"id":"71677","label":"B","text":"B\nSet tool_choice to type \"tool\", name \"extract_metadata\" and process the enrichment requests in subsequent turns after receiving the extracted metadata."},{"id":"71678","label":"C","text":"C\nSet tool_choice to \"auto\" in the API call, combined with tools so that Claude always prioritizes metadata before any other tool calls."},{"id":"71679","label":"D","text":"D\nSet tool_choice to type \"any\" so Claude must use a tool, combined with system prompt instructions to call extract_metadata first."}],"correctAnswerIds":["71677"],"explanation":"Trong kiến trúc của Anthropic Claude API, khi bạn muốn đảm bảo một công cụ bắt buộc phải được gọi trước bất kỳ hành động nào khác (đặc biệt khi mô hình có xu hướng bỏ qua công cụ để tự trả lời), cách xử lý tin cậy nhất là kiểm soát chặt chẽ luồng thực thi (execution flow):\n\nTại sao chọn B:\n\nTính bắt buộc (Forced Execution): Bằng cách thiết lập tool_choice là {\"type\": \"tool\", \"name\": \"extract_metadata\"}, bạn yêu cầu Claude bắt buộc phải gọi công cụ này ngay trong turn đầu tiên. Mô hình không có lựa chọn nào khác ngoài việc trả về một tool_use request thay vì đưa ra câu trả lời trực tiếp.\n\nXử lý tuần tự (Sequential Processing): Sau khi nhận được kết quả (metadata) từ công cụ, bạn mới đưa kết quả đó ngược lại vào conversation history để Claude thực hiện các bước tiếp theo (như làm giàu dữ liệu hoặc trả lời câu hỏi). Đây là cách an toàn nhất để tránh việc mô hình \"ảo giác\" (hallucinate) hoặc tự trả lời trước khi có dữ liệu cần thiết.\n\nTại sao các phương án khác chưa tối ưu:\n\nA & C: Thiết lập tool_choice là \"auto\" không bao giờ đảm bảo 100% việc mô hình sẽ chọn công cụ. Ngay cả khi bạn đặt thứ tự trong danh sách, nếu mô hình cảm thấy nó \"đủ thông minh\" để trả lời trực tiếp mà không cần công cụ, nó vẫn sẽ bỏ qua.\n\nD: Dù tool_choice type \"any\" bắt buộc mô hình phải dùng công cụ, nhưng nó không chỉ định cụ thể công cụ nào. Nếu bạn có nhiều công cụ trong danh sách, mô hình vẫn có thể chọn sai công cụ, dẫn đến kết quả không như ý. Hệ thống prompt (System prompt) chỉ có tác dụng hướng dẫn, không có tính cưỡng ép kỹ thuật mạnh mẽ bằng cách cấu hình tool_choice cụ thể cho tên công cụ như ở phương án B."},{"index":49,"text":"Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences they mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most recent 25 message pairs to stay within context limits.\n\nWhat's the most effective approach to maintain awareness of earlier conversation content while managing context size?","choices":[{"id":"71916","label":"A","text":"A\nAdd a separate API call each turn to summarize messages being dropped, prepending this running summary to the conversation."},{"id":"71917","label":"B","text":"B\nReplace the sliding window with a hybrid approach: summarize older messages while keeping recent messages verbatim."},{"id":"71918","label":"C","text":"C\nIncrease the window size to 50 message pairs to retain more conversation history before truncation."},{"id":"71919","label":"D","text":"D\nImplement vector similarity search over the full conversation history, retrieving relevant past messages for each user query."}],"correctAnswerIds":["71917"],"explanation":"Tại sao chọn B:\n\nPhương pháp Hybrid (kết hợp) là giải pháp tối ưu nhất cho bài toán quản lý cửa sổ ngữ cảnh (context window) trong các đoạn hội thoại dài:\n\nGiữ nguyên (verbatim) các tin nhắn gần đây: Đảm bảo độ chi tiết, mạch lạc và tự nhiên cho các câu trả lời ngắn hạn của trợ lý.\n\nTóm tắt (summarize) các tin nhắn cũ hơn: Giúp lưu giữ lại các thông tin quan trọng như chủ đề, ví dụ, hoặc sở thích mà người dùng đã đề cập từ đầu phiên, đồng thời tiết kiệm đáng kể dung lượng token để không bị vượt quá giới hạn và tránh việc bị mất vết thông tin (như khi dùng sliding window thuần túy).\n\nTại sao loại các đáp án khác:\n\nA (Sai): Việc thực hiện một lệnh gọi API riêng biệt trong mỗi lượt chỉ để tóm tắt các tin nhắn bị loại bỏ sẽ làm tăng đáng kể độ trễ (latency) và chi phí vận hành một cách không cần thiết.\n\nC (Sai): Việc tăng kích thước cửa sổ lên 50 cặp tin nhắn chỉ trì hoãn vấn đề tạm thời; sớm muộn gì khi cuộc trò chuyện kéo dài vượt quá giới hạn đó, thông tin cũ vẫn sẽ bị cắt bỏ hoàn toàn.\n\nD (Sai): Việc sử dụng vector similarity search cho toàn bộ lịch sử trò chuyện tiêu tốn tài nguyên nặng nề, dễ bỏ sót bối cảnh tuần tự (sequential context) và quá phức tạp so với yêu cầu tiêu chuẩn của một cơ chế quản lý hội thoại theo phiên (session)."},{"index":50,"text":"Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms.\n\nWhat is the most reliable approach?","choices":[{"id":"71880","label":"A","text":"A\nAnnotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools."},{"id":"71881","label":"B","text":"B\nAdd detailed instructions and few-shot examples to the tool description requiring the agent to always call with dry_run=true first and wait for user confirmation before calling with dry_run=false."},{"id":"71882","label":"C","text":"C\nAdd server-side validation that permits dry_run=false only when a dry_run=true call with identical parameters occurred within the past 60 seconds."},{"id":"71883","label":"D","text":"D\nReplace with two tools: preview_remove_member returns impact details and a single-use confirmation token; execute_remove_member requires that token, binding execution to the specific previewed action."}],"correctAnswerIds":["71883"],"explanation":"Bối cảnh bài toán:\n\nCông cụ hiện tại remove_team_member dùng tham số dry_run: boolean để preview, nhưng agent vẫn bỏ qua bước này trong 15% trường hợp bằng cách gọi thẳng dry_run=false.\n\nYêu cầu bắt buộc là phải đảm bảo mọi thao tác xóa luôn luôn phải đi kèm với một bước preview và có sự xác nhận rõ ràng từ phía người dùng.\n\nLý do lựa chọn phương án D:\n\nMô hình lập trình hướng kiến trúc (Architectural Enforcement): Thay vì phụ thuộc vào việc mô hình tuân thủ prompt (dễ bị bỏ qua hoặc Hallucination), phương án tốt nhất trong thiết kế Agent là thay đổi thiết kế công cụ để làm cho hành vi sai trở thành bất khả thi về mặt kỹ thuật.\n\nBằng cách chia làm 2 công cụ (preview trả về token xác thực dùng một lần và execute bắt buộc phải có token đó), agent buộc phải thực hiện lệnh preview trước mới lấy được token để chạy lệnh thực thi. Điều này ngăn chặn hoàn toàn việc gọi trực tiếp dry_run=false.\n\nCác phương án khác (như A, B, C) phụ thuộc vào cấu hình lớp điều phối hoặc nhắc nhở (prompting), vốn kém tin cậy hơn và vẫn có xác suất bị agent lách qua khi gặp tình huống phức tạp."},{"index":51,"text":"Your agent has spent 25 minutes exploring a game engine's rendering subsystem–reading shader code, buffer management, and frame synchronization logic. An engineer now asks it to understand how the physics engine integrates with rendering for collision debug overlays. You notice recent responses reference \"typical rendering patterns\" rather than the specific VulkanPipeline and FrameGraph classes it discovered earlier.\n\nWhat's the most effective approach?","choices":[{"id":"71620","label":"A","text":"A\nContinue in the current context with more targeted prompts referencing the specific classes by name."},{"id":"71621","label":"B","text":"B\nUse /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md."},{"id":"71622","label":"C","text":"C\nSpawn a sub-agent to explore physics independently, then manually synthesize its findings with the rendering knowledge accumulated in the main conversation."},{"id":"71623","label":"D","text":"D\nSummarize key rendering findings, then spawn a sub-agent for physics exploration with that summary in its initial context."}],"correctAnswerIds":["71623"],"explanation":"Trong kiến trúc quản lý ngữ cảnh của các AI agent (đặc biệt là Claude Code), việc duy trì sự tập trung của model là rất quan trọng:\n\nTại sao chọn D:\n\nNgăn chặn \"Context Drift\": Agent đã bắt đầu trả lời bằng những kiến thức chung (\"typical rendering patterns\"), điều này cho thấy ngữ cảnh về rendering đang bị \"loãng\" hoặc bị ghi đè khi bắt đầu chuyển sang chủ đề physics.\n\nTối ưu hóa hiệu năng: Việc tóm tắt (summarize) giúp cô đọng những điểm quan trọng nhất (như VulkanPipeline và FrameGraph) thành một \"bản ghi nhớ\" ngắn gọn, giúp sub-agent tập trung vào nhiệm vụ mới (physics) mà vẫn nắm được mối liên kết cốt lõi với hệ thống rendering. Điều này giúp cả hai hệ thống (rendering và physics) không bị nhầm lẫn trong cùng một không gian làm việc.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Tiếp tục trong ngữ cảnh hiện tại sẽ làm tăng nguy cơ agent tiếp tục \"quên\" hoặc nhầm lẫn giữa các kiến thức chuyên sâu của rendering và physics do giới hạn của cửa sổ ngữ cảnh (context window).\n\nB: Việc dùng /clear sẽ xóa sạch 25 phút nghiên cứu quý giá về rendering, khiến agent mất đi nền tảng cần thiết để hiểu sự tích hợp giữa rendering và physics.\n\nC: Việc tự mình \"tổng hợp thủ công\" (manually synthesize) là một cách làm tốn sức lao động của con người, đi ngược lại với mục tiêu sử dụng AI agent để tự động hóa các tác vụ phức tạp."},{"index":52,"text":"Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article–for example, outputting \"500\" for attendee_count when the source contains no attendance information.\n\nWhat's the most effective way to reduce these false extractions?","choices":[{"id":"71688","label":"A","text":"A\nUpgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies."},{"id":"71689","label":"B","text":"B\nMake all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data."},{"id":"71690","label":"C","text":"C\nAdd prompt instructions to return null for any field where information is not directly stated in the source."},{"id":"71691","label":"D","text":"D\nAdd a post-processing step using a second LLM call to verify each extracted value exists in the source document."}],"correctAnswerIds":["71690"],"explanation":"Khi hệ thống gặp tình trạng \"ảo giác\" (hallucination) trong trích xuất dữ liệu — tức là model tự điền các giá trị hợp lý nhưng không có thật thay vì bỏ trống — cách tiếp cận trực tiếp và hiệu quả nhất là điều chỉnh các chỉ dẫn (instructions) trong prompt.\n\nTại sao chọn C:\n\nNgăn chặn hành vi giả định: LLM thường được huấn luyện để trở nên \"hữu ích\" và hoàn thành các trường thông tin. Khi bạn cung cấp chỉ dẫn rõ ràng và mạnh mẽ (explicit instruction) rằng \"nếu thông tin không có, hãy trả về null (hoặc None)\", bạn đang thiết lập một \"bộ lọc\" hành vi ngay tại thời điểm suy luận (inference time). Điều này buộc mô hình phải dựa hoàn toàn vào dữ liệu đầu vào thực tế thay vì cố gắng suy diễn từ kiến thức sẵn có.\n\nChi phí thấp & hiệu quả cao: Đây là thay đổi ở mức cấu hình prompt, không yêu cầu thay đổi cơ sở hạ tầng (như việc thêm post-processing model) hay thay đổi schema phức tạp.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Nâng cấp model có thể giúp cải thiện đôi chút, nhưng ngay cả các model mạnh nhất vẫn có xu hướng suy diễn nếu prompt không yêu cầu nghiêm ngặt việc xử lý thông tin thiếu hụt.\n\nB: Việc bắt buộc (required) các trường dữ liệu sẽ khiến mô hình \"bế tắc\" hoặc buộc nó phải bịa ra dữ liệu để thỏa mãn điều kiện schema, điều này thực chất làm trầm trọng thêm vấn đề thay vì giải quyết nó.\n\nD: Việc thêm một bước LLM thứ hai (post-processing) là một giải pháp tốn kém về mặt chi phí vận hành (latency và token cost) và vẫn có thể thất bại nếu chính model thứ hai cũng bị \"ảo giác\" hoặc hiểu sai dữ liệu gốc. Prompt engineering (C) luôn là bước đầu tiên cần ưu tiên."},{"index":53,"text":"Your system must extract event details from calendar invitations and output JSON that strictly conforms to a schema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non- conformant JSON.\n\nWhat approach provides the most reliable schema compliance?","choices":[{"id":"71888","label":"A","text":"A\nDefine a tool with your target schema as input parameters and have Claude call it with the extracted data."},{"id":"71889","label":"B","text":"B\nInclude detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's text response as JSON."},{"id":"71890","label":"C","text":"C\nPre-fill Claude's response with an opening brace to force JSON output, then complete and parse the response."},{"id":"71891","label":"D","text":"D\nAppend instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to re-prompt when JSON parsing fails."}],"correctAnswerIds":["71888"],"explanation":"Bối cảnh bài toán:\n\nHệ thống cần trích xuất chi tiết sự kiện và xuất ra định dạng JSON tuân thủ tuyệt đối theo một schema nghiêm ngặt (với các trường title, date, time, location, attendees).\n\nYêu cầu đặt ra là tìm phương pháp mang lại độ tin cậy cao nhất về mặt schema compliance (tính tuân thủ schema).\n\nLý do lựa chọn phương án A:\n\nSử dụng Tool Use (Function Calling): Khi định nghĩa một tool với input parameters tuân theo schema mong muốn, các mô hình ngôn ngữ lớn (đặc biệt là hệ thống của Anthropic/Claude) được tối ưu hóa để sinh ra các đối số tool gọi khớp chính xác 100% với cấu trúc schema đó. Trình biên dịch hoặc API của mô hình sẽ ép buộc định dạng đầu vào truyền vào tool, hạn chế tối đa tình trạng JSON không hợp lệ hoặc sai kiểu dữ liệu so với việc chỉ dùng văn bản (text prompt).\n\nCác phương án còn lại (B, C, D) dựa trên prompt thuần túy, pre-fill hoặc retry logic đều có rủi ro cao hơn vì mô hình vẫn có thể sinh ra văn bản sai lệch cấu trúc hoặc thiếu trường dữ liệu theo schema yêu cầu."},{"index":54,"text":"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings.\n\nWhat state management approach best balances information fidelity with context efficiency when restoring agent state?","choices":[{"id":"71736","label":"A","text":"A\nPersist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming."},{"id":"71737","label":"B","text":"B\nHave each agent maintain its own persistent state file and reload it independently at the start of each session."},{"id":"71738","label":"C","text":"C\nHave each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts."},{"id":"71739","label":"D","text":"D\nIndex all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."}],"correctAnswerIds":["71738"],"explanation":"Lý do chọn C:\n\nCân bằng giữa độ chính xác thông tin (fidelity) và hiệu quả ngữ cảnh (context efficiency): Việc mỗi agent lưu trữ (persist) một báo cáo cấu trúc vào vị trí xác định giúp lưu giữ toàn bộ dữ liệu, phát hiện của phần công việc đã hoàn thành (12/28 tài liệu) mà không làm mất mát chi tiết (fidelity).\n\nKhi khôi phục, coordinator chỉ cần tải các báo cáo này và chọn lọc/tiêm (inject) đúng phần trạng thái liên quan vào prompt của từng agent thay vì nhồi nhét toàn bộ lịch sử thô (giúp tối ưu context window).\n\nCác đáp án khác không chính xác:\n\nA: Lưu toàn bộ conversation log thô sẽ nhanh chóng làm quá tải bộ nhớ ngữ cảnh (context window explosion) khi quy mô văn bản lớn và không hiệu quả.\n\nB: Mỗi agent tự quản lý file trạng thái riêng rời rạc khiến coordinator khó điều phối và tổng hợp lại tiến trình tổng thể một cách đồng bộ.\n\nD: Tìm kiếm ngữ nghĩa (vector store semantic search) có nguy cơ bỏ sót hoặc làm mất thông tin chi tiết, chính xác từng phần (mất fidelity) so với việc nạp trực tiếp báo cáo cấu trúc."},{"index":55,"text":"Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability.\n\nWhich batching strategy is most appropriate?","choices":[{"id":"71712","label":"A","text":"A\nSubmit batches every 4 hours containing documents from that window"},{"id":"71713","label":"B","text":"B\nSubmit batches every 6 hours containing documents from that window"},{"id":"71714","label":"C","text":"C\nSubmit a single batch at end of day containing all documents from that day"},{"id":"71715","label":"D","text":"D\nUse the real-time API for all documents instead of batch processing"}],"correctAnswerIds":["71712"],"explanation":"Để chọn chiến lược phù hợp, chúng ta cần cân bằng giữa chi phí (Message Batches API), thời gian xử lý (Processing window) và SLA (Service Level Agreement):\n\nTại sao chọn A (4 giờ):\n\nGiới hạn xử lý: Message Batches API có cửa sổ xử lý lên tới 24 giờ. Nếu bạn gửi batch vào thời điểm cuối của cửa sổ 4 giờ (ví dụ: giờ thứ 4), với thời gian xử lý tối đa 24 giờ, tổng thời gian từ khi tài liệu đến cho đến khi có kết quả sẽ là $4 + 24 = 28$ giờ.\n\nĐáp ứng SLA: Với SLA là 30 giờ, việc gửi theo batch 4 giờ đảm bảo kết quả luôn sẵn sàng trong vòng tối đa 28 giờ, tạo một biên độ an toàn (buffer) 2 giờ để hệ thống xử lý các vấn đề phát sinh hoặc chậm trễ, đảm bảo đạt được độ tin cậy 99.9%.\n\nTại sao các phương án khác chưa tối ưu:\n\nB (6 giờ): Nếu bạn gửi batch vào giờ thứ 6, tổng thời gian có thể lên tới $6 + 24 = 30$ giờ. Điều này sát nút giới hạn SLA, không để lại biên độ an toàn cho các rủi ro hệ thống, làm giảm khả năng đạt mục tiêu độ tin cậy 99.9%.\n\nC (Cuối ngày): Nếu một tài liệu đến ngay đầu giờ làm việc, và bạn đợi đến cuối ngày (ví dụ 8-10 tiếng sau) mới gửi batch, cộng thêm 24 giờ xử lý, tổng thời gian có thể lên tới 32-34 giờ, vi phạm nghiêm trọng SLA 30 giờ.\n\nD (Real-time API): Mặc dù nhanh, nhưng yêu cầu đề bài là cần giảm chi phí bằng cách sử dụng Message Batches API. Chuyển sang Real-time API sẽ làm mất đi ưu đãi giảm giá 50%"},{"index":56,"text":"The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some are receipts. You've defined separate extraction tools, each with its own schema tailored to the document type. During testing, you observe that with tool_choice: \"auto\", Claude sometimes returns conversational text instead of calling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without knowing the document type in advance.\n\nWhat's the most effective approach?","choices":[{"id":"71896","label":"A","text":"A\nSet tool_choice: \"any\" with all extraction tools defined."},{"id":"71897","label":"B","text":"B\nKeep tool_choice: \"auto\" with system prompt instructions requiring tool use."},{"id":"71898","label":"C","text":"C\nAdd a preliminary classification call, then make a second call with tool_choice forced to the identified extraction tool."},{"id":"71899","label":"D","text":"D\nConsolidate all document types into a single unified-schema extraction tool and force that tool."}],"correctAnswerIds":["71896"],"explanation":"Bối cảnh bài toán:\n\nHệ thống tiếp nhận nhiều loại tài liệu khác nhau (hóa đơn, hợp đồng, biên lai) và đã định nghĩa các công cụ trích xuất riêng biệt cho từng loại.\n\nGặp lỗi: Khi dùng tool_choice: \"auto\", mô hình đôi khi trả về văn bản hội thoại thay vì gọi tool trích xuất, làm hỏng luồng xử lý tự động phía sau.\n\nYêu cầu cốt lõi: Bắt buộc phải có đầu ra dạng cấu trúc (guaranteed structured output) mà không cần biết trước loại tài liệu.\n\nLý do lựa chọn phương án A:\n\nSử dụng tool_choice: \"any\": Tham số này trong Anthropic API ép buộc mô hình phải gọi ít nhất một trong các công cụ được định nghĩa (thay vì được quyền chọn tự do giữa trả lời văn bản hay gọi tool như chữ \"auto\"). Bằng cách này, mô hình bị bắt buộc phải thực hiện lệnh gọi tool trích xuất với bất kỳ tập hợp công cụ nào đã cung cấp, loại bỏ hoàn toàn khả năng sinh ra văn bản hội thoại thông thường.\n\nKhi kết hợp với việc định nghĩa tất cả các công cụ trích xuất, mô hình sẽ tự động chọn đúng công cụ phù hợp với tài liệu được cung cấp mà vẫn đảm bảo tính cấu trúc tuyệt đối.\n\nLoại trừ các phương án khác:\n\nPhương án B vẫn dùng chế độ \"auto\" nên không thể ngăn chặn hoàn toàn việc mô hình đôi lúc trả về văn bản hội thoại.\n\nPhương án C (tách thành 2 bước: gọi phân loại trước rồi mới gọi tool ép buộc ở bước sau) làm tăng độ trễ (latency), tốn thêm chi phí tokens và thêm điểm gãy tiềm năng trong pipeline hệ thống.\n\nPhương án D (gộp chung tất cả thành một schema duy nhất) làm mất đi tính đặc thù và ưu điểm của các schema riêng biệt đã được tối ưu theo từng loại tài liệu."},{"index":57,"text":"Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting–prices as \"$12\" vs \"12.00\", dietary info as icons vs text.\n\nWhat's the most reliable approach?","choices":[{"id":"71700","label":"A","text":"A\nExtract data as-is and normalize formats in post-processing code after Claude returns."},{"id":"71701","label":"B","text":"B\nUse separate extraction calls for each field to ensure consistent handling of each type."},{"id":"71702","label":"C","text":"C\nRequest multiple extraction attempts per document and select the most common format."},{"id":"71703","label":"D","text":"D\nDefine a strict output schema and include format normalization rules in your prompt."}],"correctAnswerIds":["71703"],"explanation":"Trong các bài toán trích xuất dữ liệu (data extraction), mục tiêu là đạt được kết quả đồng nhất từ các tài liệu có cấu trúc không đồng nhất.\n\nTại sao chọn D: Đây là giải pháp tối ưu nhất về hiệu quả và tính bền vững:\n\nStrict Output Schema (JSON Schema): Việc định nghĩa một schema nghiêm ngặt giúp ép buộc mô hình phải trả về đúng cấu trúc mong đợi (ví dụ: price luôn là number hoặc string theo một format định sẵn).\n\nFormat Normalization Rules: Thay vì để mô hình \"đoán\" hoặc để lại lỗi cho code hậu kiểm, việc cung cấp quy tắc chuẩn hóa ngay trong prompt (ví dụ: \"Luôn định dạng giá tiền thành số thập phân có 2 chữ số, loại bỏ ký tự '$'\", \"Chuyển đổi icon ăn kiêng sang nhãn văn bản chuẩn: 'vegetarian', 'vegan', 'gluten-free'\") giúp mô hình xử lý ngay tại thời điểm suy luận (inference time). Điều này tận dụng khả năng ngôn ngữ của Claude để thực hiện logic chuyển đổi một cách chính xác.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Hậu kiểm (post-processing) là phương pháp thụ động. Nếu dữ liệu đầu ra không ổn định ngay từ đầu, code của bạn sẽ phải đối mặt với hàng loạt trường hợp ngoại lệ (edge cases), làm tăng độ phức tạp của code.\n\nB: Gọi nhiều lần (multiple calls) cho mỗi trường sẽ làm tăng chi phí API, tăng độ trễ (latency) của hệ thống và quan trọng nhất là làm mất đi ngữ cảnh liên kết (ví dụ: giá của món ăn này phải đi với mô tả của món ăn đó).\n\nC: Việc lấy \"kết quả phổ biến nhất\" (majority vote) từ nhiều lần chạy là cực kỳ tốn kém và không giải quyết được vấn đề nếu mô hình vốn đã hiểu sai quy tắc định dạng. Nó chỉ làm giảm xác suất lỗi ngẫu nhiên chứ không sửa được lỗi hệ thống."},{"index":58,"text":"Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count, or budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any action, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive recommendations that don't match their preferences.\n\nWhat's the most effective approach to improve this trade-off?","choices":[{"id":"71932","label":"A","text":"A\nImplement a structured intake form that collects all required parameters (date, guest count, budget, venue type) upfront before the assistant begins providing any recommendations."},{"id":"71933","label":"B","text":"B\nInstruct the assistant to state explicit assumptions based on conversation history, proceed with recommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like confirming bookings."},{"id":"71934","label":"C","text":"C\nConfigure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate budget) without explicitly stating these assumptions, allowing users to provide corrections if results don't match expectations."},{"id":"71935","label":"D","text":"D\nConfigure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What date, guest count, and budget are you considering?\") to reduce the total number of conversational turns."}],"correctAnswerIds":["71933"],"explanation":"Tại sao B đúng? Trong thiết kế trải nghiệm trợ lý AI (đặc biệt là theo các nguyên tắc kiến trúc ứng dụng AI nâng cao như Claude Certified Architect), việc đưa ra giả định rõ ràng kết hợp với các khuyến nghị ngay lập tức giúp giảm thiểu độ trễ và số lượt hội thoại (tránh việc hỏi quá nhiều câu hỏi khiến người dùng bỏ cuộc), đồng thời vẫn giữ được tính minh bạch và cho phép người dùng dễ dàng điều chỉnh. Việc chỉ giữ lại các câu hỏi làm rõ cho những hành động không thể đảo ngược (như xác nhận đặt chỗ) giúp tối ưu hóa cân bằng giữa trải nghiệm người dùng và độ chính xác.\n\nTại sao các đáp án khác chưa tối ưu?\n\nA (Intake form): Việc ép buộc điền form cấu trúc cứng nhắc từ đầu sẽ làm giảm tính tự nhiên của hội thoại dạng chat, dễ dẫn đến việc người dùng bỏ cuộc ngay từ bước đầu (tương tự như vấn đề 35% bỏ cuộc do hỏi quá nhiều).\n\nC (Ẩn giả định): Không nêu rõ giả định sẽ khiến người dùng bối rối không hiểu tại sao AI lại đưa ra kết quả đó và khó khăn hơn trong việc đưa ra phản hồi chính xác.\n\nD (Gộp câu hỏi): Vẫn giữ nguyên bản chất là ép người dùng trả lời nhiều thông tin cùng lúc trong một lượt, chưa giải quyết được triệt để việc giảm bớt gánh nặng đầu vào cho người dùng."},{"index":59,"text":"Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona guidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing reveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the assistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations regardless of the learner's stated level.\n\nWhat's the most effective approach to ensure consistent adherence to these guidelines throughout extended conversations?","choices":[{"id":"71936","label":"A","text":"A\nAfter each assistant response, make a separate API call to evaluate whether the difficulty level matched the learner's profile, regenerating responses that don't align."},{"id":"71937","label":"B","text":"B\nInject a condensed reminder of the proficiency requirements into the conversation as a system message every 4-5 turns."},{"id":"71938","label":"C","text":"C\nRestructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section immediately before the conversation history begins."},{"id":"71939","label":"D","text":"D\nReplace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at each proficiency level, showing concrete differences in vocabulary, complexity, and explanation depth."}],"correctAnswerIds":["71939"],"explanation":"Vì sao D đúng?\n\nĐây là câu hỏi về prompt engineering và cách LLM tuân thủ hướng dẫn trong các cuộc hội thoại dài.\n\nVấn đề là:\n\nPrompt hiện có 2.800 token.\n\nHướng dẫn điều chỉnh theo trình độ được viết dưới dạng các quy tắc dài.\n\nSau nhiều lượt hội thoại, mô hình bắt đầu \"quên\" hoặc giảm mức ưu tiên đối với những hướng dẫn trừu tượng này.\n\nMột nguyên tắc quan trọng khi làm việc với Claude (và các LLM hiện đại) là:\n\nShow, don't just tell.\n\nFew-shot examples thường hiệu quả hơn các hướng dẫn dài vì chúng cho mô hình thấy chính xác hành vi mong muốn.\n\nVí dụ:\n\nBeginner\n\nPhotosynthesis is how plants make food using sunlight.\n\nIntermediate\n\nPhotosynthesis converts light energy into chemical energy stored in glucose.\n\nAdvanced\n\nPhotosynthesis involves light-dependent reactions followed by the Calvin cycle...\n\nChỉ cần vài ví dụ như vậy, mô hình sẽ hiểu rõ hơn rất nhiều so với một đoạn mô tả dài như:\n\n\"When the learner is beginner, simplify vocabulary...\"\n\nCác LLM học theo mẫu rất mạnh, nên ví dụ cụ thể thường bền vững hơn trong các cuộc hội thoại dài."},{"index":60,"text":"Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific guidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline requirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives generic advice without asking about budget or timeline. The conversation totals only 2,500 tokens.\n\nWhat is the most likely cause?","choices":[{"id":"71912","label":"A","text":"A\nSystem prompts only establish initial behavior and don't persist across all turns."},{"id":"71913","label":"B","text":"B\nThe model's attention on system prompt instructions naturally weakens as turns accumulate."},{"id":"71914","label":"C","text":"C\nThe assistant's accumulated responses are diluting the system prompt's influence."},{"id":"71915","label":"D","text":"D\nThe system prompt is only sent with the first API request."}],"correctAnswerIds":["71914"],"explanation":"Tại sao chọn C: Trong bối cảnh LLM (Large Language Model) trò chuyện nhiều lượt (multi-turn conversation), lịch sử trò chuyện bao gồm cả tin nhắn của người dùng và các phản hồi trước đó của trợ lý được gửi lại trong mỗi API request mới. Khi số lượt trao đổi tăng lên, lượng token từ các câu trả lời tích lũy của trợ lý sẽ làm \"loãng\" (dilute) tầm quan trọng hoặc sự chú ý của mô hình đối với system prompt ban đầu (hiện tượng này thường liên quan đến vị trí của prompt và sự phân phối trọng số trong ngữ cảnh). Do đó, trợ lý có xu hướng quên đi các hướng dẫn cụ thể trong system prompt ở các lượt sau dù tổng số token vẫn nằm trong giới hạn cho phép.\n\nTại sao loại các đáp án khác:\n\nA (Sai): System prompt duy trì sự tồn tại và ảnh hưởng của nó xuyên suốt các lượt trò chuyện, không chỉ thiết lập hành vi ở lượt đầu tiên (nó được gửi lại trong mỗi yêu cầu API).\n\nB (Sai/Không chính xác bằng C): Sự suy giảm chú ý (attention drift/lost in the middle) thường liên quan mạnh mẽ đến dung lượng ngữ cảnh quá lớn hoặc khoảng cách xa, nhưng nguyên nhân trực tiếp dẫn đến việc lệch hướng ở đây là do sự tích lũy nội dung đối thoại (đặc biệt là các phản hồi của chính trợ lý) ngày càng chiếm lĩnh context window và làm suy yếu ảnh hưởng hướng dẫn gốc.\n\nD (Sai): System prompt không chỉ được gửi ở request đầu tiên; trong các API chat thông thường, system prompt thường được đính kèm cùng với toàn bộ lịch sử trò chuyện trong mỗi lần gọi tiếp theo."}]},{"file":"certlab-questions-with-explanations (1).json","title":"Bộ câu hỏi 2","questions":[{"index":1,"text":"Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a JSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing on a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON, causing your pipeline's parser to fail.\n\nWhat is the most effective way to handle this?","choices":[{"id":"72028","label":"A","text":"A\nSplit the review into multiple API calls that each analyze a subset of the changed files, then merge the resulting findings arrays."},{"id":"72029","label":"B","text":"B\nSwitch from tool_use to prompting Claude to return findings as a markdown list."},{"id":"72030","label":"C","text":"C\nAdd retry logic that detects truncated JSON and re-sends the request with instructions to report only critical and high severity findings."},{"id":"72031","label":"D","text":"D\nIncrease max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50 words each."}],"correctAnswerIds":["72028"],"explanation":"Tại sao chọn A: Khi xử lý một Pull Request (PR) lớn với số lượng file thay đổi lớn (30+ files), lượng thông tin trả về vượt quá giới hạn max_tokens của mô hình, dẫn đến việc cắt cụt chuỗi JSON. Giải pháp kiến trúc chuẩn và hiệu quả nhất là chia nhỏ khối lượng công việc (chia PR thành các tập con file nhỏ hơn để phân tích qua các lệnh gọi API riêng biệt) sau đó gộp kết quả của các mảng findings lại với nhau. Cách làm này vừa đảm bảo không bị tràn bộ nhớ/token vừa giữ nguyên tính năng tool_use cấu trúc sẵn.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Chuyển sang định dạng danh sách markdown làm mất đi tính cấu trúc chặt chẽ của tool_use, đồng thời vẫn có nguy cơ bị cắt nội dung nếu lượng chữ quá lớn.\n\nC: Việc giảm bớt mức độ nghiêm trọng (chỉ lấy critical và high) là giải pháp mang tính chắp vá, có thể bỏ sót các lỗi quan trọng ở mức độ trung bình hoặc thấp.\n\nD: max_tokens luôn có giới hạn phần cứng tối đa của mô hình, việc ép mô tả ngắn dưới 50 từ không giải quyết được gốc rễ vấn đề khi số lượng file quá lớn."},{"index":2,"text":"You're implementing a complex graph traversal algorithm with specific performance requirements and edge cases to handle (disconnected nodes, cycles, weighted edges). You want to structure your workflow for efficient iterative refinement with Claude.\n\nWhat approach will most effectively enable progressive improvement across multiple iterations?","choices":[{"id":"72148","label":"A","text":"A\nProvide Claude with a detailed natural language specification of the algorithm, including all requirements and edge cases. Review each output manually and provide descriptive feedback on what behavior needs to change."},{"id":"72149","label":"B","text":"B\nWrite a test suite covering expected behavior, edge cases, and performance requirements before implementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each refinement request."},{"id":"72150","label":"C","text":"C\nHave Claude extensively research the algorithm and create a detailed implementation plan using extended thinking, then implement the complete solution based on that plan."},{"id":"72151","label":"D","text":"D\nProvide Claude with a reference implementation from documentation, then ask it to rewrite the code to match your codebase style and add the required edge case handling, comparing outputs against the reference."}],"correctAnswerIds":["72149"],"explanation":"Bản chất của Test-Driven Development (TDD) với AI:\n\nKhi làm việc với AI để triển khai
