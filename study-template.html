 cậy cao hơn nhiều cho LLM."},{"index":9,"text":"When the agent calls lookup_order and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call process_refund or escalate_to_human next?","choices":[{"id":"71816","label":"A","text":"A\nThe orchestration layer automatically routes to the next tool based on the order's status field."},{"id":"71817","label":"B","text":"B\nThe order details are added to the conversation and the model reasons about which action to take."},{"id":"71818","label":"C","text":"C\nThe agent follows a pre-configured decision tree mapping order attributes to specific tool calls."},{"id":"71819","label":"D","text":"D\nThe agent executes the remaining steps in a tool sequence planned at the start of the request."}],"correctAnswerIds":["71817"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Trong một vòng lặp agentic tiêu chuẩn (agentic loop) sử dụng LLM, kết quả trả về từ công cụ (lookup_order) được đưa trở lại vào ngữ cảnh hội thoại, từ đó mô hình (model) phân tích nội dung thông tin (ví dụ: phát hiện thời gian mua hàng là 45 ngày trước, vượt quá chính sách hoàn trả tự động thông thường) và tự suy luận bước hành động tiếp theo nên gọi công cụ process_refund hay chuyển giao escalate_to_human.\n\nCác đáp án khác không chính xác:\n\nA: Lớp điều phối (orchestration layer) không tự động định tuyến cứng nhắc dựa trên một trường trạng thái đơn giản mà phụ thuộc vào khả năng nhận thức và suy luận của mô hình từ dữ liệu thô.\n\nC & D: Agent không chạy theo cây quyết định cố định hay một chuỗi công cụ được lập kế hoạch sẵn từ đầu, mà hoạt động dựa trên cơ chế phản hồi động (dynamic tool-calling loops) qua từng vòng lặp."},{"index":10,"text":"After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations.\n\nWhat context-passing strategy provides the best balance of completeness and efficiency?","choices":[{"id":"71768","label":"A","text":"A\nPass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated."},{"id":"71769","label":"B","text":"B\nPass the full accumulated context from all prior agents."},{"id":"71770","label":"C","text":"C\nPass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts."},{"id":"71771","label":"D","text":"D\nPass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only."}],"correctAnswerIds":["71770"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Để đạt được sự cân bằng tối ưu giữa tính đầy đủ/chính xác của nguồn trích dẫn (completeness) và hiệu quả ngữ cảnh (efficiency) trong một hệ thống đa agent, việc truyền tải bản nháp tổng hợp (synthesis draft) đi kèm với một chỉ mục nguồn có cấu trúc (structured source index) chứa các liên kết URL và đoạn trích dẫn tương ứng cho phép agent tạo báo cáo cuối cùng dễ dàng lập bản đồ chính xác các tuyên bố với nguồn gốc mà không cần phải nhồi nhét lại toàn bộ hàng nghìn token nội dung thô ban đầu.\n\nCác đáp án khác không chính xác:\n\nA: Quy trình xử lý hậu kỳ (post-processing pipeline) bằng cách so khớp thủ công sau khi báo cáo đã được sinh ra dễ dẫn đến sai sót ngữ cảnh hoặc chèn nhầm trích dẫn.\n\nB: Việc truyền lại toàn bộ context tích lũy từ tất cả các agent trước đó (hơn 138K tokens) gây lãng phí tài nguyên, tăng độ trễ và dễ làm loãng ngữ cảnh.\n\nD: Chỉ định danh nguồn bằng tên mà không có chỉ mục cấu trúc rõ ràng hoặc trích dẫn đoạn văn bản gốc sẽ làm giảm độ chính xác và khó kiểm chứng thông tin cho báo cáo cuối cùng."},{"index":11,"text":"Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document analysis agent frequently identifies gaps—for instance, noting \"the retrieved sources discuss API authentication but lack details on token refresh patterns\"—but under the current strict pipeline, this insight isn't actionable since search has already completed.\n\nWhat's the most effective architectural change?","choices":[{"id":"71864","label":"A","text":"A\nHave the coordinator review analysis output for gap indicators and re-invoke search with gapinformed queries when gaps are detected."},{"id":"71865","label":"B","text":"B\nHave the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage for manual review."},{"id":"71866","label":"C","text":"C\nAdd a research planning agent before the search phase that decomposes topics into specific sub- questions."},{"id":"71867","label":"D","text":"D\nHave the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-invokes analysis until sufficient."}],"correctAnswerIds":["71867"],"explanation":"Tại sao đáp án D đúng:\n\nĐề bài nêu rõ vấn đề: agent phân tích tài liệu (document analysis agent) phát hiện ra các khoảng trống thông tin (gaps), nhưng theo pipeline hiện tại thì thông tin này không được xử lý vì giai đoạn tìm kiếm (search) đã kết thúc. Phương án D thiết lập một vòng lặp phản hồi thông minh (feedback loop): analysis agent báo cáo trực tiếp các khoảng trống cụ thể cho coordinator, từ đó coordinator sẽ kích hoạt các lượt tìm kiếm bổ sung (targeted searches) và lặp lại quá trình phân tích cho đến khi đạt đủ độ sâu và độ phủ thông tin cần thiết.\n\nTại sao các đáp án khác sai:\n\nĐáp án A sai: Việc để coordinator tự xem lại đầu ra của phân tích để tìm dấu hiệu thiếu hụt kém hiệu quả hơn và bỏ qua chuyên môn của chính agent phân tích (đội ngũ phân tích mới là bên trực tiếp nhận diện chi tiết nội dung bị thiếu như token refresh patterns).\n\nĐáp án B sai: Việc yêu cầu synthesis agent (agent tổng hợp) gắn điểm tự tin và gắn cờ để review thủ công (manual review) làm mất đi tính tự động của hệ thống agent, không giải quyết được việc tự động bổ sung thông tin thiếu sót.\n\nĐáp án C sai: Thêm một planning agent trước giai đoạn search chỉ giúp lập kế hoạch ban đầu, nhưng không giải quyết được vấn đề phát sinh khi phân tích tài liệu thực tế phát hiện ra các lỗ hổng thông tin mới cần được tìm kiếm bổ sung vòng sau."},{"index":12,"text":"Your conversation history includes two types of content: persistent story elements (character backgrounds, plot structure, world rules) that must remain consistent throughout, and extensive brainstorming discussion that's mostly ephemeral. After 40+ turns, you're hitting context limits and users report the assistant \"forgets\" established character traits, breaking narrative consistency.\n\nWhich approach best ensures persistent story elements remain available to the model while reclaiming context space?","choices":[{"id":"72224","label":"A","text":"A\nStore all history in a vector database and retrieve semantically similar passages for each new message, replacing conversation history with retrieved chunks."},{"id":"72225","label":"B","text":"B\nSeparate persistent story elements into a retained \"story bible\" section at context start, applying trimming or summarization only to brainstorming discussion."},{"id":"72226","label":"C","text":"C\nSummarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full history to free up tokens."},{"id":"72227","label":"D","text":"D\nApply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier context from recent discussion flow."}],"correctAnswerIds":["72225"],"explanation":"Tại sao chọn B:\n\nBài toán đưa ra hai loại thông tin riêng biệt: thông tin cố định (phông nền nhân vật, cốt truyện, quy tắc thế giới) cần giữ nguyên vẹn 100% và thông tin tạm thời (các thảo luận ý tưởng, động não).\n\nGiải pháp tối ưu nhất là tách các yếu tố cốt lõi cố định thành một phần \"Story Bible\" đặt ở đầu ngữ cảnh (context start / system prompt) để mô hình luôn ghi nhớ chính xác các đặc tính nhân vật. Trong khi đó, các kỹ thuật giải phóng dung lượng (trimming/summarization) chỉ áp dụng cho phần thảo luận động não phía sau.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: RAG (Vector DB) dựa trên truy vấn ngữ nghĩa (semantic similarity). Tuy nhiên, các thuộc tính nhân vật hay quy tắc thế giới có thể không chứa từ khóa trùng khớp trực tiếp với câu hỏi hiện tại, dẫn đến việc RAG bỏ sót thông tin quan trọng.\n\nC sai: Việc tóm tắt toàn bộ lịch sử trò chuyện (bao gồm cả phần cốt truyện cố định) sẽ làm mất dần các chi tiết tinh tế về tính cách nhân vật qua các lần nén tóm tắt.\n\nD sai: Cửa sổ trượt (sliding-window) chỉ giữ lại 25 lượt thoại gần nhất sẽ khiến mô hình quên hoàn toàn các thông tin nhân vật/quy tắc đã thiết lập ở các lượt thoại ban đầu."},{"index":13,"text":"Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge. What approach best balances efficiency and accuracy?","choices":[{"id":"72456","label":"A","text":"A\nResume the session and immediately have the agent re-read all 12 previously analyzed files"},{"id":"72457","label":"B","text":"B\nStart a fresh session to ensure the agent works with current codebase state without stale assumptions"},{"id":"72458","label":"C","text":"C\n\nResume the session and inform the agent which specific files changed for targeted re-analysis"},{"id":"72459","label":"D","text":"D\nResume the session without informing the agent about the changed files"}],"correctAnswerIds":["72458"],"explanation":"Trong môi trường làm việc cộng tác, code thường xuyên thay đổi. Để cân bằng giữa hiệu quả (không phải làm lại toàn bộ) và độ chính xác (đảm bảo AI nắm bắt được các cập nhật mới nhất), chiến lược tối ưu nhất là cung cấp thông tin có chọn lọc:\n\nTại sao chọn C:\n\nHiệu quả (Efficiency): Bạn tận dụng được 9/12 file không thay đổi mà AI đã nắm rõ ngữ cảnh từ hôm qua, giúp tiết kiệm thời gian và tài nguyên tính toán thay vì bắt AI đọc lại toàn bộ (phương án D) hoặc mất công bắt đầu lại từ đầu (phương án B).\n\nĐộ chính xác (Accuracy): Việc thông báo cụ thể 3 file nào đã thay đổi giúp AI thực hiện targeted re-analysis (phân tích lại có trọng tâm). AI sẽ cập nhật \"mental model\" của nó về kiến trúc module dựa trên những thay đổi đó, đảm bảo các giả định cũ không bị lỗi thời (stale assumptions).\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Cực kỳ nguy hiểm. AI sẽ đưa ra các phân tích hoặc gợi ý dựa trên code cũ, dẫn đến các sai sót logic nghiêm trọng khi module đã có sự thay đổi.\n\nB: Lãng phí thời gian. Việc bắt đầu phiên làm việc mới khiến AI mất đi toàn bộ ngữ cảnh (context) về các file không thay đổi và luồng tư duy đã xây dựng được sau 1 giờ làm việc hôm qua.\n\nD: Việc bắt AI đọc lại toàn bộ 12 file là dư thừa và thiếu tối ưu (inefficient), đặc biệt khi 9 file còn lại không hề có sự thay đổi nào. Điều này làm tăng độ trễ (latency) không cần thiết."},{"index":14,"text":"After integrating a local MCP server providing code analysis tools (analyze_dependencies, find_dead_code, calculate_complexity), you verify the server is healthy and tools appear in the tools/list response. However, you observe that the agent consistently uses Grep to search for import statements instead of calling analyze_dependencies—even when users explicitly ask about \"code dependencies.\" Examining tool definitions reveals: - MCP: analyze_dependencies — \"Analyzes dependency graph\" - Built-in: Grep — \"Search file contents for a pattern using regular expressions. Returns matching lines with line numbers and surrounding context.\" What's the most effective approach to improve the agent's selection of MCP tools?","choices":[{"id":"72432","label":"A","text":"A\nRemove Grep from available tools when the MCP server is connected to eliminate functional overlap."},{"id":"72433","label":"B","text":"B\nSplit analyze_dependencies into granular tools (list_imports, resolve_transitive_deps, detect_circular_deps) so each has a focused purpose less likely to overlap with Grep."},{"id":"72434","label":"C","text":"C\nAdd routing instructions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep."},{"id":"72435","label":"D","text":"D\n\nExpand MCP tool descriptions to detail capabilities and outputs—e.g., \"Builds dependency graph showing direct imports, transitive dependencies, and cycles.\""}],"correctAnswerIds":["72435"],"explanation":"Tại sao chọn D:\n\nNguyên nhân khiến LLM chọn Grep thay vì analyze_dependencies là do mô tả công cụ (tool description) quá ngắn gọn và mơ hồ (\"Analyzes dependency graph\"), trong khi Grep lại có mô tả rất chi tiết về chức năng và kết quả trả về.\n\nTrong kiến trúc Tool Use / MCP, mô tả công cụ là yếu tố quan trọng nhất để LLM quyết định khi nào nên gọi công cụ đó. Mở rộng mô tả của analyze_dependencies để giải thích chi tiết khả năng, dữ liệu đầu vào và kết quả đầu ra (chẳng hạn như phân tích import trực tiếp, phụ thuộc bắc cầu, chu kỳ) sẽ giúp LLM hiểu rõ sức mạnh vượt trội của nó so với việc chỉ tìm kiếm chuỗi văn bản bằng Grep.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: Xóa Grep sẽ làm mất đi một công cụ tìm kiếm văn bản tổng quát rất quan trọng cho các tác vụ khác.\n\nB sai: Chia nhỏ công cụ làm tăng số lượng tool, gây phức tạp ngữ cảnh và không giải quyết được vấn đề mô tả thiếu thông tin.\n\nC sai: Thêm quy tắc định tuyến vào System Prompt là cách giải pháp tình thế (patchwork), tốn context window và không tuân thủ nguyên tắc thiết kế công cụ tự mô tả (self-describing tools) chuẩn của MCP."},{"index":15,"text":"A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account.\n\nWhat should the agent do?","choices":[{"id":"71796","label":"A","text":"A\n\nAcknowledge the frustration and ask one targeted question to understand the specific issue before escalating."},{"id":"71797","label":"B","text":"B\n\nImmediately call escalate_to_human with the conversation history."},{"id":"71798","label":"C","text":"C\nBriefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request."},{"id":"71799","label":"D","text":"D\nFirst call get_customer and lookup_order to gather account context, then escalate to a human agent."}],"correctAnswerIds":["71797"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Khi một khách hàng đã bày tỏ rõ sự tức giận tột độ, cảm thấy mất thời gian vì phải lặp lại vấn đề nhiều lần và yêu cầu trực tiếp rõ ràng được nói chuyện với người thật ngay lập tức (\"NOW\"), mô hình thiết kế agent tuân thủ nguyên tắc \"Human-in-the-loop\" tốt nhất là ngay lập tức gọi công cụ escalate_to_human kèm theo toàn bộ lịch sử trò chuyện. Việc cố gắng gặng hỏi thêm hay tự ý gọi tool tra cứu (như ở các đáp án khác) lúc này chỉ càng làm khách hàng thêm bực bội vì yêu cầu kết nối với nhân viên con người bị phớt lờ.\n\nCác đáp án khác không chính xác:\n\nA & C: Cố gắng kéo dài thời gian tương tác, đặt thêm câu hỏi hoặc thuyết phục khách hàng tiếp tục làm việc với AI khi họ đã kiên quyết đòi gặp con người sẽ làm gia tăng trải nghiệm tiêu cực.\n\nD: Việc gọi công cụ thu thập thông tin trước khi chuyển giao là dư thừa vì lịch sử trò chuyện đã bao gồm các dữ liệu cần thiết và làm chậm trễ quá trình chuyển giao cho nhân viên thực tế."},{"index":16,"text":"The document analysis agent has a single analyze_documnet tool that takes a document and a free-text instruction parameter. During evaluation, requests like “extract the key financial metrics” often return narrative summaries, while “summarize the methodology” sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions. What’s the most effective way to improve reliability?","choices":[{"id":"77771","label":"A","text":"A\n\nHave the coordinator pre-classify each analysis request before passing instructions to the document analysis agent"},{"id":"77772","label":"B","text":"B\n\nKeep the single tool but add an analyze_type enum parameter requiring explicit selection between extraction, summarization, and verification modes"},{"id":"77773","label":"C","text":"C\n\nEnhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats"},{"id":"77774","label":"D","text":"D\n\nSplit the generic tool into purpose-specific tools – extract_data_points, summarize_content, verify_claim_against_source – each with defined input/output contracts"}],"correctAnswerIds":["77774"],"explanation":"Vì sao D là giải pháp hiệu quả nhất?\n\nRàng buộc đầu ra (Deterministic Input/Output Contracts):\n\nViệc dùng một công cụ đa năng chung chung với tham số hướng dẫn tự do (free-text instruction) làm tăng tính mơ hồ cho LLM, dẫn đến tình trạng trả về sai định dạng (ví dụ: yêu cầu trích xuất số liệu lại trả về tóm tắt văn bản).\n\nKhi chia nhỏ thành các công cụ chuyên biệt, mỗi công cụ có một Schema/Contract rõ ràng về cấu trúc dữ liệu trả về (JSON schema cho trích xuất, văn bản cho tóm tắt, cờ boolean/bằng chứng cho kiểm chứng). Điều này giúp LLM chọn chính xác công cụ cần dùng và đảm bảo kết quả đầu ra luôn nhất quán, loại bỏ 35% tỷ lệ phải yêu cầu lại.\n\nTối ưu hóa khả năng chọn Tool của Agent (Tool Selection):\n\nTên công cụ và mô tả chức năng rõ ràng (extract_data_points, summarize_content) giúp Agent định hướng nhiệm vụ tốt hơn nhiều so với việc cố giải nghĩa một tham số văn bản tự do.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Phân loại trước yêu cầu ở cấp Coordinator ❌\n\nThêm một lớp phân loại phía trước làm tăng thêm độ trễ và độ phức tạp cho kiến trúc hệ thống, nhưng công cụ bên dưới vẫn là một tool duy nhất có tham số tự do, do đó không giải quyết triệt me vấn đề mơ hồ về định dạng đầu ra.\n\nB. Thêm tham số Enum (analyze_type) vào tool duy nhất ❌\n\nMặc dù Enum giúp giới hạn chế độ phân tích, nhưng vì cấu trúc đầu ra (Output Schema) của một tool duy nhất vẫn phải bao phủ cho cả 3 chế độ khác nhau, LLM vẫn có thể gặp khó khăn trong việc trả về đúng định dạng dữ liệu mong muốn cho từng chế độ cụ thể.\n\nC. Cải thiện mô tả tool bằng ví dụ chi tiết (Few-shot prompting) ❌\n\nViệc thêm ví dụ vào mô tả tool chỉ mang tính chất định hướng mềm (soft constraint). LLM vẫn có thể vi phạm hướng dẫn khi gặp các câu lệnh thực tế phức tạp hoặc khác biệt so với ví dụ."},{"index":17,"text":"Your product search tool queries an external catalog API and returns matching items. In production, you observe the agent frequently retries searches immediately after receiving zero results, treating “no matches found” as a failure requiring retry. The external API returns HTTP 200 with an empty results array – a valid response. How should you restructure the tool’s result to help the agent correctly interpret empty result sets?","choices":[{"id":"77751","label":"A","text":"A\n\nAdd a suggestions field containing alternative search strategies when results are empty, helping guide the agent toward more productive follow-up queries."},{"id":"77752","label":"B","text":"B\n\nReturn a natural language string describing the outcome, allowing the agent to interpret the result contextually based on the message content."},{"id":"77753","label":"C","text":"C\n\nReturn a result object with isError: true and a message explaining no products matched."},{"id":"77754","label":"D","text":"D\n\nReturn a structured result with a success boolean and results array, reserving isError: true for actual execution failures only."}],"correctAnswerIds":["77754"],"explanation":"Vì sao D là thiết kế tối ưu nhất?\n\nPhân định rõ ràng giữa Lỗi Execution (Technical Failure) và Kết quả Trống (Business Outcome):\n\nLLM/Agent thường cắm cờ retry khi nhận thấy dấu hiệu hoặc thông điệp thất bại. Bằng cách chuẩn hóa đầu ra dạng cấu trúc minh bạch:\n\nJSON\n{\n\"success\": true,\n\"results\": [],\n\"total_count\": 0\n}\n\nAgent hiểu rằng công cụ đã thực thi thành công (HTTP 200), chỉ là không có dữ liệu khớp với truy vấn. isError: true chỉ nên dùng cho các lỗi kỹ thuật thực sự như timeout, 500 Internal Error, hay sai tham số.\n\nNgăn chặn hành vi Retry vô ích: Cấu trúc này làm rõ trạng thái cho Agent, giúp nó dừng việc cố gắng thử lại (retry) cùng một truy vấn và chuyển hướng sang giải thích cho người dùng hoặc điều chỉnh từ khóa tìm kiếm.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Thêm trường suggestions khi kết quả trống ❌\n\nDù việc gợi ý từ khóa/chiến lược tìm kiếm mới là một tính năng UX tốt, nhưng nó không giải quyết trực tiếp nguyên nhân cốt lõi khiến Agent hiểu lầm kết quả mảng rỗng [] là một lỗi execution để thực hiện retry ngay lập tức.\n\nB. Trả về chuỗi văn bản tự nhiên (Natural Language String) ❌\n\nĐịnh dạng phi cấu trúc làm tăng tính mơ hồ (ambiguity). Agent sẽ phải mất thêm công sức suy luận ngữ cảnh từ văn bản thay vì dựa vào các cờ boolean rõ ràng, dễ dẫn đến việc xử lý thiếu ổn định.\n\nC. Trả về isError: true kèm thông báo không tìm thấy sản phẩm ❌\n\nTạo ra sai lầm nghiêm trọng hơn: Việc gán isError: true cho một phản hồi 200 OK hợp lệ sẽ đánh lừa Agent rằng công cụ bị lỗi, khiến hành vi retry lặp lại liên tục diễn ra tồi tệ hơn."},{"index":18,"text":"Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analyzer had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings. What state management approach best balances information fidelity with context efficiency when restoring agent state?","choices":[{"id":"72268","label":"A","text":"A\nHave each agent maintain its own persistent state file and reload it independently at the start of each session."},{"id":"72269","label":"B","text":"B\nPersist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming."},{"id":"72270","label":"C","text":"C\nIndex all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings."},{"id":"72271","label":"D","text":"D\n\nHave each agent persist a structured export to a known location. On resume, the coordinator loads the manifest and injects relevant state into agent prompts."}],"correctAnswerIds":["72271"],"explanation":"Tại sao chọn D:\n\nKiến trúc điều phối đa agent (multi-agent architecture) hiệu quả nhất khi Coordinator (bộ điều phối) giữ vai trò quản lý luồng công việc và trạng thái tổng thể.\n\nViệc mỗi agent lưu xuất dữ liệu cấu trúc (structured export/checkpoint) ra vị trí xác định giúp Coordinator dễ dàng đọc file manifest, biết chính xác tiến độ của từng agent (12/28 tài liệu) và chỉ tiêm (inject) đúng ngữ cảnh/trạng thái cần thiết vào prompt khi khởi động lại. Điều này vừa giúp đảm bảo tính chính xác của dữ liệu (fidelity) vừa tối ưu hóa dung lượng context window (context efficiency).\n\nTại sao các đáp án khác không tối ưu?\n\nA sai: Nếu mỗi agent tự đọc lại file trạng thái một cách độc lập mà không qua Coordinator, hệ thống sẽ thiếu sự đồng bộ toàn cục và khó điều phối công việc nối tiếp giữa các agent (ví dụ: Synthesizer cần biết thông tin chính xác từ Document Analyzer).\n\nB sai: Lưu lại toàn bộ lịch sử hội thoại (conversation log) của Coordinator sẽ chứa rất nhiều thông tin dư thừa, làm phình to context window và tốn chi phí token khi tải lại.\n\nC sai: Dùng Vector Store để tìm kiếm ngữ nghĩa (semantic search) không đảm bảo truy xuất đầy đủ 100% dữ liệu chính xác cần thiết để phục hồi chính xác trạng thái thực thi tại điểm bị ngắt."},{"index":19,"text":"Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return confidence scores (0.0-1.0) for each extracted field. In production, you observe: (1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent requests unnecessary human review for 31% of extractions that were actually correct.\n\nHow should you restructure the tool's output?","choices":[{"id":"72068","label":"A","text":"A\nReturn fields with confidence scores, plus a requires_review boolean computed using your tested confidence thresholds, along with a review_reasons array explaining which fields triggered review."},{"id":"72069","label":"B","text":"B\nReturn fields with their raw confidence scores and add detailed few-shot examples to your system prompt demonstrating how to interpret different confidence ranges and when to request human review."},{"id":"72070","label":"C","text":"C\nCompute an aggregate extraction quality score across all fields and return it alongside the extracted values. Include a text summary describing the overall extraction reliability."},{"id":"72071","label":"D","text":"D\nReturn fields organized into verified and needs_verification objects based on confidence thresholds."}],"correctAnswerIds":["72068"],"explanation":"Tại sao chọn A: Vấn đề chính hiện tại là mô hình AI không đánh giá chính xác các con số độ tin cậy (confidence scores) dạng thô từ ML model, dẫn đến việc bỏ sót lỗi hoặc đánh giá nhầm cần review. Cách tối ưu nhất là thực hiện bước tiền xử lý bên trong tool (hoặc hệ thống backend của tool): áp dụng ngưỡng (thresholds) đã được kiểm thử để tính toán sẵn cờ quyết định (requires_review boolean) kết hợp mảng giải thích nguyên nhân (review_reasons). Điều này giúp giải phóng mô hình khỏi việc phải tự suy luận toán học/ngưỡng phức tạp từ điểm số thô, từ đó giảm thiểu đáng kể sai sót.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Dùng few-shot examples trong system prompt vẫn bắt mô hình phải tự xử lý số liệu thô và suy diễn thủ công, không loại bỏ được hoàn toàn sự thiếu nhất quán của LLM khi đánh giá xác suất.\n\nC: Tính điểm chất lượng tổng hợp (aggregate score) sẽ làm mất đi thông tin chi tiết của từng trường riêng lẻ, khiến agent không thể xác định cụ thể trường nào (vendor, amount hay date) bị lỗi để yêu cầu review chính xác.\n\nD: Việc chia cứng thành hai object (verified và needs_verification) làm mất đi các điểm số độ tin cậy chi tiết (confidence scores) vốn rất cần thiết để agent hiểu rõ mức độ chắc chắn của từng trường riêng lẻ."},{"index":20,"text":"After 30+ turns, your conversational assistant shows noticeably slower responses and occasionally produces less coherent outputs. Investigation reveals: (1) average conversations reach 50,000 tokens by turn 35, (2) production logs show 94% of user messages only reference the previous 3-5 exchanges, (3) the 6% of queries referencing earlier context typically ask about information the user could easily re-state. Your goal is to improve response speed and quality while maintaining good user experience. What’s the most effective approach?","choices":[{"id":"77779","label":"A","text":"A\n\nEnable prompt caching and continue sending the complete conversation history, using cached prefixes to reduce per-request costs while preserving all context."},{"id":"77780","label":"B","text":"B\n\nBuild a retrieval system that stores all conversation turns and uses semantic search to pull in relevant historical context only when the current query appears to reference past information."},{"id":"77781","label":"C","text":"C\n\nImplement a summarization layer that progressively compresses older conversation turns into a running summary while keeping the most recent 5-6 turns verbatim, maintaining full historical context in condensed form."},{"id":"77782","label":"D","text":"D\n\nImplement a sliding window keeping only the system prompt and last 8-10 turns. When users reference earlier context, acknowledge the limitation and ask them to re-state the relevant information."}],"correctAnswerIds":["77782"],"explanation":"Vì sao D là lựa chọn hiệu quả nhất?\n\nGiải quyết trực tiếp nguyên nhân gốc rễ (Root Cause):\n\nDữ liệu phân tích chỉ ra 2 thực tế quan trọng:\n\n94% tin nhắn chỉ tham chiếu đến 3–5 lượt hội thoại gần nhất.\n\n6% còn lại truy vấn ngữ cảnh cũ đều chứa thông tin mà người dùng có thể dễ dàng nhắc lại.\n\nBằng cách áp dụng Sliding Window giữ lại System Prompt và 8–10 lượt hội thoại gần nhất, bạn giảm ngay kích thước context window từ 50,000 tokens xuống chỉ còn 2,000–3,000 tokens. Điều này ngay lập tức tăng tốc độ xử lý (giảm latency) và nâng cao độ mạch lạc (coherence) của mô hình nhờ loại bỏ bớt nhiễu (attention noise) từ các tin nhắn quá cũ.\n\nĐảm bảo trải nghiệm người dùng (UX) tối ưu trên chi phí:\n\nViệc yêu cầu người dùng nhắc lại thông tin trong 6% trường hợp hiếm hoi là một sự đánh đổi cực kỳ hợp lý (Trade-off) để mang lại phản hồi nhanh và chính xác cho 94% các tương tác còn lại.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Bật Prompt Caching và tiếp tục gửi toàn bộ Context 50,000 tokens ❌\n\nPrompt Caching giúp giảm chi phí tài chính (cost), nhưng không giải quyết triệt để độ trễ generation và đặc biệt là sự suy giảm độ mạch lạc (Less Coherent Outputs) do mô hình bị quá tải ngữ cảnh (Context Rot/Attention Degradation) khi xử lý 50,000 tokens.\n\nB. Xây dựng hệ thống RAG/Retrieval cho lịch sử trò chuyện ❌\n\nPhức tạp hóa hệ thống quá mức không cần thiết (Over-engineering). Dữ liệu chỉ ra 94% truy vấn chỉ cần 3–5 lượt gần nhất. Việc tốn chi phí embedding, lưu trữ vector database, và tìm kiếm semantic chỉ phục vụ cho 6% nhu cầu không đáng kể.\n\nC. Tóm tắt lũy tiến (Progressive Summarization) ❌\n\nViệc tóm tắt sau mỗi lượt hội thoại làm tăng đáng kể độ trễ (Latency) cho từng request và tiêu tốn chi phí token liên tục cho việc gọi LLM tóm tắt, trong khi thông tin tóm tắt này chỉ thực sự được dùng tới trong vỏn vẹn 6% trường hợp."},{"index":21,"text":"The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations–the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps.\n\nWhat's the most effective approach to ensure proper source attribution in the final reports?","choices":[{"id":"71780","label":"A","text":"A\nInstruct the synthesis agent to embed source references inline within its summary text using a consistent citation format."},{"id":"71781","label":"B","text":"B\nHave each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers)."},{"id":"71782","label":"C","text":"C\nHave the report generator query the web search agent to re-locate sources for claims in the final report."},{"id":"71783","label":"D","text":"D\nSkip summarization and pass full raw outputs from web search and document analysis directly to the report generator."}],"correctAnswerIds":["71781"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Trong kiến trúc hệ thống đa agent, để đảm bảo thông tin nguồn (URLs, tên tài liệu, số trang) không bị mất mát trong quá trình các agent tóm tắt và tổng hợp, phương pháp chuẩn hóa và bền vững nhất là yêu cầu mỗi agent xuất ra dữ liệu có cấu trúc (structured data), tách biệt rõ ràng giữa phần nội dung tóm tắt và phần siêu dữ liệu nguồn (source metadata). Điều này giúp report generator dễ dàng bóc tách và trích dẫn chính xác nguồn gốc cho từng tuyên bố.\n\nCác đáp án khác không chính xác:\n\nA: Việc nhúng trích dẫn thủ công inline trong văn bản tóm tắt rất dễ bị LLM làm sai lệch định dạng, bỏ sót hoặc tự ý biến đổi khi qua các bước tổng hợp tiếp theo.\n\nC: Việc để report generator phải gọi ngược lại web search agent để tìm lại nguồn cho từng câu trong báo cáo cuối cùng làm tăng độ trễ và phức tạp không cần thiết.\n\nD: Bỏ qua hoàn toàn việc tóm tắt và chuyển toàn bộ dữ liệu thô sang sẽ làm quá tải ngữ cảnh (context window) của report generator, gây lãng phí tài nguyên và kém hiệu quả."},{"index":22,"text":"Your track_shipment(tracking_id) tool queries an external logistics API that sometimes fails – the API may be temporarily unavailable, the tracking ID may be malformed, or the shipment may not exist. Currently, your tool raises a Python exception when errors occur. Users report the agent gives unhelpful responses like “I’m having trouble with that request” instead of suggesting alternatives such as verifying the tracking number format or checking by order number. How should you handle errors in tool results?","choices":[{"id":"77755","label":"A","text":"A\n\nReturn a generic error response (e.g., {\"success\": false, \"error\": \"lookup_failed\"}) for all failure cases to maintain a consistent schema and avoid exposing internal error details."},{"id":"77756","label":"B","text":"B\n\nReturn structured error information as normal tool output including error type, recoverability status, and actionable context for the user"},{"id":"77757","label":"C","text":"C\n\nCreate dedicated error-recovery tools (retry_tracking_lookup, search_by_order_number) that the model can invoke after the primary tracking tool returns a failure indicator."},{"id":"77758","label":"D","text":"D\n\nImplement retry logic with exponential backoff inside the tool implementation so transient errors are automatically handled and only return a result after all retry attempts are exhausted."}],"correctAnswerIds":["77756"],"explanation":"Vì sao B là thiết kế tối ưu nhất?\n\nChuyển Exception thành Ngữ cảnh cho LLM (Error Contextualization):\n\nKhi tool văng ra một Python Exception (ví dụ: Exception, ConnectionError), khung ứng dụng (Framework) sẽ coi đó là một sự cố thực thi hệ thống (Execution Failure) và chỉ trả về thông báo lỗi chung chung cho Agent.\n\nBằng cách bắt lỗi (catch exception) và trả về một đối tượng JSON cấu trúc chuẩn dưới dạng đầu ra bình thường, Agent có đủ dữ liệu để suy luận và hỗ trợ người dùng:\n\nJSON\n{\n\"success\": false,\n\"error_type\": \"INVALID_FORMAT\",\n\"is_recoverable\": true,\n\"message\": \"Tracking ID '123' contains only 3 digits (expected 10-12 digits).\",\n\"suggested_actions\": [\"Ask user to verify tracking number\", \"Offer to search by order number\"]\n}\n\nGiúp Agent đưa ra phản hồi có tính hành động (Actionable Feedback):\n\nNhờ biết chính xác lý do thất bại (do định dạng sai, không tìm thấy đơn, hay do máy chủ API bị gián đoạn), Agent có thể giải thích rõ ràng cho người dùng và gợi ý các hướng xử lý thay thế thay vì chỉ nói \"Tôi gặp sự cố khi xử lý yêu cầu\".\n\nVì sao các đáp án khác không phù hợp?\n\nA. Trả về thông báo lỗi chung chung ({\"success\": false, \"error\": \"lookup_failed\"}) ❌\n\nLàm ẩn đi nguyên nhân cốt lõi. Agent không thể phân biệt được lỗi do người dùng nhập sai định dạng hay do hệ thống lỗi, dẫn đến câu trả lời vẫn mơ hồ và không giúp ích gì cho người dùng.\n\nC. Tạo các tool xử lý lỗi riêng biệt (retry_tracking_lookup, search_by_order_number) ❌\n\nTạo thêm các tool xử lý lỗi riêng biệt chỉ để thực hiện lại thao tác là không cần thiết và gây phình to danh sách Tool (Tool Bloat). Agent đã có khả năng gọi lại track_shipment hoặc dùng các tool tra cứu khác nếu nhận được thông tin lỗi rõ ràng từ B.\n\nD. Thực hiện Retry tự động nội bộ (Exponential Backoff) ❌\n\nTự động retry chỉ giải quyết được các lỗi mạng tạm thời (transient errors). Nó hoàn toàn vô tác dụng đối với các lỗi do người dùng (nhập sai định dạng tracking_id, đơn hàng không tồn tại). Nếu sai định dạng, dù retry nhiều lần vẫn sẽ thất bại và làm tăng độ trễ (latency) không cần thiết."},{"index":23,"text":"Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like \"Actually, let's raise the budget to $650K\" or \"I'd prefer a condo now instead of a house,\" the assistant sometimes continues referencing the original preferences in later responses—even though the updates are clearly present in the conversation history. Context usage is only at 35% capacity.\n\nWhich solution most reliably ensures the model uses the current preferences?","choices":[{"id":"72228","label":"A","text":"A\nAdd system prompt instructions emphasizing that the model should always prioritize the most recently stated preferences over earlier ones."},{"id":"72229","label":"B","text":"B\nInclude few-shot examples showing the assistant correctly acknowledging and applying preference changes in responses."},{"id":"72230","label":"C","text":"C\nMaintain a structured state object with current preferences, update it on changes, and include it in each request."},{"id":"72231","label":"D","text":"D\nImplement conversation pruning to remove turns containing outdated preferences, ensuring only current ones remain in context."}],"correctAnswerIds":["72230"],"explanation":"Tại sao chọn C:\n\nĐây là mô hình quản lý trạng thái chuẩn (State Management) khi làm việc với LLMs trong các ứng dụng thực tế. Việc duy trì một đối tượng trạng thái cấu trúc (structured state/JSON object) chứa toàn bộ ưu tiên hiện tại và cập nhật nó mỗi khi người dùng thay đổi tiêu chí giúp tạo ra nguồn sự thật duy nhất (Single Source of Truth).\n\nKhi đưa đối tượng trạng thái này vào mỗi yêu cầu API (trong system prompt hoặc context), mô hình sẽ luôn truy cập chính xác các tùy chọn mới nhất mà không bị lẫn lộn bởi các thông tin lịch sử cũ trong cuộc trò chuyện.\n\nTại sao các đáp án khác không phải là giải pháp đáng tin cậy nhất?\n\nA & B sai: Thêm hướng dẫn trong system prompt hay dùng few-shot examples chỉ là giải pháp mang tính gợi ý (probabilistic prompt engineering). Khi đoạn chat dài lên, mô hình vẫn có xác suất cao bị ảnh hưởng bởi thông tin cũ (recency vs context bias).\n\nD sai: Cắt tỉa hội thoại (conversation pruning) xóa đi các lượt thoại cũ có thể làm mất ngữ cảnh tự nhiên của câu chuyện và tốn thêm chi phí/logic phức tạp để phát hiện và xóa chính xác các câu chứa thông tin lỗi thời."},{"index":24,"text":"A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my refund?\" The conversation is approaching context limits.\n\nWhat strategy best maintains the agent's ability to address all issues throughout the session?","choices":[{"id":"71828","label":"A","text":"A\n\nExtract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer."},{"id":"71829","label":"B","text":"B\n\nSummarize earlier turns into a narrative description, preserving full message history only for the active issue."},{"id":"71830","label":"C","text":"C\nImplement sliding window context that retains the most recent 30 turns."},{"id":"71831","label":"D","text":"D\nRely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues."}],"correctAnswerIds":["71828"],"explanation":"Đề bài: Khách hàng nêu ra ba vấn đề riêng biệt trong một phiên làm việc: câu hỏi hoàn tiền (lượt 1-15), câu hỏi về gói đăng ký (lượt 16-30), và cập nhật phương thức thanh toán (lượt 31-45). Đến lượt 48, khách hàng hỏi: \"Chuyện hoàn tiền của tôi đến đâu rồi?\". Cuộc trò chuyện đang tiệm cận giới hạn ngữ cảnh (context limits).\n\nChiến lược nào duy trì tốt nhất khả năng của agent trong việc giải quyết tất cả các vấn đề trong suốt phiên làm việc?\n\nGiải thích chi tiết\n\nĐáp án đúng là A: Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer. (Trích xuất và lưu trữ dữ liệu vấn đề có cấu trúc (ID đơn hàng, số tiền, trạng thái) vào một tầng ngữ cảnh riêng).\n\nLý do các phương án còn lại không tối ưu:\n\nB (Tóm tắt các lượt trước thành văn bản tường thuật): Văn bản tường thuật dạng tự do dễ làm mất đi các dữ liệu cụ thể như ID đơn hàng hoặc trạng thái chính xác.\n\nC (Dùng cửa sổ trượt giữ lại 30 lượt gần nhất): Giữ 30 lượt gần nhất (lượt 19-48) sẽ làm mất hoàn toàn thông tin về vấn đề hoàn tiền (diễn ra ở lượt 1-15), khiến agent không nhớ khách hàng đang hỏi về cái gì.\n\nD (Dựa vào công cụ MCP để tra cứu lại): Việc phụ thuộc hoàn toàn vào gọi lại tool cho các vấn đề cũ làm tăng thêm độ trễ và số lượt gọi không cần thiết khi dữ liệu có thể được lưu trữ dạng trạng thái gọn nhẹ."},{"index":25,"text":"A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains lookup_order results showing \"Status: PENDING, Expected resolution: 24-48 hours.\" In testing, you observe that when resuming sessions with stale tool results, the agent often references the outdated data in responses (e.g., \"I see your refund is still being processed\") even after subsequent fresh tool calls return different information. What approach most reliably handles returning customers?","choices":[{"id":"72360","label":"A","text":"A\nResume with full history but filter out previous tool_result messages before resuming, keeping only the human/assistant turns so the agent must re-fetch needed data."},{"id":"72361","label":"B","text":"B\n\nStart a new session, inject a structured summary of the previous interaction (issue type, actions taken, resolution status), then make fresh tool calls before engaging."},{"id":"72362","label":"C","text":"C\nResume with full history and add a system prompt instruction telling the agent to always prefer the most recent tool results when multiple calls to the same tool exist in context."},{"id":"72363","label":"D","text":"D\nResume with full history and configure the agent to automatically re-call all previously-used tools at session start to ensure data freshness."}],"correctAnswerIds":["72361"],"explanation":"Vì sao đúng: B. Đúng. Một phiên (session) mới kèm bản tóm tắt vẫn giữ được mạch truyện liên tục (narrative continuity), đồng thời đảm bảo agent không suy luận dựa trên các tool result đã lỗi thời (stale). Phân tích từng phương án: • A: Việc loại bỏ tool_result ở giữa một cuộc hội thoại có thể khiến các assistant message tham chiếu đến những kết quả không còn tồn tại — làm cho transcript trở nên mâu thuẫn nội tại. • B: Đúng. Một phiên mới kèm bản tóm tắt vẫn giữ được mạch truyện liên tục, đồng thời đảm bảo agent không suy luận dựa trên các tool result đã lỗi thời. • C: Các instruction trong prompt chỉ mang tính gợi ý (suggestion). Bạn đã quan sát thấy chính xác kiểu lỗi này khi test — mô hình vẫn tham chiếu đến kết quả cũ. • D: Việc gọi lại toàn bộ các tool một cách dàn trải vừa lãng phí, vừa chậm, và vẫn để các kết quả cũ nằm trong context gây nhiễu cho mô hình."},{"index":26,"text":"You're implementing the escalation logic for when the agent should call escalate_to_human. Your team proposes four different approaches for triggering escalation.\n\nWhich approach will most reliably identify cases that genuinely require human intervention?","choices":[{"id":"71800","label":"A","text":"A\nBuild a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls."},{"id":"71801","label":"B","text":"B\nInstruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress."},{"id":"71802","label":"C","text":"C\nConfigure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human."},{"id":"71803","label":"D","text":"D\nImplement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold."}],"correctAnswerIds":["71801"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Trong thiết kế kiến trúc hệ thống agent hướng tới độ tin cậy và linh hoạt cao (đặc biệt theo các nguyên tắc của Anthropic), việc xác định thời điểm chuyển giao cho con người cần bao quát các tình huống thực tế cốt lõi: khách hàng chủ động yêu cầu, vấn đề vượt quá quyền hạn của AI (cần ngoại lệ chính sách - policy exceptions), hoặc agent rơi vào vòng lặp bế tắc không thể tạo ra tiến triển có ý nghĩa. Cách kết hợp các tiêu chí định tính này mang lại độ nhạy và độ chính xác cao nhất trong việc nhận diện đúng ca cần can thiệp.\n\nCác đáp án khác không chính xác:\n\nA: Dùng rules engine cứng nhắc loại bỏ hoàn toàn phán đoán của mô hình sẽ quá cứng nhắc, không bao quát được vô số biến thể ngôn ngữ và tình huống phức tạp phát sinh từ phía khách hàng.\n\nC: Việc cố định con số \"ba lần gọi công cụ thất bại liên tiếp\" quá đơn giản và mang tính máy móc; nhiều trường hợp chỉ cần 1 lần gọi tool sai hoặc cần sự can thiệp ngay lập tức mà không cần đợi đến đủ 3 lần, hoặc ngược lại, có những tác vụ cần nhiều lần thử hợp lệ.\n\nC & D: Phụ thuộc hoàn toàn vào điểm số phân tích cảm xúc (sentiment analysis) dựa trên từ khóa, dấu chấm than hay ngôn từ tiêu cực dễ dẫn đến việc nhận diện sai (dương tính giả khi khách hàng chỉ đang bức xúc kể chuyện hoặc sử dụng từ mạnh nhưng vấn đề hoàn toàn có thể tự giải quyết)."},{"index":27,"text":"The synthesis agent completes its initial pass but flags that three key research questions remain unanswered because the web search and document analysis agents didn’t find relevant information on those specific subtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete coverage. What change would most effectively improve research completeness?","choices":[{"id":"77738","label":"A","text":"A\n\nHave the report generation agent note which research questions couldn’t be answered, so users understand the limitations of the final output."},{"id":"77739","label":"B","text":"B\n\nIncrease the initial breadth of queries sent to web search and document analysis to reduce the probability of missing relevant information."},{"id":"77740","label":"C","text":"C\n\nHave the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document analysis with targeted queries before invoking synthesis again."},{"id":"77741","label":"D","text":"D\n\nGive the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps without returning control to the coordinator."}],"correctAnswerIds":["77740"],"explanation":"Giải thích chi tiết:\n\nĐáp án C thiết lập vòng lặp phản hồi (Feedback Loop / Multi-step Refinement): Trong mô hình đa đại lý (multi-agent orchestration), việc tổng hợp thông tin không phải là đường một chiều. Khi phát hiện ra khoảng trống tri thức (knowledge gaps), kiến trúc tối ưu nhất là cho phép bộ điều phối (coordinator) nhận phản hồi, đánh giá các câu hỏi còn thiếu, sau đó giao lại nhiệm vụ (re-delegate) với các truy vấn có mục tiêu rõ ràng hơn cho agent tìm kiếm và phân tích. Vòng lặp này giúp chủ động bù đắp thông tin bị thiếu trước khi chuyển sang bước tạo báo cáo.\n\nTại sao các đáp án còn lại chưa tối ưu:\n\nOption A (Chỉ ghi chú hạn chế vào báo cáo): Đây chỉ là giải pháp thụ động nhằm chấp nhận sự thiếu sót, không làm tăng tính đầy đủ của kết quả nghiên cứu.\n\nOption B (Tăng độ rộng tìm kiếm ban đầu): Việc mở rộng truy vấn ngay từ đầu vừa gây lãng phí tài nguyên (token, thời gian API), vừa tạo ra nhiều thông tin nhiễu mà không đảm bảo sẽ bao phủ đúng các khía cạnh chuyên sâu bị thiếu.\n\nOption D (Cấp quyền tìm kiếm trực tiếp cho synthesis agent): Việc này vi phạm nguyên tắc phân tách nhiệm vụ (Separation of Concerns) và làm tăng độ phức tạp công cụ cho synthesis agent (dễ dẫn đến hành vi chọn sai công cụ như ở câu hỏi trước). Quản lý luồng công việc nên thuộc về trách nhiệm của bộ điều phối."},{"index":28,"text":"Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing, Claude frequently omits user_id or passes incorrectly structured data.\n\nWhat is most critical for helping Claude understand what parameter values to provide?","choices":[{"id":"72220","label":"A","text":"A\nStrict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object type"},{"id":"72221","label":"B","text":"B\nClear parameter descriptions explaining expected format, such as \"user_id : UUID of the user to update (required)\""},{"id":"72222","label":"C","text":"C\nVerbose parameter names encoding format hints, such as user_id_string_uuid_format"},{"id":"72223","label":"D","text":"D\nDetailed error responses explaining why invalid parameter values were rejected"}],"correctAnswerIds":["72221"],"explanation":"Tại sao chọn B:\n\nTheo tài liệu hướng dẫn thiết kế Tool của Anthropic, mô tả tham số (parameter descriptions) là yếu tố quan trọng nhất giúp Claude hiểu ngữ cảnh, ý nghĩa, định dạng dữ liệu kỳ vọng (ví dụ: chuỗi định dạng UUID) và thời điểm cần cung cấp tham số đó.\n\nMặc dù JSON Schema giúp định nghĩa kiểu dữ liệu về mặt cú pháp, nhưng Claude cần thông tin mô tả ngữ nghĩa (semantic description) chi tiết để đưa ra các giá trị chính xác và phù hợp nhất với yêu cầu.\n\nTại sao các đáp án khác không phải là lựa chọn ưu tiên nhất?\n\nA sai: Ràng buộc JSON Schema (như type: string, required) chỉ giúp kiểm tra mặt cấu trúc cú pháp, không giúp Claude hiểu được định dạng cụ thể (như UUID) hoặc ngữ cảnh sử dụng dữ liệu nếu thiếu mô tả rõ ràng.\n\nC sai: Việc đặt tên tham số quá dài và rối rắm (verbose parameter names) làm tốn token context không cần thiết và không phải là giải pháp tiêu chuẩn hay hiệu quả để giải thích định dạng cho mô hình.\n\nD sai: Phản hồi lỗi chi tiết chỉ có tác dụng sửa sai sau khi mô hình đã thực thi công cụ thất bại (reactive), trong khi mô tả tham số rõ ràng giúp ngăn ngừa lỗi ngay từ lần gọi đầu tiên (proactive)."},{"index":29,"text":"During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order details via lookup_order, but when attempting to process the refund via process_refund, the tool returns a timeout error. The agent has enough information to explain the billing, confirm the refund eligibility, and verify refund eligibility, but cannot actually process the refund due to the backend failure.\n\nWhat approach best balances first-contact resolution with appropriate error handling?","choices":[{"id":"71808","label":"A","text":"A\nExplain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later"},{"id":"71809","label":"B","text":"B\nEscalate immediately to a human agent since the refund action cannot be completed"},{"id":"71810","label":"C","text":"C\nImplement automatic retries with exponential backoff for process_refund, keeping the conversation open until the refund is successfully processed"},{"id":"71811","label":"D","text":"D\nConfirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically"}],"correctAnswerIds":["71808"],"explanation":"Đáp án đúng cho câu hỏi này là [A].\n\nGiải thích chi tiết:\n\nLý do chọn A: Khi agent gặp sự cố kỹ thuật từ phía backend (timeout error khi gọi công cụ process_refund) nhưng đã thu thập đầy đủ thông tin để xác nhận tính hợp lệ của khoản hoàn tiền, phương án cân bằng tốt nhất giữa tỷ lệ giải quyết ngay (first-contact resolution) và xử lý lỗi phù hợp là giải thích rõ ràng tình trạng, xác nhận quyền lợi cho khách hàng, thông báo về sự cố hệ thống tạm thời và đưa ra các lựa chọn tiếp theo (như chuyển giao cho nhân viên hoặc thử lại sau). Điều này vừa minh bạch với khách hàng, vừa giữ trải nghiệm tốt thay vì bỏ mặc hoặc ép họ chờ đợi mơ hồ.\n\nCác đáp án khác không chính xác:\n\nB: Việc leo thang ngay lập tức (escalate immediately) mà không thông báo chi tiết bối cảnh hoặc khi agent hoàn toàn có đủ thông tin xác thực làm lãng phí năng lực tự động hóa của agent.\n\nC: Việc tự động retry với exponential backoff và bắt người dùng giữ nguyên cuộc trò chuyện chờ đợi trong thời gian timeout gây ra trải nghiệm tồi tệ.\n\nD: Xác nhận sai lệch rằng khoản tiền đã được xử lý xong trong khi backend thực tế đã báo lỗi timeout là hành vi sai lệch dữ liệu và gây mất uy tín nghiêm trọng."},{"index":30,"text":"After investigating a billing dispute over 25+ turns, you've identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call escalate_to_human, and the human agent won't have access to your conversation transcript.\n\nWhat context should you pass to enable effective resolution?","choices":[{"id":"71788","label":"A","text":"A\nThe complete conversation transcript with all tool results."},{"id":"71789","label":"B","text":"B\nThe customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions."},{"id":"71790","label":"C","text":"C\nYour diagnosis and the refund amount only."},{"id":"71791","label":"D","text":"D\nA structured summary: customer ID, root cause, refund amount, and recommended action."}],"correctAnswerIds":["71791"],"explanation":"Đáp án đúng cho câu hỏi này là [D].\n\nGiải thích chi tiết:\n\nLý do chọn D: Khi cần chuyển giao một tiến trình phức tạp kéo dài qua nhiều lượt (25+ turns) sang cho con người (human agent) mà lịch sử trò chuyện không được tự động chia sẻ, việc truyền một bản tóm tắt có cấu trúc rõ ràng (customer ID, root cause, refund amount, and recommended action) là cách tối ưu nhất. Nó cung cấp ngay lập tức các dữ liệu cốt lõi cần thiết giúp con người nắm bắt thông tin nhanh chóng, ra quyết định phê duyệt khoản tiền vượt hạn mức và giải quyết vấn đề mà không bị quá tải bởi dữ liệu thô.\n\nCác đáp án khác không chính xác:\n\nA: Truyền toàn bộ bản ghi hội thoại thô (25+ turns) có thể vượt quá giới hạn hoặc làm mất thời gian đọc của con người, đi ngược lại mục đích chắt lọc thông tin tóm tắt để hỗ trợ xử lý nhanh.\n\nB: Chỉ cung cấp lời phàn nàn ban đầu cộng với đoạn trích giao dịch thiếu đi phần chẩn đoán nguyên nhân gốc rễ và đề xuất hành động cụ thể từ AI.\n\nC: Quá sơ sài, thiếu thông tin định danh khách hàng (customer ID) và nguyên nhân chi tiết khiến con người mất công điều tra lại từ đầu."},{"index":31,"text":"The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you notice that after the customer answers the third verification question, the agent asks them to provide their name again, as if the earlier exchange never happened.\n\nWhat's the most likely cause of this behavior?","choices":[{"id":"71832","label":"A","text":"A\nThe verification tool is clearing the agent's internal state after each successful validation step."},{"id":"71833","label":"B","text":"B\nThe prompt lacks instructions telling Claude to remember information across multiple exchanges."},{"id":"71834","label":"C","text":"C\nThe conversation history isn't being passed in subsequent API requests."},{"id":"71835","label":"D","text":"D\nClaude's memory retention is limited to two conversational turns by default, requiring explicit configuration to extend it."}],"correctAnswerIds":["71834"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Hiện tượng người dùng trả lời xong các câu hỏi xác thực nhưng mô hình lại hỏi lại tên như thể cuộc hội thoại trước đó chưa từng diễn ra (mất hoàn toàn ngữ cảnh trước đó) thường xuất phát từ việc ứng dụng không truyền lại mảng lịch sử trò chuyện (messages array) trong các yêu cầu API tiếp theo gửi đến LLM, khiến mỗi lượt yêu cầu bị coi là một phiên làm việc hoàn toàn mới (stateless).\n\nCác đáp án khác không chính xác:\n\nA: Công cụ xác thực (verification tool) thực hiện các hàm backend, nó không có khả năng tự động xóa trạng thái bên trong của LLM hay quản lý bộ nhớ của mô hình.\n\nB: Bản thân LLM (như Claude) tự động có khả năng ghi nhớ toàn bộ ngữ cảnh được truyền vào trong mảng thông điệp, không phụ thuộc vào việc phải có prompt hướng dẫn nhắc nó phải nhớ.\n\nD: LLM không có giới hạn cố định ngầm định là 2 lượt hội thoại, mà phụ thuộc hoàn toàn vào giới hạn cửa sổ ngữ cảnh (context window) của mô hình (lên đến hàng trăm nghìn token) và việc ứng dụng có truyền đầy đủ lịch sử hay không."},{"index":32,"text":"Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research.\n\nWhat's the most effective way to improve response time for these follow-up summaries?","choices":[{"id":"71764","label":"A","text":"A\nEnable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings."},{"id":"71765","label":"B","text":"B\nPre-generate and cache summaries at multiple granularities whenever new findings accumulate."},{"id":"71766","label":"C","text":"C\nHave the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis."},{"id":"71767","label":"D","text":"D\nSpawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand."}],"correctAnswerIds":["71766"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Đề bài chỉ ra rằng coordinator đã có sẵn toàn bộ kết quả nghiên cứu (80K+ tokens) trong ngữ cảnh của mình từ quá trình điều phối, và các yêu cầu tóm tắt tiếp theo (như \"summarize what we learned about market trends\") chỉ là những truy vấn đơn giản dựa trên thông tin đã có sẵn. Do đó, cách giải quyết hiệu quả nhất về mặt hiệu suất và độ trễ là để coordinator tự xử lý trực tiếp các yêu cầu tóm tắt này bằng context hiện có của nó thay vì lãng phí thời gian và tài nguyên để khởi tạo (spawn) một subagent mới chỉ để tóm tắt lại dữ liệu mà bản thân coordinator đã nắm rõ.\n\nCác đáp án khác không chính xác:\n\nA: Dù prompt caching có thể giúp giảm một phần chi phí hoặc thời gian nạp lại token, việc liên tục tạo subagent mới cho những tác vụ tóm tắt đơn giản mà coordinator hoàn toàn có thể tự làm vẫn gây ra chi phí gọi hàm, độ trễ cấu trúc và quản lý agent không cần thiết.\n\nB: Việc tiền tạo và lưu cache các bản tóm tắt ở nhiều mức độ chi tiết làm tăng thêm độ phức tạp trong việc quản lý trạng thái khi dữ liệu nghiên cứu liên tục thay đổi động.\n\nD: Việc bắt subagent khởi tạo với ít ngữ cảnh rồi liên tục gọi ngược lại coordinator để xin thêm thông tin (on-demand) sẽ làm tăng số lượng vòng lặp (round-trips) và càng làm tăng thêm tổng độ trễ."},{"index":33,"text":"Your process_refund tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection timeout\") that are transient (5% of calls), and business errors (\"Order exceeds 30-day return window\", \"Item already refunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude.\n\nWhat's the most effective way to reduce wasted retries while improving customer-facing response quality?","choices":[{"id":"71836","label":"A","text":"A\nImplement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries."},{"id":"71837","label":"B","text":"B\nAdd few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text."},{"id":"71838","label":"C","text":"C\nReturn structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use."},{"id":"71839","label":"D","text":"D\nAdd a check_refund_eligibility tool that must be called before process_refund to prevent business rule violations."}],"correctAnswerIds":["71838"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Khi công cụ gặp cả lỗi kỹ thuật tạm thời (transient errors như timeout, 503) và lỗi nghiệp vụ cố định (permanent business errors như vượt quá 30 ngày đổi trả), việc chỉ trả về thông báo lỗi dạng văn bản thuần túy khiến mô hình LLM bị bối rối và cố gắng thử lại nhiều lần một cách vô ích. Giải pháp tối ưu và chuẩn xác nhất là trả về các phản hồi lỗi có cấu trúc (structured error responses) chứa các trường tường minh như retryable: false đối với lỗi nghiệp vụ, kết hợp kèm theo thông điệp giải thích thân thiện để mô hình nhận diện ngay lập tức mà không lãng phí số lượt gọi (turns) thực hiện lại các thao tác vô vọng.\n\nCác đáp án khác không chính xác:\n\nA: Việc tự động ẩn lỗi và retry ngầm hoàn toàn ở tầng tool đối với mọi lỗi kỹ thuật có thể gây nghẽn hoặc che giấu các vấn đề hệ thống cốt lõi, đồng thời không giải quyết triệt để cách LLM tiếp nhận và hiểu các lỗi nghiệp vụ.\n\nB: Bổ sung few-shot examples để phân tích văn bản lỗi thủ công là giải pháp kém bền vững và dễ dẫn đến sai sót ngữ cảnh khi nội dung thông báo lỗi thay đổi.\n\nD: Việc bắt buộc phải gọi thêm một công cụ kiểm tra điều kiện riêng biệt trước mỗi lần chạy làm tăng thêm số bước gọi tool không cần thiết (round-trips) trong khi bản thân logic xử lý lỗi có thể được trả trực tiếp từ phản hồi của công cụ chính."},{"index":34,"text":"A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summari narrative flow. What change would most improve briefing quality?","choices":[{"id":"72588","label":"A","text":"A\n\nUpdate the synthesis agent to render each content type appropriately—financial data as tables, news as prose, and technical lists as structured points."},{"id":"72589","label":"B","text":"B\nAdd a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation (such as Markdown) to facilitate more flexible rendering."},{"id":"72590","label":"C","text":"C\nStandardize all subagent outputs to JSON with fields for every data type to ensure programmatic consistency across the pipeline."},{"id":"72591","label":"D","text":"D\nStandardize all subagent outputs to prose summaries with a uniform character to maintain a consistent executive voice regardless of the source material."}],"correctAnswerIds":["72588"],"explanation":"Tại sao chọn A:\n\nCác loại dữ liệu khác nhau có hình thức trình bày tối ưu khác nhau để mang lại trải nghiệm đọc tốt nhất cho người dùng/ban quản trị (executive briefing):\n\nDữ liệu tài chính (con số, biên lợi nhuận, tỷ lệ tăng trưởng) phát huy hiệu quả cao nhất khi trình bày dưới dạng bảng (tables).\n\nTin tức và diễn biến gần đây cần giữ mạch văn xuôi (prose) để bảo toàn tính tự nhiên và ngữ cảnh.\n\nCác danh sách kỹ thuật/bằng sáng chế thích hợp với các ý có cấu trúc (structured points).\n\nCập nhật Synthesis Agent để nó linh hoạt định dạng nội dung phù hợp theo từng bản chất dữ liệu sẽ giải quyết triệt để vấn đề mất tính so sánh ở bảng biểu và làm gãy mạch văn của tin tức.\n\nTại sao các đáp án khác không phù hợp?\n\nB sai: Việc thêm một lớp chuyển đổi trung gian sang Markdown không tự động dạy cho Synthesis Agent biết cách chọn loại định dạng nào cho từng loại dữ liệu nếu bản thân prompt/logic của Agent chưa được cập nhật.\n\nC sai: Chuẩn hóa tất cả đầu ra thành JSON có thể giúp ích cho xử lý lập trình (programmatic consistency) nhưng không giải quyết được vấn đề hiển thị/định dạng trong báo cáo tóm tắt dành cho con người đọc (executive briefings).\n\nD sai: Ép tất cả thành văn xuôi (prose summaries) sẽ làm mất đi tính trực quan của các con số tài chính và các danh sách kỹ thuậ"},{"index":35,"text":"Your post_content tool requires user confirmation before publishing. The current workflow displays “Ready to post to social media. Confirm?” and analytics show users approve 98% of requests within 2 seconds. Post-mortems reveal incidents where posts went to wrong accounts, were scheduled for wrong times, or contained errors – all confirmed by users without catching the mistakes. How should you redesign the confirmation workflow?","choices":[{"id":"77743","label":"A","text":"A\n\nAuto-approve routine posts and only require explicit confirmation for unusual patterns like posting to new accounts or large audiences"},{"id":"77744","label":"B","text":"B\n\nRequire users to type a confirmation phrase instead of clicking a button"},{"id":"77745","label":"C","text":"C\n\nAdd a mandatory waiting period before the confirm option becomes available"},{"id":"77746","label":"D","text":"D\n\nInclude the complete post text, target account, scheduled time, and platform in the confirmation request"}],"correctAnswerIds":["77746"],"explanation":"Vì sao D đúng?\n\nVấn đề cốt lõi không phải là người dùng có xác nhận hay không, mà là người dùng xác nhận khi chưa có đủ thông tin để phát hiện lỗi.\n\nWorkflow hiện tại:\n\n“Ready to post to social media. Confirm?”\n\nquá mơ hồ. Người dùng có thể bấm Confirm theo thói quen mà không kiểm tra:\n\nNội dung có sai không?\n\nĐăng vào account nào?\n\nĐăng lên platform nào?\n\nĐăng ngay hay lúc nào?\n\nThực tế post-mortem cho thấy chính những lỗi này vẫn xảy ra dù confirmation rate lên tới 98%.\n\nD nên biến confirmation thành một informed confirmation:\n\nReview before posting\nContent: “...”\nPlatform: LinkedIn\nAccount: Company Official\nScheduled time: Aug 16, 2026 – 10:00 AM JST\n\n[Cancel] [Confirm Post]\n\nNhư vậy, confirmation trở thành một safety checkpoint, thay vì chỉ là một nút “OK”.\n\nVì sao các đáp án khác không tốt?\n\nA. Auto-approve routine posts ❌\n\nNgược lại với bài học từ incident. Những lỗi nguy hiểm có thể xảy ra ngay cả với các post tưởng như “routine”. Auto-approve còn loại bỏ lớp kiểm soát cuối cùng.\n\nB. Bắt nhập confirmation phrase ❌\n\nĐiều này làm tăng friction, nhưng không làm tăng information.\n\nNgười dùng vẫn có thể copy/paste hoặc gõ “CONFIRM” mà không đọc nội dung. Vấn đề là confirmation quality, không phải confirmation mechanism.\n\nC. Mandatory waiting period ❌\n\nChờ 5–10 giây không đảm bảo người dùng phát hiện:\n\nsai account\n\nsai platform\n\nsai thời gian\n\nsai nội dung\n\nNó chỉ làm workflow chậm hơn."},{"index":36,"text":"You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to analyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions. However, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely stops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository context, which is critical because the diff modifies a core function called by many other external modules.\n\nWhich change to the CLI invocation will cause Claude to read related files in the repository while still successfully applying your custom review instructions?","choices":[{"id":"72236","label":"A","text":"A\nKeep --system-prompt and add --allowedTools \"Read, Glob, Grep\" so that the non-interactive mode permits file system tools that it otherwise disables."},{"id":"72237","label":"B","text":"B\nRemove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root, since --system-prompt is incompatible with tool use under -p."},{"id":"72238","label":"C","text":"C\nStop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code treats the invocation as an agentic session rather than a stream-processing one."},{"id":"72239","label":"D","text":"D\nReplace --system-prompt with --append-system-prompt so your review instructions are added to Claude Code's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation tools."}],"correctAnswerIds":["72239"],"explanation":"Giải thích chi tiết\n\nTại sao chọn D:\n\nKhi truyền cờ --system-prompt, Claude Code sẽ ghi đè hoàn toàn (overwrite) system prompt mặc định của hệ thống. System prompt mặc định này chứa các hướng dẫn thiết yếu về cách Claude Code tương tác với môi trường, bao gồm việc sử dụng các công cụ như đọc file, tìm kiếm mã nguồn (Read, Glob, Grep).\n\nViệc sử dụng --append-system-prompt giúp bổ sung các hướng dẫn code review tùy chỉnh vào sau system prompt mặc định thay vì ghi đè nó. Nhờ đó, Claude Code vẫn giữ nguyên được khả năng và hướng dẫn dùng các công cụ điều hướng/đọc file để kiểm tra toàn bộ codebase.\n\nTại sao các đáp án khác không đúng?\n\nA sai: Cờ --allowedTools không giải quyết được việc mô hình bị mất đi câu lệnh/hướng dẫn sử dụng công cụ trong system prompt khi bị --system-prompt ghi đè.\n\nB sai: --system-prompt hoàn toàn tương thích với việc sử dụng công cụ; vấn đề ở đây chỉ là do nó ghi đè làm mất hướng dẫn mặc định của hệ thống.\n\nC sai: Việc truyền diff qua stdin hay nằm trong chuỗi prompt không quyết định việc Claude có dùng tool hay không; nguyên nhân chính khiến Claude dừng dùng tool là do prompt mặc định bị mất."},{"index":37,"text":"During initial testing of the automated review pipeline, you notice that reviews on large PRs (50+ changed files) sometimes take over 20 minutes and cost $8-12 per run due to extensive agentic loops — Claude reads files, runs analysis tools, and iterates many times. Your team needs each invocation to abort once it reaches a fixed iteration count and a fixed dollar amount, enforced by Claude Code itself rather than the surrounding job runner.\n\nWhich configuration change directly enforces both of those per-invocation caps?","choices":[{"id":"72216","label":"A","text":"A\nSet timeout-minutes: 5 on the GitHub Actions job step and monitor per-run costs via the Anthropic Console usage dashboard."},{"id":"72217","label":"B","text":"B\nSwitch the --model flag to a smaller, cheaper model so each iteration uses fewer tokens and lower per- call cost."},{"id":"72218","label":"C","text":"C\nSet --permission-mode dontAsk to auto-deny any tool permission requests not in the explicitly allowed set."},{"id":"72219","label":"D","text":"D\nAdd --max-turns 10 --max-budget-usd 2.00 to the claude -p invocation to cap iterations and spend."}],"correctAnswerIds":["72219"],"explanation":"Tại sao chọn D:\n\nYêu cầu của bài toán là thiết lập giới hạn về số lượt lặp (iteration count) và ngân sách tối đa (dollar amount), được kiểm soát trực tiếp bởi chính Claude Code (chứ không phải bởi runner bên ngoài như GitHub Actions).\n\nCLI của Claude Code cung cấp sẵn hai cờ (flags) để đáp ứng chính xác yêu cầu này:\n\n--max-turns: Giới hạn số lượt tương tác/lặp (agentic turns/iterations) trong một lần gọi command.\n\n--max-budget-usd: Giới hạn mức chi phí tối đa (tính theo USD) cho lần gọi đó. Khi đạt đến ngưỡng ngân sách này, Claude Code sẽ tự động dừng thực thi.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: timeout-minutes được cấu hình trên GitHub Actions (runner bên ngoài), không phải do Claude Code tự quản lý. Ngoài ra, việc theo dõi chi phí trên Anthropic Console chỉ mang tính xem báo cáo sau khi chạy chứ không chủ động chặn/abort khi chạm ngưỡng chi phí.\n\nB sai: Chuyển sang mô hình nhỏ hơn chỉ giúp giảm chi phí cho từng lượt gọi, nhưng không thiết lập giới hạn cứng (hard cap) về số lượt lặp tối đa hay tổng ngân sách chi trả.\n\nC sai: Cờ --permission-mode dontAsk dùng để quản lý quyền thực thi công cụ (tools permission) tự động từ chối nếu không nằm trong danh sách cho phép, không dùng để giới hạn số lượt lặp hay chi phí của chương trình."},{"index":38,"text":"Your control_device tool manages smart home devices through external APIs. When a device doesn’t respond within the timeout period, the tool returns an error. Production logs show that the agent simply tells users “the device is not responding” without offering helpful next steps. Which error response structure would best enable the agent to provide useful follow-up?","choices":[{"id":"77763","label":"A","text":"A\n\nSet is_error: true with a structured technical error containing the device ID, timeout duration, and raw API response code for debugging purposes."},{"id":"77764","label":"B","text":"B\n\nSet is_error: true with a brief “Device offline” message and provide a separate tool the agent can call to retrieve context-specific troubleshooting suggestions."},{"id":"77765","label":"C","text":"C\n\nSet is_error: false with an optimistic message indicating the command was dispatched successfully but device acknowledgment is still pending."},{"id":"77766","label":"D","text":"D\n\nSet is_error: true with a message explaining the likely cause and suggesting troubleshooting steps the agent can offer the user."}],"correctAnswerIds":["77766"],"explanation":"Vì sao D là thiết kế tối ưu nhất?\n\nCung cấp ngữ cảnh hành động ngay lập tức (Actionable Context):\n\nKhi thiết bị thông minh bị timeout, người dùng không chỉ muốn biết thiết bị bị lỗi mà còn muốn biết nguyên nhân dự kiến và các bước xử lý tiếp theo.\n\nViệc trả về phản hồi lỗi có cấu trúc kèm các gợi ý khắc phục (ví dụ: \"Kiểm tra kết nối Wi-Fi của thiết bị\", \"Thử khởi động lại thiết bị\", hoặc \"Kiểm tra xem thiết bị có đang cắm điện không\") giúp Agent có đầy đủ thông tin để chủ động tư vấn và hướng dẫn người dùng giải quyết vấn đề ngay trong phản hồi.\n\nTránh phát sinh thêm lệnh gọi Tool (Tool Call Overhead):\n\nNhúng trực tiếp các gợi ý khắc phục sự cố vào nội dung phản hồi lỗi giúp Agent phản hồi người dùng ngay lập tức mà không cần tốn thêm một lượt gọi API phụ.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Trả về thông tin kỹ thuật thô (device_ID, raw API response code) ❌\n\nCác mã lỗi kỹ thuật thô chỉ có ích cho nhà phát triển để debug, nhưng hoàn toàn vô ích với người dùng cuối. Agent sẽ không thể tự suy luận ra các bước hỗ trợ người dùng nếu chỉ nhận được một mã lỗi HTTP hoặc stack trace.\n\nB. Trả về lỗi ngắn gọn và yêu cầu gọi một Tool riêng để lấy gợi ý ❌\n\nTự tạo ra sự phức tạp và tăng độ trễ (latency) không cần thiết. Việc bắt Agent phải thực hiện thêm một vòng gọi tool khác chỉ để lấy các gợi ý xử lý sự cố sẽ làm chậm trải nghiệm của người dùng.\n\nC. Đặt is_error: false và báo lệnh đã được gửi đi (Optimistic UI) ❌\n\nĐánh lừa người dùng: Việc báo lệnh thành công khi thiết bị thực tế đã timeout có thể gây ra hậu quả xấu trong thực tế (ví dụ: người dùng tưởng cửa đã khóa hoặc đèn đã tắt nhưng thực tế thiết bị chưa nhận được lệnh)."},{"index":39,"text":"Compliance requires that refunds exceeding $500 must automatically escalate to a human agent–this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate).\n\nHow should you achieve guaranteed compliance?","choices":[{"id":"71824","label":"A","text":"A\nStrengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\""},{"id":"71825","label":"B","text":"B\nAdd few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600)."},{"id":"71826","label":"C","text":"C\nImplement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation."},{"id":"71827","label":"D","text":"D\nModify the refund tool to return an error with message \"Amount exceeds policy limit–please escalate\" when threshold is exceeded."}],"correctAnswerIds":["71826"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Khi yêu cầu tuân thủ chính sách là bắt buộc tuyệt đối (\"cannot be left to model discretion\") và các giải pháp dựa trên ngôn ngữ trong prompt (như viết hoa, dùng từ nhấn mạnh hoặc thêm few-shot examples) vẫn có tỷ lệ thất bại 3%, cách duy nhất để đảm bảo tuân thủ tuyệt đối (guaranteed compliance) là sử dụng cơ chế lập trình xác định (programmatic enforcement). Việc cài đặt một hook để chặn các lệnh gọi công cụ (intercept tool calls) khi giá trị hoàn tiền vượt quá $500 sẽ loại bỏ hoàn toàn khả năng sai sót do mô hình LLM quyết định.\n\nCác đáp án khác không chính xác:\n\nA & B: Các phương pháp tối ưu hóa system prompt (dù dùng từ mạnh hay thêm few-shot examples) vẫn chỉ mang tính chất định hướng ngôn ngữ (probabilistic), không thể đảm bảo sự tuân thủ tuyệt đối 100% đối với các quy tắc tuân thủ pháp lý/chính sách cứng.\n\nD: Việc sửa đổi công cụ để trả về lỗi thông báo vẫn phụ thuộc vào việc mô hình phải đọc, hiểu thông báo lỗi đó và tự quyết định chuyển giao đúng cách, do đó vẫn có rủi ro mô hình cố gắng lách luật hoặc xử lý sai trong một số trường hợp."},{"index":40,"text":"After deploying automated code review, developers report that approximately 35% of flagged findings are false positives falling into consistent patterns: style suggestion contradicting team conventions, security warnings for patterns safe in your deployment context, and performance suggestions that would degrade your specific use case. You want to reduce false positives while maintaining the ability to catch genuine issues.\n\nWhich approach best enables the model to generalize its judgment to novel code patterns it hasn't seen before?","choices":[{"id":"72232","label":"A","text":"A\nInclude few-shot examples in your prompt showing annotated code snippets that distinguish acceptable patterns from genuine issues in each category."},{"id":"72233","label":"B","text":"B\nCreate a comprehensive written specification of all patterns that should not be flagged, then include this full documentation in the system prompt."},{"id":"72234","label":"C","text":"C\nAdd instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider that some patterns may be intentional.\""},{"id":"72235","label":"D","text":"D\nImplement post-processing that uses keyword matching to filter out findings containing terms like \"convention,\" \"context-dependent,\" or \"trade-off.\""}],"correctAnswerIds":["72232"],"explanation":"Tại sao chọn A:\n\nCung cấp các ví dụ mẫu (few-shot examples) có chú thích rõ ràng phân biệt giữa mã nguồn hợp lệ (acceptable patterns) và vấn đề thực sự (genuine issues) là phương pháp hiệu quả nhất giúp LLM khái quát hóa (generalize) và đưa ra phán đoán chính xác cho các mẫu code mới mà nó chưa từng gặp.\n\nViệc thấy trực tiếp các cặp ví dụ \"Đúng vs Sai\" kèm lập luận mẫu giúp mô hình nắm bắt được tư duy/tiêu chuẩn đánh giá của đội ngũ phát triển thay vì chỉ áp dụng máy móc quy tắc.\n\nTại sao các đáp án khác không phù hợp?\n\nB sai: Việc liệt kê toàn bộ các quy tắc/mẫu code không được báo cáo (comprehensive written specification) là bất khả thi và làm quá tải cửa sổ ngữ cảnh (context window), đồng thời khiến mô hình khó khái quát hóa khi gặp các dạng mã nguồn mới.\n\nC sai: Hướng dẫn chung c
