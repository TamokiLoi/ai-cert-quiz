for API-facing services). Your 15 packages are organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without naming conventions indicating which handle user data or expose APIs. Package maintainers are expected to configure their own local development settings, as they understand their package's domain requirements. Currently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance.\n\nWhat's the most effective approach?","choices":[{"id":"71960","label":"A","text":"A\nUse @imports in each package's CLAUDE.md to reference only the specific standard files relevant to that package, based on the maintainer's domain knowledge."},{"id":"71961","label":"B","text":"B\nCreate a shared-standards.nd that uses @imports to combine all three standards, then have each package's CLAUDE.md import that combined file."},{"id":"71962","label":"C","text":"C\nPut all standards in the root CLAUDE.md with override instructions like \"ignore security-rules.md when working in packages that don't handle user data.\""},{"id":"71963","label":"D","text":"D\nCreate claude/rules/ files for each standard with YAML frontmatter paths listing every package directory where that standard should apply."}],"correctAnswerIds":["71960"],"explanation":"Vì sao đáp án A đúng:\n\nĐề bài nhấn mạnh yếu tố đặc thù: \"Package maintainers are expected to configure their own local development settings, as they understand their package's domain requirements\" (Các maintainer của từng package tự cấu hình cài đặt phát triển vì họ hiểu rõ yêu cầu về domain của package đó).\n\nCác package được tổ chức theo tính năng (/packages/auth/, /packages/billing/, v.v.) mà không có quy ước đặt tên sẵn để phân biệt gói nào xử lý dữ liệu người dùng hay mở API. Do đó, việc để từng maintainer sử dụng lệnh @imports chọn lọc chính xác các file tiêu chuẩn thực sự liên quan đến domain của mình là phương án linh hoạt, đúng với phân quyền và bối cảnh nhất.\n\nVì sao các đáp án khác sai:\n\nB: Tạo một file shared-standards.md chung gộp tất cả rồi bắt mọi package import vào sẽ khiến các package không liên quan vẫn phải tiếp nhận những quy chuẩn thừa thãi (tương tự vấn đề trùng lặp ban đầu).\n\nC: Đặt tất cả ở root và dùng câu lệnh ngoại lệ phức tạp (\"ignore...\") không đảm bảo độ chính xác khi LLM xử lý phạm vi ngữ cảnh chi tiết cho từng package.\n\nD: Sử dụng cấu trúc thư mục .claude/rules/ với YAML frontmatter khai báo đường dẫn từng package có thể hoạt động trong các hệ thống tự động hóa tập trung, nhưng trái với yêu cầu cốt lõi của đề bài là trao quyền tự cấu hình cho package maintainer dựa trên sự hiểu biết domain riêng của họ."},{"index":37,"text":"Your expense reimbursement agent processes employee requests using a process reimbursement tool. Company policy requires that reimbursements above $500 must be approved before funds are disbursed.\n\nThe agent handles hundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the agent is prompted ensures the $500 approval threshold cannot be bypassed?","choices":[{"id":"72180","label":"A","text":"A\nThe process reimbursement tool accepts an approved by manager parameter. The system prompt instructs the agent to only set this to true after confirming that a manager approved the request. A nightly audit script reviews all reimbursements where approved by manager was set to true."},{"id":"72181","label":"B","text":"B\nThe process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts \u003c$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the tool to create a pending approval request and return a status indicating manager review is pending."},{"id":"72182","label":"C","text":"C\nProvide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed system prompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post ToolUse hook that logs which tool was called for auditing."},{"id":"72183","label":"D","text":"D\nImplement the threshold check in a PreToolUse hook that inspects the amount parameter before process reimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires approval: true flag, which the tool checks before disbursing."}],"correctAnswerIds":["72181"],"explanation":"Nguyên tắc thiết kế an toàn (Defense in Depth / Business Logic Enforcement):\n\nYêu cầu đặt ra là kiểm soát hạn mức phải chống can thiệp hoàn toàn (tamper-proof), bất kể agent bị prompt hay tấn công prompt injection như thế nào.\n\nTrong kiến trúc AI Agent, System Prompt hay LLM Logic KHÔNG BAO GIỜ được dùng làm ranh giới bảo mật duy nhất (Security Boundary) cho các quy tắc nghiệp vụ quan trọng. LLM có thể bị ảo giác (hallucination) hoặc bị đánh lừa qua prompt injection.\n\nViệc đưa logic kiểm tra hạn mức $500 vào chính mã nguồn bên trong của Tool (Tool Code / Backend) đảm bảo rằng dù agent gửi bất kỳ tham số nào, backend vẫn thực thi đúng chính sách công ty một cách tuyệt đối và không thể bị qua mặt.\n\nLý do các phương án còn lại không đúng:\n\nA (Dựào System Prompt & Tham số agent truyền): Agent vẫn có thể bị jailbreak/prompt injection để tự gửi approved_by_manager: true. Việc kiểm tra qua audit script chỉ phát hiện sau khi tiền đã bị chi.\n\nC (Nhờ Agent tự chọn 1 trong 2 tool): Dựa hoàn toàn vào khả năng ra quyết định của Agent (System Prompt instructions). Agent hoàn toàn có thể chọn nhầm hoặc cố tình chọn tool auto_reimburse cho khoản tiền $1000.\n\nD (Sử dụng PreToolUse hook sửa context): Hook sửa context vẫn dựa vào tool đọc cờ requires_approval: true từ context do AI quản lý, không an toàn và độc lập bằng việc mã hóa logic cố định ngay trong code backend của chính tool đó."},{"index":38,"text":"An engineer sees an unfamiliar error message \"SYNC_CONFLICT: entity version mismatch detected\" in production logs but doesn't know which of the 12 services in the codebase generates it. They ask the agent to help locate the source code.\n\nWhat exploration approach will most efficiently find the responsible code?","choices":[{"id":"72032","label":"A","text":"A\nUse Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version mismatch\"), then Read the matching files to understand context."},{"id":"72033","label":"B","text":"B\nUse Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or handlers/) across services, then Read each matching file."},{"id":"72034","label":"C","text":"C\nRead the project's README and service configuration files to understand the architecture, then systematically Read source files in service directory."},{"id":"72035","label":"D","text":"D\nUse Grep to find all files that import the project's error handling module, then Read those files to locate custom error definitions."}],"correctAnswerIds":["72032"],"explanation":"Tại sao chọn A: Khi cần tìm kiếm nguồn gốc của một lỗi cụ thể trong codebase lớn có nhiều services, cách tiếp cận trực tiếp và hiệu quả nhất là sử dụng công cụ tìm kiếm văn bản (như Grep) để tìm các chuỗi đặc trưng hoặc mã lỗi (SYNC_CONFLICT, entity version mismatch). Sau đó, tiến hành đọc (Read) các file khớp kết quả để hiểu ngữ cảnh. Đây là kỹ thuật cốt lõi trong việc điều hướng mã nguồn cho AI Agent.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Dùng Glob tìm các thư mục chung chung (errors/, exceptions/) có thể bỏ sót nếu lỗi nằm ở file logic nghiệp vụ thông thường hoặc được định nghĩa linh hoạt trong từng service.\n\nC: Đọc README và cấu hình rồi quét tuần tự từng file trong thư mục service là phương pháp tốn thời gian và kém hiệu quả nhất (brute-force).\n\nD: Tìm tất cả các file import module xử lý lỗi không giúp tìm ra trực tiếp định nghĩa hoặc nơi phát sinh câu lệnh lỗi cụ thể của chuỗi SYNC_CONFLICT."},{"index":39,"text":"Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals a recurring pattern: when recipes use informal measurements like \"a handful\" or \"a splash,\" the model either invents specific amounts or leaves fields empty—accounting for 23% of all corrections.\n\nHow should you use this feedback to improve extraction accuracy?","choices":[{"id":"72104","label":"A","text":"A\nImplement a post-processing layer that uses pattern matching to detect informal measurement phrases in source text and automatically populate values when the extraction is empty."},{"id":"72105","label":"B","text":"B\nAdd few-shot examples to your prompt demonstrating correct handling of informal measurements— extracting them verbatim rather than converting or omitting them."},{"id":"72106","label":"C","text":"C\nUpdate your JSON schema to add a \"measurement_type\" enum field (precise/informal)."},{"id":"72107","label":"D","text":"D\nFine-tune the model on the 847 corrected extractions."}],"correctAnswerIds":["72105"],"explanation":"Bản chất của vấn đề: Mô hình đang gặp khó khăn trong việc xử lý trường hợp đặc biệt (edge case) – các cụm từ đo lường không chính xác (như \"a handful\", \"a splash\"). Mô hình tự suy đoán con số hoặc bỏ trống vì chưa được hướng dẫn rõ ràng về quy tắc xử lý loại dữ liệu này.\n\nTại sao B đúng (Few-shot prompting):\n\nCung cấp các ví dụ cụ thể trong prompt (Few-shot examples) mô tả chính xác cách trích xuất nguyên văn (verbatim) các cụm từ đo lường ước chừng là giải pháp nhanh chóng, hiệu quả nhất đối với các mô hình LLM (đặc biệt là Claude) để sửa lỗi hành vi mà không cần can thiệp hệ thống phức tạp.\n\nTại sao các phương án khác không tối ưu:\n\nA (Post-processing): Sử dụng khớp mẫu (pattern matching) bằng mã nguồn rất giòn (brittle) và khó bao quát hết sự đa dạng của ngôn ngữ tự nhiên.\n\nC (Update JSON schema): Thêm trường enum chỉ làm rõ cấu trúc đầu ra chứ không dạy mô hình cách nhận biết và trích xuất đúng nội dung từ văn bản gốc.\n\nD (Fine-tune): Fine-tuning tốn kém, phức tạp và không cần thiết khi vấn đề hoàn toàn có thể giải quyết triệt để bằng kỹ thuật Prompt Engineering (few-shot prompting)."},{"index":40,"text":"Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users frequently approve allocations and immediately ask \"how much did that cost?\" or \"which project was that?\" - indicating they confirmed without understanding the request.\n\nWhat tool design change would most effectively address this?","choices":[{"id":"72092","label":"A","text":"A\nReturn structured data including cost estimate, target project, resource specifications, and impact summary in the tool response"},{"id":"72093","label":"B","text":"B\nAdd a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much context the agent presents in confirmations"},{"id":"72094","label":"C","text":"C\nImplement a 60-second hold before execution completes, allowing users time to review pending allocations and cancel if needed"},{"id":"72095","label":"D","text":"D\nAdd a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only set it after the user explicitly confirms they reviewed the details"}],"correctAnswerIds":["72092"],"explanation":"Tại sao chọn A: Vấn đề gốc rễ là người dùng phê duyệt phân bổ tài nguyên mà thiếu đi thông tin chi tiết (chi phí, dự án, thông số kỹ thuật) vì tool chỉ trả về một thông báo đơn giản (acknowledgment message). Giải pháp thiết kế tool tối ưu nhất để cung cấp đầy đủ ngữ cảnh ngay cho mô hình (để hiển thị lại cho người dùng hoặc xác nhận) là trả về dữ liệu có cấu trúc chứa đầy đủ các thông tin cốt lõi (chi phí ước tính, dự án mục tiêu, thông số và tóm tắt tác động) ngay trong kết quả phản hồi của tool.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Thêm tham số detail_level không giải quyết được vấn đề nếu tool vẫn chỉ trả về thông báo xác nhận thành công đơn giản mà thiếu đi các dữ liệu thực tế về chi phí và dự án để hiển thị.\n\nC: Việc trì hoãn thực thi 60 giây gây bất tiện lớn cho người dùng, làm giảm trải nghiệm tương tác (UX) và không giải quyết được nguyên nhân cốt lõi là thiếu thông tin hiển thị tại thời điểm xác nhận.\n\nD: Thêm tham số user_acknowledged dưới dạng boolean không cung cấp thêm các dữ liệu định lượng cần thiết (như chi phí hay tên dự án), người dùng vẫn sẽ mù mờ bấm xác nhận nếu họ không có sẵn thông tin trước mặt."},{"index":41,"text":"The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string array), cons (string array), and overall_sentiment (enum: positive, negative, mixed).\n\nTesting reveals two issues with brief or ambiguous reviews (~20% of the dataset):\n\n(1) for reviews like \"Great product!\", Claude fabricates specific pros and cons rather than indicating this information isn't explicitly stated, and (2) for sarcastic reviews like \"Well that was... interesting\", Claude picks sentiment arbitrarily since there's no option for ambiguous cases.\n\nWhat schema modification best addresses both issues?","choices":[{"id":"72196","label":"A","text":"A\nMake pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum."},{"id":"72197","label":"B","text":"B\nAdd an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls below a threshold."},{"id":"72198","label":"C","text":"C\nAllow null values for pros/cons, and add \"unclear\" to the sentiment enum."},{"id":"72199","label":"D","text":"D\nAllow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum."}],"correctAnswerIds":["72199"],"explanation":"Giải quyết vấn đề (1) - Bịa đặt pros/cons khi đánh giá quá ngắn:\n\npros và cons vốn được định nghĩa dưới dạng danh sách chuỗi (string array).\n\nCách thiết kế chuẩn nhất trong JSON Schema cho trường kiểu danh sách khi không có thông tin là cho phép trả về mảng rỗng ([]). Điều này giúp mô hình không phải cố \"bịa\" ra thông tin để lấp đầy, đồng thời giữ nguyên kiểu dữ liệu nhất quán (array type) mà ứng dụng phía backend kỳ vọng xử lý.\n\nGiải quyết vấn đề (2) - Nhận diện đánh giá mỉa mai/mơ hồ:\n\nBổ sung giá trị \"unclear\" vào danh sách enum của overall_sentiment cho phép mô hình chọn chính xác phân loại khi gặp câu đánh giá không rõ ràng hoặc mỉa mai, thay vì phải đoán ngẫu nhiên giữa positive, negative, hay mixed.\n\nLý do các phương án còn lại không tối ưu:\n\nA (Make optional / Add neutral & unclear): Biến trường thành optional khiến schema thiếu ràng buộc chặt chẽ. Ngoài ra, \"neutral\" (trung tính) không giải quyết đúng bản chất của câu mỉa mai/mơ hồ (\"unclear\").\n\nB (Extraction confidence): Việc yêu cầu mô hình tự đánh giá độ tin cậy (confidence score) thường không chính xác do LLM hay bị hiện tượng tự tin thái quá (overconfidence bias), đồng thời làm tăng độ phức tạp không cần thiết cho schema.\n\nC (Allow null values): Giá trị null dễ gây ra lỗi kiểu dữ liệu (type errors) ở hệ thống phía sau nếu code backend đang chờ nhận một mảng (array). Mảng rỗng [] là lựa chọn chuẩn hóa hơn."},{"index":42,"text":"You've configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket management, and one for documentation search.\n\nWhen a user asks the agent to \"create a branch for JIRA- 123 and add documentation links to the ticket,\" how does the agent access tools across these servers?","choices":[{"id":"72208","label":"A","text":"A\nThe agent automatically selects the most relevant server based on the request and loads only that server's tools."},{"id":"72209","label":"B","text":"B\nTools from all configured MCP servers are discovered at connection time and available simultaneously to the agent."},{"id":"72210","label":"C","text":"C\nThe agent queries each server sequentially to determine which handles each tool, routing calls based on tool name prefixes."},{"id":"72211","label":"D","text":"D\nYou must specify which MCP server to use for each turn, and the agent can only access one server's tools at a time."}],"correctAnswerIds":["72209"],"explanation":"Tại sao chọn B:\n\nTrong giao thức MCP (Model Context Protocol), khi client/agent kết nối với các MCP server đã được cấu hình, nó sẽ gửi yêu cầu tools/list tới tất cả các server tại thời điểm khởi tạo/kết nối (connection time).\n\nTất cả các công cụ (tools) thu thập được từ các MCP server (như Git, Jira, Documentation) sẽ được hợp nhất và cung cấp đồng thời cho Claude. Nhờ đó, trong cùng một lượt xử lý (turn), agent có thể chọn và phối hợp sử dụng các tool từ nhiều server khác nhau để hoàn thành yêu cầu đa tác vụ của người dùng.\n\nTại sao các đáp án khác không đúng?\n\nA sai: Agent không tải linh hoạt từng server theo nhu cầu mà tải tất cả các tool được khai báo từ các server ngay lúc khởi tạo.\n\nC sai: Không có cơ chế gửi truy vấn tuần tự dựa trên prefix để xác định server xử lý; danh sách tool đã được định nghĩa và tổng hợp sẵn trước khi thực thi prompt.\n\nD sai: Người dùng không cần chỉ định thủ công server nào sẽ dùng cho mỗi lượt trò chuyện, và agent hoàn toàn có thể truy cập tool từ nhiều server cùng một lúc."},{"index":43,"text":"Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests (/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root CLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load into context unnecessarily, consuming tokens.\n\nWhat is the best approach to reorganize so only relevant guidance loads when editing specific file types?","choices":[{"id":"72152","label":"A","text":"A\nSplit content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so Claude loads directory-specific guidance."},{"id":"72153","label":"B","text":"B\nKeep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files from separate documents."},{"id":"72154","label":"C","text":"C\nCreate files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading rules only when editing matching files."},{"id":"72155","label":"D","text":"D\nRestructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform Conventions\"), improving organization and readability."}],"correctAnswerIds":["72154"],"explanation":"Tính năng Claude Code Rules (.claude/rules/):\n\nTrong hệ sinh thái Claude Code / Anthropic, tính năng modular rules cho phép bạn chia nhỏ quy tắc thành các file riêng trong thư mục .claude/rules/.\n\nBằng cách sử dụng YAML frontmatter với trường paths (ví dụ paths: [\"terraform/**/*\"]), Claude Code chỉ tải các quy tắc này vào context window khi người dùng thực hiện các thao tác/chỉnh sửa liên quan đến những file khớp với đường dẫn đó.\n\nLý do các phương án còn lại không đúng:\n\nA (Subdirectory CLAUDE.md): Claude Code cơ bản chỉ tự động tải file CLAUDE.md ở thư mục gốc (root) và thư mục dự án hiện tại, không tự động phân vùng ngữ cảnh theo loại file đang edit linh hoạt như hệ thống .claude/rules/ có đính kèm path-scoping.\n\nB (Dùng cú pháp @path/to/import): Việc @import thẳng vào file root CLAUDE.md vẫn sẽ khiến tất cả các quy tắc được nạp đồng loạt vào context, không giải quyết được vấn đề tiêu tốn token.\n\nD (Thêm chia section bằng Header): Việc chia tiêu đề trong 1 file 500+ dòng chỉ giúp người đọc dễ nhìn hơn, nhưng toàn bộ 500+ dòng đó vẫn sẽ bị tải đầy đủ vào context window của Claude mỗi khi chạy."},{"index":44,"text":"A security audit requires updating your authentication library from v2 to v3. The migration guide documents breaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has restructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files across several modules.\n\nWhat's the most effective approach?","choices":[{"id":"71948","label":"A","text":"A\nCreate a custom slash command encapsulating the migration transformations, then execute it against each file without prior codebase exploration."},{"id":"71949","label":"B","text":"B\nPaste the migration guide's breaking changes into your prompt and use direct execution to update all usages across the 45 files."},{"id":"71950","label":"C","text":"C\nUpdate the dependency version, run the test suite, and use Claude Code to fix each failure as it appears."},{"id":"71951","label":"D","text":"D\nEnter plan mode to explore library usage across modules, map affected code paths, then create a migration strategy before implementing."}],"correctAnswerIds":["71951"],"explanation":"Lý do chọn D: Trong các công cụ trợ lý AI nâng cao cho lập trình (đặc biệt là môi trường làm việc của Claude Code), việc enter plan mode để khảo sát phạm vi sử dụng thư viện, lập bản đồ các đường dẫn mã nguồn bị ảnh hưởng và xây dựng chiến lược trước khi tiến hành chỉnh sửa hàng loạt là phương pháp an toàn và chuẩn mực nhất. Nó giúp tránh việc thực thi mù quáng trên 45 file mà không hiểu rõ tác động dây chuyền hoặc ngữ cảnh của từng module.\n\nCác phương án khác chưa tối ưu:\n\nA: Tạo custom slash command mà không khám phá mã nguồn trước rất dễ dẫn đến lỗi do sự khác biệt về cách gọi hàm trong các file khác nhau.\n\nB: Dán toàn bộ breaking changes vào prompt và thực thi trực tiếp trên 45 file dễ gây tràn ngữ cảnh, thiếu kiểm soát và sót các lỗi logic phức tạp.\n\nC: Chỉ cập nhật dependency và sửa từng lỗi dựa trên test suite khi chúng xuất hiện (trial and error) là cách tiếp cận bị động, thiếu tính toán toàn cục cho một thay đổi kiến trúc lớn (v2 lên v3)."},{"index":45,"text":"Your team's CLAUDE.md includes a rule: \"Use 4-space indentation and always run Prettier formatting.\" Despite this, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting — sometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (\"IMPORTANT: You MUST use Prettier formatting\") reduces violations to about 15%, but doesn't eliminate them.\n\nWhat is the most effective way to ensure all generated code is consistently formatted?","choices":[{"id":"72012","label":"A","text":"A\nSplit the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file types."},{"id":"72013","label":"B","text":"B\nAdd a Stop hook with a prompt-based check that evaluates whether generated code follows formatting standards and prompts Claude to fix violations."},{"id":"72014","label":"C","text":"C\nConfigure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file Claude modifies."},{"id":"72015","label":"D","text":"D\nExtract the formatting rules into a dedicated skill that Claude loads automatically when generating code, with more detailed examples of correct formatting."}],"correctAnswerIds":["72014"],"explanation":"Tại sao chọn C: Trong kiến trúc của Claude Code (và các hệ thống agentic coding hiện đại), các hướng dẫn dạng tĩnh trong prompt (CLAUDE.md, thêm chữ in hoa, hay kỹ năng) chỉ mang tính chất định hướng và vẫn có tỷ lệ sai sót nhất định (như vẫn còn 15% lỗi). Giải pháp kỹ thuật chắc chắn và tự động 100% để ép buộc định dạng mã nguồn là sử dụng Post ToolUse hook với bộ khớp lệnh (matcher) bắt các hành động chỉnh sửa hoặc ghi tệp (Edit|Write), từ đó tự động chạy công cụ định dạng (như Prettier) ngay lập tức trên mọi tệp mà Claude vừa sửa đổi.\n\nTại sao các phương án khác chưa tối ưu:\n\nA, B & D: Việc chia nhỏ rules theo đường dẫn, thêm Stop hook kiểm tra bằng prompt hay tạo skill hướng dẫn đều dựa vào khả năng tuân thủ của mô hình ngôn ngữ (vốn có thể bị trôi hoặc bỏ sót), trong khi định dạng code là công việc cơ học mà hệ thống tự động hóa (automation hooks) có thể xử lý tuyệt đối và chính xác ở tầng hạ tầng."},{"index":46,"text":"Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and away_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of official names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the same season.\n\nWhat tool interface change would effectively prevent these errors?","choices":[{"id":"72072","label":"A","text":"A\nReplace the three parameters with a single game_id parameter and a separate search_games lookup tool that returns matching game IDs."},{"id":"72073","label":"B","text":"B\nAdd enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing ISO 8601 format for the date parameter."},{"id":"72074","label":"C","text":"C\nAdd a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the resolved game details for the agent to verify before the score is committed."},{"id":"72075","label":"D","text":"D\nAdd detailed examples to the tool description showing the required date format and complete list of official team names."}],"correctAnswerIds":["72072"],"explanation":"Tại sao chọn A: Vấn đề gốc rễ phát sinh từ việc agent phải tự nhớ/nhập các thông tin thô dễ sai sót như tên biệt danh (nicknames), định dạng ngày tháng, và nhầm lẫn các trận đấu lặp lại (rematches). Kiến trúc tối ưu nhất để loại bỏ các lỗi này là tách biệt rõ ràng hai thao tác: cung cấp một công cụ tra cứu (search_games) để trả về game_id chính xác sau khi tìm kiếm, và công cụ cập nhật (update_game_score) chỉ nhận một tham số định danh duy nhất là game_id. Điều này giúp ép agent phải thực hiện bước search trước, loại bỏ hoàn toàn các phỏng đoán thủ công về tên đội hay ngày tháng.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Thêm các ràng buộc enum cho tên đội và regex cho định dạng ngày vẫn buộc agent phải tự quyết định các giá trị đó từ ngữ cảnh tự do ban đầu, không giải quyết được vấn đề chọn nhầm trận đấu khi có các trận tái đấu (rematches) trong cùng một mùa giải.\n\nC: Việc thêm cờ xác nhận thủ công (confirm_before_update) không ngăn chặn được việc agent chọn nhầm trận từ bước đầu mà chỉ tạo thêm vòng lặp xác nhận tốn kém chi phí tương tác.\n\nD: Thêm ví dụ chi tiết vào phần mô tả công cụ (tool description) chỉ mang tính hướng dẫn mềm, không ngăn chặn được việc LLM thỉnh thoảng vẫn sinh ra sai lệch khi context dài hoặc số lượng tên đội quá lớn."},{"index":47,"text":"An engineer submits two requests:\n\nRequest A: \"Rename the getUserData function to fetchUserProfile everywhere it's used.\"\n\nRequest B: \"Improve error handling throughout the data processing module—add try/catch blocks, meaningful error messages, and ensure failures don't silently corrupt data.\"\n\nFor which request does specifying an explicit multi-phase workflow (such as analyze propose implement with review) most improve outcome quality?","choices":[{"id":"72212","label":"A","text":"A\nBoth requests benefit equally"},{"id":"72213","label":"B","text":"B\nNeither request benefits significantly"},{"id":"72214","label":"C","text":"C\nRequest A, the function rename task"},{"id":"72215","label":"D","text":"D\nRequest B, the error handling task"}],"correctAnswerIds":["72215"],"explanation":"Tại sao chọn D:\n\nRequest A là một nhiệm vụ đổi tên hàm (refactoring đơn giản, định hình rõ ràng). Đây là tác vụ mang tính cơ học, ít rủi ro về mặt logic hay thiết kế, nên mô hình có thể thực hiện trực tiếp mà không cần quy trình phức tạp.\n\nRequest B là một nhiệm vụ mở (open-ended), đòi hỏi thiết kế lại luồng xử lý lỗi (error handling) trên toàn bộ module. Việc áp dụng quy trình nhiều bước (multi-phase workflow: phân tích -> đề xuất -> triển khai -> kiểm tra) sẽ giúp:\n\nPhân tích (Analyze): Xác định các điểm có nguy cơ gây lỗi hoặc làm hỏng dữ liệu.\n\nĐề xuất (Propose): Đưa ra chiến lược bắt lỗi (try/catch) và thông điệp lỗi phù hợp để xem xét trước.\n\nTriển khai & Kiểm tra (Implement & Review): Thực thi mã nguồn và rà soát lại để đảm bảo không làm thay đổi luồng xử lý chính.\n\nTại sao các đáp án khác không đúng?\n\nA & B sai: Vì lợi ích mang lại giữa hai tác vụ là hoàn toàn chênh lệch. Tác vụ phức tạp và mang tính thiết kế (Request B) thu được hiệu quả vượt trội hơn rất nhiều khi áp dụng workflow so với tác vụ cơ học (Request A).\n\nC sai: Request A không đòi hỏi giai đoạn đề xuất hay phân tích kiến trúc phức tạp."},{"index":48,"text":"Your test generation produces unit tests for new code, but reviews show 55% are low-value: trivial assertions that only verify functions don't throw exceptions, tests duplicating existing coverage, or tests ignoring your team's fixture conventions.\n\nHow do you reduce the rate of low-value tests being generated in the first place?","choices":[{"id":"72176","label":"A","text":"A\nRestrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."},{"id":"72177","label":"B","text":"B\nImplement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."},{"id":"72178","label":"C","text":"C\nAdd post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide."},{"id":"72179","label":"D","text":"D\nDocument testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}],"correctAnswerIds":["72179"],"explanation":"Bản chất vấn đề: Đề bài hỏi cách giảm tỷ lệ test kém chất lượng ngay từ đầu khi sinh ra (in the first place). Nguyên nhân của việc sinh ra test vô nghĩa hay bỏ qua fixture của team là do AI thiếu ngữ cảnh (context) và các ví dụ/tiêu chuẩn (standards/few-shot examples) đặc thù của dự án.\n\nTại sao D đúng:\n\nCung cấp các tiêu chuẩn kiểm thử, danh sách fixtures có sẵn và các ví dụ minh họa phân biệt giữa behavioral test có nghĩa vs trivial assertions trực tiếp trong CLAUDE.md giúp Claude hiểu chính xác kỳ vọng của đội ngũ phát triển ngay ở bước khởi tạo prompt context.\n\nĐây là thực hành cốt lõi trong tài liệu hướng dẫn của Anthropic/Claude Code: cung cấp rõ ràng hướng dẫn, quy chuẩn và ví dụ minh họa mẫu ngay từ đầu.\n\nLý do các phương án còn lại không tối ưu:\n\nA (Giới hạn thư mục): Tránh né vấn đề thay vì giải quyết, khiến các vùng code mới không thể áp dụng tự động hóa sinh test.\n\nB (Xử lý 2 pha / Gọi Claude lần 2 để chấm điểm): Tốn gấp đôi lượng token và chi phí API, đồng thời tốn thời gian phản hồi mà không giải quyết gốc rễ việc Claude ở bước 1 chưa nắm đủ thông tin.\n\nC (Lọc theo độ bao phủ dòng / Line coverage): Trivial assertions (test hình thức không bắt bug) vẫn có thể đạt line coverage cao. Độ bao phủ dòng không phản ánh chất lượng hành vi (behavioral value) của bài test."},{"index":49,"text":"Your code review assistant needs to analyze pull requests and provide feedback on three aspects: code style compliance, potential security issues, and documentation completeness. Each aspect requires reading files, running analysis tools, and generating a report section. The review process follows the same three-step workflow for every PR.\n\nWhich task decomposition pattern is most appropriate for this workflow?","choices":[{"id":"72116","label":"A","text":"A\nOrchestrator-workers—have a central LLM analyze each PR to dynamically determine which checks are needed, then delegate to specialized worker LLMs for each identified subtask."},{"id":"72117","label":"B","text":"B\nSingle comprehensive prompt—include all instructions in one prompt and let the model handle all three aspects simultaneously."},{"id":"72118","label":"C","text":"C\nRouting—classify each PR by type (feature, bugfix, refactor) first, then route to different review prompts optimized for that category."},{"id":"72119","label":"D","text":"D\nPrompt chaining—break the review into sequential steps where each aspect (style, security, documentation) is analyzed separately, with outputs combined in a final synthesis step."}],"correctAnswerIds":["72119"],"explanation":"Yêu cầu cốt lõi của đề bài:\n\nQuy trình đánh giá PR luôn tuân theo cùng một quy trình 3 bước cố định (follows the same three-step workflow for every PR) bao gồm: kiểm tra chuẩn mã nguồn (code style), bảo mật (security), và tài liệu (documentation), sau đó tổng hợp lại báo cáo.\n\nTại sao D đúng (Prompt Chaining):\n\nPrompt Chaining (Chuỗi Prompt) là mô hình phân rã tác vụ (Task Decomposition Pattern) trong đó đầu ra của bước này làm đầu vào cho bước tiếp theo theo một thứ tự tuyến tính/cố định.\n\nVì quy trình đánh giá PR ở đây là cố định và lặp lại giống hệt nhau cho mọi PR, việc xâu chuỗi các bước xử lý nối tiếp (Style → Security → Documentation → Synthesize Report) là giải pháp tối ưu, đơn giản và đáng tin cậy nhất.\n\nLý do các phương án còn lại không phù hợp:\n\nA (Orchestrator-workers): Dùng khi các subtask cần được phân tích và quyết định động (dynamically) tùy theo từng trường hợp. Trong khi ở đây quy trình là cố định cho mọi PR.\n\nB (Single comprehensive prompt): Dễ gây quá tải ngữ cảnh (context congestion), giảm độ chính xác khi mô hình phải thực hiện đồng thời nhiều tiêu chí kiểm tra phức tạp trong 1 lần gọi.\n\nC (Routing): Chỉ phù hợp khi cần phân loại đầu vào để chuyển tiếp hướng xử lý sang các nhánh hoàn toàn khác nhau (ví dụ: PR sửa lỗi đi luồng khác PR tính năng mới). Ở đây mọi PR đều cần trải qua đúng 3 bước như nhau."},{"index":50,"text":"Anthropic's tool use documentation states: \"Write instructive error messages. Instead of generic errors like 'failed', include what went wrong and what Claude should try next.\" A billing dispute agent uses lookup_order, which catches all exceptions and returns a tool_result with is_error: true and the message \"execution failed\". Monitoring shows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls escalate_to_human without trying alternative tools.\n\nWhich change follows the documented recommendation and gives Claude the information it needs to select the correct recovery action for each error type?","choices":[{"id":"71968","label":"A","text":"A\nReturn error-type-specific messages with is_error: true, e.g., \"order not found-try get_customer to search by phone\" for data errors and \"Database timeout (transient)-retry should succeed\" for infrastructure errors."},{"id":"71969","label":"B","text":"B\nRemove is_error: true and return the error details as normal tool content, so Claude reasons about the response as data rather than treating it as a flagged failure condition that biases retry behavior."},{"id":"71970","label":"C","text":"C\nImplement retry logic with exponential backoff inside each tool implementation so transient errors are resolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop."},{"id":"71971","label":"D","text":"D\nAdd an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags each as \"retry\" \"try_alternative,\" or \"escalate,\" and adds that recommendation to the tool result."}],"correctAnswerIds":["71968"],"explanation":"Lý do chọn A: Theo đúng tài liệu của Anthropic về Tool Use, khi xảy ra lỗi, hệ thống cần cung cấp các thông báo lỗi mang tính hướng dẫn (instructive error messages) kèm theo cờ is_error: true. Thông báo này phải nêu rõ điều gì đã xảy ra và Claude nên thử bước tiếp theo nào (ví dụ: chuyển sang công cụ thay thế như get_customer đối với lỗi dữ liệu, hoặc thử lại đối với lỗi gián đoạn cơ sở hạ tầng). Điều này khắc phục trực tiếp hai hiện tượng mô hình bị kẹt (lặp lại vô ích hoặc lập tức chuyển hướng sang nhân sự).\n\nCác phương án khác chưa tối ưu:\n\nB: Loại bỏ is_error: true khiến Claude hiểu nhầm thông báo lỗi là dữ liệu thông thường thay vì một sự cố cần can thiệp xử lý.\n\nC: Ẩn hoàn toàn các lỗi tạm thời bên trong tool bằng cơ chế retry tự động ngăn cản agent tự thích ứng và xử lý khi gặp các vấn đề lớn hơn.\n\nD: Thêm bước phân loại lỗi bên ngoài loop làm thay đổi logic vòng lặp agent tiêu chuẩn, thay vì tận dụng khuyến nghị cốt lõi của Anthropic về việc thiết kế nội dung thông báo lỗi trực tiếp cho Claude tự đưa ra quyết định phục hồi (recovery action)."},{"index":51,"text":"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't specified which modules to prioritize.\n\nHow should the agent decompose this open-ended task?","choices":[{"id":"72036","label":"A","text":"A\nStart writing tests for the first module alphabetically, using test failures and imports to discover related files organically."},{"id":"72037","label":"B","text":"B\nSystematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for every function before beginning."},{"id":"72038","label":"C","text":"C\nUse Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered."},{"id":"72039","label":"D","text":"D\nCreate a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-level directory regardless of code complexity or business importance."}],"correctAnswerIds":["72038"],"explanation":"Tại sao chọn C: Khi đối mặt với một tác vụ mở (open-ended) trên một codebase lớn (200 file, ít test), một AI Agent cần phải lập kế hoạch chiến lược. Sử dụng các công cụ như Glob và Grep để lập bản đồ cấu trúc, xác định các module cốt lõi/phụ thuộc lẫn nhau (heavily-coupled modules), từ đó xây dựng một kế hoạch ưu tiên cho các khu vực có tác động lớn (high-impact areas) và linh hoạt điều chỉnh khi phát hiện thêm phụ thuộc là phương pháp tiếp cận thông minh, hiệu quả và có cấu trúc nhất.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Bắt đầu viết test theo thứ tự bảng chữ cái từ module đầu tiên là cách làm tùy tiện (naive), bỏ qua tầm quan trọng thực tế của nghiệp vụ và cấu trúc phụ thuộc của mã nguồn.\n\nB: Đọc toàn bộ 200 file trước khi viết bất kỳ test nào sẽ gây lãng phí lớn về context window và token, không khả thi đối với các dự án lớn.\n\nD: Lập lịch trình cố định dựa trên cấu trúc thư mục với nỗ lực đều nhau cho mọi thư mục không phản ánh đúng mức độ phức tạp thực tế hoặc giá trị nghiệp vụ của từng phần mã nguồn."},{"index":52,"text":"A developer uses Claude Code to refactor a function during their development session. Before committing, they ask the same Claude session to review the code for issues. Later, a separate automated CI review catches several bugs that the same-session review missed.\n\nWhat best explains this discrepancy?","choices":[{"id":"72204","label":"A","text":"A\nThe CI environment has access to the full codebase context while the local session only sees the current file"},{"id":"72205","label":"B","text":"B\nThe CI review uses a more specific prompt tailored for catching bugs, while the developer's request was too general"},{"id":"72206","label":"C","text":"C\nClaude retains context about its prior reasoning in the session, making it less likely to question its own decisions"},{"id":"72207","label":"D","text":"D\nThe extended session length caused the context window to fill with conversation history, leaving less room for thorough analysis"}],"correctAnswerIds":["72206"],"explanation":"Tại sao chọn C:\n\nĐây là hiện tượng thiên vị suy luận cũ (confirmation bias / self-consistency issue). Khi thực hiện review mã nguồn trong cùng một phiên làm việc (session) vừa dùng để refactor, Claude vẫn lưu giữ toàn bộ ngữ cảnh và lập luận cũ trong context window. Điều này khiến mô hình có xu hướng tự đồng ý với quyết định trước đó của chính mình thay vì kiểm tra lại với một góc nhìn khách quan, độc lập.\n\nTại sao các đáp án khác không phải là lý do chính?\n\nA sai: Claude Code ở phiên làm việc cục bộ hoàn toàn có khả năng truy cập toàn bộ codebase thông qua các công cụ tìm kiếm và đọc file chứ không chỉ giới hạn ở một file duy nhất.\n\nB sai: Dù prompt cụ thể hơn có thể giúp ích, nhưng vấn đề cốt lõi của việc review lại chính đoạn mã do mình vừa sửa trong cùng phiên làm việc nằm ở thiên vị ngữ cảnh (context bias), chứ không chỉ do câu lệnh chung chung.\n\nD sai: Chiều dài phiên làm việc có thể ảnh hưởng đến context, nhưng lý do chính giải thích sự khác biệt giữa hai lần review (trong cùng session vs CI độc lập) là việc giữ lại lịch sử lý luận làm giảm khả năng tự phản biện."},{"index":53,"text":"Your documents (query) tool returns results as \"Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast, Annual Review\". You want the agent to document (4, multi) and doc (24, multi).\n\nWhat return format would best enable these multi-step workflows?","choices":[{"id":"72048","label":"A","text":"A\nA JSON array of document titles extracted from the search results."},{"id":"72049","label":"B","text":"B\nStructured data containing document IDs and metadata for each result."},{"id":"72050","label":"C","text":"C\nMore detailed human-readable descriptions including the size and authors."},{"id":"72051","label":"D","text":"D\nURLs that users can click to open the document in their browser."}],"correctAnswerIds":["72049"],"explanation":"Tại sao chọn B: Để một AI Agent thực hiện các tác vụ tiếp theo (multi-step workflows) như gọi tiếp các công cụ thao tác trên tài liệu (ví dụ: document(id) hoặc đọc nội dung chi tiết), việc trả về dữ liệu có cấu trúc chứa ID định danh duy nhất và metadata của từng kết quả là bắt buộc. Agent cần ID chính xác để truyền vào các tham số của công cụ tiếp theo thay vì chỉ dựa vào tiêu đề văn bản dạng chuỗi thô.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Mảng JSON chỉ chứa tiêu đề (titles) không cung cấp ID định danh, khiến agent không thể xác định chính xác tài liệu nào cần gọi trong các bước tiếp theo nếu có tiêu đề trùng lặp.\n\nC: Mô tả chi tiết mang tính con người (kích thước, tác giả) làm lãng phí không gian ngữ cảnh (context window) mà vẫn thiếu các khóa định danh máy đọc được (machine-readable IDs).\n\nD: URL nhấp chuột trên trình duyệt phục vụ cho giao diện người dùng (UI) cuối, không phù hợp cho các lệnh gọi công cụ tự động dạng API của agent."},{"index":54,"text":"After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history includes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8 servings, (3) the user's clarification that \"room temperature butter\" means 68°F in their kitchen, and (4) general back-and-forth about meal timing and presentation. You need to implement context management before the window limit is reached.\n\nWhat approach best balances information preservation with token reduction?","choices":[{"id":"72088","label":"A","text":"A\nExtract critical structured data (allergies, serving counts, user-defined terms) into a compact reference section, summarize general discussion, and retain recent exchanges verbatim."},{"id":"72089","label":"B","text":"B\nStore the full conversation externally and use semantic search to retrieve relevant portions for each turn, loading only matching segments into context."},{"id":"72090","label":"C","text":"C\nImplement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state important information when relevant."},{"id":"72091","label":"D","text":"D\nSummarize the entire conversation history into a concise summary capturing main topics discussed, then append new messages going forward."}],"correctAnswerIds":["72088"],"explanation":"Tại sao chọn A: Trong quản lý ngữ cảnh (context management) cho các cuộc trò chuyện dài với LLM, việc kết hợp trích xuất dữ liệu quan trọng có cấu trúc (như dị ứng, số lượng khẩu phần, định nghĩa thuật ngữ riêng của người dùng), tóm tắt phần thảo luận chung, và giữ lại các trao đổi gần nhất nguyên vẹn là giải pháp tối ưu nhất. Cách làm này vừa bảo toàn được các thông tin cốt lõi, nhạy cảm/quan trọng không bị mất mát qua việc tóm tắt cẩu thả, vừa giảm đáng kể dung lượng token mà vẫn duy trì được mạch tương tác liền mạch.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Lưu trữ toàn bộ bên ngoài và dùng tìm kiếm ngữ nghĩa (semantic search) cho từng lượt tương tác có thể làm mất đi tính liên tục của ngữ cảnh, đồng thời tốn kém thêm chi phí và độ trễ gọi API tìm kiếm liên tục.\n\nC: Dùng cửa sổ trượt (sliding window) đơn thuần làm mất vĩnh viễn các thông tin quan trọng được đề cập từ đầu phiên (như dị ứng của khách hoặc quy định nhiệt độ bơ) nếu chúng nằm ngoài cửa sổ trượt.\n\nD: Tóm tắt toàn bộ cuộc trò chuyện thành một đoạn văn bản chung chung sẽ làm thất thoát các thông tin chi tiết chính xác (như con số định lượng cụ thể, thông tin dị ứng nghiêm trọng) vốn rất cần thiết cho các lượt hỏi đáp tiếp theo."},{"index":55,"text":"Your pipeline reviews every PR using a single API call with a static prompt containing the diff and full text of each changed file — unchanged files are not included. Reviews are posted asynchronously and don't block PR creation. Developers report that reviews consistently miss bugs involving cross-file interactions — for example, a PR renames a function's parameters but the review doesn't flag callers in unchanged files that still use the old argument order. Evaluation shows cross-file bugs account for 35% of production incidents from reviewed PRs.\n\nWhat is the most effective change to your review design?","choices":[{"id":"71984","label":"A","text":"A\nAdd chain-of-thought instructions asking the model to list all external references in the diff, then reason step-by-step about how each change might affect callers in other files."},{"id":"71985","label":"B","text":"B\nRun parallel review passes per changed file with direct dependents included in each pass, then aggregate and deduplicate findings using a final summarization call."},{"id":"71986","label":"C","text":"C\nRedesign the review as a turn-limited agentic task where the model can read files and search the codebase via tools, following references to verify cross-file findings."},{"id":"71987","label":"D","text":"D\nUse static analysis to build a dependency graph of changed code, then expand the prompt to include all files within two dependency hops of any changed file."}],"correctAnswerIds":["71986"],"explanation":"Tại sao chọn C: Vấn đề cốt lõi được nêu trong bài toán là pipeline hiện tại chỉ truyền các tệp thay đổi (changed files) và bỏ qua các tệp không thay đổi, dẫn đến việc mô hình thiếu ngữ cảnh toàn cục để phát hiện các lỗi tương tác giữa các tệp (cross-file interactions) như các hàm gọi đến ở tệp khác. Thiết kế lại hệ thống thành dạng agentic task (tác vụ tự trị giới hạn lượt) cho phép mô hình chủ động sử dụng các công cụ tìm kiếm và đọc mã nguồn (search the codebase, read files) để tự truy vết các tệp liên quan. Đây là giải pháp tiêu chuẩn và hiệu quả nhất trong kiến trúc LLM hiện đại để giải quyết bài toán context rộng và phụ thuộc chéo mà không làm quá tải static prompt.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Chỉ dùng chain-of-thought (CoT) trong static prompt vẫn bị giới hạn bởi việc mô hình không thực sự nhìn thấy nội dung của các tệp không thay đổi nằm ngoài prompt, dẫn đến việc suy luận bước-nhưng-thiếu-dữ-liệu.\n\nB: Việc chạy các pass song song với các direct dependents chỉ giải quyết được một phần nhỏ (cấp độ phụ thuộc trực tiếp) nhưng vẫn cứng nhắc, tốn kém tài nguyên và không linh hoạt bằng việc để agent tự động tìm kiếm.\n\nD: Việc dùng static analysis để nhét tất cả các tệp trong 2 dependency hops vào prompt sẽ làm context window bị phình to quá mức (context bloat), làm giảm hiệu suất chú ý (attention) của mô hình và tăng chi phí token một cách không cần thiết."},{"index":56,"text":"Your CRM agent's delete_contact tool handles requests like \"delete the duplicate entry for Acme Corp.\" The database contains similarly named records (e.g., \"Acme Corp,\" \"Acme Corporation,\" \"ACME Corp Inc.\"), and analytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also complained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks.\n\nWhich approach most effectively reduces the error rate while maintaining workflow efficiency?","choices":[{"id":"72132","label":"A","text":"A\nDeploy automated duplicate detection that identifies and merges probable duplicates, removing the need for manual deletion requests."},{"id":"72133","label":"B","text":"B\nPresent matched records with differentiating fields and require single-click confirmation of the intended target before executing deletion."},{"id":"72134","label":"C","text":"C\nImplement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the deletion workflow."},{"id":"72135","label":"D","text":"D\nRequire users to supply the exact record ID from the CRM Interface rather than using natural language references to contact names."}],"correctAnswerIds":["72133"],"explanation":"Yêu cầu của bài toán:\n\nGiảm tỷ lệ xóa nhầm (8% lỗi do các bản ghi trùng tên/tương tự nhau như \"Acme Corp\", \"Acme Corporation\").\n\nGiảm độ ma sát trong quy trình (người dùng phàn nàn luồng xác nhận nhiều bước - multi-step confirmation - gây tốn thời gian).\n\nTại sao B đúng:\n\nGiải quyết lỗi xóa nhầm: Bằng cách hiển thị tất cả các bản ghi khớp kèm theo các trường phân biệt (ví dụ: Email, ID, Ngày tạo), người dùng dễ dàng nhận diện chính xác bản ghi cần xóa.\n\nTối ưu hóa quy trình (Efficiency): Thay thế luồng xác nhận qua lại nhiều bước phức tạp bằng việc chỉ yêu cầu người dùng xác nhận 1-click (single-click confirmation) trên bản ghi chính xác. Điều này vừa giúp tránh xóa nhầm, vừa giữ trải nghiệm nhanh gọn.\n\nLý do các phương án còn lại không phù hợp:\n\nA (Tự động gộp bản ghi trùng): Tự động gộp/xóa mà không qua xác nhận của người dùng rất nguy hiểm, dễ dẫn đến mất mát dữ liệu kinh doanh quan trọng nếu AI dự đoán sai.\n\nC (Soft-delete 30 ngày): Soft-delete là tính năng an toàn bổ trợ (safety guardrail), nhưng nó không giúp ngăn chặn việc xóa nhầm ban đầu hay giải quyết vấn đề phân biệt các bản ghi có tên tương tự nhau.\n\nD (Bắt nhập chính xác Record ID): Bắt người dùng phải tra cứu và nhập tay ID thủ công làm tăng độ khó và ma sát rất lớn đối với quy trình làm việc bằng ngôn ngữ tự nhiên."},{"index":57,"text":"You're building a security scanning workflow.\n\nWhen engineers need to locate all occurrences of a dangerous function like eval() across a large codebase, which tool should your agent use for content search?","choices":[{"id":"72172","label":"A","text":"A\nUse Bash to run ls -R | grep eval to recursively list files containing eval."},{"id":"72173","label":"B","text":"B\nRead the project's main entry file and follow import statements to trace where eval might be used."},{"id":"72174","label":"C","text":"C\nUse Grep to search for the pattern \"eval(\" across all files in the codebase."},{"id":"72175","label":"D","text":"D\nUse Glob with a pattern like /*eval* to find files, then Read each matching file."}],"correctAnswerIds":["72174"],"explanation":"Vai trò của công cụ Grep: Trong hệ sinh thái Anthropic / Claude Code tools, Grep là công cụ chuyên dụng dùng cho mục đích tìm kiếm nội dung (content search / pattern matching) bên trong các tệp tin của dự án.\n\nTại sao C đúng: Để tìm sự xuất hiện của chuỗi/hàm nguy hiểm như eval() trên toàn bộ codebase, việc sử dụng Grep với pattern \"eval(\" giúp tìm chính xác các dòng mã nguồn chứa chuỗi này một cách nhanh chóng và tối ưu nhất.\n\nLý do các phương án còn lại không đúng:\n\nA (ls -R | grep eval): ls -R chỉ liệt kê tên tệp/thư mục, không đọc được nội dung bên trong tệp. Nếu tệp tên auth.js chứa mã eval(), lệnh này sẽ hoàn toàn bỏ sót.\n\nB (Read entry file & trace imports): Phương pháp đọc thủ công và lần theo import vừa tốn rất nhiều token, tốn thời gian, vừa dễ bỏ sót các file không được import trực tiếp hoặc nằm trong các script độc lập.\n\nD (Glob with pattern /*eval*): Glob là công cụ dùng để tìm kiếm tệp theo tên/đường dẫn (file path search), không phải tìm kiếm nội dung bên trong tệp. Tên tệp chứa eval() như evaluation.js sẽ khớp, nhưng tệp main.js chứa hàm eval() bên trong sẽ bị bỏ sót hoàn toàn."},{"index":58,"text":"Your CI pipeline performs security-focused code reviews on approximately 50 PRs daily, currently costing $150/day using the synchronous API. Reviews are non-blocking—developers merge after tests pass and address findings in follow-up commits. You're evaluating the Message Batches API for its 50% cost reduction.\n\nWhat factor most determines whether batch processing is appropriate for this use case?","choices":[{"id":"72084","label":"A","text":"A\nWhether your result processing can handle reviews arriving in a different order than submitted."},{"id":"72085","label":"B","text":"B\nWhether reducing per-review latency from 30-60 seconds to near-instant matters for your workflow."},{"id":"72086","label":"C","text":"C\nWhether review feedback arriving up to 24 hours after PR creation remains actionable."},{"id":"72087","label":"D","text":"D\nWhether you can structure each review as a single request without multi-turn refinement."}],"correctAnswerIds":["72086"],"explanation":"Tại sao chọn C: Đặc điểm cốt lõi và giới hạn quan trọng nhất của Message Batches API (từ các nhà cung cấp như Anthropic) là các yêu cầu gửi vào dạng batch sẽ được xử lý bất đồng bộ và có thời gian hoàn thành trong vòng lượng thời gian dài hơn (thường lên đến 24 giờ). Do đó, yếu tố quyết định lớn nhất xem batch processing có phù hợp hay không chính là việc liệu phản hồi review đến chậm (có thể mất tới vài giờ hoặc tối đa 24 giờ sau khi PR được tạo) có còn tính khả thi, hữu ích (actionable) đối với quy trình làm việc hay không. Dù đề bài có đề cập review là non-blocking và developers sẽ xử lý các findings ở các commit sau, việc feedback bị trễ quá lâu (ví dụ: code đã được merge hoặc nhánh đã bị xóa từ lâu) sẽ làm mất đi ý nghĩa thực tế của việc review code.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Message Batches API thường hỗ trợ trả về kết quả đi kèm custom_id tương ứng với từng request ban đầu, do đó kết quả không bắt buộc phải khớp đúng thứ tự gửi đi, hệ thống xử lý hoàn toàn có thể ánh xạ ngược lại dựa trên ID nên đây không phải là yếu tố cốt lõi ngăn cản.\n\nB: Về độ trễ, Batch API bản chất là xử lý không đồng bộ (asynchronous) với độ trễ tính bằng giờ chứ không bao giờ đạt mức near-instant, câu hỏi đặt ra là tính chất công việc có chấp nhận được độ trễ đó hay không, chứ không phải ta mong đợi nó giảm từ 30-60 giây xuống near-instant.\n\nD: Hầu hết các yêu cầu phân tích PR hoặc Message Batches đều hỗ trợ các khối lượng dữ liệu lớn và cấu trúc đơn/đa lượt tùy theo cách thiết kế payload trong batch request, không bị giới hạn bắt buộc phải là single request tuyệt đối không có multi-turn nếu cấu trúc payload chuẩn bị đúng cách."},{"index":59,"text":"Your search products tool queries an external catalog API that returns paginated results (50 items per request). Production logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes 15-20 second delays.\n\nHow should you redesign the pagination handling?","choices":[{"id":"72096","label":"A","text":"A\nAdd a max pages parameter (default: 2) that controls how many pages are fetched internally."},{"id":"72097","label":"B","text":"B\nCreate separate search products and fetch more results tools for pagination."},{"id":"72098","label":"C","text":"C\nReturn the first page with total match count and cursor for additional pages."},{"id":"72099","label":"D","text":"D\nImplement server-side relevance ranking and return only the top 50 most relevant items."}],"correctAnswerIds":["72098"],"explanation":"Tại sao chọn C: Trong thiết kế công cụ cho AI Agent, việc tự động lặp (auto-fetching) tất cả các trang ngầm bên trong một lần gọi tool khi dữ liệu lớn là phản 패턴 (anti-pattern), gây chậm trễ nghiêm trọng (15-20 giây) và làm quá tải ngữ cảnh. Giải pháp kiến trúc chuẩn là trả về trang đầu tiên kèm theo tổng số lượng khớp và con trỏ (cursor) hoặc thông tin phân trang, sau đó để mô hình (hoặc người dùng) quyết định xem có cần gọi tiếp các trang tiếp theo hay không thông qua các tham số điều hướng. Điều này giúp tối ưu hóa độ trễ phản hồi ban đầu.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Thêm tham số max_pages ngầm định vẫn ép tool phải tự fetch nhiều trang bên trong trước khi trả về kết quả, không giải quyết triệt để vấn đề độ trễ cao nếu số lượng trang cần lấy lớn.\n\nB: Việc tạo thêm công cụ rời rạc độc lập (fetch more results) không cần thiết bằng việc thiết kế một tham số cursor linh hoạt ngay trong chính công cụ tìm kiếm hoặc trả về cơ chế phân trang tiêu chuẩn.\n\nD: Việc cắt bỏ dữ liệu chỉ lấy 50 items dựa trên xếp hạng phía server có thể làm mất đi các mục (items) quan trọng ở các trang sau mà người dùng thực sự muốn tìm kiếm hoặc duyệt qua."},{"index":60,"text":"After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the synthesis subagent to synthesize the findings.\n\nWhat is the correct approach for providing the synthesis subagent with the information it needs?","choices":[{"id":"72120","label":"A","text":"A\nProvide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks"},{"id":"72121","label":"B","text":"B\nSpawn the subagent with only a brief task description, relying on automatic context inheritance from the coordinator"},{"id":"72122","label":"C","text":"C\n\nInclude the complete findings from both subagents directly in the synthesis subagent's prompt"},{"id":"72123","label":"D","text":"D\n\nPass reference identifiers and configure the subagent with read access to a shared memory store where other subagents deposited their results"}],"correctAnswerIds":["72122"],"explanation":"Khi coordinator đã nhận kết quả từ web search subagent và document analysis subagent, nó cần truyền các kết quả đó một cách tường minh cho synthesis subagent.\n\nVí dụ:\n\nSynthesis task:- Web search findings: [complete findings...]- Document analysis findings: [complete findings...]\nSynthesize these findings into a unified answer.\n\nĐiểm quan trọng là subagent không tự động kế thừa context của coordinator. Nếu synthesis subagent cần biết kết quả của các subagent trước, coordinator phải đưa dữ liệu đó vào prompt/context của nó.\n\nVì sao các đáp án khác sai?\n\nA ❌ — Không nên thiết kế synthesis subagent để gọi ngược các subagent khác qua callback. Coordinator đã có nhiệm vụ orchestration và tổng hợp context.\n\nB ❌ — Subagent không tự động inherit toàn bộ context của coordinator. Cần truyền thông tin cần thiết một cách explicit.\n\nC ✅ — Truyền trực tiếp findings vào prompt giúp synthesis subagent có đầy đủ thông tin cần thiết và không phụ thuộc vào cơ chế context ngầm.\n\nD ❌ — Shared memory có thể là một kiến trúc hợp lệ trong một số hệ thống, nhưng với tình huống này nó tạo thêm cơ chế lưu trữ/truy cập không cần thiết. Cách trực tiếp và đáng tin cậy là truyền findings vào prompt."}]},{"file":"certlab-questions-with-explanations (2).json","title":"Bộ câu hỏi 3","questions":[{"index":1,"text":"Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each recommendation, and ask clarifying questions to better understand user preferences. You want this behavior to persist reliably across all user interactions.\n\nWhere should you define these behavioral guidelines?","choices":[{"id":"72244","label":"A","text":"A\nIn the first assistant message, instructing Claude to follow these guidelines going forward"},{"id":"72245","label":"B","text":"B\nIn environmental variables that your application passes to the API client"},{"id":"72246","label":"C","text":"C\nIn the system prompt"},{"id":"72247","label":"D","text":"D\nPrepended to each user message before sending to the API"}],"correctAnswerIds":["72246"],"explanation":"Tại sao chọn C:\n\nSystem prompt là nơi lý tưởng nhất để thiết lập vai trò (persona), giọng điệu (tone), các quy tắc hành vi và định dạng phản hồi cố định cho trợ lý AI. Các chỉ dẫn trong system prompt có hiệu lực nhất quán và bền vững xuyên suốt toàn bộ cuộc trò chuyện mà không bị trôi đi như các tin nhắn hội thoại thông thường.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: Đặt trong tin nhắn trợ lý đầu tiên (assistant message) dễ bị xáo trộn luồng hội thoại và có thể bị mô hình \"quên\" dần khi cuộc trò chuyện kéo dài.\n\nB sai: Biến môi trường (environment variables) chỉ dùng để cấu hình mã nguồn ứng dụng (như API key, endpoint), mô hình Claude không thể đọc trực tiếp các biến này.\n\nD sai: Ghép nối hướng dẫn vào đầu mỗi tin nhắn người dùng (user message) làm tiêu tốn dung lượng token không cần thiết và dễ gây nhiễu ngữ cảnh cho câu hỏi thực sự của người dùng."},{"index":2,"text":"After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided.\n\nWhat is the most likely cause of this issue?","choices":[{"id":"71756","label":"A","text":"A\nThe subagents need to share a single API connection to enable automatic context sharing between invocations."},{"id":"71757","label":"B","text":"B\nThe coordinator did not include the outputs from the previous agents in the synthesis agent's prompt."},{"id":"71758","label":"C","text":"C\nThe synthesis agent's context window is not large enough to hold the combined outputs from both previous agents."},{"id":"71759","label":"D","text":"D\nThe synthesis agent needs tools that can fetch results directly from the other agents' conversation histories."}],"correctAnswerIds":["71757"],"explanation":"Đáp án đúng cho câu hỏi này là [B].\n\nGiải thích chi tiết:\n\nLý do chọn B: Trong kiến trúc hệ thống đa agent thông thường, các subagent độc lập và không tự động truyền ngữ cảnh cho nhau qua các lượt gọi khác nhau. Coordinator (Agent điều phối) chịu trách nhiệm nhận output từ các agent trước (web search agent và document analysis agent) và phải chủ động tiêm (inject) hoặc đính kèm các đầu ra đó vào trong prompt khi gọi synthesis agent. Nếu coordinator quên hoặc không thực hiện việc này, synthesis agent sẽ không nhận được dữ liệu và báo lỗi thiếu thông tin nghiên cứu.\n\nCác đáp án khác không chính xác:\n\nA: Subagent không cần chia sẻ chung một API connection để tự động chia sẻ ngữ cảnh giữa các lần gọi theo cách này.\n\nC: Việc vượt quá context window sẽ thường gây ra lỗi token hoặc cắt cụt chứ không dẫn đến việc agent phản hồi cụ thể là \"không có thông tin nào được cung cấp\" trong khi các đầu ra vốn dĩ có kích thước nhỏ gọn.\n\nD: Các subagent không cần thiết phải có công cụ gọi trực tiếp lịch sử của nhau, vì việc truyền dữ liệu qua coordinator là mô hình điều phối chuẩn."},{"index":3,"text":"Your content curation agent discovers articles, analyzes each for relevance, then adds selected articles to themed collections. With separate discover_articles(topic), analyze_article(id), and add_to_collection(article_id, collection_id) tools, you observe 18+ sequential tool calls per request, causing latency issues. The agent must make editorial judgments about which articles fit a collection’s theme – this requires seeing all candidates with their analysis scores simultaneously to select a cohesive set. What tool composition best addresses efficiency while preserving editorial judgment?","choices":[{"id":"77767","label":"A","text":"A\n\nKeep all tools separate but implement response caching for analyze_article calls."},{"id":"77768","label":"B","text":"B\n\nCreate a curate_collection(topic, collection_id) tool that handles discovery, analysis, and selection internally using configurable quality thresholds."},{"id":"77769","label":"C","text":"C\n\nCreate a discover_and_analyze(topic) composite tool that returns all candidates with their analysis scores, keeping add_to_collection separate for selective calls."},{"id":"77770","label":"D","text":"D\n\nAdd a preview_curation(topic, collection_id) tool that shows what would be added based on predefined rules, with an approve_curation() tool to confirm."}],"correctAnswerIds":["77769"],"explanation":"Vì sao C là thiết kế tối ưu nhất?\n\nGiảm đáng kể số lượng Tool Call & Độ trễ (Latency):\n\nHiện tại, nếu tìm thấy 8 bài viết, Agent phải thực hiện 1 cuộc gọi discover_articles, 8 cuộc gọi analyze_article nối tiếp nhau, và 8 cuộc gọi add_to_collection $\\rightarrow$ 17+ cuộc gọi nối tiếp (sequential tool calls).\n\nBằng cách gộp hai bước đầu thành discover_and_analyze(topic), Agent chỉ cần 1 cuộc gọi duy nhất để lấy toàn bộ danh sách ứng viên kèm điểm số phân tích.\n\nBảo tồn năng lực đánh giá biên tập của Agent (Editorial Judgment):\n\nĐể chọn ra một tập hợp bài viết hài hòa và phù hợp nhất cho chủ đề (cohesive set), Agent bắt buộc phải nhìn thấy bức tranh tổng thể (toàn bộ danh sách ứng viên và điểm số tương ứng cùng một lúc). Sau khi chọn lọc, Agent có thể gọi add_to_collection một lần (hoặc song song) cho các bài viết đã được duyệt.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Giữ nguyên công cụ và thêm Response Caching cho analyze_article ❌\n\nCaching chỉ giúp ích khi Agent phân tích lại các bài viết đã từng xử lý trước đó. Đối với các bài viết mới được phát hiện, Agent vẫn phải thực hiện 18+ lượt gọi tool nối tiếp nhau, hoàn toàn không giải quyết được vấn đề độ trễ ban đầu.\n\nB. Tạo công cụ curate_collection tự động hóa toàn bộ bằng ngưỡng cố định (Quality Thresholds) ❌\n\nTước bỏ năng lực đánh giá của Agent: Việc đẩy logic chọn lọc vào backend dựa trên các ngưỡng điểm số cố định sẽ biến Agent thành một script tự động cứng nhắc. Nó loại bỏ hoàn toàn khả năng đưa ra \"quyết định biên tập\" (editorial judgment) dựa trên sự kết hợp hài hòa giữa các bài viết.\n\nD. Thêm công cụ preview_curation và approve_curation dựa trên quy tắc có sẵn ❌\n\nGiống như B, phương án này phụ thuộc vào các quy tắc định sẵn (predefined rules) ở backend thay vì năng lực suy luận của LLM, đồng thời vẫn phải tốn thêm các bước xác nhận phụ không cần thiết."},{"index":4,"text":"An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing test coverage. The engineer hasn't spent much time on the codebase, so they ask for help identifying which modules to prioritize. How should the agent decompose this open-ended task?","choices":[{"id":"72984","label":"A","text":"A\n\nUse Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for high-impact areas, and revise as dependencies are discovered."},{"id":"72985","label":"B","text":"B\nCreate a fixed testing schedule upfront based on directory structure, allocating equal effort to each top- level directory regardless of code complexity or importance."},{"id":"72986","label":"C","text":"C\nSystematically read all 200 files to create a complete function inventory before writing any tests, ensuring the testing plan accounts for everything from the beginning."},{"id":"72987","label":"D","text":"D\nStart writing tests for the first module alphabetically, using test failures and imports to discover related files organically."}],"correctAnswerIds":["72984"],"explanation":"Phân tích bối cảnh bài toán:\n\nCơ sở mã nguồn (codebase) legacy khá lớn với 200 tệp và rất ít test coverage.\n\nLập trình viên không nắm rõ codebase và cần Agent gợi ý cách phân chia (decompose) nhiệm vụ mở này để xác định ưu tiên.\n\nTại sao phương án A là tối ưu nhất?\n\nĐo đạc và lập bản đồ kiến trúc hiệu quả: Sử dụng các công cụ tìm kiếm nhanh như Glob (để nắm cấu trúc thư mục) và Grep (để quét các phụ thuộc, imports) giúp Agent nhanh chóng nhận diện các module quan trọng có độ liên kết cao (heavily-coupled modules) mà không cần đọc hết 200 tệp.\n\nƯu tiên khu vực có tác động lớn (High-impact areas): Việc ưu tiên các module trung tâm/được gọi nhiều giúp tăng độ tin cậy của codebase nhanh nhất.\n\nLập kế hoạch linh hoạt (Iterative refinement): Lập kế hoạch ban đầu và điều chỉnh linh hoạt khi phát hiện ra các phụ thuộc mới là quy trình chuẩn khi làm việc với nhiệm vụ mở (open-ended tasks) trong các hệ thống legacy.\n\nTại sao các phương án khác không phù hợp?\n\nPhương án B (Tạo lịch cố định và chia đều công sức): Chia đều nguồn lực cho mọi thư mục bất kể độ phức tạp hay mức độ quan trọng là chiến lược rất lãng phí và không hiệu quả.\n\nPhương án C (Đọc toàn bộ 200 tệp trước khi viết test): Đọc tuần tự 200 tệp sẽ gây tràn bộ nhớ ngữ cảnh (context window) và làm lãng phí rất nhiều token không cần thiết.\n\nPhương án D (Làm theo thứ tự bảng chữ cái): Viết test theo thứ tự A-Z hoàn toàn mang tính ngẫu nhiên, bỏ qua kiến trúc thực tế và mức độ ưu tiên của hệ thống."},{"index":5,"text":"Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response includes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority of the conversation's context. The customer mentions two more orders they want to discuss.\n\nWhat's the most effective approach before making additional lookups?","choices":[{"id":"71792","label":"A","text":"A\nProceed with additional lookups without modifying the existing tool output context"},{"id":"71793","label":"B","text":"B\nMove all tool responses to a vector database with semantic indexing, retrieving relevant portions as the conversation continues"},{"id":"71794","label":"C","text":"C\nExtract only return-relevant fields (items, purchase date, return window, status) from each existing order response, removing verbose details"},{"id":"71795","label":"D","text":"D\nHave the model generate a natural language summary of each order's key details, replacing structured responses with prose descriptions"}],"correctAnswerIds":["71794"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Khi ngữ cảnh của cuộc trò chuyện bị quá tải do các kết quả gọi công cụ dài dòng (mỗi order gồm 40+ trường thông tin), cách tối ưu nhất để tiết kiệm không gian ngữ cảnh (context window) mà vẫn giữ lại vẹn toàn các chi tiết định lượng chính xác phục vụ cho việc xử lý đổi trả là trích xuất và giữ lại duy nhất các trường liên quan đến việc đổi trả (như items, purchase date, return window, status) và loại bỏ đi các thông tin rườm rà (verbose details) không cần thiết trước khi thực hiện các lượt tra cứu tiếp theo.\n\nCác đáp án khác không chính xác:\n\nA: Tiếp tục gọi thêm các lookups mới trong khi context đã phình to sẽ nhanh chóng làm tràn giới hạn ngữ cảnh (context window explosion) hoặc làm giảm độ chính xác của mô hình.\n\nB: Đưa toàn bộ phản hồi vào vector database với semantic indexing gây thêm độ phức tạp hạ tầng không cần thiết cho một đoạn hội thoại tương tác trực tiếp.\n\nD: Thay thế cấu trúc dữ liệu chính xác bằng văn bản tự sự (prose descriptions) dễ dẫn đến hiện tượng mơ hồ, mất mát dữ liệu số liệu cụ thể hoặc sai lệch thông tin khi model cần đối chiếu điều kiện đổi trả."},{"index":6,"text":"Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls delete_file when users ask to \"remove old backups,\" policy requires archiving backup files. Both tools currently have minimal descriptions: \"Archives a file\" and \"Deletes a file.\"\n\nWhich change most directly improves tool selection?","choices":[{"id":"72128","label":"A","text":"A\nExpand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to delete_file."},{"id":"72129","label":"B","text":"B\nAdd a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes."},{"id":"72130","label":"C","text":"C\nImplement server-side validation that rejects delete_file calls for files tagged as backups, returning an error message suggesting archive_file."},{"id":"72131","label":"D","text":"D\nAdd few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\" should use archive_file."}],"correctAnswerIds":["72128"],"explanation":"Bản chất vấn đề: Đề bài mô tả rằng cả hai tool (archive_file và delete_file) hiện chỉ có mô tả rất tối giản (minimal descriptions). Khi mô hình (LLM) lựa chọn công cụ để gọi trong kiến trúc MCP (Model Context Protocol), nó dựa chủ yếu vào mô tả chi tiết của tool (Tool Description).\n\nTại sao A đúng:\n\nCải thiện và mở rộng mô tả công cụ (Tool Description Engineering) là cách trực tiếp nhất và chuẩn nhất theo nguyên tắc thiết kế MCP để hướng dẫn LLM phân biệt chính xác khi nào nên/không nên dùng một công cụ.\n\nBổ sung hướng dẫn cụ thể như \"Do not use for backup files\" trực tiếp trong delete_file giúp mô hình hiểu rõ định hướng chọn archive_file khi xử lý các tệp sao lưu.\n\nLý do các phương án còn lại không phải lựa chọn trực tiếp nhất:\n\nB (Add confirmation step): Đây là biện pháp an toàn (Safety Guardrail) ngăn thao tác nguy hiểm chứ không giúp LLM học cách chọn đúng tool ngay từ đầu.\n\nC (Server-side validation): Xử lý ở server là giải pháp phản ứng (reactive) khi lỗi đã xảy ra, khiến agent phải tốn thêm vòng lặp (retry) để gọi lại tool khác.\n\nD (Add few-shot examples): Tốn token trong System Prompt và không linh hoạt bằng việc định nghĩa trực tiếp vai trò của từng công cụ ngay trong schema của MCP server."},{"index":7,"text":"Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful).\n\nWhen the web search agent returns \"industry analysts estimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study estimates $35B (±$7B, 95% CI)\", the coordinator either picks one arbitrarily or produces vague statements like \"the market may be $35B-$50B depending on factors.\"\n\nWhat systematic approach best addresses this?","choices":[{"id":"72804","label":"A","text":"A\nImplement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence."},{"id":"72805","label":"B","text":"B\n\nInstruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context."},{"id":"72806","label":"C","text":"C\nConfigure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator."},{"id":"72807","label":"D","text":"D\nAdd a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources."}],"correctAnswerIds":["72805"],"explanation":"Phân tích vấn đề:\n\nBài toán đưa ra 2 xung đột chính trong báo cáo tổng hợp (synthesis report):\n\nTự động gộp các kết quả mâu thuẫn thành một khẳng định chắc chắn $\\rightarrow$ làm mất đi các sắc thái / ngữ cảnh quan trọng (losing nuance).\n\nBáo cáo quá dè dặt (over-hedging) hoặc đưa ra các tuyên bố chung chung mơ hồ như \"35B-50B tùy thuộc vào nhiều yếu tố\" $\\rightarrow$ không đem lại giá trị hữu ích.\n\nVí dụ đưa ra hai nguồn dữ liệu có phương pháp luận và độ chính xác khác nhau (một bên là ước tính của các nhà phân tích ngành, một bên là nghiên cứu đã qua kiểm duyệt peer-reviewed với khoảng tin cậy 95%).\n\nTại sao phương án B lại đúng?\n\nBảo tồn sắc thái & Bối cảnh (Preserving Context): Thay vì gộp ép buộc thành một con số duy nhất hoặc đưa ra một khoảng giá trị mơ hồ, agent tổng hợp (synthesis agent) nên phân loại rõ thông tin thành các phần: nội dung đã rõ ràng/đồng thuận và nội dung đang tranh cãi/chưa thống nhất.\n\nTrích dẫn minh bạch phương pháp luận: Phương án này giữ nguyên đặc trưng của từng nguồn (ví dụ: giải thích phương pháp luận khác nhau dẫn đến con số $50B và $35B), giúp người đọc có cái nhìn chính xác và đưa ra quyết định phù hợp nhất.\n\nTại sao các phương án khác không phù hợp?\n\nPhương án A: Việc quy đổi độ tin cậy thành điểm xác suất (0.0 - 1.0) rồi tính trung bình trọng số là phương pháp khiên cưỡng, không thực tế đối với dữ liệu văn bản/định tính, đồng thời dễ làm sai lệch dữ liệu gốc (ví dụ: không thể \"tính trung bình\" giữa 2 phương pháp luận nghiên cứu khác nhau).\n\nPhương án C: Lọc bỏ các thông tin chưa chắc chắn ngay từ agent con sẽ khiến hệ thống bỏ sót các phát hiện quan trọng hoặc thông tin mang tính cảnh báo (surfacing edge cases).\n\nPhương án D: Việc bắt buộc phải có ít nhất 2 nguồn độc lập xác nhận mới cho phép đi tiếp sẽ loại bỏ hoàn toàn các thông tin độc quyền, phát hiện mới hoặc thông tin duy nhất từ các tài liệu chuyên sâu."},{"index":8,"text":"Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types.\n\nWhat's the most effective improvement?","choices":[{"id":"71860","label":"A","text":"A\nImplement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted."},{"id":"71861","label":"B","text":"B\nCreate an analyze_error MCP tool the agent calls after any failure to determine the error category and recommended action."},{"id":"71862","label":"C","text":"C\nEnhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure."},{"id":"71863","label":"D","text":"D\nAdd few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each."}],"correctAnswerIds":["71862"],"explanation":"Tại sao đáp án C đúng: Vấn đề gốc rễ được nêu trong đề bài là MCP tool trả về một phản hồi lỗi đồng nhất, không phân biệt (\"Operation failed\"), khiến agent không thể phân loại lỗi để xử lý (retry, escalate, hay hỏi lại người dùng). Bổ sung structured metadata (như errorCategory, isRetryable và mô tả chi tiết) trực tiếp vào response của tool giúp agent nhận được thông tin rõ ràng ngay lập tức để tự đưa ra quyết định hành động chính xác cho từng loại lỗi mà không tốn thêm vòng lặp gọi tool phụ.\n\nTại sao các đáp án khác sai:\n\nĐáp án A sai: Việc tự động retry mọi lỗi ở phía MCP server ẩn đi bản chất thực sự của lỗi (ví dụ: lỗi validation như order ID không tồn tại hoặc lỗi permission) khỏi agent. Điều này khiến hệ thống vẫn tiếp tục retry vô ích hoặc không báo đúng bản chất vấn đề cho tầng logic phía trên.\n\nĐáp án B sai: Việc tạo ra một công cụ analyze_error bắt buộc agent phải tốn thêm một bước gọi tool phụ (extra tool call latency và chi phí token) sau mỗi lần thất bại, trong khi thông tin lỗi có thể được trả về trực tiếp ngay trong response của tool ban đầu một cách hiệu quả hơn.\n\nĐáp án D sai: Việc dựa vào few-shot examples trong system prompt để đoán các mẫu thông báo lỗi không cấu trúc rất dễ bị sai lệch khi thông điệp lỗi từ backend thay đổi hoặc không rõ ràng, trong khi dữ liệu cấu trúc (structured metadata) mang tính chính xác và tin
