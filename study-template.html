 các thuật toán phức tạp có nhiều trường hợp biên (edge cases như chu trình, nút cô lập, trọng số), việc dựa vào đánh giá thủ công hoặc mô tả bằng ngôn ngữ tự nhiên rất dễ bỏ sót lỗi.\n\nViệc viết trước một Test Suite tạo ra một tiêu chí thành công khách quan và tự động (objective, deterministic signal).\n\nTại sao B đúng (Iterative Refinement Loop):\n\nKhi Claude viết code và bạn chạy test, các thông báo lỗi (test failures/stack traces) chính là đầu vào chính xác nhất để gửi lại cho Claude điều chỉnh.\n\nChu trình này (Feedback Loop: Code → Test → Share Failure → Refine) giúp tối ưu hóa quá trình cải tiến mã nguồn một cách nhanh chóng, chính xác và có thể đo lường được.\n\nLý do các phương án còn lại không tối ưu:\n\nA (Đánh giá thủ công): Đánh giá thủ công (manual review) bằng mắt đối với thuật toán đồ thị phức tạp cực kỳ tốn thời gian, dễ sót bug và phản hồi không chính xác bằng kết quả chạy test thực tế.\n\nC (Chỉ dùng Extended Thinking & Planning): Tạo plan tốt đến đâu thì trong thực tế triển khai vẫn sẽ phát sinh bug/edge cases. Lập kế hoạch không thể thay thế cho quá trình kiểm thử và tinh chỉnh thực tế.\n\nD (Rewrite từ Reference Code): Chỉ áp dụng khi có sẵn code mẫu tương đồng. Ngoài ra, việc so sánh thủ công kết quả với code mẫu không đảm bảo bao phủ hết các yêu cầu hiệu năng và edge cases đặc thụ của bài toán."},{"index":3,"text":"Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output.\n\nWhat is the most effective way to run these subagents concurrently?","choices":[{"id":"72024","label":"A","text":"A\nCreate an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator."},{"id":"72025","label":"B","text":"B\nAdd detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution at the same time."},{"id":"72026","label":"C","text":"C\nStructure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message."},{"id":"72027","label":"D","text":"D\nSwitch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}],"correctAnswerIds":["72026"],"explanation":"Tại sao C đúng: Trong kiến trúc agentic và giao thức của các LLM hỗ trợ gọi công cụ (như Claude API), khi các tác vụ độc lập nhau (ví dụ: tìm kiếm web và phân tích tài liệu), mô hình có khả năng gọi đồng thời nhiều công cụ trong cùng một thông điệp phản hồi duy nhất (parallel tool calling) nếu được định hướng hoặc cấu trúc đúng cách. Khi coordinator phát ra cả hai lệnh gọi công cụ Task cùng một lúc trong một lượt, hệ thống thực thi bên dưới (orchestrator/runtime) sẽ xử lý chúng song song thay vì tuần tự từng cái một, giúp giảm thiểu tối đa độ trễ.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc xây dựng một tầng điều phối bất đồng bộ (async orchestration layer) hoàn toàn bên ngoài agent là giải pháp quá phức tạp (overkill) và không cần thiết trong khi kiến trúc API gốc của LLM đã hỗ trợ sẵn tính năng gọi công cụ song song trong một lượt.\n\nB: Chỉ thêm hướng dẫn bằng văn bản thông thường vào system prompt thường không đủ tin cậy để ép mô hình phát ra các lệnh gọi đồng thời nếu cấu trúc prompt không định hướng cụ thể cách tạo ra các tool call đồng thời.\n\nD: Việc hạ cấp mô hình xuống dòng Haiku chỉ giúp tăng tốc độ từng tác vụ đơn lẻ nhưng không giải quyết được nguyên nhân gốc rễ là tính thực thi tuần tự (sequential execution) của hệ thống điều phối."},{"index":4,"text":"Your agent has access to 50+ specialized API connectors for different external services. As the connector library grew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds matching connectors, but in testing agents frequently skip searching and call connectors directly (often incorrectly), or search select wrong connectors from the filtered results.\n\nHow should you design the tool composition pattern to address both issues?","choices":[{"id":"72052","label":"A","text":"A\nDesign a find_and_execute(description, params) composite tool that searches and immediately executes the best matching connector."},{"id":"72053","label":"B","text":"B\nDesign connectors with built-in compatibility validation that return descriptive errors for mismatched requests."},{"id":"72054","label":"C","text":"C\nEnhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add few-shot examples showing the correct search-then-use workflow."},{"id":"72055","label":"D","text":"D\nDesign search_connectors to dynamically add matched connectors to the agent's available tools. Connectors start unavailable and persist once discovered."}],"correctAnswerIds":["72055"],"explanation":"Tại sao chọn D: Vấn đề cốt lõi ở đây là: (1) Agent bỏ qua bước search và gọi thẳng connector (vì chúng luôn sẵn có trong danh sách công cụ), và (2) Agent chọn sai connector từ kết quả tìm kiếm. Bằng cách thiết kế công cụ search_connectors để thêm động (dynamically add) các connector vào danh sách công cụ sẵn có của agent sau khi tìm thấy (và giữ nguyên từ đó), chúng ta vô hiệu hóa việc agent tự ý gọi các connector chưa được khám phá (vì ban đầu chúng chưa khả dụng/chưa xuất hiện trong schema), đồng thời ép agent phải thông qua cơ chế tìm kiếm, loại bỏ hoàn toàn các lựa chọn sai lệch do quá tải context ban đầu.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Dùng find_and_execute gộp chung tìm và chạy làm mất đi tính kiểm soát bước trung gian của agent, và nếu agent chọn sai công cụ tìm kiếm thì hành động thực thi cũng sẽ sai ngay lập tức mà không có cơ hội kiểm tra lại.\n\nB: Validation bên trong chỉ giúp báo lỗi sau khi gọi sai chứ không ngăn chặn được việc agent bỏ qua bước search hoặc chọn sai từ đầu.\n\nC: Việc cải thiện mô tả và thêm few-shot examples không giải quyết triệt để vấn đề quá tải khi số lượng connector quá lớn (hơn 50+), hiện tượng context window bị loãng vẫn khiến agent chọn nhầm hoặc bỏ qua bước tìm kiếm."},{"index":5,"text":"After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code, update_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that the agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools — calling issue_credit when process_refund was correct, and calling check_delivery_status when looking order_allready_returns_the_needed_data.\n\nWhich approach structurally eliminates the semantic overlap identified in the error source?","choices":[{"id":"72160","label":"A","text":"A\nConsolidate semantically overlapping tools – merge issue_credit and process_refund into a single handle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an optional include_tracking flag."},{"id":"72161","label":"B","text":"B\nAdd few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such as showing when issue_credit applies versus when process_refund is appropriate."},{"id":"72162","label":"C","text":"C\nSplit the tools across two sub-agents — a 'financial resolution' agent with issue_credit, process_refund, return_order, and apply_promo_code and a 'delivery operations' agent with the remaining delivery tools — with a coordinating routing between them."},{"id":"72163","label":"D","text":"D\nEnable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded, so the agent dynamically discovers specialized tools only when needed."}],"correctAnswerIds":["72160"],"explanation":"Yêu cầu của đề bài: Tìm phương án loại bỏ hoàn toàn từ mặt cấu trúc (structurally eliminates) sự trùng lặp ngữ nghĩa (semantic overlap) giữa các công cụ.\n\nTại sao A đúng:\n\nBằng cách hợp nhất (consolidate) các công cụ có chức năng chồng chéo thành một công cụ duy nhất kết hợp tham số phân loại (ví dụ: gộp issue_credit và process_refund; gộp check_delivery_status vào lookup_order với cờ include_tracking), mô hình sẽ không còn bị phân vân giữa hai công cụ tương tự nhau nữa.\n\nLý do các phương án còn lại không đúng:\n\nB (Thêm few-shot examples): Chỉ là giải pháp hỗ trợ prompt, không giải quyết vấn đề từ mặt cấu trúc thiết kế tool.\n\nC (Chia làm 2 sub-agents): Việc chia sub-agent vẫn giữ nguyên các tool chồng chéo bên trong sub-agent đó, nên sự trùng lặp ngữ nghĩa giữa issue_credit và process_refund vẫn tồn tại.\n\nD (Dùng tool search / defer loading): Dùng để quản lý số lượng tool quá lớn để tiết kiệm token, không giải quyết được xung đột khi hai tool có ý nghĩa quá giống nhau."},{"index":6,"text":"The system needs to extract candidate information (name, contact details, skills, work experience, education) from uploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required fields or incorrect data types will cause downstream validation failures.\n\nWhat is the most reliable approach to ensure Claude's output consistently matches the schema?","choices":[{"id":"71964","label":"A","text":"A\nInclude detailed JSON formatting instructions and a template example in the system prompt, asking Claude to output only valid JSON."},{"id":"71965","label":"B","text":"B\nParse Claude's text response with regex patterns to extract JSON objects, using retry logic for malformed responses."},{"id":"71966","label":"C","text":"C\nDefine a tool with an input schema matching your required JSON structure and extract the data from Claude's tool_use response."},{"id":"71967","label":"D","text":"D\nMake two separate API calls—first extracting information as text, then asking Claude to format that text as JSON."}],"correctAnswerIds":["71966"],"explanation":"Lý do chọn C: Trong hệ sinh thái Anthropic/Claude, cách đáng tin cậy nhất để bắt buộc mô hình trả về dữ liệu tuân thủ chặt chẽ một JSON Schema định sẵn là sử dụng tính năng Tool Use / Tool Definition với input_schema. Khi đó, cấu trúc dữ liệu sẽ được ràng buộc trực tiếp ở cấp độ API và mô hình sẽ gửi lại dữ liệu thông qua đối số của tool_use, giúp loại bỏ hoàn toàn tình trạng sai lệch kiểu dữ liệu hoặc thiếu trường so với việc chỉ dùng văn bản thông thường (prompt) rồi tự parse bằng regex.\n\nCác phương án khác chưa tối ưu:\n\nA: Dùng prompt hướng dẫn (system prompt + ví dụ mẫu) không đảm bảo độ tuân thủ 100% đối với các schema phức tạp.\n\nB: Dùng regex parsing kết hợp retry logic vừa rườm rà, tốn kém token/chi phí API vừa không giải quyết triệt để vấn đề gốc rễ.\n\nD: Chia thành hai lần gọi API làm tăng độ trễ và chi phí mà vẫn không đảm bảo tính chính xác của schema ở lần gọi thứ hai bằng việc sử dụng cơ chế Tool Use chuẩn."},{"index":7,"text":"Performance analysis reveals your context is composed of accumulated RAG results from all previous queries, which is crowding out conversation history and causing coherence degradation after 15+ turns.\n\nWhich approach best addresses this issue?","choices":[{"id":"72188","label":"A","text":"A\nCompress all RAG results into a consolidated summary document that updates incrementally after each retrieval"},{"id":"72189","label":"B","text":"B\nImplement a sliding window for RAG results from the last 2-3 queries while preserving conversation history"},{"id":"72190","label":"C","text":"C\nImplement semantic deduplication to identify and remove redundant information across the accumulated RAG results and conversation turns"},{"id":"72191","label":"D","text":"D\nShift context budget to favor RAG results while reducing conversation history allocation"}],"correctAnswerIds":["72189"],"explanation":"Bản chất vấn đề:\n\nViệc tích lũy (accumulate) kết quả RAG qua nhiều lượt hỏi-đáp mà không dọn dẹp khiến các thông tin tra cứu cũ chiếm hết không gian bộ nhớ (context window), dẫn đến hiện tượng chèn ép lịch sử hội thoại (crowding out conversation history) và làm mất tính mạch lạc (coherence degradation) sau 15+ lượt trò chuyện.\n\nTại sao B đúng (Ephemeral RAG / Context Budget Management):\n\nCác thông tin RAG từ các lượt hỏi cũ thường không còn quá quan trọng cho lượt hỏi hiện tại.\n\nÁp dụng Cửa sổ trượt (Sliding Window) chỉ giữ lại kết quả RAG của 2-3 lượt gần nhất, đồng thời bảo tồn lịch sử hội thoại chính là giải pháp tối ưu nhất để cân bằng giữa thông tin tra cứu ngắn hạn và tính liên tục của cuộc trò chuyện.\n\nLý do các phương án còn lại không đúng:\n\nA (Compress into a consolidated summary): Việc liên tục cập nhật/nén tài liệu RAG sau mỗi lượt tra cứu tốn rất nhiều chi phí tính toán (latency & API cost), đồng thời việc tóm tắt nhiều lần rất dễ làm mất các chi tiết tra cứu chính xác.\n\nC (Semantic deduplication): Lọc trùng thông tin không giải quyết được vấn đề cơ bản là khối lượng dữ liệu RAG mới tích lũy quá lớn theo thời gian làm chèn ép lịch sử hội thoại.\n\nD (Shift budget to favor RAG over history): Việc giảm bớt lịch sử hội thoại sẽ càng làm tệ hơn tình trạng mất mạch lạc (coherence degradation) của câu chuyện."},{"index":8,"text":"Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts, 503s) and non-transient errors (403 permission denied, 422 validation failure). Currently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and wasting turns on failures that will never succeed.\n\nHow should you partition error-handling responsibility between the tool implementation and the agent?","choices":[{"id":"72056","label":"A","text":"A\nImplement a universal error handler that catches all exceptions and returns a generic \"tool unavailable- try again later\" message, shielding the agent from error complexity."},{"id":"72057","label":"B","text":"B\nSurface all errors to the agent immediately with detailed context, and let the agent decide which errors to retry and how many times-keeping the tool implementation stateless and simple."},{"id":"72058","label":"C","text":"C\nHandle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface non-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can take corrective action."},{"id":"72059","label":"D","text":"D\nHandle all errors inside the tool: Implement retries with exponential backoff for every error type, and only surface a failure to the agent after a fixed number of retry attempts have been exhausted."}],"correctAnswerIds":["72058"],"explanation":"Tại sao chọn C: Nguyên tắc phân chia trách nhiệm (separation of concerns) hiệu quả nhất trong thiết kế tool cho AI Agent là:\n\nLỗi tạm thời (transient errors như timeouts, 503): Nên được tự động xử lý (retry) ngầm bên trong tool implementation để giảm tải vòng lặp cho agent và tiết kiệm token.\n\nLỗi vĩnh viễn / logic (non-transient errors như 403, 422): Phải được trả về kèm thông điệp rõ ràng cho agent, giúp agent có đủ ngữ cảnh để thực hiện hành động khắc phục (ví dụ: sửa lại dữ liệu đầu vào hoặc thông báo xin quyền).\n\nTại sao các đáp án khác không phù hợp:\n\nA: Bọc tất cả lỗi thành một thông báo chung chung làm mất đi thông tin chi tiết, khiến agent không phân biệt được lỗi nào cần sửa và lỗi nào cần chờ.\n\nB: Bắt agent phải tự xử lý cả lỗi mạng và retry thủ công sẽ lãng phí số lượt tương tác (turns) và làm phức tạp hóa vòng lặp suy luận một cách không cần thiết.\n\nD: Cố gắng retry cả các lỗi không bao giờ thành công (như 403 permission denied hoặc 422 validation failure) là vô nghĩa và gây lãng phí thời gian tài nguyên hệ thống."},{"index":9,"text":"Your code review prompts include both implementation changes and the corresponding test file, but the LLM's review comments fail to point out untested code paths. Analysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functions that have no tests at all, but fails to identify when conditional branches or error-handling paths within tested functio lack coverage.\n\nWhat's the most effective way to improve detection of branch-level coverage gaps without overcomplicating the pipeline?","choices":[{"id":"71976","label":"A","text":"A\nImplement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-reference each against test assertions in a second pass."},{"id":"71977","label":"B","text":"B\nRestructure the prompt to interleave implementation and tests, presenting each function followed immediately by its test cases"},{"id":"71978","label":"C","text":"C\n\nInclude few-shot examples showing code with an uncovered branch paired with the review comment identifying the specific missing test case."},{"id":"71979","label":"D","text":"D\n\nAdd explicit instructions directing the model to enumerate each conditional branch and exception path, then verify each has a corresponding test assertion."}],"correctAnswerIds":["71979"],"explanation":"Tại sao đáp án D đúng?\n\nCác mô hình ngôn ngữ lớn (LLM) thường có xu hướng đưa ra nhận xét tổng quan và dễ bỏ sót chi tiết nhỏ nếu chỉ được yêu cầu review chung chung. Khi yêu cầu mô hình thực hiện kỹ thuật Chain-of-Thought (Chuỗi tư duy) bằng cách:\n\nLiệt kê rõ từng nhánh điều kiện / đường dẫn xử lý lỗi.\n\nĐối chiếu từng nhánh đó với file test để kiểm tra tính đầy đủ.\n\nMô hình sẽ buộc phải phân tích sâu từng dòng code và không bỏ sót các nhánh rẽ ẩn. Quan trọng nhất, phương pháp này chỉ thay đổi nội dung prompt trong một lời gọi duy nhất (single pass), giúp giải quyết triệt để vấn đề mà vẫn đáp ứng yêu cầu \"không làm phức tạp hóa pipeline\".\n\n3. Tại sao các đáp án còn lại sai?\n\nA) Sai vì làm phức tạp hóa hệ thống: Phương pháp multi-pass (tách thành nhiều bước gọi LLM) có thể tăng độ chính xác, nhưng lại vi phạm trực tiếp điều kiện đề bài là \"không làm phức tạp hóa pipeline\". Việc tạo nhiều API call làm tăng thời gian xử lý (latency), chi phí (cost) và công sức quản lý luồng dữ liệu.\n\nB) Sai vì không thay đổi cách tư duy của mô hình: Sắp xếp lại vị trí hiển thị giữa code và test chỉ giúp mô hình dễ truy xuất ngữ cảnh hơn (context proximity), nhưng không bắt buộc mô hình phải phân tích từng nhánh logic. Mô hình vẫn có thể chỉ đọc lướt qua và bỏ sót các đường dẫn xử lý lỗi.\n\nC) Sai vì ví dụ không bắt buộc mô hình quét kiệt các nhánh: Kỹ thuật Few-shot (đưa ra ví dụ mẫu) chủ yếu định hình phong cách và định dạng trả lời, nhưng không đảm bảo mô hình sẽ tự động áp dụng quy trình kiểm tra toàn diện cho một đoạn code mới phức tạp. Để ép mô hình kiểm tra từng đường dẫn rẽ nhánh, việc yêu cầu liệt kê từng bước (CoT như ở đáp án D) luôn mang lại hiệu quả cao hơn."},{"index":10,"text":"You're implementing a new payment processing module that must follow your project's established patterns for database transactions, error handling, and audit logging. You've identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and audit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and don't need additional project-level documentation.\n\nWhat's the most effective approach?","choices":[{"id":"71956","label":"A","text":"A\nAsk Claude to explore your codebase to find and understand the transaction, error handling, and logging patterns before generating the new module."},{"id":"71957","label":"B","text":"B\nDescribe the patterns from the three modules in natural language in your prompt, explaining the transaction handling approach, error format, and logging conventions Claude should follow."},{"id":"71958","label":"C","text":"C\nUse @references to include the three modules directly in your prompt, giving Claude concrete code examples of the patterns to follow."},{"id":"71959","label":"D","text":"D\nAdd documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that Claude will apply automatically."}],"correctAnswerIds":["71958"],"explanation":"Lý do chọn C: Đề bài nhấn mạnh đây là một nhiệm vụ tích hợp một lần (one-off integration task) và các mẫu đã được ghi chép rõ ràng, không cần đưa vào tài liệu cấp độ dự án (vì vậy loại D). Việc sử dụng các thẻ @references để đính kèm trực tiếp ba module mẫu (db_utils.py, error_handlers.py, audit_logger.py) vào prompt là cách hiệu quả nhất để cung cấp ngữ cảnh code cụ thể, giúp Claude nắm bắt và áp dụng chính xác các quy ước sẵn có mà không làm ô nhiễm file CLAUDE.md.\n\nCác phương án khác chưa tối ưu:\n\nA: Yêu cầu Claude tự đi dò tìm trong toàn bộ mã nguồn tốn kém thời gian và kém chính xác hơn việc chỉ định trực tiếp các file mẫu.\n\nB: Diễn đạt lại bằng ngôn ngữ tự nhiên dễ dẫn đến việc thiếu sót các chi tiết kỹ thuật cốt lõi so với việc cho Claude đọc trực tiếp mã nguồn.\n\nD: Thêm vào CLAUDE.md không phù hợp vì đây là tác vụ dùng một lần và các pattern này không cần thiết phải duy trì như chuẩn mực toàn cục của dự án."},{"index":11,"text":"You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional statement to one existing function in a single file.\n\nWhat is the most appropriate approach?","choices":[{"id":"72008","label":"A","text":"A\nStart with extended thinking mode enabled to ensure thorough reasoning about the validation logic"},{"id":"72009","label":"B","text":"B\nEnter plan mode first to create a detailed implementation strategy before making the change"},{"id":"72010","label":"C","text":"C\nUse direct execution to make the change"},{"id":"72011","label":"D","text":"D\nEnter plan mode to analyze how the validation might impact other parts of the reservation flow"}],"correctAnswerIds":["72010"],"explanation":"Tại sao chọn C: Bài toán đặt ra yêu cầu chỉnh sửa rất đơn giản và cục bộ: \"thêm một câu lệnh điều kiện vào một hàm có sẵn trong duy nhất một tệp\". Đối với các tác vụ nhỏ, rõ ràng và có phạm vi cực kỳ hạn chế như thế này, việc sử dụng phương pháp thực thi trực tiếp (direct execution) là hiệu quả và tối ưu nhất, giúp tránh lãng phí thời gian và token cho các bước lập kế hoạch hay suy luận phức tạp không cần thiết (như plan mode hay extended thinking mode vốn chỉ dành cho các tính năng hệ thống lớn, đa tệp hoặc mang tính kiến trúc cao).\n\nTại sao các phương án khác chưa tối ưu:\n\nA, B & D: Việc bật extended thinking hay chuyển sang plan mode là quá mức cần thiết (overkill) đối với một chỉnh sửa code đơn giản trong một tệp duy nhất, làm tăng độ trễ và quy trình xử lý của agent một cách không cần thiết."},{"index":12,"text":"You've documented API error handling conventions in a CLAUDE.md file at your project root, specifying that endpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes follows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency appears random across different coding sessions.\n\nWhat's the most efficient first diagnostic step?","choices":[{"id":"72080","label":"A","text":"A\nCreate path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling instructions to your API handler files."},{"id":"72081","label":"B","text":"B\nAdd more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for different endpoint types."},{"id":"72082","label":"C","text":"C\nRun /memory to check which memory files are loaded and verify your CLAUDE.md is included."},{"id":"72083","label":"D","text":"D\nSearch for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your project conventions."}],"correctAnswerIds":["72082"],"explanation":"Tại sao chọn C: Trong môi trường Claude Code, khi các quy tắc tùy chỉnh (custom instructions/CLAUDE.md) có biểu hiện hoạt động không ổn định hoặc ngẫu nhiên giữa các phiên làm việc (sessions), bước chẩn đoán cơ bản và nhanh chóng nhất là kiểm tra xem hệ thống có thực sự đọc và nạp các tệp bộ nhớ hay không. Lệnh /memory trong Claude Code dùng để kiểm tra các file nhớ (như tệp cấu hình, CLAUDE.md) đang được tải vào context, giúp xác định xem tệp có bị bỏ qua hay có vấn đề về cấu hình cục bộ trước khi thực hiện các giải pháp phức tạp hơn.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Việc tạo cấu trúc file rules mới chỉ là bước tinh chỉnh nâng cao, không giải quyết được nguyên nhân gốc rễ vì sao tệp CLAUDE.md hiện tại lúc tuân thủ lúc không.\n\nB: Bổ sung thêm ví dụ trong CLAUDE.md không khắc phục được tình trạng ngẫu nhiên không load hoặc không đọc tệp hướng dẫn của hệ thống.\n\nD: Kiểm tra các file cấu hình toàn cục (~/.claude/) là bước tìm kiếm quá sâu và không phải là bước chẩn đoán nhanh đầu tiên khi tệp cấu hình dự án gốc (CLAUDE.md ở thư mục root) đã được khai báo nhưng hoạt động không ổn định."},{"index":13,"text":"You're implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea—Redis with a 5-minute TTL—but you're new to production caching and aren't sure what other considerations a robust implementation requires.\n\nWhat's the most effective way to start your iterative workflow?","choices":[{"id":"72016","label":"A","text":"A\nAsk Claude to interview you about the caching requirements before implementing, surfacing considerations like invalidation strategies, cache layers, consistency guarantees, and failure modes."},{"id":"72017","label":"B","text":"B\nWrite a specification with your known requirements and \"TBD\" markers for uncertain areas, having Claude propose solutions for each TBD as it implements."},{"id":"72018","label":"C","text":"C\nStart with a minimal request: \"Add Redis caching to/products with 5-minute TTL.\" Add features and fix issues through follow-up prompts as problems surface during testing."},{"id":"72019","label":"D","text":"D\nUse plan mode to analyze the current/products endpoint implementation, then provide your caching requirements once Claude explains how the existing code is structured."}],"correctAnswerIds":["72016"],"explanation":"Tại sao chọn A: Khi bạn là người mới làm quen với việc thiết kế hệ thống caching trong môi trường production và chỉ có một ý tưởng thô sơ (ví dụ: dùng Redis với TTL 5 phút), việc để Claude phỏng vấn bạn (interview you) là phương pháp khởi đầu iterative workflow hiệu quả nhất. Cách tiếp cận này giúp mô hình chủ động đặt các câu hỏi định hướng nhằm khai thác và làm rõ các khía cạnh kỹ thuật quan trọng mà một người mới dễ bỏ sót (như chiến lược vô hiệu hóa cache - invalidation, tính nhất quán - consistency, và các tình huống lỗi - failure modes) trước khi đi vào viết code.\n\nTại sao các phương án khác chưa tối ưu:\n\nB: Viết specification với các đánh dấu \"TBD\" khi bạn còn thiếu kiến thức nền tảng về các cân nhắc production sẽ khiến tài liệu đặc tả bị thiếu sót nhiều ý trọng yếu, làm Claude khó đưa ra đề xuất tối ưu.\n\nC: Bắt đầu bằng một yêu cầu tối thiểu rồi sửa dần qua thử nghiệm là cách làm mang tính phản ứng (reactive), dễ dẫn đến việc phải cấu trúc lại toàn bộ mã nguồn khi phát sinh các vấn đề nghiêm trọng về cache invalidation hoặc failure handling.\n\nD: Dùng plan mode chỉ giúp phân tích mã nguồn hiện tại của endpoint, nhưng nó không giải quyết được vấn đề thiếu hụt kiến thức và yêu cầu kiến trúc production caching của chính bạn."},{"index":14,"text":"Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes exhausts its max_turns limit after gathering data and before completing resolution or escalating. The team's goal is to guarantee that every customer interaction ends with either a completed resolution or a human escalation, regardless of how the agent loop terminates.\n\nWhich approach achieves this guarantee?","choices":[{"id":"72200","label":"A","text":"A\nAdd system prompt instructions telling the agent to call escalate_to_human with a summary of its findings whenever it determines it cannot resolve the dispute."},{"id":"72201","label":"B","text":"B\nAdd orchestration-layer code that checks the agent's outcome after each loop termination - if the loop ended without a completed resolution or escalation, programmatically call escalate_to_human with the accumulated conversation context and tool results."},{"id":"72202","label":"C","text":"C\nImplement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic escalation once the agent reaches 80% of its remaining actions."},{"id":"72203","label":"D","text":"D\nSplit the workflow into two sequential agent invocations — a first agent gathers information via get_customer and lookup_order, then the second agent uses that data and handles process_refund or escalate_to_human, each with separate turn budgets."}],"correctAnswerIds":["72201"],"explanation":"Bản chất vấn đề:\n\nKhi Agent chạm đến giới hạn max_turns, vòng lặp thực thi của Agent sẽ bị ngắt đột ngột từ phía hạ tầng/code điều khiển.\n\nLúc này, mô hình (LLM) không còn cơ hội để tự gọi thêm bất kỳ tool nào (như escalate_to_human) hay sinh thêm câu trả lời nữa.\n\nTại sao B đúng (Orchestration-Level Fallback / Guardrail):\n\nĐể đảm bảo 100% cam kết (guarantee) rằng mọi tương tác luôn kết thúc bằng một kết quả giải quyết hoặc chuyển tiếp tới nhân viên hỗ trợ (regardless of how the agent loop terminates), mã nguồn thuộc lớp điều phối hệ thống (orchestration layer) phải trực tiếp bắt sự kiện kết thúc này.\n\nNếu kiểm tra thấy vòng lặp kết thúc do hết lượt (exhausted max_turns) mà chưa hoãn/hoàn tất, code hệ thống sẽ chủ động thực hiện lệnh chuyển tiếp tới nhân viên (human escalation) kèm theo toàn bộ ngữ cảnh đã thu thập.\n\nLý do các phương án còn lại không thể đảm bảo (guarantee):\n\nA (System Prompt): Một khi đã vượt quá max_turns, Agent dừng lại hoàn toàn. Mọi hướng dẫn trong System Prompt đều trở nên vô hiệu vì mô hình không được kích hoạt để chạy tiếp.\n\nC (Pre-tool-use hook ở 80%): Chỉ là giải pháp phỏng đoán mang tính thời điểm, không cam kết tuyệt đối và vẫn có nguy cơ hết lượt nếu các tác vụ sau đó tốn nhiều lượt hơn dự kiến.\n\nD (Chia làm 2 agent): Chia đôi số lượt chỉ làm giảm bớt khả năng chạm trần lượt, nhưng không đảm bảo 100% việc xử lý ngoại lệ nếu agent thứ 2 vẫn dùng hết ngân sách max_turns của nó mà chưa xong việc."},{"index":15,"text":"Your team frequently migrates React components to Vue. You've written a step-by-step workflow for Claude Code to follow during each migration, and you want every developer on the team to invoke it by typing /migrate-component. The workflow should stay in sync as the team iterates on it.\n\nWhere should you place the skill file?","choices":[{"id":"72192","label":"A","text":"A\nAs a detailed instruction block in the project's root CLAUDE.md file"},{"id":"72193","label":"B","text":"B\nIn the project's .claude/settings.json using a skillOverrides entry to register and define the workflow"},{"id":"72194","label":"C","text":"C\nIn .claude/skills/migrate-component/SKILL.md at the project root, committed to version control"},{"id":"72195","label":"D","text":"D\nIn ~/.claude/skills/migrate-component/SKILL.md on each developer's machine"}],"correctAnswerIds":["72194"],"explanation":"Cấu trúc Custom Skill trong Claude Code:\n\nClaude Code hỗ trợ tạo các lệnh slash command tùy chỉnh bằng cách định nghĩa file SKILL.md nằm trong thư mục .claude/skills/\u003cskill-name>/SKILL.md ở thư mục gốc của dự án.\n\nĐồng bộ trong đội ngũ phát triển (Version Control):\n\nĐề bài yêu cầu: mọi lập trình viên trong team đều có thể gọi lệnh /migrate-component và quy trình làm việc phải luôn được đồng bộ (stay in sync) khi team cập nhật.\n\nViệc đặt file skill trong thư mục .claude/skills/ cấp dự án và commit vào git/version control đảm bảo tất cả thành viên trong team luôn nhận được bản cập nhật mới nhất của workflow khi pull code về.\n\nLý do các phương án còn lại không đúng:\n\nA (Đưa vào CLAUDE.md): CLAUDE.md dùng để chứa các quy chuẩn/hướng dẫn dự án chung, không tạo thành một custom slash command dạng /migrate-component có thể gọi riêng lẻ.\n\nB (Trong settings.json qua skillOverrides): Đây không phải là cấu trúc chính thức để định nghĩa và đăng ký một custom skill mới trong Claude Code.\n\nD (Đặt ở thư mục cá nhân ~/.claude/skills/): Nằm trên máy cá nhân của từng lập trình viên (user-level skill), sẽ không được tự động chia sẻ hay đồng bộ qua Git cho toàn bộ đội ngũ."},{"index":16,"text":"During initial testing, you notice that Claude doesn't seem to remember vocabulary words from earlier in the conversation. When a student asks \"Can you quiz me on those words?\", responds as if no words have been discussed.\n\nWhat is the most likely explanation?","choices":[{"id":"71996","label":"A","text":"A\nYou're not including prior messages in each API request—the stateless API doesn't retain conversation history."},{"id":"71997","label":"B","text":"B\nYour system prompt needs explicit instructions telling Claude to remember information from earlier turns."},{"id":"71998","label":"C","text":"C\nThe model's context window has filled up, causing earlier conversation content to be dropped."},{"id":"71999","label":"D","text":"D\nYou need to enable conversation persistence by passing a session ID parameter with each API call."}],"correctAnswerIds":["71996"],"explanation":"Tại sao chọn A: Các API của LLM (như Anthropic Claude API) được thiết kế theo dạng stateless (không lưu trạng thái). Điều này có nghĩa là mỗi khi bạn gửi một yêu cầu (request) mới lên API, hệ thống sẽ xử lý độc lập và hoàn toàn không tự động ghi nhớ các đoạn chat ở những lượt trước đó. Để mô hình có thể duy trì ngữ cảnh (context) và nhớ các từ vựng đã thảo luận, ứng dụng của bạn phải chủ động đính kèm toàn bộ lịch sử tin nhắn trước đó (prior messages) vào payload của mỗi lần gọi API tiếp theo.\n\nTại sao các phương án khác chưa chính xác:\n\nB: System prompt chỉ đóng vai trò định hình nhân vật, quy tắc ứng xử hoặc hướng dẫn chung, không có cơ chế tự động lưu trữ hoặc nhớ lịch sử trò chuyện thay thế cho mảng tin nhắn lịch sử (messages).\n\nC: Việc ngữ cảnh bị tràn (context window filled up) sẽ dẫn đến lỗi độ dài hoặc mô hình bị cắt bớt dữ liệu cũ, chứ không giải thích cho việc mô hình xử lý một phiên chat mới hoàn toàn như thể chưa hề có tương tác nào từ đầu.\n\nD: Các API tiêu chuẩn của Claude không sử dụng tham số session ID để duy trì lịch sử tự động phía máy chủ theo cách này; việc quản lý trạng thái hội thoại là trách nhiệm ở phía ứng dụng khách (client-side) thông qua việc truyền danh sách messages."},{"index":17,"text":"Your automated reviewer uses a single prompt covering security issues, API design, and business logic correctness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API design recall drops to 68%.\n\nHow should you address this trade-off to improve detection across both categories?","choices":[{"id":"72112","label":"A","text":"A\nUpgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single prompt and eliminate the recall trade-off."},{"id":"72113","label":"B","text":"B\nReplace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as division-by-zero in score calculation or grading thresholds."},{"id":"72114","label":"C","text":"C\nProvide the full repository as context instead of just the changed files and surrounding code, giving the model deeper visibility into business logic."},{"id":"72115","label":"D","text":"D\nSplit the review into separate focused prompts - one for security and API design, another for business logic - each with dedicated examples, then combine findings before posting."}],"correctAnswerIds":["72115"],"explanation":"Bản chất vấn đề (Prompt Congestion / Trade-off): Khi bạn đưa quá nhiều nhiệm vụ khác nhau hoặc áp dụng quá nhiều ví dụ few-shot đa dạng vào chung một prompt duy nhất, mô hình AI dễ bị nhiễu ngữ cảnh (attention dilution). Việc thêm ví dụ cho khía cạnh này (logic) làm suy giảm khả năng tập trung vào khía cạnh khác (API design).\n\nTại sao D đúng (Decomposition / Multi-agent Approach):\n\nChia nhỏ công việc (Task Decomposition) thành các prompt riêng biệt chuyên biệt hóa (chẳng hạn một prompt tập trung hoàn toàn vào Security & API design, một prompt chỉ tập trung vào Business logic) giúp mỗi tác vụ có thể sử dụng các few-shot ví dụ tối ưu nhất mà không bị triệt tiêu lẫn nhau.\n\nSau khi thu được kết quả từ các luồng phân tích riêng biệt, bạn gộp các phát hiện lại trước khi gửi kết quả đánh giá cuối cùng. Đây là thực hành chuẩn (Best Practice) khi thiết kế AI Agent cho các bài toán phân tích phức tạp.\n\nLý do các phương án còn lại không đúng:\n\nA (Nâng cấp model tier): Nâng cấp mô hình có thể cải thiện năng lực chung nhưng không giải quyết triệt để vấn đề gốc rễ về xung đột yêu cầu/ví dụ trong cùng một prompt (prompt trade-off).\n\nB (Dùng checklist thay few-shot): Thay thế few-shot bằng danh sách kiểm tra không giải quyết được việc mô hình bị giảm độ tập trung khi phải xử lý đồng thời quá nhiều tiêu chí trong một lượt.\n\nC (Cung cấp toàn bộ codebase): Việc đưa toàn bộ repository vào context làm tăng thêm rất nhiều nhiễu (noise) và chi phí token, khiến mô hình càng khó phát hiện ra các lỗi logic tiềm ẩn hơn."},{"index":18,"text":"Developer Productivity An engineer asks the agent to find all files in the monorepo that import the @company/auth package to understand how authentication is used across services.\n\nWhich built-in tool is most appropriate for this task?","choices":[{"id":"72124","label":"A","text":"A\nGrep, to search for the import statement pattern across file contents"},{"id":"72125","label":"B","text":"B\nRead, starting with package.json files to trace dependency declarations"},{"id":"72126","label":"C","text":"C\nGlob, to find files with \"auth\" in their filename or path"},{"id":"72127","label":"D","text":"D\nBash, to execute find . -type d -name \"*auth*\" and explore matching directories"}],"correctAnswerIds":["72124"],"explanation":"Mục tiêu của yêu cầu: Kỹ sư muốn tìm tất cả các file import package @company/auth để hiểu cách authentication được sử dụng.\n\nTại sao A đúng:\n\nCông cụ Grep (hoặc grep_search) trong bộ công cụ tích hợp (built-in tools) của Claude Code / Claude Agent được thiết kế chuyên biệt để tìm kiếm chuỗi văn bản / regex bên trong nội dung tệp tin (file contents). Việc tìm câu lệnh import ... from '@company/auth' chính là bài toán tìm kiếm mẫu chuỗi trong nội dung file.\n\nLý do các phương án còn lại không đúng:\n\nB (Read): Công cụ Read chỉ dùng để đọc nội dung của một file cụ thể khi đã biết đường dẫn, không thể dùng để tìm kiếm đồng loạt trên toàn bộ monorepo. Việc tìm trong package.json cũng chỉ biết được dự án nào khai báo phụ thuộc, không biết được file nào trực tiếp import mã nguồn đó.\n\nC (Glob): Công cụ Glob chỉ tìm kiếm file theo tên file hoặc đường dẫn (filename/path pattern), không thể tìm kiếm nội dung bên trong file (như câu lệnh import).\n\nD (Bash): Việc chạy lệnh find chỉ giúp tìm tên thư mục/file, không giải quyết việc tìm nội dung import. Hơn nữa, luôn ưu tiên dùng các built-in tools dedicated (như Grep) thay vì gọi qua lệnh shell không cần thiết."},{"index":19,"text":"Evaluation shows 94% extraction accuracy on short meeting transcripts (\u003c30 minutes) but only 68% on longer transcripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of both lengths fit within the model's context window.\n\nWhat pattern most effectively improves accuracy on complex, lengthy documents?","choices":[{"id":"72144","label":"A","text":"A\nUpgrade to a more capable model tier for the extraction task"},{"id":"72145","label":"B","text":"B\nAdd a pre-extraction step where the model summarizes key discussions and conclusions before performing structured extraction."},{"id":"72146","label":"C","text":"C\nAdd few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."},{"id":"72147","label":"D","text":"D\nSplit lengthy transcripts Into chunks, extract from each chunk separately, then merge and deduplicate the results."}],"correctAnswerIds":["72147"],"explanation":"Đáp án chính xác của câu hỏi này là D: Split lengthy transcripts into chunks, extract from each chunk separately, then merge and deduplicate the results.\n\nGiải thích nguyên lý kỹ thuật:\n\nKhắc phục triệt để hiện tượng \"Lost in the Middle\":\n\nĐề bài đặt ra tình huống: Dù bản ghi cuộc họp dài (>60 phút) vẫn nằm vừa trong context window, nhưng độ chính xác lại giảm mạnh từ 94% xuống 68%.\n\nĐây là hiện tượng kinh điển của LLM: Khi ngữ cảnh quá dài và thông tin bị phân tán, cơ chế chú ý (Attention) của mô hình bị pha loãng (attention dilution), làm giảm khả năng trích xuất chính xác các thông tin nằm rải rác ở giữa văn bản.\n\nÁp dụng mô hình MapReduce (Chunk → Extract → Merge):\n\nCắt nhỏ (Chunking): Chia bản ghi dài thành từng phân đoạn nhỏ giúp mô hình tập trung 100% độ chú ý vào từng đoạn ngắn, đảm bảo không bỏ sót chi tiết.\n\nTrích xuất từng phần (Extract): Rút trích dữ liệu cấu trúc độc lập trên từng đoạn.\n\nGộp & Lọc trùng (Merge & Deduplicate): Dùng một bước xử lý cuối cùng để hợp nhất các thông tin và loại bỏ các chi tiết bị lặp lại.\n\nTại sao các phương án còn lại không giải quyết được vấn đề?\n\nA (Upgrade model): Tốn chi phí nhưng không giải quyết được bản chất pha loãng chú ý trên ngữ cảnh dài phân tán.\n\nB (Pre-extraction summarization): Tóm tắt trước trên toàn bộ tệp dài vẫn bắt mô hình phải đọc hết ngữ cảnh bị pha loãng ngay từ bước 1, dẫn đến nguy cơ bỏ sót thông tin quan trọng ngay trong bản tóm tắt.\n\nC (Few-shot examples): Tốn dung lượng token và không giúp ích nhiều khi cấu trúc thảo luận của mỗi cuộc họp dài là hoàn toàn khác nhau."},{"index":20,"text":"A new user's first message is \"Set up my focus music,\" This could mean configure preferences, create a playlist, or play music immediately. Your system supports all three actions.\n\nWhat's the effective approach?","choices":[{"id":"72000","label":"A","text":"A\nCreate a new \"Focus\" playlist with curated tracks and notify the user it's ready."},{"id":"72001","label":"B","text":"B\nPlay popular focus tracks Immediately and let the user redirect if needed"},{"id":"72002","label":"C","text":"C\nAsk one clarifying question about action type: play now or configure for later"},{"id":"72003","label":"D","text":"D\nStart preference configuration by asking about genres, temps, and artists they prefer for focus."}],"correctAnswerIds":["72002"],"explanation":"Tại sao chọn C: Trong trường hợp này, thông điệp ban đầu của người dùng (\"Set up my focus music\") mang tính đa nghĩa (ambiguous), và hệ thống hỗ trợ nhiều hành động hoàn toàn khác nhau (cấu hình sở thích, tạo playlist mới, hoặc phát nhạc ngay lập tức). Theo nguyên tắc thiết kế trải nghiệm người dùng hội thoại (conversational UX) và thiết kế hệ thống agent hiệu quả, khi yêu cầu của người dùng mơ hồ và có thể dẫn đến các tác vụ trái ngược nhau, giải pháp tốt nhất là đặt một câu hỏi làm rõ duy nhất (clarifying question) để xác định chính xác mong muốn của người dùng trước khi thực thi, thay vì đoán mò và tự ý thực hiện hành động sai lệch.\n\nTại sao các phương án khác chưa tối ưu:\n\nA & B: Việc tự động thực hiện hành động (tạo playlist hoặc phát nhạc ngay) mà không hỏi ý kiến có thể làm phiền người dùng hoặc đi ngược lại ý định thực sự của họ (ví dụ: người dùng chỉ muốn cấu hình thiết lập trước chứ chưa muốn nhạc bật lên ngay).\n\nD: Việc lao ngay vào cấu hình chi tiết (hỏi về thể loại, nghệ sĩ, tempo) quá sớm sẽ tạo ra ma sát lớn (friction) ngay từ câu lệnh đầu tiên, trong khi người dùng có thể chỉ muốn hệ thống bắt đầu phát nhạc ngay lập tức."},{"index":21,"text":"After deploying an updated system prompt that improves response quality, users with multi-session conversations spanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably different communication style. New users don't experience these issues.\n\nWhat's the best approach to resolve this?","choices":[{"id":"72140","label":"A","text":"A\nAdd instructions to the new system prompt directing the assistant to maintain consistency with any prior statements in the conversation history."},{"id":"72141","label":"B","text":"B\nAdd a transition message when sessions resume explaining that the assistant has been updated and behavior may differ."},{"id":"72142","label":"C","text":"C\nVersion system prompts and associate each conversation with the prompt version under which it started, applying updates only to new conversations."},{"id":"72143","label":"D","text":"D\nRegenerate summaries of existing conversations using the new prompt and replace the stored histories to align past context with current behavior."}],"correctAnswerIds":["72142"],"explanation":"Vấn đề cốt lõi: Khi bạn thay đổi system prompt của một hội thoại đang diễn ra (đã kéo dài nhiều tuần), mô hình AI sẽ bị xung đột giữa cá tính/hướng dẫn mới trong system prompt và phong cách/thông tin cũ được lưu trong lịch sử chat (conversation history). Điều này dẫn đến hiện tượng mâu thuẫn câu từ và thay đổi văn phong đột ngột làm ảnh hưởng đến trải nghiệm người dùng.\n\nTại sao C đúng (Prompt Versioning):\n\nĐây là thực hành chuẩn (Best Practice) trong quản trị hệ thống AI (AI Lifecycle Management).\n\nBằng cách đánh phiên bản (versioning) cho system prompt, mỗi hội thoại cũ sẽ tiếp tục duy trì phiên bản prompt ban đầu mà nó được khởi tạo. Các bản cập nhật system prompt mới chỉ áp dụng cho những cuộc trò chuyện mới. Việc này đảm bảo tính nhất quán (consistency) tuyệt đối xuyên suốt vòng đời của từng cuộc trò chuyện.\n\nLý do các phương án còn lại không phù hợp:\n\nA (Thêm hướng dẫn tự nhất quán vào prompt mới): Thường không hiệu quả vì system prompt mới vẫn có thể xung đột trực tiếp với lịch sử ngữ cảnh cũ, khiến mô hình bị bối rối (hallucination/confusion).\n\nB (Gửi tin nhắn thông báo cho người dùng): Đây chỉ là giải pháp tình thế thông báo sự thay đổi, không giải quyết triệt me được lỗi kỹ thuật mâu thuẫn logic và thay đổi phong cách của AI.\n\nD (Tạo lại tóm tắt hội thoại cũ bằng prompt mới): Tốn kém chi phí token, có nguy cơ làm mất hoặc biến dạng thông tin quan trọng trong quá khứ của người dùng."},{"index":22,"text":"Your portfolio value tool returns the total value of a user's investment portfolio. You're deciding between returning a structured JSON object with explicit fields versus returning information as a formatted text string.\n\nWhat is the primary advantage of using structured output with defined fields?","choices":[{"id":"72184","label":"A","text":"A\nStructured JSON is processed deterministically by the model, significantly improving accuracy when extracting values."},{"id":"72185","label":"B","text":"B\nStructured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."},{"id":"72186","label":"C","text":"C\nJSON schemas automatically validate that the underlying API returned correct data before the agent processes it."},{"id":"72187","label":"D","text":"D\nThe agent can reliably extract specific values without parsing free form text, reducing errors in subsequent operations."}],"correctAnswerIds":["72187"],"explanation":"Bản chất của Structured Output trong Tool Results:\n\nKhi công cụ trả về kết quả dưới dạng JSON cấu trúc với các trường rõ ràng (explicit fields), mô hình AI (Agent) có thể đọc và trích xuất trực tiếp các giá trị mong muốn (như portfolio_value, currency, holdings) một cách chính xác mà không phải thực hiện các thao tác tách chuỗi/phân tích văn bản tự do (parsing free-form text).\n\nViệc này giảm thiểu nguy cơ hiểu sai dữ liệu hoặc trích xuất nhầm số liệu trong các thao tác xử lý tiếp theo của Agent.\n\nLý do các phương án còn lại không đúng:\n\nA (Processed deterministically): LLM bản chất vẫn là mô hình xác xuất (probabilistic), việc đọc JSON giúp nó trích xuất dễ hơn nhưng không biến việc xử lý của LLM thành deterministic tuyệt đối.\n\nB (Consumes significantly fewer tokens): JSON thường tốn nhiều token hơn văn bản tự nhiên đơn giản do chứa thêm các cú pháp ngoặc, dấu ngoặc nếp và tên key (\"field_name\": ...).\n\nC (JSON schemas automatically validate underlying API data): JSON Schema của Tool định nghĩa cấu trúc trả về cho Agent, nó không tự động kiểm tra/xác thực xem dữ liệu nghiệp vụ do Backend API của ứng dụng trả về có chính xác về mặt logic hay không."},{"index":23,"text":"Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then book_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts fall with \"slot no longer available\" because another user booked the slot between the availability check and the booking call.\n\nHow should you refactor these tools?","choices":[{"id":"72060","label":"A","text":"A\nCombine both tools into a single find_and_book_appointment that atomically checks availability and books, returning either the confirmed booking or available alternatives."},{"id":"72061","label":"B","text":"B\nAdd a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the agent to call it between checking availability and booking."},{"id":"72062","label":"C","text":"C\nModify book_appointment to return detailed failure information including currently available alternative slots when the requested slot is unavailable, enabling the agent to retry with a different time."},{"id":"72063","label":"D","text":"D\nKeep both tools but add retry logic to the agent's system prompt, instructing it to call get_available_slots again and select a different time if booking fails."}],"correctAnswerIds":["72060"],"explanation":"Tại sao chọn A: Vấn đề chính là điều kiện tranh chấp (race condition) do độ trễ thời gian giữa bước kiểm tra tính khả dụng (get_available_slots) và bước gọi đặt chỗ (book_appointment). Giải pháp chuẩn thiết kế kiến trúc hệ thống là kết hợp gộp cả hai thành một thao tác nguyên tử duy nhất (find_and_book_appointment) để thực hiện kiểm tra và khóa chốt trong cùng một giao dịch (transaction), qua đó loại bỏ hoàn toàn khả năng bị chiếm chỗ ở giữa chừng.\n\nTại sao các đáp án khác không phù hợp:\n\nB: Thêm công cụ hold_slot vẫn không giải quyết được vấn đề gốc rễ vì nó tạo ra một bước gọi rời rạc bổ sung mà agent vẫn có thể gọi nhầm thứ tự hoặc bị tranh chấp ở chính bước tạm giữ đó nếu lượng truy cập cao.\n\nC: Sửa book_appointment để trả về lỗi kèm thời gian thay thế chỉ giúp xử lý sau khi lỗi đã xảy ra (cơ chế phản ứng), không ngăn chặn được 15% tỷ lệ thất bại ban đầu.\n\nD: Thêm logic vào system prompt yêu cầu agent tự retry bằng tay làm tăng số lượng vòng lặp (round-trips), tiêu tốn token và không giải quyết được tính nguyên tử (atomicity) ở cấp độ cơ sở dữ liệu."},{"index":24,"text":"Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You've also defined lookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests like \"extract the metadata and tell me how cited it is,\" Claude sometimes calls lookup_citations first, which fails because it needs the DOI that extract_metadata would provide.\n\nWhat's the most effective way to ensure structured metadata extraction happens first?","choices":[{"id":"71980","label":"A","text":"A\nSet tool_choice to \"any\" so Claude must use a tool, combined with system prompt instructions prioritizing extract_metadata."},{"id":"71981","label":"B","text":"B\nSet tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} and process the enrichment requests in subsequent turns after receiving the extracted metadata."},{"id":"71982","label":"C","text":"C\nSet tool_choice to \"auto\" and reorder the tool definitions so extract_metadata appears first in the tools array, since Claude prioritizes earlier-listed tools."},{"id":"71983","label":"D","text":"D\nSet tool_choice to {\"type\": \"tool\", \"name\": \"extract_metadata\"} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur."}],"correctAnswerIds":["71981"],"explanation":"Tại sao chọn B: Trong Anthropic Claude API, khi bạn muốn ép mô hình bắt buộc phải sử dụng một công cụ cụ thể ngay trong lượt gọi đầu tiên (ví dụ: extract_metadata để lấy DOI trước), việc cấu hình tool_choice thành dạng ép buộc ({\"type\": \"tool\", \"name\": \"extract_metadata\"}) sẽ đảm bảo mô hình không gọi nhầm các công cụ khác cần dữ liệu đầu ra chưa tồn tại. Sau khi nhận được kết quả của bước này (chứa DOI), bạn có thể tiếp tục xử lý các yêu cầu bổ sung/enrichment ở các lượt tiếp theo (subsequent turns).\n\nTại sao các phương án khác chưa chính xác:\n\nA: tool_choice loại \"any\" chỉ bắt buộc mô hình phải chọn một công cụ bất kỳ trong danh sách, chứ không chỉ định đích danh phải là extract_metadata, do đó Claude vẫn có nguy cơ gọi nhầm lookup_citations.\n\nC: Việc dùng tool_choice là \"auto\" kết hợp sắp xếp lại thứ tự công cụ chỉ mang tính chất gợi ý yếu, không đảm bảo 100% mô hình sẽ không gọi sai công cụ phụ thuộc trước.\n\nD: Việc cài đặt ép buộc extract_metadata cho mọi API call trong toàn bộ pipeline sẽ gây lỗi nghiêm trọng khi người dùng thực hiện các lượt hội thoại sau đó (khi đã lấy được metadata và muốn gọi các công cụ enrichment khác), vì lúc này mô hình sẽ bị kẹt và lặp lại việc gọi extract_metadata liên tục."},{"index":25,"text":"You've configured the system so that all four subagents have access to the complete set of 18 tools. During testing, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and the report generator tries to analyze documents.\n\nWhat is the primary cause of this poor tool selection behavior?","choices":[{"id":"72076","label":"A","text":"A\nThe agents' role descriptions in their system prompts conflict with having access to tools outside that role."},{"id":"72077","label":"B","text":"B\nThe coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."},{"id":"72078","label":"C","text":"C\nChoosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection thresholds."},{"id":"72079","label":"D","text":"D\nThe tool definitions consume too much context window space, leaving insufficient room for task content."}],"correctAnswerIds":["72078"],"explanation":"Tại sao chọn C: Khi một tác nhân (agent) phải đối mặt với số lượng quá lớn các công cụ (18 tools thay vì 4 đến 5 tools chuyên biệt), độ phức tạp khi lựa chọn tăng lên vượt quá ngưỡng tin cậy của mô hình (decision complexity / attention dilution). Điều này dẫn đến hiện tượng mô hình dễ bị nhầm lẫn và gọi nhầm các công cụ ngoài phạm vi chuyên môn của mình. Giải pháp kiến trúc chuẩn là phân tách bộ công cụ phù hợp cho từng agent riêng biệt (mỗi agent chỉ thấy 4-5 công cụ thực sự cần thiết).\n\nTại sao các đáp án khác không phù hợp:\n\nA: Xung đột system prompt không phải là nguyên nhân chính; bản thân LLM có xu hướng dễ bị quá tải khi số lượng công cụ khả dụng quá lớn trong schema definitions.\n\nB: Vấn đề trong đề bài nằm ở việc các subagent gọi sai tool chứ không phải do coordinator định tuyến sai tác vụ.\n\nD: 18 công cụ thông thường không chiếm quá nhiều context window đến mức gây nghẽn ngữ cảnh làm giảm chất lượng nội dung, mà vấn đề cốt lõi là không gian lựa chọn quá rộng (search space / decision space quá lớn)."},{"index":26,"text":"Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a beginner, provide step-by-step form instructions. If they use term 'progressive overload' or 'superset', respond concisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation, you find the assistant correct explicit expertise declarations but struggles when users don't clearly state their level-often defaulting to overly detailed responses regardless of contextual cues like technical terms.\n\nWhich change to the system prompt would most directly address this failure to pick up on implicit expertise signals?","choices":[{"id":"72168","label":"A","text":"A\nAdd more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep ranges or asks about periodization, treat as advanced.\""},{"id":"72169","label":"B","text":"B\nReplace most conditionals with a general principle: \"Adapt explanation depth to match user expertise, mirroring their terminology.\" Keep only the safety-critical conditional abou consultations."},{"id":"72170","label":"C","text":"C\nImplement a pre-conversation intake that asks users to rate their experience level, then inject that rating into the system prompt as context for all subsequent responses."},{"id":"72171","label":"D","text":"D\nAdd an explicit instruction for the model to ask a clarifying question about experience level whenever the user's expertise isn't immediately clear from their first message."}],"correctAnswerIds":["72169"],"explanation":"Bản chất vấn đề (Over-specifying Conditional Logic):\n\nKhi thiết kế system prompt, việc lạm dụng quá nhiều câu lệnh điều kiện cứng (hard-coded conditionals như \"nếu dùng từ X thì làm Y\") sẽ khiến mô hình bị máy móc, dễ rơi vào trường hợp mặc định (default behavior) khi người dùng không dùng chính xác các từ khóa đó.\n\nCác mô hình LLM hiện đại (như Claude) rất mạnh trong việc hiểu ngữ cảnh tự nhiên và tự điều chỉnh phong cách/độ sâu kiến thức theo cách nói của người dùng.\n\nTại sao B đúng (General Principles over Rules):\n\nĐây là thực hành chuẩn (Best Practice) trong Prompt Engineering: Sử dụng nguyên tắc tổng quát (General Principle) để mô hình tự nhận biết các tín hiệu ngầm (implicit signals) và thích ứng linh hoạt, đồng thời chỉ giữ lại câu lệnh điều kiện cứng đối với các quy tắc an toàn quan trọng (như tư vấn y tế/chấn thương).\n\nLý do các phương án còn lại không đúng:\n\nA (Thêm nhiều điều kiệnif-else): Càng thêm nhiều nhánh điều kiện sẽ càng làm prompt bị cồng kềnh, gây xung đột logic và không bao giờ bao phủ hết mọi trường hợp trong thực tế.\n\nC (Khảo sát đầu vào / Intake form): Thay đổi luồng UX sản phẩm và không giải quyết được vấn đề tối ưu hóa khả năng đọc tín hiệu ngầm của LLM trong prompt.\n\nD (Hỏi lại người dùng): Làm đứt gãy trải nghiệm người dùng (friction), bắt người dùng phải giải thích trong khi mô hình hoàn toàn có khả năng tự suy luận từ ngữ cảnh."},{"index":27,"text":"Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string). Production monitoring shows the agent frequently passes mismatched combinations-using measurement: \"reps\" for cardio exercises like running, or measurement: \"miles\" for strength exercises like bench press. Your exercises naturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and sets). 23% of tool calls have invalid combinations.\n\nWhat approach would most effectively reduce these errors?","choices":[{"id":"71992","label":"A","text":"A\nAdd explicit examples to the tool description showing valid combinations (e.g., \"For running: use minutes or miles. For push-ups: use reps\") with constraints for each exercise category."},{"id":"71993","label":"B","text":"B\nImplement server-side validation returning descriptive errors for invalid combinations, allowing the agent to retry with corrections."},{"id":"71994","label":"C","text":"C\nSplit into log_cardio_workout (with duration_minutes or distance_miles parameters) and log_strength_workout (with reps and sets parameters)."},{"id":"71995","label":"D","text":"D\nAdd enum constraints on measurement limiting values to \"minutes\", \"miles\", \"reps\", or \"sets\" to prevent arbitrary measurement strings."}],"correctAnswerIds":["71994"],"explanation":"Tại sao chọn C: Theo các nguyên tắc thiết kế công cụ (tool design) cho LLM (đặc biệt trong các chuẩn kiến trúc agent nâng cao của Anthropic), khi một công cụ đơn lẻ xử lý quá nhiều loại dữ liệu hoặc phân nhánh logic phức tạp (ở đây là kết hợp cả bài tập cardio và strength với các tham số đo lường hoàn toàn khác nhau), mô hình LLM rất dễ nhầm lẫn trong việc truyền tham số. Việc tách thành các công cụ chuyên biệt rõ ràng (chia thành log_cardio_workout và log_strength_workout) giúp cấu trúc schema của từng tool trở nên minh bạch tuyệt đối, loại bỏ hoàn toàn hiện tượng nhầm lẫn giữa các loại chỉ số và giúp giảm thiểu tối đa tỷ lệ lỗi (error rate) của agent.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Việc chỉ thêm ví dụ bằng văn bản (explicit examples) trong tool description chỉ cải thiện được một phần nhỏ, nhưng với các agent phải thực hiện hàng loạt tác vụ liên tục, LLM vẫn có xu hướng bỏ sót hoặc quên các ràng buộc dạng văn bản thuần túy khi context dài lên.\n\nB: Server-side validation chỉ giúp phát hiện và sửa lỗi sau khi lỗi đã xảy ra (bằng cách bắt agent thử lại), khiến tốn kém thêm số lượt gọi API (turns) và làm chậm quá trình xử lý, chứ không ngăn chặn tận gốc việc agent đưa ra các kết hợp sai ngay từ đầu.\n\nD: Việc dùng ràng buộc enum trên trường measurement dạng chuỗi chung (\"minutes\", \"miles\", \"reps\", \"sets\") không giải quyết được vấn đề gán nhầm loại bài tập (ví dụ: agent vẫn có thể chọn nhầm reps cho bài chạy bộ vì cả hai đều nằm chung trong một enum pool của cùng một tool duy nhất)."},{"index":28,"text":"You've asked Claude Code to build a PDF report generation feature. The initial implementation queries the database correctly, but the output has formatting issues: table columns are too narrow causing content truncation, dates display without proper formatting, and page break handling is incorrect. You've noticed these issues interact— changing column widths affects how dates render, and page breaks depend on content height.\n\nWhat's the most effective approach for iterating toward a working solution?","choices":[{"id":"71952","label":"A","text":"A\nShow Claude an example of a correctly formatted report and ask it to match that output, rather than listing the specific technical issues."},{"id":"71953","label":"B","text":"B\nStart fresh with a detailed prompt specifying all formatting requirements upfront."},{"id":"71954","label":"C","text":"C\nProvide all three issues in a single detailed message with exact specifications for each, allowing Claude to address them together in one update."},{"id":"71955","label":"D","text":"D\nAddress the column width issue first with specific measurements, verify it works, then fix date formatting within the corrected columns, then adjust page breaks— testing after each change."}],"correctAnswerIds":["71955"],"explanation":"Lý do chọn D: Do các vấn đề trong việc tạo file PDF (chiều rộng cột, định dạng ngày tháng, và ngắt trang) có tính chất tương tác lẫn nhau (interact), việc giải quyết tuần tự từng bước một (chỉnh cột -> kiểm tra -> chỉnh ngày -> kiểm tra -> chỉnh ngắt trang -> kiểm tra) giúp cô lập nguyên nhân gây lỗi, tránh việc Claude Code bị chồng chất quá nhiều thay đổi phức tạp dẫn đến hỏng cấu trúc.\n\nCác phương án khác chưa tối ưu:\n\nA, B, C: Việc dồn tất cả các yêu cầu sửa đổi cùng lúc hoặc chỉ đưa ra hình ảnh mẫu mà không xử lý tuần tự các yếu tố phụ thuộc lẫn nhau sẽ khiến AI dễ bỏ sót chi tiết hoặc tạo ra các xung đột bố cục mới khi xử lý đồng thời cả chiều rộng, định dạng và vị trí ngắt trang."},{"index":29,"text":"Your search Flights tool calls an external airline API that occasionally returns a 503 Service Unavailable error.\n\nWhat is the most effective way to handle this error in your tool implementation?","choices":[{"id":"71988","label":"A","text":"A\nAutomatically retry the request up to five times with exponential backoff before returning results to the agent."},{"id":"71989","label":"B","text":"B\nReturn an error message in the tool result explaining the service is temporarily unavailable."},{"id":"71990","label":"C","text":"C\nLog the error internally and return an empty response, letting the model continue without the flight data."},{"id":"71991","label":"D","text":"D\nReturn an empty flight list as if the search succeeded but found no matching flights."}],"correctAnswerIds":["71988"],"explanation":"Tại sao A đúng: Lỗi 503 Service Unavailable là một dạng lỗi tạm thời (transient error), thường xảy ra khi máy chủ phía bên ngoài (external API của hãng hàng không) đang bị quá tải hoặc bảo trì chớp nhoáng và sẽ sớm hoạt động bình thường trở lại sau một khoảng thời gian rất ngắn. Trong thiết kế kiến trúc hệ thống AI và tool production, phương pháp tốt nhất để xử lý các sự cố hạ tầng tạm thời này là để công cụ tự động thử lại (automatic retry) kết hợp thuật toán giãn cách thời gian (exponential backoff) ở tầng dưới, giúp che giấu các lỗi chớp nhoáng này khỏi mô hình LLM và đảm bảo trải nghiệm liền mạch cho người dùng.\n\nTại sao các đáp án khác sai:\n\nB: Việc trả về ngay thông báo lỗi cho mô hình làm gián đoạn trải nghiệm trong khi lỗi đó hoàn toàn có thể tự phục hồi sau vài lần thử lại ngầm.\n\nC & D: Việc tự ý trả về kết quả rỗng (như thể không có chuyến bay hoặc lờ đi lỗi) sẽ đánh lừa mô hình, khiến LLM hiểu sai rằng hệ thống không có dữ liệu thực tế thay vì hiểu rằng hệ thống đang gặp sự cố hạ tầng tạm thời."},{"index":30,"text":"\"You're the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical details or the data, and it negative impacts expected outputs. They need to independently develop both approaches to evaluation data...\n\nHow do you manage this scenario?\"","choices":[{"id":"72108","label":"A","text":"A\nContinue in the original session, developing end-to-end tests first, then snapshot tests sequentially."},{"id":"72109","label":"B","text":"B\nExport the analysis session's key findings to a file, then create two new sessions that reference this file."},{"id":"72110","label":"C","text":"C\nStart two fresh sessions, having each re-read the relevant source files before beginning."},{"id":"72111","label":"D","text":"D\nResume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}],"correctAnswerIds":["72111"],"explanation":"Trong kiến trúc quản lý phiên làm việc (Session Management) của Claude Code / Anthropic Agent SDK:\n\nTính năng fork_session (hoặc --fork-session): Cho phép bạn nhân bản (fork) một phiên làm việc hiện tại từ một điểm baseline chung. Điều này tạo ra các nhánh (branches) độc lập nhưng vẫn giữ nguyên toàn bộ ngữ cảnh, dữ liệu phân tích và lịch sử đã thực hiện trước đó.\n\nTại sao phương án D là tối ưu:\n\nViệc cần phát triển hai hướng kiểm thử (end-to-end tests và snapshot tests) độc lập đòi hỏi mỗi luồng có không gian thử nghiệm riêng mà không làm ảnh hưởng lẫn nhau hoặc làm nhiễu ngữ cảnh gốc.\n\nSử dụng fork_session giúp tiết kiệm chi phí token và thời gian vì không phải bắt các phiên mới đọc/phân tích lại từ đầu toàn bộ mã nguồn hoặc tệp dữ liệu đã phân tích ở phiên gốc.\n\nLý do các phương án còn lại không phù hợp:\n\nA (Thực hiện nối tiếp trong cùng phiên): Sẽ làm cho ngữ cảnh bị dài, dễ nhiễu thông tin giữa 2 phương pháp testing khác nhau và làm tăng giới hạn token/attention dilution.\n\nB & C (Tạo phiên mới hoàn toàn và bắt đọc lại file): Tốn kém thời gian, token và mất công thiết lập lại toàn bộ ngữ cảnh/kết quả phân tích ban đầu mà phiên gốc đã thực hiện thành công."},{"index":31,"text":"You've asked Claude to write a data migration script, but the initial output doesn't correctly handle records with null values in required fields.\n\nWhat's the most effective way to iterate toward a working solution?","choices":[{"id":"72020","label":"A","text":"A\nAdd \"think harder about edge cases\" to your prompt and request a complete rewrite of the migration logic."},{"id":"72021","label":"B","text":"B\nDescribe the null value problem in detail and ask Claude to regenerate the entire script with improved edge case handling."},{"id":"72022","label":"C","text":"C\nManually edit the generated code to fix the null handling, then continue working with Claude on other parts."},{"id":"72023","label":"D","text":"D\nProvide a test case with example input containing null values and the expected output, then ask Claude to fix it."}],"correctAnswerIds":["72023"],"explanation":"Tại sao chọn D: Trong việc tối ưu hóa hiệu suất tinh chỉnh code với LLM (Prompt Engineering và Interactive Debugging), việc cung cấp một test case cụ thể (bao gồm dữ liệu đầu vào có giá trị null và đầu ra kỳ vọng) mang lại hướng dẫn trực quan, rõ ràng và có tính kỹ thuật chính xác cao nhất cho mô hình. Thay vì chỉ ra lệnh chung chung (như \"think harder\" hay mô tả văn bản thuần túy), việc đưa ra concrete examples giúp mô hình xác định ngay lập tức vị trí logic cần sửa đổi trong script mà không cần phải viết lại toàn bộ mã từ đầu.\n\nTại sao các phương án khác chưa tối ưu:\n\nA: Các câu lệnh định tính chung chung như \"think harder\" thường không mang lại hiệu quả cao đối với các lỗi logic cụ thể liên quan đến dữ liệu.\n\nB: Yêu cầu regenerate lại toàn bộ script khi chỉ có một lỗi nhỏ về giá trị null sẽ làm lãng phí token, thời gian và có thể làm phát sinh các lỗi mới ở các phần code vốn đã hoạt động ổn định.\n\nC: Việc tự thủ công sửa code bỏ qua khả năng tương tác và tận dụng trợ lý AI trong việc học hỏi và tự động hóa các bước xử lý ngoại lệ lặp đi lặp lại."},{"index":32,"text":"Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that succeed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that never succeed regardless of retry attempts. Currently, both error types are returned to the agent identically, causing it to waste turns retrying syntax errors and telling users to \"try again later\" for timeouts.\n\nHow should you modify the tool's error handling?","choices":[{"id":"72064","label":"A","text":"A\nReturn all errors with a retryable boolean flag and error type details."},{"id":"72065","label":"B","text":"B\nImplement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details."},{"id":"72066","label":"C","text":"C\nAdd few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors and handle each case appropriately."},{"id":"72067","label":"D","text":"D\nApply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily unavailable\" message after max retries are exhausted."}],"correctAnswerIds":["72065"],"explanation":"Tại sao chọn B: Vấn đề được chia thành hai loại lỗi rõ rệt:\n\nLỗi mạng (8%): Là lỗi tạm thời (transient) và có thể tự động thành công khi retry. Theo thiết kế kiến trúc chuẩn cho Agent tools, tool nên tự xử lý các lỗi này ở bên trong (retry/backoff) để agent không phải tốn turn lãng phí.\n\nLỗi cú pháp (4%): Là lỗi vĩnh viễn (non-transient) do người dùng cung cấp sai. Tool phải trả về ngay lập tức kèm theo chi tiết lỗi xác thực (validation details) để agent biết cách thông báo chính xác cho người dùng sửa lại tham số truy vấn.\n\nTại sao các đáp án khác không phù hợp:\n\nA: Ép agent phải xử lý cờ boolean retryable thủ công vẫn làm tốn số lượt tương tác (turns) của agent và tăng độ phức tạp không cần thiết cho vòng lặp suy luận.\n\nC: Dùng few-shot examples trong system prompt không giải quyết triệt để vấn đề đối với các lỗi mạng có thể tự xử lý ngầm, đồng thời tiêu tốn thêm context token.\n\nD: Áp dụng backoff đồng nhất cho cả lỗi cú pháp là sai nguyên tắc, vì lỗi cú pháp không bao giờ thành công dù có retry bao nhiêu lần đi nữa, dẫn đến việc agent bị kẹt vòng lặp vô ích."},{"index":33,"text":"Your productivity agent connects to three MCP servers: an issue tracker (search_issues, get_issue, create_comment), a documentation wiki (search_docs, get_page, list_spaces), and a database explorer (run_query, get_schema, list_databases). When engineers ask cross-system questions like \"What database tables are affected by the authentication refactor in PROJ-1234?\", monitoring shows the agent makes 8-10 sequential tool calls, frequently issues exploratory calls because it lacks visibility into what content each server contains, and exhausts context space before completing complex investigations.\n\nWhat architectural change best leverages MCP capabilities to address these issues?","choices":[{"id":"72040","label":"A","text":"A\nConsolidate all three servers into a unified MCP server with cross-referencing capabilities"},{"id":"72041","label":"B","text":"B\nAdd an orchestrator that routes questions to a single server based on keywords"},{"id":"72042","label":"C","text":"C\nExpose each server's content catalog as MCP resources—issue summaries, documentation hierarchy, database schemas"},{"id":"72043","label":"D","text":"D\nAdd a prepare_investigation tool to each server that accepts a natural language question and returns relevant content summaries"}],"correctAnswerIds":["72042"],"explanation":"Tại sao chọn C: Model Context Protocol (MCP) thiết kế Resources chuyên dụng để cung cấp cho mô hình khả năng đọc và hiểu cấu trúc, danh mục dữ liệu của server một cách chủ động (như issue summaries, documentation hierarchy, database schemas) mà không cần tốn các lệnh gọi tool (tool calls) mang tính thăm dò. Việc tận dụng MCP resources giúp giảm thiểu đáng kể số lượng vòng lặp (round-trips) và tiết kiệm ngữ cảnh (context space).\n\nTại sao các đáp án khác không phù hợp:\n\nA: Gom tất cả các server thành một thực thể đơn nhất làm mất đi tính module hóa và khả năng tách biệt các dịch vụ độc lập của kiến trúc MCP.\n\nB: Bộ định tuyến dựa trên từ khóa không giải quyết được các câu hỏi mang tính chéo hệ thống (cross-system) vì thông tin cần thiết nằm rải rác ở nhiều server khác nhau.\n\nD: Việc thêm các công cụ dạng prepare_investigation trả về chuỗi văn bản tự do không tận dụng tối đa các nguyên lý thiết kế chuẩn của MCP (như Resources và Prompts) mà vẫn gây quá tải context."},{"index":34,"text":"Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial testing with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due to diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail typically need refinements targeting their specific failure modes before extraction succeeds.\n\nWhich batch processing strategy is the most cost-efficient while still meeting the deadline?","choices":[{"id":"72136","label":"A","text":"A\nUse the real-time API for all 50,000 documents since the batch API's 24-hour processing window creates unacceptable deadline risk."},{"id":"72137","label":"B","text":"B\nSplit documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between batches to improve extraction quality progressively."},{"id":"72138","label":"C","text":"C\nSubmit all 50,000 documents via batch API, then submit failed extractions in successive batches— refining prompts between each batch—until all documents pass validation."},{"id":"72139","label":"D","text":"D\nProcess 2,000 sample documents via real time API to identify failure patterns and refine prompts, then batch process all 50,000 with the optimized prompts."}],"correctAnswerIds":["72138"],"explanation":"Yêu cầu của bài toán:\n\nTối ưu chi phí tối đa (Cost-efficient): Sử dụng Message Batches API giúp giảm 50% chi phí so with Real-time API.\n\nĐảm bảo thời hạn (Deadline 2 tuần): Thời gian xử lý Batch API là trong vòng 24 giờ, hoàn toàn thoải mái cho deadline 14 ngày.\n\nXử lý tài liệu lỗi: 82% tài liệu thành công ngay lần đầu. 18% còn lại bị lỗi có thể được tinh chỉnh prompt và gửi lại qua các đợt batch tiếp theo cho đến khi đạt chuẩn validation.\n\nLý do các phương án còn lại không đúng:\n\nA (Dùng Real-time API cho tất cả 50,000 tài liệu): Tốn gấp đôi chi phí không cần thiết vì Batch API 24h hoàn toàn đáp ứng tốt deadline 2 tuần.\n\nB (Chia thành 10 đợt nối tiếp 5,000 tài liệu): Chạy nối tiếp 10 đợt batch (mỗi đợt mất tối đa 24h) sẽ làm kéo dài tổng thời gian xử lý (có thể mất tới 10 ngày chỉ để đợi batch), tạo ra rủi ro trễ hạn không cần thiết.\n\nD (Thử nghiệm 2,000 mẫu bằng Real-time API): Tự làm tăng thêm chi phí Real-time API và thời gian thử nghiệm thủ công, trong khi đợt Batch 50,000 đầu tiên đã tự động trích xuất thành công ngay 82% dữ liệu với giá giảm một nửa."},{"index":35,"text":"After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver, issue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown from 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the majority of errors involve the agent selecting between semantically overlapping tools- calling issue_credit when process_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data.\n\nWhich approach structurally eliminates the semantic overlaps that are being logged as the error source?","choices":[{"id":"72156","label":"A","text":"A\nSplit the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit, and apply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator routing between them."},{"id":"72157","label":"B","text":"B\nAdd few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair, such as showing when issue_credit or process_refund is appropriate."},{"id":"72158","label":"C","text":"C\nConsolidate semantically overlapping tools-merge issue_credit and process_refund into a single resolve_compensation tool with an optional include_tracking flag."},{"id":"72159","label":"D","text":"D\nEnable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded, so the agent dynamically calls it when needed."}],"correctAnswerIds":["72158"],"explanation":"Bản chất vấn đề: Đề bài nhấn mạnh lỗi xảy ra do sự chồng chéo về mặt ngữ nghĩa (semantic overlaps) giữa các công cụ (issue_credit vs process_refund, check_delivery_status vs lookup_order). Khi hai công cụ có vai trò gần như tương tự nhau, mô hình dễ bị phân vân và chọn sai.\n\nTại sao C đúng (Gom/Tối ưu hóa Tool - Consolidation):\n\nĐể loại bỏ tận gốc vấn đề từ mặt cấu trúc (structurally eliminate), phương pháp hiệu quả nhất là thiết kế lại Tool Schema bằng cách hợp nhất (consolidate/merge) các công cụ bị lặp/chồng chéo chức năng thành một công cụ duy nhất có tham số (parameter/flag) để linh hoạt xử lý các trường hợp.\n\nLý do các phương án còn lại không phải là đáp án giải quyết tận gốc:\n\nA (Chia làm 2 sub-agents): Việc chia sub-agent chỉ chuyển bớt số lượng tool ở từng agent, nhưng trong sub-agent \"financial resolution\" vẫn còn chứa process_refund và issue_credit $\\rightarrow$ sự chồng chéo ngữ nghĩa giữa 2 tool này vẫn chưa bị loại bỏ.\n\nB (Thêm few-shot examples): Đây chỉ là mẹo prompt engineering hỗ trợ thêm, không giải quyết triệt để lỗi từ thiết kế cấu trúc công cụ (structural fix).\n\nD (Enable tool search / defer loading): Kỹ thuật này giúp quản lý khi có quá nhiều tool (tool volume/token overhead), nhưng không giúp giải quyết xung đột khi hai tool có ý nghĩa quá giống nhau."},{"index":36,"text":"Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user data), testing-patterns.md (for all packages), and api-conventions.md (
