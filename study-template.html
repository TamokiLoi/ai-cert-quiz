hung như \"be conservative\" hay \"only flag definite issues\" thường khiến mô hình bỏ sót cả những lỗi nghiêm trọng thực sự (false negatives) do cách diễn đạt quá mơ hồ.\n\nD sai: Lọc từ khóa ở hậu xử lý (post-processing) là giải pháp thô sơ, dễ làm mất các cảnh báo quan trọng và không giúp cải thiện khả năng suy luận cốt lõi của mô hình."},{"index":41,"text":"Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you encounter three error conditions: (1) the tool is called with a malformed request, missing the required user_email parameter (2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system (3) the calendar API returns a 503 because the service is temporarily unavailable.\n\nHow should each error be reported according to MCP's error handling design?","choices":[{"id":"72100","label":"A","text":"A\nReport errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true"},{"id":"72101","label":"B","text":"B\nReport all three as tool results with isError: true"},{"id":"72102","label":"C","text":"C\nReport all three as JSON-RPC protocol errors."},{"id":"72103","label":"D","text":"D\nReport error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}],"correctAnswerIds":["72103"],"explanation":"Theo chuẩn thiết kế xử lý lỗi của Model Context Protocol (MCP):\n\nLỗi 1 (Request không hợp lệ / Thiếu tham số bắt buộc):\n\nĐây là lỗi ở cấp độ giao thức (Protocol-level error) do yêu cầu gửi tới không tuân thủ đúng JSON-RPC schema hoặc sai cú pháp (ví dụ: Invalid params -32602).\n\nMCP yêu cầu trả về trực tiếp JSON-RPC protocol error.\n\nLỗi 2 (Calendar API trả về 404) & Lỗi 3 (Calendar API trả về 503):\n\nĐây là các lỗi trong quá trình thực thi công cụ (Tool execution errors) hoặc lỗi từ hệ thống bên ngoài. Việc gọi tool bản thân nó là hợp lệ về mặt giao thức JSON-RPC, nhưng kết quả thực thi không thành công.\n\nMCP quy định các lỗi này cần được trả về dưới dạng một kết quả công cụ bình thường (Tool Result) kèm thuộc tính isError: true để LLM (hoặc client) có thể đọc thông điệp lỗi và đưa ra hướng xử lý phù hợp."},{"index":42,"text":"Your development team is using Claude Code to automate test generation across a large codebase. However, developers are frequently rejecting the generated test suites because Claude creates a high volume of trivial assertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge cases. You want to guide Claude to generate high-quality, production-ready tests directly without introducing high latency or modifying the core pipeline script.\n\nWhich strategy best ensures that high-quality, meaningful tests are generated in the first place?","choices":[{"id":"72240","label":"A","text":"A\nAdd post-generation coverage analysis that automatically filters out any generated test that doesn't increase line coverage beyond what existing tests provide."},{"id":"72241","label":"B","text":"B\nRestrict test generation to directories where historical quality metrics show higher acceptance rates, disabling it for areas where generated tests consistently require heavy editing."},{"id":"72242","label":"C","text":"C\nImplement a two-phase generation where a second Claude call scores each test against quality criteria, filtering out low-scoring tests before presenting results to developers."},{"id":"72243","label":"D","text":"D\nDocument testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}],"correctAnswerIds":["72243"],"explanation":"Tại sao chọn D:\n\nCLAUDE.md là nơi lưu trữ tiêu chuẩn ngữ cảnh (context/project guidance) tốt nhất cho Claude Code.\n\nĐề bài yêu cầu tạo ra các bài test chất lượng cao ngay từ lần chạy đầu tiên (in the first place) mà không tăng độ trễ (latency) và không sửa đổi script pipeline.\n\nViệc định nghĩa tiêu chuẩn kiểm thử, fixtures có sẵn và cung cấp ví dụ phân biệt (few-shot examples) trực tiếp trong file CLAUDE.md giúp Claude hiểu rõ định hướng ngay từ đầu mà không phát sinh thêm lượt gọi API hay làm tăng độ trễ của hệ thống.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: Lọc theo line coverage chỉ kiểm tra số lượng dòng code được chạy chứ không đảm bảo về mặt chất lượng hay logic của bài test (vẫn có thể giữ lại các trivial assertions).\n\nB sai: Hạn chế thư mục làm giảm phạm vi tự động hóa của dự án thay vì giải quyết bản chất vấn đề chất lượng test do Claude tạo ra.\n\nC sai: Tạo luồng 2 giai đoạn (hai lần gọi Claude) sẽ làm tăng đáng kể độ trễ (latency) và chi phí, vi phạm yêu cầu \"without introducing high latency\" của đề bài."},{"index":43,"text":"When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or temporary database failures).\n\nWhat is the correct pattern for communicating these errors back to the agent?","choices":[{"id":"71784","label":"A","text":"A\nReturn the error message in the tool result content with the isError flag set to true"},{"id":"71785","label":"B","text":"B\nThrow an exception from the tool handler so the agent framework can catch and log it"},{"id":"71786","label":"C","text":"C\nLog the error server-side and return an empty result to avoid confusing the model"},{"id":"71787","label":"D","text":"D\nReturn a success response with a \"status\" field indicating the error type"}],"correctAnswerIds":["71784"],"explanation":"Đáp án đúng cho câu hỏi này là [A].\n\nGiải thích chi tiết:\n\nLý do chọn A: Trong tiêu chuẩn kỹ thuật của Model Context Protocol (MCP), khi một tool gặp lỗi trong quá trình thực thi (như không tìm thấy đơn hàng hoặc lỗi cơ sở dữ liệu), giao thức yêu cầu trả về kết quả công cụ với nội dung thông báo lỗi nhưng quan trọng nhất là phải thiết lập cờ isError: true trong đối tượng kết quả (tool result content). Điều này giúp mô hình LLM nhận biết tường minh rằng lần gọi tool vừa rồi đã thất bại, từ đó có cơ chế tự phục hồi, điều chỉnh tham số hoặc thông báo lại cho người dùng một cách chính xác thay vì hiểu nhầm đó là một dữ liệu thành công trống.\n\nCác đáp án khác không chính xác:\n\nB: Việc ném ngoại lệ (throw exception) từ trình xử lý tool có thể làm sập hoặc ngắt quãng luồng thực thi của framework nếu không được bọc bắt lỗi đúng cách, thay vì trả về thông tin lỗi chuẩn hóa dạng kết quả cho LLM tự xử lý.\n\nC: Việc ẩn lỗi và trả về kết quả trống làm mô hình bị mù thông tin, tưởng rằng không có dữ liệu thay vì biết là đã xảy ra lỗi hệ thống/dữ liệu.\n\nD: Trả về trạng thái thành công (success) nhưng lại kèm theo trường báo lỗi bên trong nội dung phản hồi dễ gây mâu thuẫn logic cho bộ phân tích của agent."},{"index":44,"text":"Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team members should have access to, and you personally want to add an experimental music playlist server that only you are testing.\n\nWhich configuration approach correctly applies MCP server scopes?","choices":[{"id":"72248","label":"A","text":"A\nAdd venue server to ~/.claude.json and playlist server to .mcp.json"},{"id":"72249","label":"B","text":"B\nAdd both servers to your local ~/.claude.json"},{"id":"72250","label":"C","text":"C\nAdd venue server to .mcp.json and playlist server to ~/.claude.json"},{"id":"72251","label":"D","text":"D\nAdd both servers to the project-level .mcp.json file"}],"correctAnswerIds":["72250"],"explanation":"Tại sao chọn C:\n\nFile cấu hình cấp dự án (.mcp.json): Nằm trong thư mục gốc của dự án và được commit vào hệ thống quản lý mã nguồn (Git). Tất cả thành viên trong nhóm làm việc trên dự án này đều sẽ chia sẻ và truy cập được các MCP server khai báo ở đây (phù hợp cho shared venue lookup server).\n\nFile cấu hình cá nhân cục bộ (~/.claude.json): Nằm trong thư mục người dùng cá nhân (home directory). Các server cấu hình ở đây chỉ áp dụng riêng cho máy của bạn và không bị commit vào dự án chung (phù hợp cho experimental music playlist server mà chỉ một mình bạn thử nghiệm).\n\nTại sao các đáp án khác không đúng?\n\nA sai: Bị ngược vị trí: thêm server dùng chung vào file cá nhân ~/.claude.json thì đồng đội sẽ không dùng được, còn đưa server thử nghiệm cá nhân vào .mcp.json sẽ làm ảnh hưởng đến cả đội.\n\nB sai: Nếu đưa cả hai vào ~/.claude.json thì các thành viên khác trong team sẽ không có quyền truy cập vào venue lookup server.\n\nD sai: Nếu đưa cả hai vào .mcp.json thì server nhạc thử nghiệm cá nhân của bạn sẽ bị chia sẻ cho toàn bộ nhóm."},{"index":45,"text":"Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous requests.\n\nWhen a user asks \"Can you help me with the report?\", the assistant responds: \"I'd be happy to help! Could you tell me:\n\n1) Which report?\n\n2) What kind of help—drafting, reviewing, or formatting?\n\n3) What's your deadline?\"\n\nUser analytics show a 40% conversation abandonment rate after these multi-question responses.\n\nWhat's the most effective way to reduce friction while appropriately handling ambiguity?","choices":[{"id":"72004","label":"A","text":"A\nModify the system prompt to instruct the assistant to make reasonable assumptions from available context, state those assumptions explicitly, and offer to adjust if the interpretation is wrong."},{"id":"72005","label":"B","text":"B\nAdd a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant."},{"id":"72006","label":"C","text":"C\nLimit the assistant to one clarifying question per turn, using conversation history to accumulate answers over multiple exchanges rather than requesting everything upfront."},{"id":"72007","label":"D","text":"D\nCreate a lookup table of common request patterns with predefined default interpretations, having the assistant respond with those defaults without stating the assumptions made."}],"correctAnswerIds":["72004"],"explanation":"Đây là nguyên tắc rất quan trọng trong thiết kế Claude:\n\nĐừng hỏi quá nhiều nếu có thể đưa ra một giả định hợp lý. Hãy nói rõ giả định đó và sẵn sàng điều chỉnh nếu sai.\n\nTrong ví dụ:\n\n\"Can you help me with the report?\"\n\nAssistant hoàn toàn có thể tận dụng ngữ cảnh trước đó.\n\nVí dụ:\n\n\"Mình sẽ giả sử bạn đang nói về báo cáo doanh số quý này. Mình sẽ bắt đầu xem cấu trúc báo cáo. Nếu bạn đang nói đến báo cáo khác hoặc muốn mình soạn thảo thay vì rà soát thì cứ nói nhé.\"\n\nĐiều này:\n\ngiảm số lượt trao đổi,\n\ngiảm tỷ lệ người dùng bỏ cuộc,\n\nvẫn minh bạch về giả định,\n\nvẫn cho phép người dùng sửa nếu assistant hiểu sai.\n\nĐây chính là triết lý thiết kế mà Claude thường khuyến khích.\n\nTại sao A đúng: Trong thiết kế hội thoại của trợ lý AI (đặc biệt là theo các nguyên tắc chuẩn của hệ thống lớn như Claude), khi gặp các yêu cầu mơ hồ, việc đặt hàng loạt câu hỏi dồn dập (như hỏi liền 3 ý một lúc) sẽ tạo ra \"rào cản tâm lý\" (friction), dẫn đến tỷ lệ người dùng bỏ cuộc cao (40% conversation abandonment rate). Giải pháp tối ưu là hướng dẫn mô hình đưa ra các giả định hợp lý dựa trên ngữ cảnh hiện có, nói rõ giả định đó ngay trong câu trả lời và bắt tay vào hỗ trợ ngay lập tức, đồng thời mở ngỏ việc điều chỉnh nếu hiểu sai ý người dùng. Cách này giúp duy trì nhịp độ liền mạch và giảm thiểu tối đa sự phiền hà cho người dùng.\n\nTại sao các đáp án khác sai:\n\nB: Việc thêm một bước tiền xử lý bằng mô hình nhỏ để phân loại độ mơ hồ làm tăng độ phức tạp kiến trúc và độ trễ không cần thiết cho hệ thống.\n\nC: Mặc dù việc chỉ hỏi một câu hỏi làm rõ tốt hơn hỏi nhiều câu, nhưng theo thống kê của bài toán, việc liên tục phải hỏi lại qua nhiều lượt vẫn gây mất thời gian và tăng tỷ lệ bỏ cuộc; chiến lược tốt hơn là chủ động đoán hợp lý và làm việc luôn thay vì bắt người dùng trả lời thêm.\n\nD: Việc dùng bảng tra cứu với các diễn giải mặc định cứng nhắc mà không nói rõ giả định sẽ khiến người dùng bối rối khi hệ thống làm sai lệch hoàn toàn ý định thực tế mà không cho thấy lý do vì sao."},{"index":46,"text":"Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute involves a promotional pricing error requiring manager approval–beyond the agent's authorization level.\n\nHow should the workflow handle this mid-process escalation?","choices":[{"id":"71804","label":"A","text":"A\nCompile a structured handoff with customer details, order info, and the identified issue before calling escalate_to_human."},{"id":"71805","label":"B","text":"B\nPersist the complete conversation and tool response history to a database, then call escalate_to_human with a reference ID."},{"id":"71806","label":"C","text":"C\nCall escalate_to_human passing only the customer's original message."},{"id":"71807","label":"D","text":"D\nAttempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}],"correctAnswerIds":["71804"],"explanation":"Đáp án đúng cho câu hỏi này là [A].\n\nGiải thích chi tiết:\n\nLý do chọn A: Khi agent gặp một vấn đề vượt quá thẩm quyền của mình (như lỗi giá khuyến mãi cần quản lý phê duyệt) sau các bước tra cứu (get_customer và lookup_order), cách xử lý chuẩn hóa và hiệu quả nhất là biên soạn một bản chuyển giao có cấu trúc (structured handoff) bao gồm thông tin chi tiết về khách hàng, thông tin đơn hàng và vấn đề đã xác định trước khi gọi công cụ escalate_to_human. Điều này giúp nhân viên con người nắm bắt bối cảnh ngay lập tức mà không phải hỏi lại từ đầu.\n\nCác đáp án khác không chính xác:\n\nB: Việc lưu trữ toàn bộ lịch sử hội thoại vào cơ sở dữ liệu và chỉ truyền một ID tham chiếu làm tăng độ phức tạp hạ tầng không cần thiết và bắt nhân viên phải mất thời gian tra cứu ngoài luồng.\n\nC: Chỉ truyền mỗi tin nhắn ban đầu của khách hàng làm mất toàn bộ ngữ cảnh quan trọng đã được agent thu thập từ các bước gọi công cụ (get_customer, lookup_order).\n\nD: Cố tình gọi công cụ xử lý hoàn tiền (process_refund) vượt quyền hạn trong khi biết rõ nó yêu cầu phê duyệt cấp quản lý là vi phạm quy tắc an toàn bảo mật hệ thống."},{"index":47,"text":"A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via lookup_order that the return is straightforward–within policy and eligible for immediate processing.\n\nWhat should the agent do?","choices":[{"id":"71820","label":"A","text":"A\nAsk what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically"},{"id":"71821","label":"B","text":"B\nProcess the refund via process_refund to resolve the underlying issue, then inform them it's complete"},{"id":"71822","label":"C","text":"C\nCall escalate_to_human immediately to honor the customer's request"},{"id":"71823","label":"D","text":"D\nAcknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate"}],"correctAnswerIds":["71823"],"explanation":"Đáp án đúng cho câu hỏi này là [D].\n\nGiải thích chi tiết:\n\nLý do chọn D: Khách hàng bày tỏ sự bức xúc (\"going back and forth on this return for days\") và yêu cầu nói chuyện với người thật, tuy nhiên hệ thống/agent đã xác định rõ ràng đơn hàng hoàn toàn hợp lệ và có thể xử lý ngay lập tức. Theo nguyên tắc thiết kế trải nghiệm người dùng tối ưu cho agent, agent không nên lập tức ép buộc leo thang (bỏ qua khả năng tự động hóa khi vấn đề đã sẵn sàng giải quyết), nhưng cũng không được phớt lờ cảm xúc của khách hàng bằng cách tự ý xử lý ngầm (đáp án B). Phương án cân bằng tốt nhất là thừa nhận sự thất vọng của họ, thông báo rằng vấn đề đã có thể giải quyết ngay lập tức, và tôn trọng quyền lựa chọn của khách hàng giữa việc để AI hoàn tất thủ công hoặc chuyển giao cho con người.\n\nCác đáp án khác không chính xác:\n\nA: Việc tiếp tục gặng hỏi vòng vo nguyên nhân từ các lần thử trước làm khách hàng thêm mệt mỏi.\n\nB: Tự ý tự động xử lý mà không tôn trọng mong muốn tương tác hoặc thông báo rõ ràng cho khách hàng có thể khiến họ cảm thấy không được lắng nghe.\n\nC: Lập tức leo thang ngay khi vấn đề hoàn toàn nằm trong tầm tay tự động xử lý của agent sẽ làm lãng phí năng lực hệ thống, trong khi khách hàng thực chất chỉ cần kết quả được giải quyết nhanh chóng."},{"index":48,"text":"During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent correctAnswerss about code structure it discussed earlier. Engineers report having to repeat context about modules they've already explored. What's the most effective approach to address this?","choices":[{"id":"72460","label":"A","text":"A\n\nHave the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions."},{"id":"72461","label":"B","text":"B\nSwitch to a higher-capacity model tier to provide more context window space for accumulated exploration data."},{"id":"72462","label":"C","text":"C\nImplement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context."},{"id":"72463","label":"D","text":"D\nCreate summaries of all source files before exploration begins, loading only these compressed representations into context."}],"correctAnswerIds":["72460"],"explanation":"Tại sao chọn A:\n\nNguyên nhân gây ra vấn đề là hiện tượng mất chú ý/suy giảm ngữ cảnh (context degradation / attention drift) khi các phiên khám phá kéo dài làm ngữ cảnh bị kéo quá dài.\n\nViệc sử dụng một file scratchpad (nháp/ghi chú) giúp agent chủ động ghi lại các phát hiện kiến trúc quan trọng (key findings) vào bộ nhớ ngoài (external memory). Khi cần trả lời các câu hỏi tiếp theo, agent có thể tham chiếu lại file scratchpad này để đảm bảo câu trả lời luôn nhất quán và chính xác mà không bắt lập trình viên phải nhắc lại ngữ cảnh cũ hay phụ thuộc vào lịch sử chat quá dài.\n\nTại sao các đáp án khác không phù hợp?\n\nB sai: Tăng dung lượng cửa sổ ngữ cảnh (larger context window) không giải quyết được vấn đề LLM bị \"nhiễu\" hoặc quên thông tin nằm ở giữa/đầu ngữ cảnh dài (vấn đề \"lost in the middle\").\n\nC sai: Tự động xóa sạch context mỗi 15 phút sẽ làm mất hoàn toàn lịch sử làm việc, bắt agent phải tìm hiểu lại code từ đầu.\n\nD sai: Việc tóm tắt tất cả file nguồn trước khi bắt đầu sẽ làm mất đi các chi tiết quan trọng và tốn rất nhiều token ban đầu, đồng thời không giải quyết được nhu cầu khám phá sâu trong quá trình làm việc."},{"index":49,"text":"The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate — it generates messages like \"I'll ask the web search agent to find sources on this topic\" — but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors.\n\nWhat is the most likely cause?","choices":[{"id":"71852","label":"A","text":"A\nThe AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked."},{"id":"71853","label":"B","text":"B\nThe coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents."},{"id":"71854","label":"C","text":"C\nSubagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions."},{"id":"71855","label":"D","text":"D\nThe coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified."}],"correctAnswerIds":["71853"],"explanation":"Đáp án đúng cho câu hỏi này là:\n\nB. The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.\n\nGiải thích chi tiết\n\nTại sao đáp án B đúng:\n\nTrong kiến trúc agent phân tầng (như mô hình Anthropic/Claude Agent SDK), mô hình ngôn ngữ (LLM) có thể nhận biết và suy luận về việc khi nào cần giao việc (ví dụ: tạo ra các câu suy nghĩ như \"I'll ask the web search agent...\"). Tuy nhiên, LLM chỉ có thể thực sự gọi công cụ (tool execution) nếu công cụ đó được khai báo rõ ràng trong cấu hình allowedTools của agent. Nếu thiếu công cụ \"Task\" (hoặc công cụ dùng để kích hoạt subagent), agent chỉ có thể \"nói\" về việc giao việc mà không thể thực thi lệnh gọi tool thực tế, dẫn đến việc không có subagent nào chạy và không có lỗi nào được ghi nhận ở tầng logic của code.\n\nTại sao các đáp án khác sai:\n\nĐáp án A sai: Hệ thống không bắt buộc phải liệt kê thủ công từng loại subagent trong system prompt nếu chúng đã được cấu hình sẵn trong AgentDefinitions. Mô hình có thể đọc định nghĩa từ phần khai báo để hiểu cách sử dụng.\n\nĐáp án C sai: Subagent không gặp lỗi thiếu ngữ cảnh do tự động cô lập khiến lệnh gọi không hoạt động hoàn toàn. Vấn đề cốt lõi ở đây là subagent không hề được khởi chạy (spawn), chứ không phải việc truyền dữ liệu giữa các agent gặp lỗi.\n\nĐáp án D sai: Lỗi max_tokens quá thấp thường dẫn đến việc câu trả lời bị cắt cụt (truncated) đột ngột giữa chừng, gây ra lỗi phân tích cú pháp (JSON/Tool call syntax error). Trong khi đó, đề bài nêu rõ là mô hình hoàn thành chuỗi suy luận bình thường, tạo ra thông báo đầy đủ và \"Logs show no errors\"."},{"index":50,"text":"The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources.\n\nHow does information typically flow between these two specialized subagents?","choices":[{"id":"71752","label":"A","text":"A\nBoth agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them."},{"id":"71753","label":"B","text":"B\nThe web search agent directly invokes the document analysis agent, passing the discovered sources as parameters."},{"id":"71754","label":"C","text":"C\nThe coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent."},{"id":"71755","label":"D","text":"D\nThe agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events."}],"correctAnswerIds":["71754"],"explanation":"Đáp án đúng cho câu hỏi này là [C].\n\nGiải thích chi tiết:\n\nLý do chọn C: Trong kiến trúc hệ thống đa agent tiêu chuẩn (đặc biệt là theo các mẫu thiết kế của Anthropic Claude / Multi-agent Orchestration), các subagent thường không giao tiếp trực tiếp với nhau. Thay vào đó, Coordinator Agent (hoặc Orchestrator) đóng vai trò trung tâm: nhận kết quả đầu ra từ subagent thứ nhất (web search agent), xử lý/tổng hợp dữ liệu đó, rồi truyền tải các phát hiện có liên quan vào prompt khi gọi subagent tiếp theo (document analysis agent).\n\nCác đáp án khác không chính xác:\n\nA & D: Việc sử dụng kho nhớ chia sẻ (shared memory store) hay hàng đợi tin nhắn hướng sự kiện (event-driven message queue) phức tạp thường không phải là mô hình luồng thông tin tiêu chuẩn của các hệ thống agent dựa trên LLM thông thường, nơi việc kiểm soát ngữ cảnh nằm ở vòng lặp của Coordinator.\n\nB: Các subagent độc lập không gọi trực tiếp lẫn nhau qua các tham số hàm mà thông qua bộ điều phối trung tâm."},{"index":51,"text":"Your send_notification tool calls third-party messaging APIs. When these services time out during delivery, you cannot determine whether the message was actually sent. Currently, the tool returns is_error: true with a generic “Notification failed” message for all timeouts. Production monitoring reveals agents automatically retry these failures, frequently causing users to receive duplicate notifications. How should you modify the error response?","choices":[{"id":"77759","label":"A","text":"A\n\nReturn is_error: true with a structured field retry_safe: true for timeouts, distinguishing them from permanent failures that should not be retried."},{"id":"77760","label":"B","text":"B\n\nReturn is_error: true with a message communicating uncertainty: “Timeout – status unknown. Message may have been sent. Avoid retry.”"},{"id":"77761","label":"C","text":"C\n\nReturn is_error: true with a message encouraging retry: “Delivery service temporarily unavailable. Please retry the notification.”"},{"id":"77762","label":"D","text":"D\n\nReturn is_error: true with the original message content echoed back."}],"correctAnswerIds":["77760"],"explanation":"Vì sao B là thiết kế tối ưu nhất?\n\nGiải quyết trực tiếp bài toán Duplicate Notifications (Trùng lặp tin nhắn):\n\nTrong thiết kế hệ thống phân tán, sự cố Timeout là một trạng thái không xác định (At-Least-Once / Unknown Delivery State): tin nhắn có thể đã tới nơi nhưng phản hồi HTTP ACK bị thất lạc, hoặc tin nhắn chưa tới.\n\nKhi Agent nhận được thông báo rõ ràng rằng trạng thái không chắc chắn và được hướng dẫn \"Avoid retry\" (Tránh gửi lại), nó sẽ dừng hành vi tự động gọi lại tool, ngăn chặn việc người dùng nhận tin nhắn trùng lặp.\n\nCung cấp ngữ cảnh trung thực cho LLM:\n\nThay vì báo một lỗi mơ hồ hay khẳng định tin nhắn chưa gửi được, thông điệp phản ánh đúng bản chất kỹ thuật giúp Agent đưa ra câu trả lời phù hợp cho người dùng (ví dụ: \"Hệ thống thông báo có thể đã gửi được tin nhắn nhưng chưa xác nhận được phản hồi. Bạn vui lòng kiểm tra hộp thư trước khi thực hiện gửi lại\").\n\nVì sao các đáp án khác không phù hợp?\n\nA. Đánh dấu retry_safe: true ❌\n\nTạo ra sai lầm nghiêm trọng hơn: Đánh dấu retry_safe: true (Thao tác an toàn để thử lại) báo hiệu cho Agent rằng thao tác này mang tính idempotent (hoặc chắc chắn chưa thành công). Điều này sẽ khuyến khích Agent retry ngay lập tức, làm trầm trọng thêm vấn đề gửi trùng tin nhắn.\n\nC. Khuyến khích retry (Please retry the notification) ❌\n\nTương tự như A, việc khuyến khích thử lại khi chưa biết chắc tin nhắn đã đi hay chưa chính là nguyên nhân trực tiếp gây ra việc người dùng nhận 2–3 tin nhắn trùng lặp.\n\nD. Echo lại nội dung tin nhắn ban đầu ❌\n\nViệc gửi lại nội dung tin nhắn không cung cấp bất kỳ thông tin nào về trạng thái giao nhận (delivery status) hay hướng dẫn về việc có nên thử lại hay không, hoàn toàn không giải quyết được vấn đề của bài toán."},{"index":52,"text":"Your agent has analyzed a complex service module—reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?","choices":[{"id":"72452","label":"A","text":"A\nExport the analysis session's key findings to a file, then create two new sessions that reference this file."},{"id":"72453","label":"B","text":"B\n\nResume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."},{"id":"72454","label":"C","text":"C\nStart two fresh sessions, having each re-read the relevant source files before beginning."},{"id":"72455","label":"D","text":"D\nContinue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}],"correctAnswerIds":["72453"],"explanation":"Tại sao chọn B:\n\nLập trình viên đã mất rất nhiều chi phí token và thời gian để agent phân tích xong ngữ cảnh của 23 source files, luồng yêu cầu và mô hình xử lý lỗi.\n\nTính năng fork_session (rẽ nhánh session) cho phép kế thừa toàn bộ ngữ cảnh/kiến thức đã phân tích từ session ban đầu sang các nhánh độc lập hoàn toàn. Việc tạo 2 nhánh riêng biệt từ phiên phân tích ban đầu giúp phát triển độc lập hai chiến lược test khác nhau mà không phải phân tích lại từ đầu hay làm lẫn lộn ngữ cảnh giữa 2 phương pháp.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: Việc xuất ra file rồi truyền vào session mới làm mất đi lịch sử ngữ cảnh chi tiết (tracing, error handling patterns...) mà agent đã phân tích sâu trước đó.\n\nC sai: Việc bắt 2 session mới đọc lại 23 file nguồn từ đầu gây lãng phí chi phí token và thời gian xử lý không cần thiết.\n\nD sai: Phát triển tuần tự trong cùng một session sẽ làm ngữ cảnh bị kéo dài (bloated context), dễ gây lẫn lộn giữa hai chiến lược test và khiến agent đưa ra kết quả không chính xác."},{"index":53,"text":"Your order management system requires tools for three distinct operations: issuing refunds (requires amount and reason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id parameter but has different additional requirements. You notice during testing that with your current frequently omits required parameters or includes irrelevant ones.\n\nWhat design change will most effectively improve parameter accuracy?","choices":[{"id":"72164","label":"A","text":"A\nKeep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt showing correct parameter combinations for each operation."},{"id":"72165","label":"B","text":"B\nKeep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount are required only when the operation type is \"refund\"."},{"id":"72166","label":"C","text":"C\nSplit into three separate tools (each defining only the parameters required for that specific operation."},{"id":"72167","label":"D","text":"D\nKeep one unified tool with a nested operation object parameter whose internal structure varies by operation type, documented in the tool description."}],"correctAnswerIds":["72166"],"explanation":"Bản chất vấn đề:\n\nKhi một công cụ duy nhất (unified tool) cố gắng xử lý nhiều thao tác có các tham số đầu vào khác nhau (refund, cancel, reship), mô hình LLM rất dễ bị nhầm lẫn, dẫn đến việc bỏ sót các tham số bắt buộc hoặc truyền thừa các tham số không liên quan.\n\nViệc định nghĩa tất cả tham số dưới dạng optional hoặc dùng cấu trúc điều kiện phức tạp khiến mô hình khó tuân thủ chính xác JSON Schema.\n\nTại sao C đúng (Single Responsibility Principle for Tools):\n\nChia thành 3 công cụ riêng biệt (issue_refund, cancel_order, reship_order) với JSON Schema rõ ràng cho từng thao tác giúp mô hình dễ dàng xác định chính xác tham số nào là bắt buộc (required) cho thao tác đó.\n\nĐây là thực hành chuẩn (Best Practice) thiết kế Tool Use cho Claude/LLMs: Thà tạo nhiều công cụ nhỏ với nhiệm vụ và schema rõ ràng hơn là dùng một công cụ đa năng có schema phức tạp.\n\nLý do các phương án còn lại không tối ưu:\n\nA (Dùng Few-shot examples): Không đảm bảo triệt để 100% độ chính xác vì schema vẫn đánh dấu các tham số là optional, mô hình vẫn có xác xuất điền sai.\n\nB (Dùng JSON Schema if-then-else): Mặc dù chuẩn JSON Schema hỗ trợ điều kiện if-then-else, hầu hết các mô hình LLM (bao gồm Claude) xử lý cú pháp logic phức tạp này trong schema rất kém.\n\nD (Dùng Nested operation object): Tạo thêm cấu trúc lồng nhau phức tạp (nested object) làm tăng độ khó cho mô hình khi tạo JSON payload, dễ dẫn đến lỗi định dạng."},{"index":54,"text":"Your agent uses three tools: get_property_details(property_id) returns data including street address, get_price_history(property_id) returns historical pricing, and get_neighborhood_info(address) returns area statistics. You observe that get_neighborhood_info always requires get_property_details first just to extract the address, even when users specify the property by ID. This creates unnecessary latency and failure coupling – if the first call fails, the neighborhood request also fails. What tool design change best addresses this?","choices":[{"id":"77747","label":"A","text":"A\n\nCreate a lookup_address(property_id) helper tool for retrieving addresses."},{"id":"77748","label":"B","text":"B\n\nAdd retry logic and timeout handling to get_property_details."},{"id":"77749","label":"C","text":"C\n\nChange get_neighborhood_info to accept property_id, resolving the address internally."},{"id":"77750","label":"D","text":"D\n\nConsolidate into a single get_property_with_neighborhood(property_id) tool returning both datasets."}],"correctAnswerIds":["77749"],"explanation":"Vì sao C là thiết kế tối ưu nhất?\n\nGiải quyết triệt để vấn đề phụ thuộc (Failure Coupling) & Độ trễ (Latency):\n\nHiện tại, workflow bắt buộc phải trải qua 2 vòng gọi API (Round-trips): get_property_details $\\rightarrow$ bóc tách address $\\rightarrow$ get_neighborhood_info.\n\nBằng cách cho phép get_neighborhood_info chấp nhận trực tiếp property_id (hoặc chấp nhận cả property_id lẫn address linh hoạt), Agent có thể gọi tool này ngay từ đầu hoặc chạy song song (parallel tool calling) với get_property_details. Việc tra cứu địa chỉ từ property_id được xử lý nội bộ phía backend (nơi có tốc độ truy xuất nhanh và độ tin cậy cao hơn nhiều so với việc bắt Agent trung chuyển dữ liệu).\n\nVì sao các đáp án khác không phù hợp?\n\nA. Tạo thêm tool lookup_address(property_id) ❌\n\nKhông giải quyết được vấn đề. Việc này thậm chí còn tạo thêm một tool trung gian, làm tăng số lượng tool call của Agent và vẫn giữ nguyên chuỗi phụ thuộc (Dependency Chain).\n\nB. Thêm logic retry và timeout cho get_property_details ❌\n\nChỉ làm tăng độ bền vững (resilience) của bản thân get_property_details, nhưng không giải quyết được kiến trúc bị gắn chặt (tight coupling). Nếu dịch vụ get_property_details bị downtime dài, get_neighborhood_info vẫn sẽ thất bại hoàn toàn.\n\nD. Gộp thành một tool duy nhất get_property_with_neighborhood(property_id) ❌\n\nVi phạm nguyên tắc Đơn nhiệm (Single Responsibility Principle) trong thiết kế Tool/API. Nếu người dùng chỉ muốn hỏi thông tin khu vực mà không cần chi tiết bất động sản (hoặc ngược lại), tool gộp này sẽ gây lãng phí tài nguyên và làm tăng thời gian phản hồi không cần thiết."},{"index":55,"text":"In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings.\n\nWhat's the most effective architectural change?","choices":[{"id":"71760","label":"A","text":"A\nAdd a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents."},{"id":"71761","label":"B","text":"B\nMaintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation."},{"id":"71762","label":"C","text":"C\nHave the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations."},{"id":"71763","label":"D","text":"D\nRequire all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources."}],"correctAnswerIds":["71763"],"explanation":"Đáp án đúng cho câu hỏi này là [D].\n\nGiải thích chi tiết:\n\nLý do chọn D: Vấn đề cốt lõi là khi tổng hợp thông tin, synthesis agent bị mất liên kết giữa các kết luận và nguồn gốc do các subagent trả về văn bản thông thường thiếu ràng buộc cấu trúc. Giải pháp kiến trúc chuẩn và hiệu quả nhất là bắt buộc các subagent xuất ra dưới dạng ánh xạ cấu trúc giữa tuyên bố và nguồn (claim-source mappings). Agent tổng hợp sau đó có trách nhiệm bảo toàn, kế thừa và gộp các ánh xạ này xuyên suốt quá trình xử lý.\n\nCác đáp án khác không chính xác:\n\nA: Dùng semantic similarity matching hậu kiểm (sau khi đã phát sinh lỗi mất nguồn) làm tăng độ phức tạp tính toán, dễ sai sót và chỉ mang tính chất vá víu (post-hoc) thay vì giải quyết từ gốc kiến trúc truyền dữ liệu.\n\nB: Duy trì bản ghi toàn bộ tương tác và thêm một agent chuyên phân tích log là giải pháp rườm rà, tiêu tốn nhiều tài nguyên và context window không cần thiết.\n\nC: Việc tiêm các tiền tố định danh nguồn thủ công (prefixes) dễ bị lỗi parser, không bền vững bằng việc sử dụng cấu trúc dữ liệu tường minh (như JSON/structured objects)."},{"index":56,"text":"Analysis reveals the coordinator invokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits again. These tasks are independent—neither requires the other's output. How should you modify the system to run these subagents concurrently?","choices":[{"id":"72272","label":"A","text":"A\nSwitch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."},{"id":"72273","label":"B","text":"B\nCreate an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator-subagent pair, then aggregates results."},{"id":"72274","label":"C","text":"C\n\nStructure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message rather than across separate conversation turns."},{"id":"72275","label":"D","text":"D\nAdd detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution and requesting it invoke both subagents at the same time."}],"correctAnswerIds":["72274"],"explanation":"Tại sao chọn C:\n\nAPI của Claude hỗ trợ cơ chế gọi nhiều công cụ song song (Parallel Tool Calling). Khi coordinator trả về một tin nhắn response chứa đồng thời nhiều khối gọi tool (tool_use blocks) cho cả web search và document analysis, hệ thống client/runtime có thể thực thi cả hai subagent này song song cùng lúc, giúp tối ưu hóa đáng kể thời gian xử lý.\n\nTại sao các đáp án khác không đúng?\n\nA sai: Chuyển sang model Haiku chỉ làm giảm thời gian chạy của từng task riêng lẻ chứ không giải quyết bản chất vấn đề thực thi nối tiếp (sequential execution) thành song song.\n\nB sai: Tạo thêm một tầng async bên ngoài tạo ra hai cặp coordinator-subagent là làm phức tạp hóa kiến trúc không cần thiết, trong khi một coordinator duy nhất hoàn toàn có thể tự gọi nhiều tool song song.\n\nD sai: Chỉ thêm hướng dẫn suông trong system prompt mà không cấu hình/định hình đầu ra của coordinator gửi cả 2 tool call trong cùng một lượt (turn) thì mô hình vẫn có thể quay lại thói quen gọi tuần tự."},{"index":57,"text":"When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time. What change would best enable the synthesis agent to correctly interpret such temporal differences?","choices":[{"id":"72332","label":"A","text":"A\n\nRequire subagents to include publication or data collection dates in their structured outputs."},{"id":"72333","label":"B","text":"B\nAdd a conflict resolution agent that automatically discards older data when newer data exists for the same metric."},{"id":"72334","label":"C","text":"C\nConfigure the web search agent to only return results from the past 6 months."},{"id":"72335","label":"D","text":"D\nInstruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix."}],"correctAnswerIds":["72332"],"explanation":"Tại sao chọn A:\n\nĐể agent tổng hợp (synthesis agent) có thể nhận biết và phân tích được xu hướng theo thời gian (temporal differences/growth) thay vì coi đó là dữ liệu mâu thuẫn (contradiction), nó cần có ngữ cảnh rõ ràng về thời gian của từng điểm dữ liệu.\n\nViệc bắt buộc các subagent phải trích xuất và đính kèm ngày xuất bản hoặc ngày thu thập dữ liệu (publication/data collection dates) trong đầu ra có cấu trúc (structured output) sẽ cung cấp cho synthesis agent đúng thông tin ngữ cảnh thời gian cần thiết để đưa ra kết luận chính xác (ví dụ: tăng từ 18% năm 2022 lên 35% năm 2024).\n\nTại sao các đáp án khác không phù hợp?\n\nB sai: Tự động loại bỏ dữ liệu cũ (discard older data) sẽ làm mất thông tin lịch sử quan trọng, khiến hệ thống không thể phân tích được xu hướng hay sự tăng trưởng theo thời gian.\n\nC sai: Giới hạn tìm kiếm chỉ trong 6 tháng gần nhất sẽ bỏ qua hoàn toàn các báo cáo nội bộ/dữ liệu quá khứ cần thiết cho việc so sánh.\n\nD sai: Việc đẩy dữ liệu cũ vào phụ lục một cách máy móc không giúp synthesis agent hiểu được mối quan hệ logic/tăng trưởng giữa hai điểm dữ liệu trong báo cáo chính."},{"index":58,"text":"Your get_portfolio_value tool returns the total value of a user’s investment portfolio. You’re deciding between returning a structured JSON object with explicit fields versus returning the information as a formatted text string. What is the primary advantage of using structured output with defined fields?","choices":[{"id":"77775","label":"A","text":"A\n\nJSON schemas automatically validate that the underlying API returned correct data before the agent processes it."},{"id":"77776","label":"B","text":"B\n\nStructured JSON consumes significantly fewer tokens than natural language, substantially reducing API costs."},{"id":"77777","label":"C","text":"C\n\nStructured JSON is processed deterministically by the model, significantly improving accuracy when extracting values."},{"id":"77778","label":"D","text":"D\n\nThe agent can reliably extract specific values without parsing free-form text, reducing errors in subsequent operations."}],"correctAnswerIds":["77778"],"explanation":"Giảm thiểu lỗi trích xuất dữ liệu (Reliable Data Extraction):\n\nKhi tool trả về dữ liệu cấu trúc JSON (ví dụ: {\"portfolio_value\": 125000.50, \"currency\": \"USD\"}), các cặp key-value được định nghĩa rõ ràng. Agent có thể xác định ngay lập tức giá trị cần tìm mà không cần phải xử lý hay đoán ngữ cảnh từ văn bản tự do (free-form text) như \"Tổng giá trị danh mục đầu tư của bạn hiện tại là $125,000.50 USD\".\n\nTăng độ chính xác cho các bước xử lý tiếp theo (Downstream Tool Calls):\n\nNếu Agent cần lấy giá trị này để truyền vào một công cụ khác (ví dụ: calculate_tax hoặc rebalance_portfolio), việc trích xuất từ định dạng JSON giúp tránh được các lỗi phổ biến khi phân tích văn bản như: nhầm lẫn đơn vị tiền tệ, lấy sai dấu chấm/phẩy thập phân, hoặc bỏ sót dữ liệu.\n\nVì sao các đáp án khác không phù hợp?\n\nA. Tự động kiểm tra dữ liệu chính xác từ API ❌\n\nJSON Schema chỉ kiểm tra được cấu trúc và kiểu dữ liệu (type constraint, ví dụ: bắt buộc là number hay string), chứ không thể tự động xác minh xem dữ liệu trả về từ API có chính xác về mặt thực tế hay không.\n\nB. Tiết kiệm đáng kể token và giảm chi phí ❌\n\nĐịnh dạng JSON chứa nhiều cú pháp phụ như ngoặc nhọn {}, ngoặc kép \"\", tên trường (keys)... Do đó, JSON không nhất thiết tiết kiệm token hơn văn bản tự nhiên, thậm chí đôi khi còn tốn nhiều token hơn một chút.\n\nC. Mô hình xử lý theo cơ chế định tính hoàn toàn (Deterministic) ❌\n\nLLM bản chất hoạt động theo mô hình xác suất (probabilistic). Dù dữ liệu đầu vào là JSON, việc mô hình suy luận vẫn dựa trên xác suất chứ không trở thành định tính tuyệt đối (deterministic)."},{"index":59,"text":"Introduction monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator invokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits again. These tasks are independent - neither requires the other's output. How should you modify the system to run these subagents concurrently?","choices":[{"id":"72576","label":"A","text":"A\nSwitch both subagents to use a Haiku tier model instead of to reduce their individual execution time."},{"id":"72577","label":"B","text":"B\nCreate an async orchestration layer outside the agent that spawns parallel threads, each running a separate coordinator subagent pair, then aggregates results."},{"id":"72578","label":"C","text":"C\nAdd detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel execution and requesting it invoke both subagents at the same"},{"id":"72579","label":"D","text":"D\n\nStructure the coordinator to emit both Task tool calls (for web search and document analysis) in a single response message rather than across separate conversation turns."}],"correctAnswerIds":["72579"],"explanation":"Tại sao chọn D:\n\nTrong kiến trúc Agentic Workflow (đặc biệt là với Anthropic Claude / Task / Sub-agent Framework), khi một agent phát ra nhiều Tool Calls trong cùng một thông điệp phản hồi (single response turn), môi trường thực thi (execution runtime) sẽ tự động kích hoạt và thực thi các tool / subagent đó song song (concurrently/in parallel).\n\nViệc yêu cầu coordinator xuất ra cả 2 lệnh gọi subagent (Task tool calls) trong một turn trả về duy nhất giúp hệ thống tự động chạy đồng thời cả tìm kiếm web và phân tích tài liệu, tối ưu thời gian xử lý mà không cần thay đổi kiến trúc hạ tầng phức tạp.\n\nTại sao các đáp án khác không phù hợp?\n\nA sai: Đổi sang mô hình Haiku có thể giảm thời gian phản hồi của từng nhiệm vụ nhưng không giải quyết được vấn đề thực thi tuần tự (sequential execution) vốn có.\n\nB sai: Tạo thêm một lớp bất đồng bộ phức tạp bên ngoài làm tăng độ phức tạp hệ thống không cần thiết, trong khi cơ chế tool use của Claude đã hỗ trợ gọi tool song song tự nhiên.\n\nC sai: Chỉ đưa hướng dẫn trong prompt mà không cấu trúc cơ chế gọi tool (tool call generation) sẽ khiến LLM vẫn dễ quay lại thói quen gọi tuần tự từng tool một."}]}]</script>
  <script>
    'use strict';
    const sets = JSON.parse(document.getElementById('study-data').textContent);
    const container = document.getElementById('questions');
    const savedKey = 'certlab-study-answers-v1';
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(savedKey) || '{}') || {}; } catch (_) { saved = {}; }
    const answers = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    const cards = [];

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function normalize(text) {
      return String(text).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }
    function choiceText(choice) {
      return choice.text.replace(new RegExp('^\\s*' + choice.label + '\\s*\\n\\s*'), '').trim();
    }
    function store() {
      try { localStorage.setItem(savedKey, JSON.stringify(answers)); } catch (_) { /* Vẫn cho phép học nếu trình duyệt chặn lưu trữ. */ }
    }
    function progress() {
      let attempted = 0, correct = 0;
      for (const { key, question } of cards) {
        if (!Object.hasOwn(answers, key)) continue;
        attempted++;
        if (question.correctAnswerIds.includes(answers[key])) correct++;
      }
      document.getElementById('progress').textContent = `Đã làm ${attempted}/${cards.length} · Đúng ${correct}`;
    }
    function grade(card) {
      const { key, question, buttons, feedback } = card;
      const selected = answers[key];
      const answered = Object.hasOwn(answers, key);
      for (const [id, button] of buttons) {
        button.classList.toggle('is-picked', answered && id === selected);
        button.classList.toggle('is-correct', answered && question.correctAnswerIds.includes(id));
        button.classList.toggle('is-wrong', answered && id === selected && !question.correctAnswerIds.includes(id));
        button.setAttribute('aria-pressed', String(answered && id === selected));
      }
      feedback.className = 'feedback';
      if (!answered) { feedback.textContent = ''; return; }
      const correct = question.correctAnswerIds.includes(selected);
      const labels = question.choices.filter(choice => question.correctAnswerIds.includes(choice.id)).map(choice => choice.label).join(', ');
      feedback.textContent = correct ? '✓ Chính xác!' : `✗ Chưa đúng. Đáp án đúng: ${labels}.`;
      feedback.classList.add(correct ? 'correct' : 'wrong');
    }

    const fragment = document.createDocumentFragment();
    for (const [setIndex, set] of sets.entries()) {
      const section = element('section', 'question-set');
      section.id = `bo-${setIndex + 1}`;
      const heading = element('div', 'set-heading');
      heading.append(element('h2', '', set.title), element('span', '', `${set.questions.length} câu hỏi`));
      section.append(heading);
      const link = element('a', '', `${set.title} (${set.questions.length})`);
      link.href = `#${section.id}`;
      document.getElementById('set-nav').append(link);
      for (const question of set.questions) {
        const key = `${set.file}:${question.index}`;
        const article = element('article', 'question-card');
        article.id = `cau-${setIndex + 1}-${question.index}`;
        article.append(element('p', 'question-meta', `${set.title} / Câu ${question.index}`));
        article.append(element('h3', 'question-text', question.text));
        const choices = element('div', 'choices');
        choices.setAttribute('role', 'group');
        choices.setAttribute('aria-label', `Đáp án cho ${set.title}, câu ${question.index}`);
        const buttons = [];
        for (const choice of question.choices) {
          const button = element('button', 'choice');
          button.type = 'button';
          button.append(element('span', 'choice-label', choice.label), element('span', 'choice-text', choiceText(choice)));
          button.addEventListener('click', () => {
            answers[key] = choice.id;
            store();
            grade(card);
            progress();
          });
          choices.append(button);
          buttons.push([choice.id, button]);
        }
        article.append(choices);
        const feedback = element('p', 'feedback');
        feedback.setAttribute('role', 'status');
        feedback.setAttribute('aria-live', 'polite');
        article.append(feedback);
        const explanation = element('details', 'explanation');
        explanation.append(element('summary', '', 'Giải thích'), element('p', '', question.explanation));
        article.append(explanation);
        const card = { key, question, buttons, feedback, article,
          searchable: normalize(`${question.text} ${question.choices.map(choice => choice.text).join(' ')} ${question.explanation}`) };
        cards.push(card);
        grade(card);
        section.append(article);
      }
      fragment.append(section);
    }
    container.append(fragment);
    progress();
    const originalOrders = Array.from(container.children, section => ({
      section,
      articles: Array.from(section.querySelectorAll('.question-card'))
    }));

    const search = document.getElementById('search');
    function filterQuestions() {
      const query = normalize(search.value.trim());
      let visible = 0;
      for (const card of cards) {
        card.article.hidden = !card.searchable.includes(query);
        if (!card.article.hidden) visible++;
      }
      document.getElementById('result-count').textContent = `Hiển thị ${visible}/${cards.length} câu hỏi · Không phân trang`;
      document.getElementById('empty').hidden = visible !== 0;
      for (const section of container.children) {
        const count = section.querySelectorAll('.question-card:not([hidden])').length;
        section.hidden = count === 0;
        section.querySelector('.set-heading span').textContent = `${count} câu hỏi`;
      }
    }
    search.addEventListener('input', filterQuestions);
    filterQuestions();
    const shuffleButton = document.getElementById('shuffle-questions');
    shuffleButton.addEventListener('click', () => {
      const shuffledMode = shuffleButton.getAttribute('aria-pressed') !== 'true';
      for (const { section, articles } of originalOrders) {
        const order = [...articles];
        if (shuffledMode) {
          for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
          }
        }
        section.append(...order);
      }
      shuffleButton.setAttribute('aria-pressed', String(shuffledMode));
      shuffleButton.textContent = shuffledMode ? 'Về thứ tự gốc' : 'Đảo thứ tự câu';
    });
    const toggle = document.getElementById('toggle-explanations');
    toggle.addEventListener('click', () => {
      const explanations = document.querySelectorAll('.explanation');
      const open = !Array.from(explanations).every(item => item.open);
      explanations.forEach(item => { item.open = open; });
      toggle.textContent = open ? 'Thu gọn giải thích' : 'Mở tất cả giải thích';
    });
  </script>
</body>
